<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="El Consejo Directivo de la Facultad de Trabajo Social: qué es, qué hace la Agrupación Simón Bolívar ahí y qué se consiguió.">

<link rel="icon" type="image/png" sizes="32x32" href="../imagenes/icono-32.png">

<!-- Como se ve cuando alguien comparte el link por WhatsApp o Instagram -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Bolivar con vos">
<meta property="og:title" content="El Consejo Directivo · La Bolívar con vos">
<meta property="og:description" content="El Consejo Directivo de la Facultad de Trabajo Social: qué es, qué hace la Agrupación Simón Bolívar ahí y qué se consiguió.">

<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
</head>
<body class="lectura sin-js">

<div id="cabecera"></div>

<main id="contenido" tabindex="-1">
  <!-- Todo se dibuja desde el JS con lo que el equipo carga en el panel.
       El esqueleto va ADENTRO de #lectura para que lo reemplace: si va
       afuera, se queda arriba y el contenido real aparece debajo. -->
  <div id="lectura">
    <div class="banda tinta">
      <div class="envoltura">
        <div class="esqueleto esq-linea titulo" style="height:38px;width:80%"></div>
        <div class="esqueleto esq-linea" style="margin-top:18px"></div>
        <div class="esqueleto esq-linea media"></div>
      </div>
    </div>
  </div>
</main>

<div class="zona-fondo">
  <div id="pie"></div>
</div>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno. -->
<script src="../lib/datos.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<script src="../lectura.js"></script>
<script>
/* ============================================================
   EL CONSEJO DIRECTIVO

   El texto y los logros se editan desde el PANEL, solapa
   «🏛 Consejo Directivo». Acá no hay texto que tocar.

   Lo de abajo es la red de seguridad, para que la pantalla no quede en
   blanco si la base no contesta.
   ============================================================ */
const RESPALDO = {
  bajada: 'El Consejo Directivo es donde se decide lo que después te pasa ' +
          'en la cursada. Ahí estamos.',
  titular: 'El Consejo|*Directivo*',
  bloques: [], logros: [], imagenes: []
};

(async function consejo(){
  document.getElementById('cabecera').innerHTML = htmlCabecera();
  document.getElementById('pie').innerHTML = htmlPie();
  /* Se marca «¿Quiénes somos?» en la fila de arriba: esta pantalla vive
     adentro de esa sección, y así no queda ninguna marcada. */
  pintarNav('quienes');
  document.body.classList.remove('sin-js');

  /* ============================================================
     LO GUARDADO DE LA VISITA ANTERIOR

     Igual que en «¿Quiénes somos?»: primero lo guardado, y el
     RESPALDO recién si nunca se llegó a ver la página de verdad. Acá
     pesa más, porque este respaldo no tiene ni bloques ni logros: sin
     red, la pantalla era poco más que el título.

     El año de cada logro no es una fecha que llame a actuar: dice
     cuándo se consiguió algo que ya pasó. Nada acá vence.

     Lo que sí cambia es que ahora se avisa. Antes, sin red, mostraba
     el respaldo en silencio.
     ============================================================ */
  const memoria = memoriaDe('consejo');
  if (memoria){
    pintar(memoria.datos);
    avisarMostrandoGuardado(memoria.cuando);
  }

  let p = null, huboRed = false;
  try {
    const { data, error } = await conPaciencia(
      db.from('pagina_consejo').select('*').limit(1).maybeSingle());
    if (error) throw error;
    huboRed = true;
    p = data;              // puede venir vacío: la página sin cargar
  } catch(e){ /* sin red: más abajo se decide qué queda en pantalla */ }

  if (huboRed && p){
    pintar(p);
    guardarEnMemoria('consejo', p);
    sacarAvisoGuardado();
  } else if (huboRed){
    olvidarMemoria('consejo');
    sacarAvisoGuardado();
    pintar(RESPALDO);
  } else if (memoria){
    avisarNoSePudoActualizar(memoria.cuando);
  } else {
    pintar(RESPALDO);
  }

/* El dibujo, aparte, porque corre dos veces: una con lo guardado y
   otra con lo que trae la red. */
function pintar(p){
  const bloques  = Array.isArray(p.bloques)  ? p.bloques  : [];
  const logros   = Array.isArray(p.logros)   ? p.logros   : [];
  const imagenes = Array.isArray(p.imagenes) ? p.imagenes : [];

  const hero = `
    <div class="banda tinta">
      <div class="envoltura">
        <p class="ceja-lectura aparece">
          <a class="volver-lectura" href="../quienes/">← ¿Quiénes somos?</a>
        </p>
        <h1 class="grito aparece">${titularHTML(p.titular)}</h1>
        <p class="bajada-lectura aparece">${esc(p.bajada || '')}</p>
      </div>
    </div>`;

  const cuerpo = bloques.length ? `
    <div class="banda papel">
      <div class="envoltura">
        <div class="zigzag">
          ${bloques.map((b, i) => {
            const img = imagenes[i];
            return `
            <article class="aparece">
              <div>
                <h3>${esc(b.titulo || '')}</h3>
                ${(b.parrafos || []).map(t => `<p>${esc(t)}</p>`).join('')}
              </div>
              ${fotoDe(img) ? `
                <figure>
                  <img src="${esc(fotoDe(img))}" alt="${esc(img.epigrafe || '')}"
                       loading="lazy" decoding="async">
                  ${img.epigrafe ? `<figcaption>${esc(img.epigrafe)}</figcaption>` : ''}
                </figure>` : ''}
            </article>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  /* LOS LOGROS. Van en línea de tiempo porque el orden dice algo: se ve
     la acumulación del trabajo. Si todavía no hay ninguno cargado, no
     se muestra una lista vacía: se dice qué va a haber ahí. */
  const conseguido = `
    <div class="banda sol">
      <div class="envoltura">
        <h2 class="grito aparece">Lo que se<br><em>consiguió</em></h2>
        ${logros.length ? `
          <ol class="linea-logros">
            ${logros.map(l => `
              <li class="aparece">
                <span class="logro-anio">${esc(l.anio || '')}</span>
                <h3 class="logro-titulo">${esc(l.titulo || '')}</h3>
                ${l.detalle ? `<p>${esc(l.detalle)}</p>` : ''}
              </li>`).join('')}
          </ol>`
        : `<p class="bajada-lectura aparece">
             Acá van las cosas que se consiguieron desde el Consejo, con el año
             de cada una. Todavía no las cargamos.</p>`}
      </div>
    </div>`;

  const cierre = `
    <div class="banda tinta">
      <div class="envoltura">
        <h2 class="grito aparece" style="font-size:clamp(28px,7.4vw,52px)">
          ¿Te pasó algo<br>en la facu?</h2>
        <p class="bajada-lectura aparece">
          Una cátedra que no publica los horarios, una mesa mal puesta, un aula
          sin luz. Contanos: lo que en el pasillo es una queja, en el Consejo
          es un expediente.</p>
        <a class="puerta aparece" href="../quienes/">
          <span class="puerta-texto">
            <strong>Escribinos</strong>
            <span>Todas nuestras formas de contacto</span>
          </span>
          <span class="puerta-flecha" aria-hidden="true">→</span>
        </a>
      </div>
    </div>`;

  document.getElementById('lectura').innerHTML = hero + cuerpo + conseguido + cierre;
  vigilarAparicion();
}
})();
</script>
</body>
</html>
