<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<body class="lectura sin-js">

<div id="cabecera"></div>

<main id="contenido" tabindex="-1">
  <!-- Todo se dibuja desde el JS con lo que el equipo carga en el panel.
       El esqueleto va ADENTRO de #lectura para que lo reemplace: si va
       afuera, se queda arriba y el contenido real aparece debajo. -->

    <div class="banda tinta">
      <div class="envoltura">
        <div class="esqueleto esq-linea titulo" style="height:38px;width:80%"></div>

      </div>
    </div>
  </div>
</main>

<div id="pie"></div>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno. -->
<script src="../lib/datos.js"></script>

<script src="../app.js"></script>
<script src="../fondo-red.js"></script>
<script src="../lectura.js"></script>
<script>
/* ============================================================
   EL CONSEJO DIRECTIVO

   El texto y los logros se editan desde el PANEL, solapa
   «🏛 Consejo Directivo». Acá no hay texto que tocar.

   Lo de abajo es la red de seguridad, para que la pantalla no quede en
   blanco si la base no contesta.
   ============================================================ */
const RESPALDO = {
  bajada: 'El Consejo Directivo es donde se decide lo que después te pasa ' +
          'en la cursada. Ahí estamos.',
  titular: 'El Consejo|*Directivo*',
  bloques: [], logros: [], imagenes: []
};

/* ============================================================
   LAS CONQUISTAS CON POSTEO

   Estas siete viven acá y no en el panel porque llevan una cosa que
   la solapa «Los logros» no tiene: el enlace a la placa de Instagram.
   Esa solapa —año, título, detalle— sigue funcionando igual y lo que
   se cargue ahí se dibuja abajo de esta línea.

   `placa` es la posición dentro del carrusel, y va SOLO en el enlace
   que se abre en Instagram. En el embed no sirve: siempre arranca en
   la primera, no hay forma de que abra en la cuarta.

   Los enlaces de `post` van sin `?img_index=` por lo mismo, y además
   porque el parámetro de más le hace perder la caché al script de
   Instagram.
   ============================================================ */
const CONQUISTAS = [
  { anio: '2023', titulo: 'Aprobación del nuevo Régimen Académico',
    post: 'https://www.instagram.com/p/C00KxcEMAcN/', placa: 4 },
  { anio: '2024', titulo: 'Avales académicos para el ciclo de charlas Saberes Colectivos',
    post: 'https://www.instagram.com/p/DOzhW6lDaz0/', placa: 3 },
  { anio: '2025', titulo: 'Calendarización del tramo optativo',
    post: 'https://www.instagram.com/p/DRk-mCejSMh/', placa: 1 },
  { anio: '2025', titulo: 'Proyecto Construir Comunidad',
    post: 'https://www.instagram.com/p/DImmuOCB0vK/' },
  { anio: '2026', titulo: 'Proyecto Fono a Color',
    post: 'https://www.instagram.com/p/DXiH0n9jQ0V/', placa: 1 },
  { anio: '2026', titulo: 'Proyecto Diagonal Segura',
    post: 'https://www.instagram.com/p/Dctu41XmkNK/', placa: 1 },
  { anio: '2026', titulo: 'Proyecto + derechos es + permanencia',
    post: 'https://www.instagram.com/p/Dc1-j6kmo1s/', placa: 1 }
];

const INTRO_CONQUISTAS =
  'Gracias a nuestra presencia cotidiana en la facultad y al compromiso de ' +
  'acompañarte frente a cada problemática docente o desafío académico, ' +
  'logramos transformar las necesidades de los estudiantes en conquistas ' +
  'reales. Estos son los proyectos que impulsamos y logramos aprobar desde ' +
  'el Consejo Directivo:';

const CIERRE_COGOBIERNO =
  'Además, en cada Consejo Directivo y en cada espacio de cogobierno ' +
  'exigimos la plena implementación del régimen académico, llevando todas ' +
  'las situaciones que surgen dentro del aula y pensando propuestas para ' +
  'solucionarlas.';

/* Si el script de Instagram ya se pidió. Vive afuera de `pintar()`
   porque esta pantalla se dibuja dos veces —una con lo guardado y otra
   con lo que trae la red— y el script se pide una sola. */
let pedidoIG = false;

(async function consejo(){
  document.getElementById('cabecera').innerHTML = htmlCabecera();
  document.getElementById('pie').innerHTML = htmlPie();
  /* Se marca «¿Quiénes somos?» en la fila de arriba: esta pantalla vive
     adentro de esa sección, y así no queda ninguna marcada. */
  pintarNav('quienes');
  document.body.classList.remove('sin-js');

  /* ============================================================
     LO GUARDADO DE LA VISITA ANTERIOR

     Igual que en «¿Quiénes somos?»: primero lo guardado, y el
     RESPALDO recién si nunca se llegó a ver la página de verdad. Acá
     pesa más, porque este respaldo no tiene ni bloques ni logros: sin
     red, la pantalla era poco más que el título.

     El año de cada logro no es una fecha que llame a actuar: dice
     cuándo se consiguió algo que ya pasó. Nada acá vence.

     Lo que sí cambia es que ahora se avisa. Antes, sin red, mostraba
     el respaldo en silencio.
     ============================================================ */
  const memoria = memoriaDe('consejo');
  if (memoria){
    pintar(memoria.datos);
    avisarMostrandoGuardado(memoria.cuando);
  }

  let p = null, huboRed = false;
  try {
    const { data, error } = await conPaciencia(
      db.from('pagina_consejo').select('*').limit(1).maybeSingle());
    if (error) throw error;
    huboRed = true;
    p = data;              // puede venir vacío: la página sin cargar
  } catch(e){ /* sin red: más abajo se decide qué queda en pantalla */ }

  if (huboRed && p){
    pintar(p);
    guardarEnMemoria('consejo', p);
    sacarAvisoGuardado();
  } else if (huboRed){
    olvidarMemoria('consejo');
    sacarAvisoGuardado();
    pintar(RESPALDO);
  } else if (memoria){
    avisarNoSePudoActualizar(memoria.cuando);
  } else {
    pintar(RESPALDO);
  }

/* El dibujo, aparte, porque corre dos veces: una con lo guardado y
   otra con lo que trae la red. */
function pintar(p){
  const bloques  = Array.isArray(p.bloques)  ? p.bloques  : [];
  const logros   = Array.isArray(p.logros)   ? p.logros   : [];
  const imagenes = Array.isArray(p.imagenes) ? p.imagenes : [];

  const hero = `
    <div class="banda tinta">
      <div class="envoltura">
        <p class="ceja-lectura aparece">
          <a class="volver-lectura" href="../quienes/">← ¿Quiénes somos?</a>
        </p>
        <h1 class="grito aparece">${titularHTML(p.titular)}</h1>
        <p class="bajada-lectura aparece">${esc(p.bajada || '')}</p>
      </div>
    </div>`;

  const cuerpo = bloques.length ? `
    <div class="banda papel">
      <div class="envoltura">
        <div class="zigzag">
          ${bloques.map((b, i) => {
            const img = imagenes[i];
            return `
            <article class="aparece">
              <div>
                <h3>${esc(b.titulo || '')}</h3>
                ${(b.parrafos || []).map(t => `<p>${esc(t)}</p>`).join('')}
              </div>
              ${fotoDe(img) ? `
                <figure>
                  <img src="${esc(fotoDe(img))}" alt="${esc(img.epigrafe || '')}"
                       loading="lazy" decoding="async">
                  ${img.epigrafe ? `<figcaption>${esc(img.epigrafe)}</figcaption>` : ''}
                </figure>` : ''}
            </article>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  /* LOS LOGROS. Van en línea de tiempo porque el orden dice algo: se ve
     la acumulación del trabajo.

     Ahora la banda tiene dos listas. Primero las siete conquistas con
     posteo, que están escritas en este archivo y no se vacían nunca;
     después, si el equipo cargó algo en el panel, la lista de siempre.
     Por eso se fue el cartel de «todavía no las cargamos»: ya no hay
     forma de que esta banda quede vacía. */
  const conseguido = `
    <div class="banda sol">
      <div class="envoltura">
        <h2 class="grito aparece">Lo que se<br><em>consiguió</em></h2>
        <p class="bajada-lectura aparece">${esc(INTRO_CONQUISTAS)}</p>
        ${htmlConquistas()}
        ${logros.length ? `
          <ol class="linea-logros">
            ${logros.map(l => `
              <li class="aparece">
                <span class="logro-anio">${esc(l.anio || '')}</span>
                <h3 class="logro-titulo">${esc(l.titulo || '')}</h3>
                ${l.detalle ? `<p>${esc(l.detalle)}</p>` : ''}
              </li>`).join('')}
          </ol>` : ''}
        <aside class="cq-cierre aparece">
          <p class="cq-cierre-rotulo">En el cogobierno</p>
          <p>${esc(CIERRE_COGOBIERNO)}</p>
        </aside>
      </div>
    </div>`;

  const cierre = `
    <div class="banda tinta">
      <div class="envoltura">
        <h2 class="grito aparece" style="font-size:clamp(28px,7.4vw,52px)">
          ¿Te pasó algo<br>en la facu?</h2>
        <p class="bajada-lectura aparece">
          Una cátedra que no publica los horarios, una mesa mal puesta, un aula
          sin luz. Contanos: lo que en el pasillo es una queja, en el Consejo
          es un expediente.</p>
        <a class="puerta aparece" href="../quienes/">
          <span class="puerta-texto">
            <strong>Escribinos</strong>
            <span>Todas nuestras formas de contacto</span>
          </span>
          <span class="puerta-flecha" aria-hidden="true">→</span>
        </a>
      </div>
    </div>`;

  document.getElementById('lectura').innerHTML = hero + cuerpo + conseguido + cierre;
  vigilarAparicion();
  armarPosteos();
}

/* ============================================================
   LA LÍNEA DE LAS CONQUISTAS

   Agrupadas por año, con el año como nodo de la línea: así 2026 se lee
   como un racimo de tres y no como tres renglones sueltos repitiendo
   el mismo número.

   El posteo NO está acá: cada renglón trae el marco vacío con el
   enlace de respaldo adentro, y el `<blockquote>` de Instagram lo arma
   `armarPosteos()` cuando alguien abre ese renglón. Si estuviera
   escrito de entrada, `instgrm.Embeds.process()` lo convertiría en
   iframe aunque el renglón estuviera cerrado —un `<details>` cerrado
   igual tiene todo en el DOM— y la pantalla cargaría las siete placas
   que nadie pidió.
   ============================================================ */
function htmlConquistas(){
  /* Agrupar por año sin perder el orden: la lista ya viene cronológica
     desde arriba, así que alcanza con mirar el grupo anterior. */
  const porAnio = [];
  CONQUISTAS.forEach(c => {
    const ultimo = porAnio[porAnio.length - 1];
    if (ultimo && ultimo.anio === c.anio) ultimo.items.push(c);
    else porAnio.push({ anio: c.anio, items: [c] });
  });

  return `
    <div class="conquistas">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="cq-ico-ig" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="cq-ico-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </symbol>
      </svg>
      <ol class="cq-linea">
        ${porAnio.map(g => `
          <li class="cq-tramo aparece">
            <h3 class="cq-anio"><span>${esc(g.anio)}</span></h3>
            <ul class="cq-grupo">
              ${g.items.map(c => {
                const enlace = c.post + (c.placa ? '?img_index=' + c.placa : '');
                return `
                <li class="cq-item">
                  <details class="cq-post">
                    <summary class="cq-cab">
                      <h4 class="cq-item-titulo">${esc(c.titulo)}</h4>
                      <span class="cq-abre">
                        <svg aria-hidden="true" focusable="false"><use href="#cq-ico-ig"></use></svg>
                        Ver el posteo
                        <svg class="cq-flecha" aria-hidden="true" focusable="false"><use href="#cq-ico-flecha"></use></svg>
                      </span>
                    </summary>
                    <div class="cq-panel">
                      <div class="cq-ig" data-ig="${esc(c.post)}">
                        <a class="cq-respaldo" href="${esc(enlace)}" target="_blank" rel="noopener">
                          <strong>${esc(c.titulo)}</strong>
                          <span>Ver el posteo en Instagram ↗</span>
                        </a>
                      </div>
                      <a class="cq-ver" href="${esc(enlace)}" target="_blank" rel="noopener">
                        <svg aria-hidden="true" focusable="false"><use href="#cq-ico-ig"></use></svg>
                        Abrir en Instagram ↗
                      </a>
                    </div>
                  </details>
                </li>`;
              }).join('')}
            </ul>
          </li>`).join('')}
      </ol>
    </div>`;
}

/* Los oyentes se ponen después de cada `pintar()` y no una sola vez al
   final: el `innerHTML` de arriba se lleva puestos los de la pasada
   anterior, y esta pantalla se dibuja dos veces. */
function armarPosteos(){
  document.querySelectorAll('.conquistas .cq-post').forEach(det => {
    det.addEventListener('toggle', () => {
      if (!det.open) return;
      const caja = det.querySelector('.cq-ig');
      if (!caja || caja.dataset.armado) return;
      caja.dataset.armado = '1';

      /* El enlace de respaldo se muda adentro del blockquote: es lo que
         se ve hasta que Instagram termina de reemplazarlo, y lo que
         queda si no contesta nunca. */
      const respaldo = caja.querySelector('.cq-respaldo');
      caja.innerHTML =
        '<blockquote class="instagram-media" data-instgrm-version="14" ' +
        'data-instgrm-permalink="' + caja.dataset.ig + '">' +
        (respaldo ? respaldo.outerHTML : '') + '</blockquote>';

      pedirInstagram();
    });
  });
}

function procesarIG(){
  if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
}

function pedirInstagram(){
  if (window.instgrm && window.instgrm.Embeds){ procesarIG(); return; }
  if (pedidoIG) return;            // ya viene en camino: lo procesa su onload
  pedidoIG = true;
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.instagram.com/embed.js';
  s.onload = procesarIG;
  document.body.appendChild(s);
}
})();
</script>
</body>
