<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<!-- Iconos de la app: pestana, Google, y pantalla de inicio del celular -->
<link rel="icon" type="image/png" sizes="32x32" href="../../../imagenes/icono-32.png">

<!-- EL TEMA, ANTES DE DIBUJAR NADA. Igual que en el resto de la app: si
     esto viviera en un script del final, la ficha arrancaria clara y
     pegaria un salto a oscura. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<style>
/* ===== LO QUE VINO DEL DISENO, TAL CUAL ===== */
:root{color-scheme:light dark;--bg:#FDF9C5;--paper:#FDFCF7;--tx:#1A1A1A;--mut:#3A3A3A;--stroke:#1A1A1A;--yellow:#F9E830;--onyel:#1A1A1A;--red:#B52625;--line:#0195B1;--dur:.25s}
html[data-tema="oscuro"]{--bg:#151412;--paper:#22201D;--tx:#FDFCF7;--mut:#D8D3C8;--stroke:#FDFCF7;--red:#FF9D8F;--line:#5AD8F0}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--red);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--tx)}
button{font:inherit;cursor:pointer;color:var(--tx)}
:focus-visible{outline:3px solid var(--line);outline-offset:2px}
input[type=range]{accent-color:var(--line);width:100%;height:34px}

/* ===== LO QUE AGREGA LA APP ===== */

/* La ficha no carga estilos.css. Es una pieza de lectura a pantalla
   completa con su propio sistema visual, y las 160 KB de la app le
   pelearian el body, la tipografia y los titulos. Lo unico que se
   comparte es el tema y la barra de volver. */

.ficha-volver{
  display:inline-flex; align-items:center; gap:8px;
  position:sticky; top:0; z-index:20;
  width:100%; box-sizing:border-box;
  padding:11px 18px;
  font-family:Montserrat,sans-serif; font-weight:800;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--yellow); color:var(--onyel);
  border-bottom:2px solid var(--stroke);
  text-decoration:none;
}
.ficha-volver:hover{ color:var(--onyel); }

/* Los dos sellos del pie viven en estudiemos/fichas/assets/ y los
   comparten las nueve fichas: por eso el src sale de la carpeta de la
   ficha con ../assets/ en vez de tener nueve copias. */
</style>
</head>
<body>

<a class="ficha-volver" href="../../">← Estudiemos</a>

<!-- Aca dibuja ficha.js. Vacio hasta que corre el script del final. -->
<div id="ficha"></div>

<!-- La ficha, tal como salio del diseno. Vive dentro de un <template>
     para que el navegador no la muestre a medio armar: todavia tiene los
     agujeros { asi } sin rellenar. -->
<template id="plantilla">
<main style="max-width:540px;margin:0 auto;padding:14px 14px 60px">

<header style="margin:4px 0 16px">
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
<span style="font-family:Montserrat,sans-serif;font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:99px;padding:5px 11px;box-shadow:2px 2px 0 var(--stroke)">Equipo de Fonoaudiología</span>
<span style="font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.06em;border:1px solid var(--stroke);border-radius:99px;padding:5px 11px">UNLP · FTS · 1° AÑO</span>
</div>
<h1 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(38px,12vw,58px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.025em">Anatomo<br>fisiología</h1>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase;margin:10px 0 0">Fonoaudiológica · Tríptico de estudio</p>
<p style="font-size:14.5px;line-height:1.55;color:var(--mut);margin:10px 0 0;text-wrap:pretty">Tres pliegues, tres trabajos distintos: entender la idea, ver cómo funciona y darte cuenta de si te quedó.</p>
<div style="height:2px;background:var(--stroke);margin-top:16px"></div>
</header>

<nav role="tablist" aria-label="Pliegues del tríptico" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-bottom:22px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{ t.on }}" onClick="{{ t.go }}" style="display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:9px 11px;background:{{ t.bg }};color:{{ t.fg }};transition:background var(--dur)">
<span style="font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.1em">{{ t.num }}</span>
<span style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;line-height:1.15">{{ t.label }}</span>
</button>
</sc-for>
</nav>

<!-- ============ PLIEGUE 1 ============ -->
<sc-if value="{{ isP1 }}" hint-placeholder-val="{{ true }}">
<section aria-label="Pliegue 1: qué es">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 6px">PLIEGUE 01</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(30px,9vw,42px);line-height:.92;margin:0 0 12px;text-transform:uppercase">Qué es</h2>
<p style="font-size:16px;line-height:1.6;margin:0 0 8px;text-wrap:pretty">Anatomía es saber dónde está cada cosa del cuerpo y cómo nombrarlo para que la otra persona entienda lo mismo que vos.</p>
<p style="font-size:16px;line-height:1.6;margin:0 0 20px;text-wrap:pretty">Para eso hace falta un acuerdo previo: describir siempre desde la misma posición de partida. Ese acuerdo se llama <strong style="font-family:Montserrat,sans-serif;font-weight:800">posición anatómica</strong>, y todo lo demás se apoya ahí.</p>

<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:16px;margin-bottom:18px">
<h3 style="font-family:Montserrat,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 4px">Posición anatómica</h3>
<p style="font-size:14px;line-height:1.55;color:var(--mut);margin:0 0 12px">Tocá las dos opciones y mirá qué le pasa a la palabra «arriba».</p>
<div role="group" aria-label="Elegí la posición del cuerpo" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px">
<sc-for list="{{ poseChips }}" as="c" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--stroke);border-radius:99px;padding:9px 12px;background:{{ c.bg }};color:{{ c.fg }};box-shadow:2px 2px 0 var(--stroke);transition:background var(--dur)">{{ c.label }}</button>
</sc-for>
</div>
<svg viewBox="0 0 140 275" role="img" aria-label="{{ poseAlt }}" style="width:100%;max-width:230px;display:block;margin:0 auto 6px;height:auto">
<ellipse cx="70" cy="266" rx="34" ry="5" fill="var(--yellow)" stroke="var(--stroke)" stroke-width="1"></ellipse>
<g fill="var(--paper)" stroke="var(--stroke)" stroke-width="2" stroke-linejoin="round">
<g transform="{{ headT }}" style="transition:transform var(--dur)">
<ellipse cx="70" cy="30" rx="18" ry="22"></ellipse>
</g>
<path d="M62,50h16v13h-16z"></path>
<path d="M48,63c10-4 34-4 44,0l4,41-8,48h-36l-8-48z"></path>
<g transform="{{ armRT }}" style="transition:transform var(--dur)">
<path d="M92,66l11,4 5,80-10,3-10-76z"></path>
<path d="M98,152l11,2 1,15-11,1z"></path>
<g transform="{{ palmRT }}" stroke-width="1.6" style="transition:opacity var(--dur)" opacity="{{ palmO }}">
<path d="M100,157h8M100,161h8M100,165h8"></path>
</g>
</g>
<g transform="{{ armLT }}" style="transition:transform var(--dur)">
<path d="M48,66l-11,4-5,80 10,3 10-76z"></path>
<path d="M42,152l-11,2-1,15 11,1z"></path>
<g stroke-width="1.6" opacity="{{ palmO }}" style="transition:opacity var(--dur)">
<path d="M32,157h8M32,161h8M32,165h8"></path>
</g>
</g>
<g transform="{{ legRT }}" style="transition:transform var(--dur)">
<path d="M72,152h15l-3,86-13,1z"></path>
<path d="M71,238h15v12h-17z"></path>
</g>
<path d="M68,152h-15l3,86 13,1z"></path>
<path d="M69,238h-15v12h17z"></path>
</g>
</svg>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-align:center;color:var(--mut);margin:0 0 14px">VISTA DE FRENTE</p>
<div style="border-top:2px solid var(--stroke);padding-top:12px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px">{{ poseHeadline }}</p>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 10px;text-wrap:pretty">{{ poseWhy }}</p>
<ul style="margin:0;padding-left:18px;font-size:14.5px;line-height:1.7">
<li>Cuerpo en levitación</li>
<li>Brazos y piernas extendidas</li>
<li>Manos y pies en supinación</li>
</ul>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px">
<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:13px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--line);display:inline-block;padding-bottom:3px">Planos o cortes</p>
<p style="font-size:14px;line-height:1.5;margin:0">Líneas imaginarias que dividen al cuerpo o a estructuras anatómicas para facilitar nuestro estudio.</p>
</div>
<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:13px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--line);display:inline-block;padding-bottom:3px">Ejes</p>
<p style="font-size:14px;line-height:1.5;margin:0">Tres direcciones que atraviesan el cuerpo. Cada una tiene su par de movimientos: transversal, longitudinal y sagital.</p>
</div>
<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:13px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--line);display:inline-block;padding-bottom:3px">Puntos de ubicación</p>
<p style="font-size:14px;line-height:1.5;margin:0">Importantes para el vocabulario anatómico. Sirven de referencia entre estructuras del cuerpo.</p>
</div>
<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:13px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;border-bottom:2px solid var(--line);display:inline-block;padding-bottom:3px">Cráneo y cara</p>
<p style="font-size:14px;line-height:1.5;margin:0">Los huesos de la cabeza se agrupan en neurocráneo y viscerocráneo, y se unen entre sí por las suturas.</p>
</div>
</div>

<button type="button" onClick="{{ goP2 }}" style="width:100%;text-align:left;font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:14px 16px">Seguí en el pliegue 02 → cómo funciona</button>
</section>
</sc-if>

<!-- ============ PLIEGUE 2 ============ -->
<sc-if value="{{ isP2 }}" hint-placeholder-val="{{ false }}">
<section aria-label="Pliegue 2: cómo funciona">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 6px">PLIEGUE 02</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(30px,9vw,42px);line-height:.92;margin:0 0 12px;text-transform:uppercase">Cómo<br>funciona</h2>
<p style="font-size:16px;line-height:1.6;margin:0 0 22px;text-wrap:pretty">Cuatro piezas para mover con el dedo o con el teclado. Movelas: cada una muestra algo que en una imagen quieta no se ve.</p>

<!-- 2.1 PLANOS -->
<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:16px;margin-bottom:18px">
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 4px">2.1</p>
<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22px;line-height:1;margin:0 0 6px;text-transform:uppercase">Planos y cortes</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 12px">Elegí un plano y después corrélo con la barra. Vas a ver que el plano no es un lugar fijo del cuerpo: es una dirección, y puede pasar por donde quieras.</p>
<div role="group" aria-label="Elegí un plano" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">
<sc-for list="{{ planeChips }}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--stroke);border-radius:99px;padding:8px 13px;box-shadow:2px 2px 0 var(--stroke);background:{{ c.bg }};color:{{ c.fg }};transition:background var(--dur)">{{ c.label }}</button>
</sc-for>
</div>
<svg viewBox="0 0 140 275" role="img" aria-label="{{ planeAlt }}" style="width:100%;max-width:250px;display:block;margin:0 auto 4px;height:auto">
<defs>
<pattern id="hatch1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="7" stroke="var(--line)" stroke-width="1.6"></line>
</pattern>
</defs>
<g fill="var(--paper)" stroke="var(--stroke)" stroke-width="2" stroke-linejoin="round">
<sc-if value="{{ planeFront }}" hint-placeholder-val="{{ true }}">
<g>
<ellipse cx="70" cy="30" rx="18" ry="22"></ellipse>
<path d="M62,50h16v13h-16z"></path>
<path d="M48,63c10-4 34-4 44,0l4,41-8,48h-36l-8-48z"></path>
<path d="M92,66l11,4 5,80-10,3-10-76z"></path>
<path d="M98,152l11,2 1,15-11,1z"></path>
<path d="M48,66l-11,4-5,80 10,3 10-76z"></path>
<path d="M42,152l-11,2-1,15 11,1z"></path>
<path d="M72,152h15l-3,86-13,1z"></path>
<path d="M71,238h15v12h-17z"></path>
<path d="M68,152h-15l3,86 13,1z"></path>
<path d="M69,238h-15v12h17z"></path>
</g>
</sc-if>
<sc-if value="{{ planeSide }}" hint-placeholder-val="{{ false }}">
<g>
<ellipse cx="64" cy="30" rx="19" ry="22"></ellipse>
<path d="M82,26l9,7-9,5z"></path>
<path d="M58,50h16v13h-16z"></path>
<path d="M52,63c11-4 25-2 31,4l2,37-4,48h-27l-4-48z"></path>
<path d="M68,66l11,3 3,80-11,3-8-76z"></path>
<path d="M56,152h20l-2,86-16,1z"></path>
<path d="M56,238h25v12h-27z"></path>
</g>
</sc-if>
</g>
<rect x="{{ hx }}" y="{{ hy }}" width="{{ hw }}" height="{{ hh }}" fill="url(#hatch1)" opacity="0.5" style="transition:all var(--dur)"></rect>
<line x1="{{ lx1 }}" y1="{{ ly1 }}" x2="{{ lx2 }}" y2="{{ ly2 }}" stroke="var(--stroke)" stroke-width="3" stroke-dasharray="9 5" style="transition:all var(--dur)"></line>
</svg>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-align:center;color:var(--mut);margin:0 0 10px">{{ planeView }}</p>
<label style="display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px" for="ppr">Corré el plano</label>
<input id="ppr" type="range" min="0" max="100" value="{{ pp }}" onChange="{{ setPP }}" onInput="{{ setPP }}" aria-label="Posición del plano">
<div style="display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.05em;color:var(--mut);margin:-4px 0 12px"><span>{{ ppMin }}</span><span>{{ ppMax }}</span></div>
<div style="border:1px solid var(--stroke);border-left:6px solid var(--yellow);border-radius:10px;padding:11px 12px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px">{{ planeName }}</p>
<p style="font-size:14px;line-height:1.55;margin:0">{{ planeText }}</p>
</div>
</article>

<!-- 2.2 EJES -->
<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:16px;margin-bottom:18px">
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 4px">2.2</p>
<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22px;line-height:1;margin:0 0 6px;text-transform:uppercase">Ejes y movimiento</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 12px">Elegí un eje y movelo vos con la barra. El eje no se mueve: el cuerpo se mueve alrededor de él.</p>
<div role="group" aria-label="Elegí un eje" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px">
<sc-for list="{{ axisChips }}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--stroke);border-radius:99px;padding:8px 13px;box-shadow:2px 2px 0 var(--stroke);background:{{ c.bg }};color:{{ c.fg }};transition:background var(--dur)">{{ c.label }}</button>
</sc-for>
</div>
<svg viewBox="0 0 140 275" role="img" aria-label="{{ axisAlt }}" style="width:100%;max-width:250px;display:block;margin:0 auto 4px;height:auto">
<g transform="{{ bodyRotT }}" style="transition:transform var(--dur)">
<g fill="var(--paper)" stroke="var(--stroke)" stroke-width="2" stroke-linejoin="round">
<sc-if value="{{ axisFront }}" hint-placeholder-val="{{ true }}">
<g>
<ellipse cx="70" cy="30" rx="18" ry="22"></ellipse>
<path d="M62,50h16v13h-16z"></path>
<path d="M48,63c10-4 34-4 44,0l4,41-8,48h-36l-8-48z"></path>
<g transform="{{ abdRT }}" style="transition:transform var(--dur)">
<path d="M92,66l11,4 5,80-10,3-10-76z"></path>
<path d="M98,152l11,2 1,15-11,1z"></path>
</g>
<g transform="{{ abdLT }}" style="transition:transform var(--dur)">
<path d="M48,66l-11,4-5,80 10,3 10-76z"></path>
<path d="M42,152l-11,2-1,15 11,1z"></path>
</g>

<script src="../ficha.js"></script>
<script>
class Component extends DCLogic {
  state = { p: 1, pose: 'anat', plane: 'sagital', pp: 50, axis: 'sagital', av: 0, sk: 'neuro', bone: null, sut: 'sagital', pt: 'cefalo', ans: {} };

  chip(k, cur) {
    const on = k === cur;
    return { on, bg: on ? 'var(--yellow)' : 'transparent', fg: on ? 'var(--onyel)' : 'var(--tx)' };
  }

  renderVals() {
    const s = this.state, S = (o) => this.setState(o);
    const V = {};

    V.tabs = [
      { k: 1, num: '01', label: 'Qué es' },
      { k: 2, num: '02', label: 'Cómo funciona' },
      { k: 3, num: '03', label: 'Cómo te das cuenta' }
    ].map(t => ({ ...t, ...this.chip(t.k, s.p), go: () => S({ p: t.k }) }));
    V.isP1 = s.p === 1; V.isP2 = s.p === 2; V.isP3 = s.p === 3;
    V.goP2 = () => S({ p: 2 }); V.goP3 = () => S({ p: 3 });

    /* ---- pliegue 1: posición anatómica ---- */
    V.poseChips = [
      { k: 'anat', label: 'Posición anatómica' },
      { k: 'otra', label: 'Cualquier otra pose' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.pose), go: () => S({ pose: c.k }) }));
    const otra = s.pose === 'otra';
    V.headT = otra ? 'rotate(-12 70 46)' : 'rotate(0 70 46)';
    V.armRT = otra ? 'rotate(-115 92 68)' : 'rotate(0 92 68)';
    V.armLT = otra ? 'rotate(28 48 68)' : 'rotate(0 48 68)';
    V.palmRT = 'rotate(0 103 160)';
    V.legRT = otra ? 'rotate(-14 74 152)' : 'rotate(0 74 152)';
    V.palmO = otra ? 0 : 1;
    V.poseAlt = otra
      ? 'Esquema de un cuerpo de frente en una pose cualquiera: un brazo levantado, el otro separado y una pierna cruzada.'
      : 'Esquema de un cuerpo de frente en posición anatómica: brazos y piernas extendidas, palmas de las manos hacia adelante.';
    V.poseHeadline = otra ? 'Así no se puede describir' : 'Este es el punto de partida';
    V.poseWhy = otra
      ? 'Con el cuerpo en cualquier pose, «arriba», «adelante» o «al costado» cambian de significado según cómo esté ubicada la persona. Por eso la anatomía describe siempre desde la misma posición.'
      : 'Desde acá se describe todo. Es la posición de referencia con la que se define el resto del vocabulario:';

    /* ---- 2.1 planos ---- */
    V.planeChips = [
      { k: 'sagital', label: 'Sagital' },
      { k: 'coronal', label: 'Coronal o frontal' },
      { k: 'transversal', label: 'Transversal u horizontal' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.plane), go: () => S({ plane: c.k, pp: 50 }) }));
    V.pp = s.pp;
    V.setPP = (e) => S({ pp: +e.target.value });
    const t = (s.pp - 50) / 50;
    V.planeFront = s.plane !== 'coronal';
    V.planeSide = s.plane === 'coronal';
    if (s.plane === 'sagital') {
      const x = 70 + t * 26;
      V.lx1 = x; V.ly1 = 4; V.lx2 = x; V.ly2 = 268;
      V.hx = 0; V.hy = 4; V.hw = Math.max(0, x); V.hh = 264;
      V.planeView = 'VISTA DE FRENTE'; V.ppMin = 'HACIA TU DERECHA'; V.ppMax = 'HACIA TU IZQUIERDA';
      V.planeName = 'Plano sagital';
      V.planeText = 'Corre de adelante hacia atrás y divide el cuerpo en una parte derecha y una izquierda. Podés correrlo a cualquier altura del ancho del cuerpo: sigue siendo el plano sagital.';
      V.planeAlt = 'Cuerpo de frente con una línea vertical de corte que se puede desplazar de un lado al otro.';
    } else if (s.plane === 'transversal') {
      const y = 136 + t * 110;
      V.lx1 = 4; V.ly1 = y; V.lx2 = 136; V.ly2 = y;
      V.hx = 4; V.hy = 4; V.hw = 132; V.hh = Math.max(0, y - 4);
      V.planeView = 'VISTA DE FRENTE'; V.ppMin = 'MÁS ARRIBA'; V.ppMax = 'MÁS ABAJO';
      V.planeName = 'Plano transversal u horizontal';
      V.planeText = 'Cruza el cuerpo de lado a lado en forma horizontal y lo divide en una parte de arriba y una de abajo. Corrélo: podés cortar por el cuello, por el tórax o por la rodilla.';
      V.planeAlt = 'Cuerpo de frente con una línea horizontal de corte que se puede subir y bajar.';
    } else {
      const x = 66 + t * 18;
      V.lx1 = x; V.ly1 = 4; V.lx2 = x; V.ly2 = 268;
      V.hx = 0; V.hy = 4; V.hw = Math.max(0, x); V.hh = 264;
      V.planeView = 'VISTA DE PERFIL · LA PERSONA MIRA A LA DERECHA';
      V.ppMin = 'MÁS ATRÁS'; V.ppMax = 'MÁS ADELANTE';
      V.planeName = 'Plano coronal o frontal';
      V.planeText = 'Divide el cuerpo en una parte de adelante y una de atrás. De frente no se ve, porque queda paralelo a tu mirada: por eso acá el cuerpo está de perfil. El mismo plano, otra vista.';
      V.planeAlt = 'Cuerpo de perfil con una línea vertical de corte que se puede mover hacia adelante y hacia atrás.';
    }

    /* ---- 2.2 ejes ---- */
    V.axisChips = [
      { k: 'transversal', label: 'Transversal' },
      { k: 'longitudinal', label: 'Longitudinal' },
      { k: 'sagital', label: 'Sagital' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.axis), go: () => S({ axis: c.k, av: 0 }) }));
    V.av = s.av;
    V.setAV = (e) => S({ av: +e.target.value });
    const a = s.av / 100;
    V.axisFront = s.axis !== 'transversal';
    V.axisSide = s.axis === 'transversal';
    V.axisIsLong = s.axis === 'longitudinal';
    V.axisIsPoint = s.axis !== 'longitudinal';
    V.bodyRotT = 'rotate(0)';
    V.abdRT = 'rotate(0 92 68)'; V.abdLT = 'rotate(0 48 68)'; V.flexT = 'rotate(0 72 68)';
    if (s.axis === 'sagital') {
      V.abdRT = 'rotate(' + (-a * 78).toFixed(1) + ' 92 68)';
      V.abdLT = 'rotate(' + (a * 78).toFixed(1) + ' 48 68)';
      V.pcx = 70; V.pcy = 100;
      V.axisView = 'VISTA DE FRENTE · EL EJE TE APUNTA A VOS';
      V.avMin = 'BRAZOS PEGADOS AL CUERPO'; V.avMax = 'BRAZOS ALEJADOS DEL CUERPO';
      V.axisName = 'Eje sagital';
      V.axisText = 'Atraviesa al cuerpo de atrás hacia adelante. Movimientos de abducción y aducción.';
      V.axisNote = 'De frente el eje se ve como un punto, porque va en la dirección de tu mirada. El brazo se mueve alrededor de ese punto.';
      V.axisAlt = 'Cuerpo de frente separando y acercando los brazos alrededor de un eje que apunta hacia el observador.';
    } else if (s.axis === 'transversal') {
      V.flexT = 'rotate(' + (-a * 95).toFixed(1) + ' 72 68)';
      V.pcx = 72; V.pcy = 68;
      V.axisView = 'VISTA DE PERFIL · EL EJE ATRAVIESA EL HOMBRO';
      V.avMin = 'BRAZO ABAJO'; V.avMax = 'BRAZO HACIA ADELANTE';
      V.axisName = 'Eje transversal';
      V.axisText = 'Atraviesa al cuerpo de un lado al otro. Movimientos de flexión y extensión.';
      V.axisNote = 'De frente este movimiento casi no se ve: el brazo va hacia adelante, hacia vos. Por eso el cuerpo está de perfil.';
      V.axisAlt = 'Cuerpo de perfil llevando el brazo hacia adelante alrededor de un eje que atraviesa el hombro de lado a lado.';
    } else {
      const sc = (1 - a * 0.55).toFixed(3);
      V.bodyRotT = 'translate(' + (70 * (1 - sc)).toFixed(2) + ' 0) scale(' + sc + ' 1)';
      V.axisView = 'VISTA DE FRENTE · EL EJE ES LA LÍNEA VERTICAL';
      V.avMin = 'DE FRENTE'; V.avMax = 'GIRANDO SOBRE SÍ MISMO';
      V.axisName = 'Eje longitudinal';
      V.axisText = 'Atraviesa al cuerpo de arriba a abajo. Movimientos rotacionales.';
      V.axisNote = 'Al girar alrededor de la línea vertical el cuerpo se ve cada vez más angosto: no se hizo más chico, cambió de orientación.';
      V.axisAlt = 'Cuerpo de frente girando sobre una línea vertical que lo atraviesa de arriba a abajo.';
    }

    /* ---- 2.3 puntos de ubicación ---- */
    const pointsFront = {
      cefalo: 'Céfalo: hacia la cabeza.',
      caudal: 'Caudal: hacia los pies.',
      medial: 'Medial: hacia la línea media del cuerpo.',
      lateral: 'Lateral: hacia el costado, alejándose de la línea media.',
      proximal: 'Proximal: más cerca del punto donde el miembro se une al cuerpo.',
      distal: 'Distal: más lejos del punto donde el miembro se une al cuerpo.'
    };
    const pointsSide = {
      superior: 'Superior: hacia arriba.',
      inferior: 'Inferior: hacia abajo.',
      anterior: 'Anterior: hacia adelante.',
      posterior: 'Posterior: hacia atrás.'
    };
    const front = Object.keys(pointsFront), side = Object.keys(pointsSide);
    const labels = { cefalo: 'Céfalo', caudal: 'Caudal', medial: 'Medial', lateral: 'Lateral', proximal: 'Proximal', distal: 'Distal', superior: 'Superior', inferior: 'Inferior', anterior: 'Anterior', posterior: 'Posterior' };
    V.pointChips = front.concat(side).map(k => ({ label: labels[k], ...this.chip(k, s.pt), go: () => S({ pt: k }) }));
    V.pointFront = front.indexOf(s.pt) >= 0;
    V.pointSide = !V.pointFront;
    const geoFront = [
      { k: 'cefalo', x1: 198, y1: 120, x2: 198, y2: 24, lx: 198, ly: 14, an: 'middle' },
      { k: 'caudal', x1: 198, y1: 150, x2: 198, y2: 248, lx: 198, ly: 266, an: 'middle' },
      { k: 'lateral', x1: 96, y1: 100, x2: 140, y2: 100, lx: 145, ly: 104, an: 'start' },
      { k: 'medial', x1: 140, y1: 126, x2: 98, y2: 126, lx: 145, ly: 130, an: 'start' },
      { k: 'proximal', x1: 30, y1: 92, x2: 40, y2: 76, lx: 27, ly: 92, an: 'end' },
      { k: 'distal', x1: 30, y1: 146, x2: 38, y2: 160, lx: 27, ly: 152, an: 'end' }
    ];
    const geoSide = [
      { k: 'superior', x1: 198, y1: 120, x2: 198, y2: 24, lx: 198, ly: 14, an: 'middle' },
      { k: 'inferior', x1: 198, y1: 150, x2: 198, y2: 248, lx: 198, ly: 266, an: 'middle' },
      { k: 'anterior', x1: 96, y1: 96, x2: 136, y2: 96, lx: 141, ly: 100, an: 'start' },
      { k: 'posterior', x1: 44, y1: 96, x2: 8, y2: 96, lx: 8, ly: 86, an: 'start' }
    ];
    V.arrows = (V.pointFront ? geoFront : geoSide).map(g => {
      const on = g.k === s.pt;
      return {
        ...g, label: labels[g.k].toUpperCase(),
        st: on ? 'stroke:var(--tx);stroke-width:3.5;marker-end:url(#mkI)' : 'stroke:var(--line);stroke-width:2.5;marker-end:url(#mkL);opacity:.55',
        fill: on ? 'var(--tx)' : 'var(--mut)'
      };
    });
    V.pointView = V.pointFront ? 'VISTA DE FRENTE' : 'VISTA DE PERFIL · LA PERSONA MIRA A LA DERECHA';
    V.pointName = labels[s.pt];
    V.pointText = (pointsFront[s.pt] || pointsSide[s.pt]);
    V.pointAlt = 'Esquema del cuerpo con flechas rotuladas; la flecha de ' + labels[s.pt] + ' está resaltada.';

    /* ---- 2.4 cráneo ---- */
    V.groupChips = [
      { k: 'neuro', label: 'Neurocráneo' },
      { k: 'viscero', label: 'Viscerocráneo' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.sk), go: () => S({ sk: c.k, bone: null }) }));
    const neuro = ['frontal', 'parietales', 'temporales', 'occipital', 'esfenoides', 'etmoides'];
    const viscero = ['maxilar superior', 'mandíbula', 'cigomáticos', 'nasales', 'palatinos', 'vómer', 'cornetes inferiores'];
    const list = s.sk === 'neuro' ? neuro : viscero;
    V.boneChips = list.map(k => ({ label: k, ...this.chip(k, s.bone), go: () => S({ bone: s.bone === k ? null : k }) }));
    V.groupTitle = s.sk === 'neuro' ? 'Huesos del neurocráneo — tocá uno' : 'Huesos del viscerocráneo — tocá uno';
    const paint = { frontal: 'bFront', parietales: 'bPar', temporales: 'bTemp', nasales: 'bNas', cigomáticos: 'bCig', 'maxilar superior': 'bMax', mandíbula: 'bMand' };
    const inGroup = { bFront: 'neuro', bPar: 'neuro', bTemp: 'neuro', bNas: 'viscero', bCig: 'viscero', bMax: 'viscero', bMand: 'viscero' };
    const hidden = ['occipital', 'esfenoides', 'etmoides', 'palatinos', 'vómer', 'cornetes inferiores'];
    const selKey = s.bone ? paint[s.bone] : null;
    ['bFront', 'bPar', 'bTemp', 'bNas', 'bCig', 'bMax', 'bMand'].forEach(k => {
      const isGroup = inGroup[k] === s.sk;
      let fill = 'var(--paper)';
      if (selKey === k) fill = 'var(--yellow)';
      else if (isGroup && !selKey) fill = 'var(--yellow)';
      V[k] = 'fill:' + fill + ';transition:fill var(--dur)';
    });
    if (!s.bone) {
      V.boneText = s.sk === 'neuro'
        ? 'Pintado: el neurocráneo, la parte que aloja al encéfalo. Lo forman el frontal, los parietales, los temporales, el occipital, el esfenoides y el etmoides.'
        : 'Pintado: el viscerocráneo, los huesos de la cara. Lo forman el maxilar superior, la mandíbula, los cigomáticos, los nasales, los palatinos, el vómer y los cornetes inferiores.';
    } else if (hidden.indexOf(s.bone) >= 0) {
      V.boneText = 'El ' + s.bone + ' no se ve en la vista de frente: queda atrás o adentro del cráneo. Está en la lista del ' + (s.sk === 'neuro' ? 'neurocráneo' : 'viscerocráneo') + ', y para ubicarlo necesitás otra vista: buscalo en el atlas de la cátedra.';
    } else {
      V.boneText = 'Resaltado: ' + s.bone + '. Forma parte del ' + (s.sk === 'neuro' ? 'neurocráneo' : 'viscerocráneo') + '. Este esquema marca la zona, no la forma exacta del hueso.';
    }
    V.skullAlt = 'Esquema de cráneo de frente con los huesos del ' + (s.sk === 'neuro' ? 'neurocráneo' : 'viscerocráneo') + ' resaltados en amarillo.';

    V.sutChips = [
      { k: 'sagital', label: 'Sagital' },
      { k: 'coronal', label: 'Coronal' },
      { k: 'lambdoidea', label: 'Lambdoidea' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.sut), go: () => S({ sut: c.k }) }));
    ['sSag', 'sCor', 'sLam'].forEach(k => { V[k] = 'opacity:.3;transition:opacity var(--dur),stroke-width var(--dur)'; });
    const sutKey = { sagital: 'sSag', coronal: 'sCor', lambdoidea: 'sLam' }[s.sut];
    V[sutKey] = 'opacity:1;stroke-width:4;transition:opacity var(--dur),stroke-width var(--dur)';
    V.sutName = 'Sutura ' + s.sut;
    V.sutText = {
      sagital: 'En el esquema visto desde arriba: corre por el medio, de adelante hacia atrás.',
      coronal: 'En el esquema visto desde arriba: cruza de lado a lado, en la parte de adelante.',
      lambdoidea: 'En el esquema visto desde arriba: queda atrás, con forma de V abierta.'
    }[s.sut] + ' Es una unión fibrosa: no es un hueso ni una articulación móvil.';
    V.sutAlt = 'Esquema de cráneo visto desde arriba con las suturas sagital, coronal y lambdoidea; la sutura ' + s.sut + ' está resaltada.';

    /* ---- pliegue 3 ---- */
    const QS = [
      { id: 'q1', text: '¿Qué son los planos o cortes anatómicos?', o: ['Estructuras que se ven al abrir el cuerpo', 'Líneas imaginarias que dividen al cuerpo o a una estructura', 'Los nombres de los huesos del cráneo'], c: 1, why: 'Son líneas imaginarias que dividen al cuerpo o a estructuras anatómicas para facilitar nuestro estudio. No están en el cuerpo: están para poder hablar de él con precisión.' },
      { id: 'q2', text: 'El eje que atraviesa al cuerpo de arriba a abajo es el…', o: ['Transversal', 'Sagital', 'Longitudinal'], c: 2, why: 'Longitudinal: atraviesa al cuerpo de arriba a abajo. Le corresponden los movimientos rotacionales.' },
      { id: 'q3', text: 'Flexión y extensión son los movimientos de qué eje?', o: ['Transversal', 'Longitudinal', 'Sagital'], c: 0, why: 'Transversal: atraviesa al cuerpo de un lado al otro. Movimientos de flexión y extensión.' },
      { id: 'q4', text: '¿Y abducción y aducción?', o: ['Longitudinal', 'Sagital', 'Transversal'], c: 1, why: 'Sagital: atraviesa al cuerpo de atrás hacia adelante. Movimientos de abducción y aducción.' },
      { id: 'q5', text: 'En posición anatómica, las manos y los pies están en…', o: ['Pronación', 'Supinación', 'Rotación interna'], c: 1, why: 'Posición anatómica: cuerpo en levitación, brazos y piernas extendidas, manos y pies en supinación. Es la posición de referencia desde la que se describe todo lo demás.' },
      { id: 'q6', text: 'El maxilar superior pertenece al…', o: ['Neurocráneo', 'Viscerocráneo'], c: 1, why: 'Viscerocráneo: maxilar superior, mandíbula, cigomáticos, nasales, palatinos, vómer y cornetes inferiores. Son los huesos de la cara.' },
      { id: 'q7', text: '¿Y el esfenoides?', o: ['Neurocráneo', 'Viscerocráneo'], c: 0, why: 'Neurocráneo: frontal, parietales, temporales, occipital, esfenoides y etmoides.' },
      { id: 'q8', text: '¿Qué son las suturas craneales?', o: ['Uniones fibrosas que conectan los huesos del cráneo', 'Agujeros por donde pasan los nervios', 'Articulaciones móviles del cráneo'], c: 0, why: 'Son uniones fibrosas que conectan los huesos del cráneo. Marcan la unión entre los huesos, el crecimiento y cierre de las fontanelas craneales. Las que vimos: sagital, coronal y lambdoidea.' }
    ];
    let ok = 0, done = 0;
    V.quiz = QS.map((q, i) => {
      const picked = s.ans[q.id];
      const answered = picked !== undefined;
      if (answered) { done++; if (picked === q.c) ok++; }
      return {
        num: 'PREGUNTA ' + String(i + 1).padStart(2, '0') + ' / 08',
        text: q.text, done: answered, why: q.why,
        opts: q.o.map((label, j) => {
          const isC = j === q.c, chosen = picked === j;
          let bg = 'var(--paper)', fg = 'var(--tx)', mark = '○';
          if (answered) {
            if (isC) { bg = 'var(--yellow)'; fg = 'var(--onyel)'; mark = '✔'; }
            else if (chosen) { mark = '✕'; }
            else { mark = '·'; }
          }
          return { label, bg, fg, mark, on: chosen, go: () => { if (!answered) S({ ans: { ...this.state.ans, [q.id]: j } }); } };
        })
      };
    });
    V.score = done === 0 ? 'TODAVÍA NO RESPONDISTE NINGUNA' : 'ACERTASTE ' + ok + ' DE ' + done + ' RESPONDIDAS · 8 EN TOTAL';
    V.resetQuiz = () => S({ ans: {} });

    return V;
  }
}
arrancarFicha();
</script>
</body>
</html>
