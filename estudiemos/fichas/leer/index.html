<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de estudio · La Bolívar con vos</title>
<meta name="theme-color" content="#F9E830">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../../../imagenes/icono-32.png">
<link rel="apple-touch-icon" href="../../../imagenes/icono-apple.png">
<link rel="manifest" href="../../../manifest.json">
<link rel="stylesheet" href="../../../estilos.css">
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
<!-- LAS FICHAS DE TEXTO. Las ocho de arriba se dibujaron en Claude
     Design, una por una. Estas veintiuna llegaron como el texto que
     devuelve NotebookLM con el molde de PROMPT-FICHAS.md, y no daba el
     tiempo para dibujarlas antes del 21. Esta página lee ese texto tal
     cual (`../textos/<nombre>.txt`) y lo arma con las piezas de la app:
     las máquinas son chips y las preguntas se corrigen al tocar.
     Lo único que se deja afuera son los ESQUEMA: son instrucciones de
     dibujo para Claude Design, no contenido. El día que una ficha se
     dibuje, se le hace su carpeta y se saca de acá. -->
<style>
.ft-cita{color:var(--texto-suave);font-size:var(--letra-chica);white-space:nowrap}
.ft-falta{font-family:var(--fuente-sub);font-size:var(--letra-mini);font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;background:var(--apagado);
  border-radius:var(--radio-chico);padding:1px 6px;white-space:nowrap}
.ft-bloque{margin:0 0 14px}
.ft-bloque h2{font-family:var(--fuente-titulo);font-size:var(--letra-sub);
  line-height:1.1;text-transform:uppercase;margin:0 0 10px}
.ft-confunde{background:var(--amarillo);color:var(--sobre-color);border:1px solid var(--tinta-borde);
  box-shadow:var(--sombra);border-radius:var(--radio);padding:14px 16px;margin:16px 0}
.ft-confunde .ft-cita{color:inherit}
.ft-rotulo{font-family:var(--fuente-sub);font-size:var(--letra-mini);font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;display:block}
.ft-piezas{margin:0;padding-left:20px}
.ft-piezas li{margin:0 0 8px}
.ft-elige{color:var(--texto-suave);font-size:var(--letra-nota);margin:0 0 8px}
.ft-chips{flex-wrap:wrap;overflow:visible}
.ft-chips .chip{white-space:normal;text-align:left;max-width:100%;min-width:0}
.ft-opcion{border-top:1px solid var(--linea);padding-top:12px;margin-top:4px}
.ft-preg{margin:0 0 22px}
.ft-preg p{font-weight:700;margin:0 0 10px}
.ft-resp{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;
  background:var(--superficie);color:var(--texto);border:1px solid var(--linea);
  border-radius:var(--radio-chico);font:inherit;cursor:pointer}
.ft-resp[disabled]{cursor:default}
.ft-resp.bien{background:var(--aviso-ok);border-color:var(--linea-gremial);color:var(--negro)}
.ft-resp.mal{background:var(--aviso-error);border-color:var(--rojo);color:var(--negro)}
.ft-porque{font-size:var(--letra-nota);color:var(--texto-suave);margin:4px 0 0}
.ft-cuenta{font-family:var(--fuente-sub);font-weight:700}
.ft-aclarar li{margin:0 0 10px}
</style>
</head>
<body>

<div id="cabecera"></div>

<main class="envoltura" id="contenido" tabindex="-1">
  <p style="margin:16px 0 0"><a href="../">← Fichas de estudio</a></p>
  <div id="ficha"><p class="bajada">Cargando la ficha…</p></div>
</main>

<div id="pie"></div>

<script>window.RAIZ = '../../../';</script>
<script src="../../../lib/datos.js"></script>
<script src="../../../config.js"></script>
<script src="../../../iconos.js"></script>
<script src="../../../app.js"></script>
<script src="../leer.js"></script>
</body>
</html>
