<!-- EL TEMA, ANTES DE DIBUJAR NADA. Igual que en el resto de la app: si
     esto viviera en un script del final, la ficha arrancaria clara y
     pegaria un salto a oscura. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<style>
/* ===== LO QUE VINO DEL DISENO, TAL CUAL ===== */
:root{color-scheme:light dark;--bg:#FFFFFF;--paper:#FDFCF7;--tx:#1A1A1A;--mut:#3A3A3A;--stroke:#1A1A1A;--yellow:#F9E830;--onyel:#1A1A1A;--red:#B52625;--line:#0195B1;--dur:.25s}
html[data-tema="oscuro"]{--bg:#151412;--paper:#22201D;--tx:#FDFCF7;--mut:#D8D3C8;--stroke:#FDFCF7;--red:#FF9D8F;--line:#5AD8F0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--red);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--tx)}
button{font:inherit;cursor:pointer;color:var(--tx)}
:focus-visible{outline:3px solid var(--line);outline-offset:2px}
input[type=range]{accent-color:var(--line);width:100%;height:34px}
.js-reveal [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.js-reveal [data-reveal].on{opacity:1;transform:none}
@media print{[data-reveal]{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1!important;transform:none!important;transition:none!important}:root{--dur:0s}}

/* ===== LO QUE AGREGA LA APP ===== */

/* La ficha no carga estilos.css. Es una pieza de lectura a pantalla
   completa con su propio sistema visual, y las 160 KB de la app le
   pelearian el body, la tipografia y los titulos. Lo unico que se
   comparte es el tema y la barra de volver. */

.ficha-volver{
  display:inline-flex; align-items:center; gap:8px;
  position:sticky; top:0; z-index:20;
  width:100%; box-sizing:border-box;
  padding:11px 18px;
  font-family:Montserrat,sans-serif; font-weight:800;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--yellow); color:var(--onyel);
  border-bottom:2px solid var(--stroke);
  text-decoration:none;
}
.ficha-volver:hover{ color:var(--onyel); }

/* LOS SELLOS TODAVIA NO LLEGARON. En el proyecto de Claude Design viven
   en assets/sello-sb.svg y assets/sello-sb-conduccion.png, y no vinieron
   con los .dc.html. Un recuadro vacio con borde se ve peor que nada, asi
   que el bloque queda escondido.

   CUANDO LOS COPIEN a estudiemos/fichas/assets/, borren estas tres
   lineas y los sellos aparecen solos en las ocho fichas. */
.ficha-sellos{ display:none; }
</style>
</head>

<!-- ===== HERO ===== -->
<section style="min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:44px 18px 32px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">

<span style="font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.06em;border:1px solid var(--stroke);border-radius:99px;padding:5px 11px">FICHA · BASES</span>

<h1 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(40px,13vw,84px);line-height:.84;margin:0;text-transform:uppercase;letter-spacing:-.03em" data-reveal data-delay="80">Preparemos<br>bases<br>juntes</h1>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(14px,4vw,19px);letter-spacing:.02em;text-transform:uppercase;margin:16px 0 0;max-width:30ch" data-reveal data-delay="160">Sistema nervioso central y periférico · lóbulos · neurona</p>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.55;color:var(--mut);margin:14px 0 0;max-width:46ch;text-wrap:pretty" data-reveal data-delay="240">Misma ficha, tres pliegues: primero qué es, después cómo funciona con las piezas para mover, y al final cómo te das cuenta de si te quedó.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:26px" data-reveal data-delay="320">
<a href="#b1" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:14px 18px;text-decoration:none">Empezar por el 01</a>
<a href="#b3" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:14px 18px;text-decoration:none">Ir a la autoevaluación</a>
</div>
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.1em;margin:34px 0 0;color:var(--mut)" data-reveal data-delay="400">↓ 01 QUÉ ES · 02 CÓMO FUNCIONA · 03 CÓMO TE DAS CUENTA</p>
</section>

<!-- ===== 01 ===== -->
<section id="b1" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 01</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Qué es</h2>
<p style="font-size:clamp(16px,4.4vw,20px);line-height:1.55;margin:0 0 12px;max-width:44ch;text-wrap:pretty" data-reveal data-delay="120">El sistema nervioso se estudia en dos partes: una que procesa y coordina, y otra que lleva y trae la información.</p>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 0 28px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="180">Tocá cada una y mirá dónde está en el cuerpo. Es la división que ordena todo lo que viene después.</p>

<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-bottom:22px" data-reveal data-delay="240">
<div role="group" aria-label="Elegí una parte del sistema nervioso" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px">

</sc-for>
</div>

<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-align:center;color:var(--mut);margin:0 0 16px">{{ sysView }}</p>
<div style="border-top:2px solid var(--stroke);padding-top:14px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px">{{ sysName }}</p>
<p style="font-size:15px;line-height:1.6;margin:0 0 10px;text-wrap:pretty">{{ sysText }}</p>

<!-- ===== 02 ===== -->
<section id="b2" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 02</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Cómo<br>funciona</h2>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 0 28px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="120">Dos piezas para mover con el dedo o con el teclado: los lóbulos del cerebro y la neurona.</p>

<!-- lóbulos -->
<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-bottom:18px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 4px">2.1</p>
<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:23px;line-height:1;margin:0 0 8px;text-transform:uppercase">Lóbulos del cerebro</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 14px">Los cuatro lóbulos no se definen por lo que hacen sino por dónde están, uno respecto del otro. Tocá cada uno: la descripción siempre te ubica desde el anterior.</p>
<div role="group" aria-label="Elegí un lóbulo" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
<sc-for list="{{ lobeChips }}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--stroke);border-radius:99px;padding:9px 13px;box-shadow:2px 2px 0 var(--stroke);background:{{ c.bg }};color:{{ c.fg }};transition:background var(--dur)">{{ c.label }}</button>
</sc-for>

<div style="border:1px solid var(--stroke);border-left:6px solid var(--yellow);border-radius:10px;padding:12px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px">{{ lobeName }}</p>

<!-- neurona -->
<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-bottom:18px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 4px">2.2</p>
<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:23px;line-height:1;margin:0 0 8px;text-transform:uppercase">Neurona</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 14px">La misma neurona se clasifica de dos maneras distintas. Cambiá de criterio y mirá qué cambia en el dibujo: por estructura cambia la forma, por función cambia el nombre y no el dibujo.</p>

<h4 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:19px;line-height:1;margin:0 0 10px;text-transform:uppercase">Sinapsis</h4>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
<div style="border:1px solid var(--stroke);border-radius:10px;padding:12px;box-shadow:2px 2px 0 var(--stroke)">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0">Química</p>
</div>
<div style="border:1px solid var(--stroke);border-radius:10px;padding:12px;box-shadow:2px 2px 0 var(--stroke)">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0">Eléctrica</p>
</div>
</div>
<p style="font-size:13px;line-height:1.55;color:var(--mut);margin:10px 0 0">La ficha nombra estos dos tipos. Cómo funciona cada una lo trabajan en la cátedra: llevá la pregunta a clase.</p>
</div>
</article>
</section>

<!-- ===== 03 ===== -->
<section id="b3" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 03</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Cómo te<br>das cuenta</h2>
<p style="font-size:clamp(16px,4.4vw,20px);line-height:1.55;margin:0 0 8px;max-width:44ch;text-wrap:pretty" data-reveal data-delay="120">Ocho preguntas. Elegís una opción y aparece la respuesta correcta con el porqué, aciertes o no.</p>
<p style="font-size:15px;line-height:1.6;color:var(--mut);margin:0 0 26px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="180">El acierto es sólo el camino: lo que hay que estudiar es el porqué.</p>

<sc-for list="{{ quiz }}" as="q" hint-placeholder-count="8">
<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:16px;margin-bottom:14px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 6px">{{ q.num }}</p>
<p style="font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;line-height:1.4;margin:0 0 12px;text-wrap:pretty">{{ q.text }}</p>
<div role="group" aria-label="Opciones" style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ q.opts }}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{ o.go }}" aria-pressed="{{ o.on }}" style="display:flex;gap:9px;align-items:flex-start;text-align:left;font-family:Roboto,sans-serif;font-size:14.5px;line-height:1.45;border:1px solid var(--stroke);border-radius:10px;padding:11px 12px;box-shadow:2px 2px 0 var(--stroke);background:{{ o.bg }};color:{{ o.fg }};transition:background var(--dur)">
<span style="font-family:'Roboto Mono',monospace;font-size:12px;padding-top:1px">{{ o.mark }}</span>
<span>{{ o.label }}</span>
</button>
</sc-for>
</div>
<sc-if value="{{ q.done }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:12px;border:1px solid var(--stroke);border-left:6px solid var(--yellow);border-radius:10px;padding:12px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px">Por qué</p>
<p style="font-size:14.5px;line-height:1.55;margin:0;text-wrap:pretty">{{ q.why }}</p>
</div>
</sc-if>
</article>
</sc-for>

<div style="background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-top:18px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.06em;margin:0 0 6px">{{ score }}</p>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;line-height:1.4;margin:0 0 8px">Si algún porqué no te cerró, anotalo y llevalo a la cátedra.</p>
<p style="font-size:14px;line-height:1.55;margin:0">Preguntar en clase o en la comisión es parte de estudiar, no una señal de que vas atrasada.</p>
</div>
<button type="button" onClick="{{ resetQuiz }}" style="width:100%;margin-top:12px;text-align:left;font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;background:transparent;border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:13px 15px">Borrar respuestas y volver a empezar</button>
</section>

<footer style="padding:48px 18px 60px;max-width:820px;margin:0 auto">
<p style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(26px,8vw,44px);line-height:.92;margin:0 0 14px;text-transform:uppercase" data-reveal>Preparemos<br>bases juntes</p>
<p style="font-size:15px;line-height:1.55;margin:0 0 10px;max-width:44ch" data-reveal data-delay="80">¿Qué otra ficha o grupo de estudio necesitás? La Bolívar te acompaña: pedí el link del grupo al Equipo de Fonoaudiología.</p>
<p style="font-size:13px;line-height:1.55;color:var(--mut);margin:0;max-width:52ch" data-reveal data-delay="140">Material de estudio armado con las placas del Equipo de Fonoaudiología · Agrupación Simón Bolívar. Los esquemas son diagramas, no atlas: para el detalle usá la bibliografía y preguntá en la cátedra.</p>
<div class="ficha-sellos" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin:28px 0 0;border-top:2px solid var(--stroke);padding-top:26px" data-reveal data-delay="180">
<img loading="lazy" src="../assets/sello-sb.svg" alt="Sello del Equipo de Fonoaudiología" width="150" height="150" style="width:clamp(112px,30vw,150px);height:auto;display:block;border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke)">
<div style="display:flex;align-items:center;justify-content:center;padding:14px 50px;background:#FDFCF7;border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke)">
<img loading="lazy" src="../assets/sello-sb-conduccion.png" alt="Simón Bolívar · Conducción del CEFTS" width="514" height="194" style="width:clamp(180px,52vw,258px);height:auto;display:block">
</div>
</div>
</footer>
</template>

<script src="../ficha.js"></script>
<script>
class Component extends DCLogic {
  state = { sys: 'snc', lobe: 'frontal', crit: 'estructura', tipo: 'multipolares', ans: {} };

  componentDidMount() { this.wire(); }
  componentDidUpdate() { this.wire(); }
  componentWillUnmount() { clearTimeout(this._fail); if (this._io) this._io.disconnect(); }

  wire() {
    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));
    const show = () => nodes.forEach(n => n.classList.add('on'));
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { show(); return; }
    document.documentElement.classList.add('js-reveal');
    nodes.forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.top < (window.innerHeight || 800) && r.bottom > 0) n.classList.add('on');
    });
    clearTimeout(this._fail);
    this._fail = setTimeout(show, 900);
    if (!this._io) {
      this._io = new IntersectionObserver((es) => {
        es.forEach(e => {
          if (e.isIntersecting) {
            e.target.style.transitionDelay = (e.target.getAttribute('data-delay') || 0) + 'ms';
            e.target.classList.add('on');
            this._io.unobserve(e.target);
          }
        });
      }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });
    }
    nodes.forEach(n => { if (!n.classList.contains('on') && !n._obs) { n._obs = 1; this._io.observe(n); } });
  }

  chip(k, cur) {
    const on = k === cur;
    return { on, bg: on ? 'var(--yellow)' : 'transparent', fg: on ? 'var(--onyel)' : 'var(--tx)' };
  }

  renderVals() {
    const s = this.state, S = (o) => this.setState(o);
    const V = {};

    V.intro = [
      { d: 0, t: 'Lóbulos', b: 'El cerebro se describe por lóbulos: frontal, parietal, temporal y occipital. Cada uno se ubica respecto de los otros.' },
      { d: 80, t: 'Neurona', b: 'Se clasifica según su función (sensitivas o aferentes, motoras o eferentes) y según su estructura (unipolares, bipolares, multipolares).' },
      { d: 160, t: 'Sinapsis', b: 'Hay dos tipos nombrados en la ficha: química y eléctrica.' }
    ];

    V.sysChips = [
      { k: 'snc', label: 'Central (SNC)' },
      { k: 'snp', label: 'Periférico (SNP)' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.sys), go: () => S({ sys: c.k }) }));
    const snc = s.sys === 'snc';
    V.sncStyle = 'opacity:' + (snc ? 1 : 0.14) + ';transition:opacity var(--dur)';
    V.snpStyle = 'opacity:' + (snc ? 0.14 : 1) + ';transition:opacity var(--dur)';
    V.sysName = snc ? 'Sistema nervioso central' : 'Sistema nervioso periférico';
    V.sysText = snc
      ? 'Está compuesto por el cerebro y la médula espinal, procesa la información y coordina las respuestas del cuerpo.'
      : 'Es la red de nervios que conecta el sistema nervioso central con el resto del cuerpo.';
    V.sysListTitle = snc ? 'Componentes' : 'Se divide en dos componentes principales';
    V.sysList = snc
      ? [{ t: 'Cerebro: corteza cerebral, sistema límbico, tálamo e hipotálamo' }, { t: 'Médula espinal' }]
      : [{ t: 'Sistema nervioso somático' }, { t: 'Sistema nervioso autónomo' }];
    V.sysView = snc ? 'EN AMARILLO: CEREBRO Y MÉDULA ESPINAL' : 'EN CELESTE: LA RED DE NERVIOS';
    V.sysAlt = snc
      ? 'Esquema del cuerpo con el cerebro y la médula espinal resaltados.'
      : 'Esquema del cuerpo con la red de nervios que sale de la médula hacia los miembros resaltada.';

    const lobes = {
      frontal: { n: 'Lóbulo frontal', t: 'Se encuentra en la parte anterior del cerebro.', k: 'lFront' },
      parietal: { n: 'Lóbulo parietal', t: 'Situado detrás del lóbulo frontal.', k: 'lPar' },
      temporal: { n: 'Lóbulo temporal', t: 'Se ubica debajo del lóbulo parietal.', k: 'lTemp' },
      occipital: { n: 'Lóbulo occipital', t: 'Forma la región posterior de cada hemisferio.', k: 'lOcc' }
    };
    V.lobeChips = Object.keys(lobes).map(k => ({ label: lobes[k].n.replace('Lóbulo ', ''), ...this.chip(k, s.lobe), go: () => S({ lobe: k }) }));
    ['lFront', 'lPar', 'lTemp', 'lOcc'].forEach(k => { V[k] = 'fill:var(--paper);transition:fill var(--dur)'; });
    V[lobes[s.lobe].k] = 'fill:var(--yellow);transition:fill var(--dur)';
    V.lobeName = lobes[s.lobe].n;
    V.lobeText = lobes[s.lobe].t + ' Este esquema marca la zona, no los límites exactos: para el detalle, el atlas de la cátedra.';
    V.lobeAlt = 'Esquema del cerebro de perfil con los cuatro lóbulos; el ' + lobes[s.lobe].n.toLowerCase() + ' está resaltado.';

    V.critChips = [
      { k: 'estructura', label: 'Según su estructura' },
      { k: 'funcion', label: 'Según su función' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.crit), go: () => S({ crit: c.k, tipo: c.k === 'estructura' ? 'multipolares' : 'sensitivas' }) }));
    const tipos = s.crit === 'estructura'
      ? ['unipolares', 'bipolares', 'multipolares']
      : ['sensitivas', 'motoras'];
    V.typeChips = tipos.map(k => ({ label: k, ...this.chip(k, s.tipo), go: () => S({ tipo: k }) }));
    const showD = {
      unipolares: [0, 0, 0, 0, 0],
      bipolares: [0, 0, 0, 0, 1],
      multipolares: [1, 1, 1, 1, 0],
      sensitivas: [1, 1, 1, 1, 0],
      motoras: [1, 1, 1, 1, 0]
    }[s.tipo];
    ['d1', 'd2', 'd3', 'd4', 'd5'].forEach((k, i) => {
      V[k] = 'opacity:' + (showD[i] ? 1 : 0) + ';transition:opacity var(--dur)';
    });
    const tt = {
      unipolares: ['Neuronas unipolares', 'Una sola prolongación sale del cuerpo neuronal.', 'El dibujo cambia: se queda sin dendritas de este lado.'],
      bipolares: ['Neuronas bipolares', 'Dos prolongaciones: una a cada lado del cuerpo neuronal.', 'El nombre te dice cuántos polos tiene, y eso es lo que ves en el esquema.'],
      multipolares: ['Neuronas multipolares', 'Muchas prolongaciones salen del cuerpo neuronal.', 'El nombre te dice cuántos polos tiene, y eso es lo que ves en el esquema.'],
      sensitivas: ['Neuronas sensitivas (aferentes)', 'Es una clasificación según su función.', 'Fijate que el dibujo no cambió: por función, la misma forma puede ser sensitiva o motora. El criterio no está en la forma.'],
      motoras: ['Neuronas motoras (eferentes)', 'Es una clasificación según su función.', 'Fijate que el dibujo no cambió: por función, la misma forma puede ser sensitiva o motora. El criterio no está en la forma.']
    }[s.tipo];
    V.typeName = tt[0]; V.typeText = tt[1]; V.typeNote = tt[2];
    V.neuronAlt = 'Esquema de una neurona: cuerpo, axón y terminales. Tipo mostrado: ' + s.tipo + '.';

    const QS = [
      { id: 'n1', text: '¿Por qué está compuesto el sistema nervioso central?', o: ['Por el cerebro y la médula espinal', 'Por los nervios de todo el cuerpo', 'Por el sistema somático y el autónomo'], c: 0, why: 'Está compuesto por el cerebro y la médula espinal, procesa la información y coordina las respuestas del cuerpo.' },
      { id: 'n2', text: '¿Qué es el sistema nervioso periférico?', o: ['La corteza cerebral', 'La red de nervios que conecta el sistema nervioso central con el resto del cuerpo', 'El conjunto de sinapsis'], c: 1, why: 'Es la red de nervios que conecta el sistema nervioso central con el resto del cuerpo. Se divide en dos componentes principales: sistema nervioso somático y sistema nervioso autónomo.' },
      { id: 'n3', text: 'Los dos componentes principales del sistema nervioso periférico son…', o: ['Somático y autónomo', 'Sensitivo y motor', 'Químico y eléctrico'], c: 0, why: 'Se divide en dos componentes principales: el sistema nervioso somático y el sistema nervioso autónomo.' },
      { id: 'n4', text: '¿Qué lóbulo se encuentra en la parte anterior del cerebro?', o: ['Occipital', 'Frontal', 'Temporal'], c: 1, why: 'Lóbulo frontal: se encuentra en la parte anterior del cerebro. Los otros tres se describen respecto de él.' },
      { id: 'n5', text: 'El lóbulo temporal se ubica…', o: ['Detrás del lóbulo frontal', 'Debajo del lóbulo parietal', 'En la región posterior de cada hemisferio'], c: 1, why: 'Lóbulo temporal: se ubica debajo del lóbulo parietal. El parietal, en cambio, está situado detrás del frontal.' },
      { id: 'n6', text: '¿Cuál forma la región posterior de cada hemisferio?', o: ['El lóbulo occipital', 'El lóbulo parietal', 'El lóbulo frontal'], c: 0, why: 'Lóbulo occipital: forma la región posterior de cada hemisferio.' },
      { id: 'n7', text: 'Unipolares, bipolares y multipolares es una clasificación de las neuronas…', o: ['Según su función', 'Según su estructura', 'Según el tipo de sinapsis'], c: 1, why: 'Según su estructura: unipolares, bipolares y multipolares. Según su función, en cambio, son sensitivas (aferentes) o motoras (eferentes).' },
      { id: 'n8', text: '¿Qué dos tipos de sinapsis nombra la ficha?', o: ['Aferente y eferente', 'Somática y autónoma', 'Química y eléctrica'], c: 2, why: 'La ficha nombra dos tipos de sinapsis: química y eléctrica. Aferente y eferente, en cambio, es la clasificación de las neuronas según su función.' }
    ];
    let ok = 0, done = 0;
    V.quiz = QS.map((q, i) => {
      const picked = s.ans[q.id];
      const answered = picked !== undefined;
      if (answered) { done++; if (picked === q.c) ok++; }
      return {
        num: 'PREGUNTA ' + String(i + 1).padStart(2, '0') + ' / 08',
        text: q.text, done: answered, why: q.why,
        opts: q.o.map((label, j) => {
          const isC = j === q.c, chosen = picked === j;
          let bg = 'var(--paper)', fg = 'var(--tx)', mark = '○';
          if (answered) {
            if (isC) { bg = 'var(--yellow)'; fg = 'var(--onyel)'; mark = '✔'; }
            else if (chosen) { mark = '✕'; }
            else { mark = '·'; }
          }
          return { label, bg, fg, mark, on: chosen, go: () => { if (!answered) S({ ans: { ...this.state.ans, [q.id]: j } }); } };
        })
      };
    });
    V.score = done === 0 ? 'TODAVÍA NO RESPONDISTE NINGUNA' : 'ACERTASTE ' + ok + ' DE ' + done + ' RESPONDIDAS · 8 EN TOTAL';
    V.resetQuiz = () => S({ ans: {} });

    return V;
  }
}
arrancarFicha();
</script>
</body>
</html>
