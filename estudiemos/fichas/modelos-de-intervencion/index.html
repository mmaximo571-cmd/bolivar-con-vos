<!-- EL TEMA, ANTES DE DIBUJAR NADA. Igual que en el resto de la app: si
     esto viviera en un script del final, la ficha arrancaria clara y
     pegaria un salto a oscura. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<style>
/* ===== LO QUE VINO DEL DISENO, TAL CUAL ===== */
:root{color-scheme:light dark;--bg:#FFFFFF;--paper:#FDFCF7;--tx:#1A1A1A;--mut:#3A3A3A;--stroke:#1A1A1A;--yellow:#F9E830;--onyel:#1A1A1A;--red:#B52625;--line:#0195B1;--dur:.25s}
html[data-tema="oscuro"]{--bg:#151412;--paper:#22201D;--tx:#FDFCF7;--mut:#D8D3C8;--stroke:#FDFCF7;--red:#FF9D8F;--line:#5AD8F0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--red);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--tx)}
button{font:inherit;cursor:pointer;color:var(--tx)}
:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.js-reveal [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.js-reveal [data-reveal].on{opacity:1;transform:none}
@media print{[data-reveal]{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1!important;transform:none!important;transition:none!important}:root{--dur:0s}}

/* ===== LO QUE AGREGA LA APP ===== */

/* La ficha no carga estilos.css. Es una pieza de lectura a pantalla
   completa con su propio sistema visual, y las 160 KB de la app le
   pelearian el body, la tipografia y los titulos. Lo unico que se
   comparte es el tema y la barra de volver. */

.ficha-volver{
  display:inline-flex; align-items:center; gap:8px;
  position:sticky; top:0; z-index:20;
  width:100%; box-sizing:border-box;
  padding:11px 18px;
  font-family:Montserrat,sans-serif; font-weight:800;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--yellow); color:var(--onyel);
  border-bottom:2px solid var(--stroke);
  text-decoration:none;
}
.ficha-volver:hover{ color:var(--onyel); }

/* LOS SELLOS TODAVIA NO LLEGARON. En el proyecto de Claude Design viven
   en assets/sello-sb.svg y assets/sello-sb-conduccion.png, y no vinieron
   con los .dc.html. Un recuadro vacio con borde se ve peor que nada, asi
   que el bloque queda escondido.

   CUANDO LOS COPIEN a estudiemos/fichas/assets/, borren estas tres
   lineas y los sellos aparecen solos en las ocho fichas. */
.ficha-sellos{ display:none; }
</style>
</head>

<span style="font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.06em;border:1px solid var(--stroke);border-radius:99px;padding:5px 11px">TRABAJO SOCIAL I</span>

<h1 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(40px,13vw,84px);line-height:.84;margin:0;text-transform:uppercase;letter-spacing:-.03em" data-reveal data-delay="80">Modelos<br>de inter<br>vención</h1>
<p style="font-size:clamp(15px,4.2vw,19px);line-height:1.5;margin:18px 0 0;max-width:34ch;font-family:Montserrat,sans-serif;font-weight:700;text-wrap:pretty" data-reveal data-delay="160">¿Qué son los modelos? ¿Cuáles son sus componentes? ¿Cómo los estudio?</p>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.55;color:var(--mut);margin:14px 0 0;max-width:46ch;text-wrap:pretty" data-reveal data-delay="240">Tres pliegues: primero qué son, después los cuatro componentes con la pieza para mover, y al final cómo te das cuenta de si te quedó.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:26px" data-reveal data-delay="320">
<a href="#m1" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:14px 18px;text-decoration:none">Empezar por el 01</a>

<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.1em;margin:34px 0 0;color:var(--mut)" data-reveal data-delay="400">↓ 01 QUÉ ES · 02 CÓMO FUNCIONA · 03 CÓMO TE DAS CUENTA</p>

<section id="m1" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 01</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Qué es</h2>
<p style="font-size:clamp(17px,4.8vw,22px);line-height:1.5;margin:0 0 14px;max-width:42ch;text-wrap:pretty" data-reveal data-delay="120">Los modelos de intervención son un <strong style="font-family:Montserrat,sans-serif;font-weight:800">instrumento de análisis</strong>.</p>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 0 24px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="180">Nos facilitan la comprensión de la intervención del Trabajo Social en distintos contextos y momentos históricos. No son recetas para aplicar: son una forma de leer.</p>

<div style="background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-bottom:18px" data-reveal data-delay="220">

</div>

<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px" data-reveal data-delay="280">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px">Cómo se estudian</p>
<p style="font-size:15px;line-height:1.6;margin:0">Para estudiar a los modelos se los divide en <strong style="font-family:Montserrat,sans-serif;font-weight:800">cuatro componentes</strong>, y esos cuatro se encuentran intrínsecamente relacionados. Están en el pliegue 02.</p>
</div>
</section>

<section id="m2" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 02</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Cómo<br>funciona</h2>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 0 28px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="120">Cuatro componentes, y ninguno se sostiene solo. Tocá uno y mirá qué se enciende con él: eso es lo que quiere decir «intrínsecamente relacionados».</p>

<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-bottom:18px" data-reveal>

<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:23px;line-height:1;margin:0 0 10px;text-transform:uppercase">La lista completa</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 14px">Como la escribe la ficha, para que la puedas repetir de memoria.</p>
<ol style="margin:0 0 14px;padding-left:22px;font-size:15px;line-height:1.75">

<p style="font-size:14px;line-height:1.55;margin:0">Son cuatro componentes que se encuentran intrínsecamente relacionados. La ficha los nombra sin desarrollarlos uno por uno: el desarrollo lo trabajan en la cátedra.</p>

<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Cómo te<br>das cuenta</h2>

<p style="font-size:15px;line-height:1.6;color:var(--mut);margin:0 0 26px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="180">El acierto es sólo el camino: lo que hay que estudiar es el porqué.</p>

<script src="../ficha.js"></script>
<script>
class Component extends DCLogic {
  state = { comp: 1, ans: {} };

  componentDidMount() { this.wire(); }
  componentDidUpdate() { this.wire(); }
  componentWillUnmount() { clearTimeout(this._fail); if (this._io) this._io.disconnect(); }

  wire() {
    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));
    const show = () => nodes.forEach(n => n.classList.add('on'));
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { show(); return; }
    document.documentElement.classList.add('js-reveal');
    nodes.forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.top < (window.innerHeight || 800) && r.bottom > 0) n.classList.add('on');
    });
    clearTimeout(this._fail);
    this._fail = setTimeout(show, 900);
    if (!this._io) {
      this._io = new IntersectionObserver((es) => {
        es.forEach(e => {
          if (e.isIntersecting) {
            e.target.style.transitionDelay = (e.target.getAttribute('data-delay') || 0) + 'ms';
            e.target.classList.add('on');
            this._io.unobserve(e.target);
          }
        });
      }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });
    }
    nodes.forEach(n => { if (!n.classList.contains('on') && !n._obs) { n._obs = 1; this._io.observe(n); } });
  }

  renderVals() {
    const s = this.state, S = (o) => this.setState(o);
    const V = {};

    const comps = [
      { k: 1, n: '01', label: 'Contexto', name: 'El contexto histórico', text: 'Es el primer componente: en qué momento histórico se sitúa esa intervención.' },
      { k: 2, n: '02', label: 'Fundamentos', name: 'Los fundamentos epistemológicos y marco conceptual de cada contexto', text: 'Desde qué ideas se piensa la intervención en ese contexto.' },
      { k: 3, n: '03', label: 'Sujeto', name: 'La noción sobre el sujeto', text: 'Cómo se concibe a la persona con la que se interviene.' },
      { k: 4, n: '04', label: 'Herramientas', name: 'Las herramientas o formas de intervención', text: 'Con qué se interviene y de qué manera.' }
    ];
    V.compChips = comps.map(c => {
      const on = c.k === s.comp;
      return { n: c.n, label: c.label, on, bg: on ? 'var(--yellow)' : 'transparent', fg: on ? 'var(--onyel)' : 'var(--tx)', go: () => S({ comp: c.k }) };
    });
    [1, 2, 3, 4].forEach(i => {
      V['n' + i] = 'fill:' + (i === s.comp ? 'var(--yellow)' : 'var(--paper)') + ';transition:fill var(--dur)';
    });
    const edges = { e12: [1, 2], e13: [1, 3], e14: [1, 4], e23: [2, 3], e24: [2, 4], e34: [3, 4] };
    Object.keys(edges).forEach(k => {
      const on = edges[k].indexOf(s.comp) >= 0;
      V[k] = 'stroke:' + (on ? 'var(--tx)' : 'var(--line)') + ';stroke-width:' + (on ? 3.5 : 2) + ';opacity:' + (on ? 1 : 0.4) + ';transition:all var(--dur)';
    });
    const cur = comps[s.comp - 1];
    V.compNum = 'COMPONENTE ' + cur.n + ' / 04';
    V.compName = cur.name;
    V.compText = cur.text;
    V.compNote = 'Fijate en el esquema: este componente está unido a los otros tres. Ninguno se estudia aislado, porque se encuentran intrínsecamente relacionados. Esta línea la agregamos nosotres para leer el esquema; la ficha nombra los componentes sin desarrollarlos.';
    V.mapAlt = 'Esquema de los cuatro componentes unidos entre sí; resaltado el componente ' + cur.n + '.';

    const QS = [
      { id: 'm1', text: '¿Qué son los modelos de intervención?', o: ['Un instrumento de análisis', 'Un protocolo de trabajo obligatorio', 'Una etapa de la historia del Trabajo Social'], c: 0, why: 'Son un instrumento de análisis que nos facilita la comprensión de la intervención del Trabajo Social en distintos contextos y momentos históricos.' },
      { id: 'm2', text: '¿En cuántos componentes se los divide para estudiarlos?', o: ['Tres', 'Cuatro', 'Cinco'], c: 1, why: 'Para estudiar a los modelos se los divide en cuatro componentes, y esos cuatro se encuentran intrínsecamente relacionados.' },
      { id: 'm3', text: '¿Cuál de estos NO es uno de los cuatro componentes?', o: ['El contexto histórico', 'La noción sobre el sujeto', 'La cantidad de casos atendidos'], c: 2, why: 'Los cuatro componentes son: el contexto histórico, los fundamentos epistemológicos y marco conceptual de cada contexto, la noción sobre el sujeto, y las herramientas o formas de intervención.' },
      { id: 'm4', text: 'Los cuatro componentes…', o: ['Se estudian por separado y sin conexión', 'Se encuentran intrínsecamente relacionados', 'Se aplican de a uno por contexto'], c: 1, why: 'Son cuatro componentes que se encuentran intrínsecamente relacionados: por eso ninguno se estudia aislado.' },
      { id: 'm5', text: '¿Para qué nos sirve estudiar los modelos?', o: ['Para entender cómo es la intervención actual del Trabajo Social', 'Para clasificar a los sujetos', 'Para elegir un modelo y aplicarlo siempre'], c: 0, why: 'Estudiar los modelos nos permite entender cómo es la intervención actual del Trabajo Social.' },
      { id: 'm6', text: 'El componente que trata de cómo se concibe a la persona con la que se interviene es…', o: ['El contexto histórico', 'La noción sobre el sujeto', 'Las herramientas o formas de intervención'], c: 1, why: 'Ese componente es la noción sobre el sujeto. Los otros tres son el contexto histórico, los fundamentos epistemológicos y marco conceptual, y las herramientas o formas de intervención.' }
    ];
    let ok = 0, done = 0;
    V.quiz = QS.map((q, i) => {
      const picked = s.ans[q.id];
      const answered = picked !== undefined;
      if (answered) { done++; if (picked === q.c) ok++; }
      return {
        num: 'PREGUNTA ' + String(i + 1).padStart(2, '0') + ' / 06',
        text: q.text, done: answered, why: q.why,
        opts: q.o.map((label, j) => {
          const isC = j === q.c, chosen = picked === j;
          let bg = 'var(--paper)', fg = 'var(--tx)', mark = '○';
          if (answered) {
            if (isC) { bg = 'var(--yellow)'; fg = 'var(--onyel)'; mark = '✔'; }
            else if (chosen) { mark = '✕'; }
            else { mark = '·'; }
          }
          return { label, bg, fg, mark, on: chosen, go: () => { if (!answered) S({ ans: { ...this.state.ans, [q.id]: j } }); } };
        })
      };
    });
    V.score = done === 0 ? 'TODAVÍA NO RESPONDISTE NINGUNA' : 'ACERTASTE ' + ok + ' DE ' + done + ' RESPONDIDAS · 6 EN TOTAL';
    V.resetQuiz = () => S({ ans: {} });

    return V;
  }
}
arrancarFicha();
</script>
