<!-- EL TEMA, ANTES DE DIBUJAR NADA. Igual que en el resto de la app: si
     esto viviera en un script del final, la ficha arrancaria clara y
     pegaria un salto a oscura. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<style>
/* ===== LO QUE VINO DEL DISENO, TAL CUAL =====
   Menos las fuentes: el export las traia embebidas en base64 y aca se

:root{
  --color-bg:#FDFCF7; --color-surface:#FFFFFF; --color-text:#1A1A1A;
  --color-divider:#D8D2C2; --color-neutral-200:#EFEAD9; --color-neutral-300:#D8D2C2;
  --color-neutral-500:#7C7566; --color-neutral-700:#3A3A3A; --color-neutral-800:#2A2A2A;
  --color-accent:#B52625; --color-accent-700:#8C1B1A;
  --hl:#F9E830; --onhl:#1A1A1A;
  --mono:'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ background:var(--color-bg); }
body{ margin:0; background:transparent; color:var(--color-text);
      font-family:'Archivo', system-ui, sans-serif; font-size:15px; line-height:1.55;

a{ color:var(--color-accent-700); text-decoration:none; }
a:hover{ color:var(--color-text); }
button:focus-visible, a:focus-visible{ outline:3px solid var(--color-accent); outline-offset:2px; }

@keyframes entra{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:none; } }
@keyframes entraPunto{ from{ opacity:0; transform:scale(.3) rotate(-25deg); } to{ opacity:1; transform:none; } }
@keyframes abrir{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
@keyframes latido{ 0%{ box-shadow:0 0 0 0 rgba(181,38,37,.45); } 70%{ box-shadow:0 0 0 12px rgba(181,38,37,0); } 100%{ box-shadow:0 0 0 0 rgba(181,38,37,0); } }
@keyframes deslizaRotulo{ from{ opacity:0; transform:translateX(-14px); } to{ opacity:1; transform:none; } }

@keyframes entraIzq{ from{ opacity:0; transform:translate(-34px,18px); } to{ opacity:1; transform:none; } }
@keyframes entraDer{ from{ opacity:0; transform:translate(34px,18px); } to{ opacity:1; transform:none; } }
[data-nodo]{ opacity:0; }
[data-nodo].entra{ animation:entra .55s cubic-bezier(.16,1,.3,1) both; }
[data-nodo].entra.izq{ animation:entraIzq .6s cubic-bezier(.16,1,.3,1) both; }
[data-nodo].entra.der{ animation:entraDer .6s cubic-bezier(.16,1,.3,1) both; }
[data-nodo].entra .hito-punto{ animation:entraPunto .5s cubic-bezier(.34,1.56,.64,1) both .12s; }
[data-nodo].entra .hito-anio{ animation:deslizaRotulo .5s cubic-bezier(.16,1,.3,1) both .08s; }
[data-nodo] .hito-caja{ transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, border-color .25s; }
[data-nodo]:hover .hito-caja{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--color-text); }
.hito-punto{ transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
[data-nodo]:hover .hito-punto{ transform:scale(1.08); }
.hito-punto.viva{ animation:latido 1.9s ease-out infinite; }

@media (prefers-reduced-motion:reduce){
  [data-nodo]{ opacity:1 !important; }
  *{ animation:none !important; transition:none !important; }
}

/* ===== LO QUE AGREGA LA APP ===== */

/* LO QUE YA ENTRO NO VUELVE A ENTRAR. ficha.js redibuja la pagina
   entera en cada toque, asi que cada hito es un nodo nuevo: sin esto,
   abrir uno hacia que todos los de la pantalla desaparecieran y
   volvieran a entrar con la animacion. Los que ya se vieron llegan
   con `visto` y quedan quietos. */
[data-nodo].visto{ opacity:1; }

/* LOS BLOQUES NEGROS. El diseno pinta la cabecera, la franja de cada
   hito y el pie con `--color-text` de fondo y `--color-bg` de letra.
   En tema oscuro esos dos se dan vuelta y los bloques quedaban casi
   blancos. Mismo arreglo que el mazo de Antropologia: su propio par de
   colores, oscuro con letra clara en los dos temas. */
:root{ --tinta:#1A1A1A; --sobre-tinta:#FDFCF7; }
html[data-tema="oscuro"]{
  color-scheme:dark;
  --color-bg:#151412; --color-surface:#22201D; --color-text:#FDFCF7;
  --color-divider:#57524A; --color-neutral-200:#2C2A26;
  --color-neutral-500:#A9A294; --color-neutral-700:#D8D3C8;
  /* El resumen de cada hito va en neutral-800: sin esto quedaba gris
     casi negro sobre la tarjeta oscura. */
  --color-neutral-800:#E6E1D6;
  --color-accent:#FF9D8F; --color-accent-700:#FF9D8F;
  --tinta:#0B0A09;
}

.ficha-barra{

  background:var(--hl);
  border-bottom:2px solid var(--color-text);
}
.ficha-barra a{ color:var(--onhl); text-decoration:none; }
.ficha-barra a:hover{ text-decoration:underline; }

/* Las categorias del diseno quedan pegadas arriba al bajar. Arriba ya
   esta la barra de volver, que tambien se pega: las categorias van

   angosto la barra puede ocupar dos renglones). */
.lt-filtros{ top:var(--alto-barra, 0px) !important; }
</style>

<!-- La linea de tiempo, tal como salio del diseno. Vive dentro de un
     <template> para que el navegador no la muestre a medio armar.
     Vino como export «standalone» de Claude Design (19/9/2026), igual
     que el mazo de Antropologia: la plantilla y el codigo son los de
     adentro de ese paquete. Los cambios para que corra con ficha.js:
       - `sc-camel-on-click` pasa a `onClick`, que es lo que el motor
         engancha;
       - los `ref` del diseno (la barra de avance y el riel que se
         llena) pasan a ser `id`, porque el motor no entiende `ref` y
         ademas redibuja todo: una referencia guardada quedaria vieja;
       - la cabecera del diseno deja lugar a la barra de la app, y los
         bloques negros usan `--tinta` para el tema oscuro. -->

class Component extends DCLogic {
  state = { cat: 'Todos', abiertos: {}, ancho: typeof window !== 'undefined' && window.innerWidth >= 680 };

  /* Los hitos que ya entraron a la pantalla (ver `.visto` arriba). */
  vistos = new Set();

  componentDidMount(){
    this.medirBarra();
    this.observar();
    this.onAncho = () => {
      this.medirBarra();
      const ancho = window.innerWidth >= 680;
      if (ancho !== this.state.ancho) this.setState({ ancho });
    };
    window.addEventListener('resize', this.onAncho, { passive: true });
    this.onAncho();
    this.onScroll = () => this.progreso();
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll, { passive: true });
    this.progreso();
  }
  componentDidUpdate(){ this.observar(); this.progreso(); }
  componentWillUnmount(){
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
    window.removeEventListener('resize', this.onAncho);
    if (this.io) this.io.disconnect();
  }

  /* Cuánto ocupa la barra amarilla de volver, para que las categorías
     se peguen justo debajo y no detrás. */
  medirBarra(){
    const b = document.getElementById('ficha-barra');
    if (b) document.documentElement.style.setProperty('--alto-barra', b.offsetHeight + 'px');
  }

  /* Cada redibujo trae nodos nuevos: se deja de mirar los viejos y se
     mira solo lo que todavía no entró. */
  observar(){
    const pendientes = document.querySelectorAll('[data-nodo]:not(.visto)');
    if (!('IntersectionObserver' in window)) {
      pendientes.forEach(el => { el.classList.add('entra'); this.vistos.add(el.getAttribute('data-nodo')); });
      return;
    }
    if (!this.io){
      this.io = new IntersectionObserver((ents) => {
        ents.forEach(e => {
          if (!e.isIntersecting) return;
          e.target.classList.add('entra');
          this.vistos.add(e.target.getAttribute('data-nodo'));
          this.io.unobserve(e.target);
        });
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });
    }
    this.io.disconnect();
    pendientes.forEach(el => this.io.observe(el));
  }

  /* EL RESPALDO DEL OBSERVADOR. Los hitos arrancan invisibles y los
     hace entrar el IntersectionObserver; donde no corre (el panel de
     vista previa, algún webview), la línea quedaba vacía. Esto mira la
     posición en cada scroll y hace entrar lo que ya está en pantalla. */
  revelar(){
    const tope = window.innerHeight * 0.88;
    document.querySelectorAll('[data-nodo]:not(.visto):not(.entra)').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < tope && r.bottom > 0){
        el.classList.add('entra');
        this.vistos.add(el.getAttribute('data-nodo'));
      }
    });
  }

  progreso(){
    this.revelar();
    const doc = document.documentElement;
    const alto = doc.scrollHeight - window.innerHeight;
    const p = alto > 0 ? Math.min(1, Math.max(0, window.scrollY / alto)) : 0;
    const barra = document.getElementById('lt-barra');
    const riel = document.getElementById('lt-riel');
    if (barra) barra.style.width = (p * 100).toFixed(1) + '%';
    if (riel){
      const caja = riel.parentElement;
      if (caja) riel.style.height = (caja.offsetHeight * p).toFixed(0) + 'px';
    }
  }

  renderVals(){
    const s = this.state;
    const visibles = NODOS.filter(n => s.cat === 'Todos' || n.cats.indexOf(s.cat) !== -1);
    const abiertosVisibles = visibles.filter(n => s.abiertos[n.id]).length;
    const todosAbiertos = abiertosVisibles === visibles.length && visibles.length > 0;

    const chip = (on) => 'flex:none;min-height:48px;padding:0 14px;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;white-space:nowrap;transition:transform .18s ease;border:1px solid ' +
      (on ? 'var(--color-text);background:var(--color-text);color:var(--color-bg)' : 'var(--color-divider);background:var(--color-bg);color:var(--color-text)');

    const colorCat = (n) =>
      n.cats.indexOf('Movimiento Obrero') !== -1 ? 'var(--color-accent)' :
      n.cats.indexOf('Género y Derechos') !== -1 ? 'var(--hl)' :
      n.cats.indexOf('Economía/Modelos') !== -1 ? 'var(--color-neutral-500)' : 'var(--color-text)';

    const ancho = s.ancho;
    const ejeX = ancho ? '50%' : '27px';

    return {
      rielFondoStyle: { position:'absolute', left:ejeX, top:0, bottom:0, width:'2px', marginLeft:'-1px', background:'var(--color-divider)' },
      rielStyle: { position:'absolute', left:ejeX, top:0, height:'0px', width:'2px', marginLeft:'-1px', background:'var(--color-text)' },
      nVisibles: visibles.length,
      nAbiertos: abiertosVisibles,
      textoTodo: todosAbiertos ? 'CERRAR TODO' : 'ABRIR TODO',
      alternarTodo: () => {
        const abiertos = Object.assign({}, s.abiertos);
        visibles.forEach(n => { if (todosAbiertos) delete abiertos[n.id]; else abiertos[n.id] = true; });
        this.setState({ abiertos });
      },
      categorias: CATS.map(c => ({
        label: c.toUpperCase(), on: s.cat === c, style: chip(s.cat === c),
        onClick: () => this.setState({ cat: c })
      })),
      nodos: visibles.map((n, idx) => {
        const color = colorCat(n);
        const abierto = !!s.abiertos[n.id];
        const izq = idx % 2 === 0;
        return {
          dir: ancho ? (izq ? 'izq' : 'der') : '',
          visto: this.vistos.has(n.id) ? 'visto' : '',
          filaStyle: ancho
            ? { position:'relative', display:'grid', gridTemplateColumns:'1fr 1fr', columnGap:'56px' }
            : { position:'relative', display:'grid', paddingLeft:'56px' },
          id: n.id, numero: idx + 1, periodo: n.periodo, unidad: n.unidad, titulo: n.titulo,
          resumen: n.resumen, categoria: n.catPrincipal.toUpperCase(), sintesis: n.sintesis,
          pregunta: n.pregunta, abierto,
          pulso: abierto ? 'viva' : '',
          onClick: () => {
            const abiertos = Object.assign({}, this.state.abiertos);
            if (abiertos[n.id]) delete abiertos[n.id]; else abiertos[n.id] = true;
            this.setState({ abiertos });
          },
          accion: abierto ? '▲ CERRAR EL PROCESO' : '▼ VER PROCESO, BIBLIOGRAFÍA Y PREGUNTA',
          accionStyle: 'margin-top:14px;width:100%;min-height:48px;cursor:pointer;border:1px solid var(--color-text);background:' +
            (abierto ? 'var(--color-text);color:var(--color-bg)' : 'transparent;color:var(--color-text)') +
            ';font-family:var(--mono);font-size:11.5px;letter-spacing:.08em',
          puntoStyle: {
            position:'absolute',
            left: ancho ? 'calc(50% - 19px)' : '4px',
            top:'10px', width:'38px', height:'38px',
            display:'flex', alignItems:'center', justifyContent:'center',
            borderRadius:'50%', background: color, color: color === 'var(--hl)' ? 'var(--onhl)' : 'var(--color-bg)',
            border:'2px solid var(--color-text)', fontWeight:800, fontSize:'16px', zIndex:2
          },
          barraStyle: 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--tinta)',
          vinetaStyle: 'flex:none;width:9px;height:9px;margin-top:6px;background:' + color + ';border:1px solid var(--color-text)',
          catStyle: 'font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 8px;background:' + color +
            ';color:' + (color === 'var(--hl)' ? 'var(--onhl)' : 'var(--color-bg)'),
          cardStyle: {
            position:'relative',
            gridColumn: ancho ? (izq ? 1 : 2) : 'auto',
            background:'var(--color-surface)',
            border:'2px solid ' + (abierto ? 'var(--color-text)' : 'var(--color-divider)'),
            boxShadow: abierto ? '4px 4px 0 var(--color-text)' : '2px 2px 0 var(--color-divider)'
          },
          tags: n.tags.map((t, k) => ({ k, t })),
          conceptos: n.conceptos.map((t, k) => ({ k, t })),
          autores: n.autores.map((t, k) => ({ k, t }))
        };
      })
    };
  }
}
arrancarFicha();
</script>
