<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anquiloglosia · Fichas · La Bolívar con vos</title>
<meta name="description" content="Frenillo · Lengua · Movilidad · Succión. Ficha de estudio con autoevaluación.">
<meta name="theme-color" content="#F9E830">
<link rel="icon" type="image/png" sizes="32x32" href="../../../imagenes/icono-32.png">
<link rel="apple-touch-icon" href="../../../imagenes/icono-apple.png">
<link rel="manifest" href="../../../manifest.json">
<meta property="og:type" content="article">
<meta property="og:site_name" content="La Bolivar con vos">
<meta property="og:title" content="Anquiloglosia · La Bolívar con vos">
<meta property="og:description" content="Frenillo · Lengua · Movilidad · Succión. Ficha de estudio con autoevaluación.">
<meta property="og:image" content="https://labolivarconvos.ar/imagenes/compartir.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../estilos.css">
<link rel="stylesheet" href="../../../estilos-rediseno.css">
<link rel="stylesheet" href="../assets/fichas-texto.css">
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
<!-- Ficha sobre textos/dfof-1-anquiloglosia.txt. Desde el 24/9/2026 es una
     pantalla más de la app: cabecera, barra de abajo y modo oscuro. La
     plantilla es la misma en las diecisiete; los estilos van en
     assets/fichas-texto.css y la lógica en ficha-texto.js. -->
<!-- Estadisticas de visitas (Vercel Web Analytics, sin cookies) -->
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div id="cabecera"></div>

<main class="envoltura" id="contenido" tabindex="-1">
<div id="ficha"></div>
</main>

<div id="pie"></div>

<template id="plantilla">
<div class="ft">
  <a class="ft-volver" href="../">← Fichas de estudio</a>
  <sc-if value="{{ err }}"><p class="ft-error">{{ err }}</p></sc-if>
  <sc-if value="{{ loading }}"><p class="bajada ft-cargando">Cargando la ficha…</p></sc-if>
  <sc-if value="{{ listo }}">
  <header class="ft-portada">
    <span class="etiqueta gremial">{{ materia }}</span>
    <h1 class="titulo-pantalla">{{ titulo }}</h1>
    <p class="ft-sub">{{ subtitulo }}</p>
    <p class="bajada">{{ entrada }}</p>
    <p class="ft-fuente">Fuente: {{ pdfs }}</p>
    <div class="ft-progreso"><div class="ft-riel"><i style="width:{{ pctW }}"></i></div><span>{{ progress }}</span></div>
  </header>

  <nav class="ft-indice" aria-label="Partes de la ficha">
    <a href="#que-es">Qué es</a><a href="#como-funciona">Cómo funciona</a><a href="#preguntas">Preguntas</a><a href="#aclarar">Falta</a>
  </nav>

  <section class="ft-parte" id="que-es">
    <h2 class="ft-h2"><span>1</span>Qué es</h2>
    <div class="tarjeta"><sc-for list="{{ defParas }}" as="p"><p>{{ p.rt }}</p></sc-for></div>
    <div class="ft-confunde">
      <span class="ft-rot">Lo que más se confunde</span>
      <sc-for list="{{ confundeParas }}" as="p"><p>{{ p.rt }}</p></sc-for>
    </div>
    <h3 class="titulo-seccion">Las piezas <span>{{ nPiezas }}</span></h3>
    <ul class="ft-piezas"><sc-for list="{{ piezas }}" as="pz"><li><b>{{ pz.name }}</b><p>{{ pz.rt }}</p></li></sc-for></ul>
  </section>

  <section class="ft-parte" id="como-funciona">
    <h2 class="ft-h2"><span>2</span>Cómo funciona</h2>
    <sc-for list="{{ machines }}" as="m"><div class="tarjeta">
      <h3 class="ft-h3">{{ m.name }}</h3>
      <p class="ft-elige">{{ m.eligeRt }}</p>
      <div class="ft-chips" role="group" aria-label="{{ m.name }}"><sc-for list="{{ m.buttons }}" as="b"><button type="button" class="chip" aria-pressed="{{ b.pressed }}" onClick="{{ b.onClick }}">{{ b.label }}</button></sc-for></div>
      <div class="ft-salida" aria-live="polite"><h4>{{ m.activeName }}</h4><p>{{ m.activeRt }}</p></div>
    </div></sc-for>
  </section>

  <section class="ft-parte" id="preguntas">
    <h2 class="ft-h2"><span>3</span>Cómo te das cuenta</h2>
    <div class="ft-preguntas"><sc-for list="{{ quiz }}" as="q"><div class="tarjeta">
      <span class="ft-rot">Pregunta {{ q.n }} de {{ totalQuiz }}</span>
      <p class="ft-enunciado">{{ q.text }}</p>
      <div class="ft-opciones"><sc-for list="{{ q.options }}" as="o"><button type="button" class="ft-opcion {{ o.cls }}" aria-disabled="{{ o.disabled }}" onClick="{{ o.onClick }}"><span class="ft-letra">{{ o.letter }}</span><span>{{ o.text }}</span></button></sc-for></div>
      <sc-if value="{{ q.answered }}"><div class="ft-porque" aria-live="polite"><span class="ft-veredicto {{ q.verdictCls }}">{{ q.verdict }}</span><p>{{ q.whyRt }}</p></div></sc-if>
    </div></sc-for></div>
  </section>

  <section class="ft-parte" id="aclarar">
    <h2 class="ft-h2"><span>4</span>Lo que hay que aclarar</h2>
    <div class="ft-falta">
      <span class="ft-rot">Pendiente con la cátedra</span>
      <ul><sc-for list="{{ aclarar }}" as="a"><li><b>{{ a.name }}</b>: {{ a.rt }}</li></sc-for></ul>
    </div>
  </section>

  <footer class="ft-cierre"><a href="../">← Volver a las fichas</a><span>Equipo Fonoaudiología · CEFTS</span></footer>
  </sc-if>
</div>
</template>
<script>window.RAIZ = '../../../';</script>
<script src="../../../lib/datos.js"></script>
<script src="../../../config.js"></script>
<script src="../../../iconos.js"></script>
<script src="../../../app.js"></script>
<script src="../../../fondo-red.js"></script>
<script src="../ficha.js"></script>
<script>window.FICHA_PROPS = { ficha: '../textos/dfof-1-anquiloglosia.txt', showRefs: true, revealWhy: true };</script>
<script src="../ficha-texto.js"></script>
<script>arrancarFicha();</script>
</body>
</html>
