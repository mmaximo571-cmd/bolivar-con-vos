<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proceso deglutorio · Fichas · La Bolívar con vos</title>
<meta name="description" content="Fases · Válvulas · Sincronismo · Maduración. Ficha de estudio con autoevaluación.">
<meta name="theme-color" content="#F9E830">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" sizes="32x32" href="../../../imagenes/icono-32.png">
<link rel="apple-touch-icon" href="../../../imagenes/icono-apple.png">
<link rel="manifest" href="../../../manifest.json">
<meta property="og:type" content="article">
<meta property="og:site_name" content="La Bolivar con vos">
<meta property="og:title" content="Proceso deglutorio · La Bolívar con vos">
<meta property="og:description" content="Fases · Válvulas · Sincronismo · Maduración. Ficha de estudio con autoevaluación.">
<meta property="og:image" content="https://bolivar-con-vos.vercel.app/imagenes/compartir.png">
<!-- Ficha diseñada en Claude Design sobre textos/dfof-1-proceso-deglutorio.txt. Los estilos
     y la lógica son los mismos para las diecisiete: assets/fichas-texto.css
     y ficha-texto.js. Acá vive solo el dibujo. Va siempre en claro: el
     diseño no trae versión oscura. -->
<link rel="stylesheet" href="../assets/fichas-texto.css">
</head>
<body>
<div id="ficha"></div>
<template id="plantilla">
<div style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">
  <header style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);border-bottom:2px solid var(--color-divider)">
    <a href="../" style="color:var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase">← Fichas de estudio</a>
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--color-neutral-700)">M1·PRD·08</span>
  </header>
  <div class="grid24" style="padding:var(--space-8) 0 0">
    <div style="max-width:1140px;margin:0 auto;padding:0 var(--space-6)">
      <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
        <p style="font-family:var(--font-heading);font-weight:800;color:var(--color-accent-700)">{{ err }}</p>
      </sc-if>
      <div class="grid24" style="border:2px solid var(--color-text);padding:var(--space-8) var(--space-6);position:relative">
      <span style="position:absolute;top:-2px;left:-2px;width:14px;height:14px;border-top:2px solid var(--color-accent);border-left:2px solid var(--color-accent)"></span>
      <span style="position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-bottom:2px solid var(--color-accent);border-right:2px solid var(--color-accent)"></span>
      <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--color-accent-700)">PLANO M1·PRD·08</span>
      <div style="margin-top:var(--space-3);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--space-6);align-items:end">
        <div><h1 style="font-size:clamp(34px,6.6vw,62px);margin:0;letter-spacing:-.015em;text-wrap:balance">{{ titulo }}</h1><p style="font-family:var(--font-heading);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--color-neutral-700);margin:var(--space-3) 0 0">{{ subtitulo }}</p></div>
        <div style="border-top:2px solid var(--color-text);padding-top:var(--space-3)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--color-neutral-700);display:block;margin-bottom:4px">MATERIA</span><p style="margin:0 0 var(--space-3);font-size:14px;font-family:var(--font-heading);font-weight:600">{{ materia }}</p><p style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--color-neutral-700);margin:0;line-height:1.6">{{ pdfs }}</p></div>
      </div>
    </div>
      <div style="padding-top:var(--space-6)"><div style="display:flex;flex-wrap:wrap;gap:var(--space-6);border-top:2px solid var(--color-text);border-bottom:2px solid var(--color-text);padding:var(--space-3) 0"><div style="display:flex;align-items:baseline;gap:var(--space-2)"><span style="font-family:var(--font-heading);font-weight:800;font-size:clamp(22px,3.4vw,32px);color:var(--color-text);font-variant-numeric:tabular-nums">{{ nPiezas }}</span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700)">PIEZAS</span></div><div style="display:flex;align-items:baseline;gap:var(--space-2)"><span style="font-family:var(--font-heading);font-weight:800;font-size:clamp(22px,3.4vw,32px);color:var(--color-text);font-variant-numeric:tabular-nums">{{ nMachines }}</span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700)">MÁQUINAS</span></div><div style="display:flex;align-items:baseline;gap:var(--space-2)"><span style="font-family:var(--font-heading);font-weight:800;font-size:clamp(22px,3.4vw,32px);color:var(--color-text);font-variant-numeric:tabular-nums">{{ nQuiz }}</span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700)">PREGUNTAS</span></div><div style="display:flex;align-items:baseline;gap:var(--space-2)"><span style="font-family:var(--font-heading);font-weight:800;font-size:clamp(22px,3.4vw,32px);color:var(--color-accent-700);font-variant-numeric:tabular-nums">{{ rightTxt }}</span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700)">ACIERTOS</span></div></div></div>
    </div>
  </div>
  <div style="max-width:1140px;margin:0 auto;padding:var(--space-8) var(--space-6) 96px">
    <section><div style="margin-bottom:var(--space-6)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--color-accent-700);display:block">SECCIÓN 01 //</span><div style="display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;border-bottom:2px solid var(--color-text);padding-bottom:var(--space-2);margin-top:4px"><h2 style="font-size:clamp(19px,3.2vw,30px);margin:0;flex:1;letter-spacing:-.01em">Qué es</h2></div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--space-8)">
        <div>
          <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700);display:block;margin-bottom:var(--space-3)">DEFINICIÓN</span>
          <sc-for list="{{ defParas }}" as="p" hint-placeholder-count="1"><p style="font-size:16px;line-height:1.6;text-wrap:pretty">{{ p.rt }}</p></sc-for>
        </div>
        <div style="border-left:8px solid var(--color-accent);padding-left:var(--space-4)">
          <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-accent-700);display:block;margin-bottom:var(--space-3)">LO QUE MÁS SE CONFUNDE</span>
          <sc-for list="{{ confundeParas }}" as="p" hint-placeholder-count="1"><p style="font-size:16px;line-height:1.6;text-wrap:pretty">{{ p.rt }}</p></sc-for>
        </div>
      </div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);margin:var(--space-8) 0 var(--space-3)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700)">PIEZAS</span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">{{ nPiezas }}</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:2px;background:var(--color-text);border:2px solid var(--color-text)"><sc-for list="{{ piezas }}" as="pz" hint-placeholder-count="6"><div style="background:var(--color-bg);padding:var(--space-4);display:grid;grid-template-columns:34px 1fr;gap:var(--space-3);align-items:start"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--color-accent-700);font-variant-numeric:tabular-nums;border-top:2px solid var(--color-accent);padding-top:4px">{{ pz.num }}</span><div><h5 style="margin:0 0 4px;font-size:15px">{{ pz.name }}</h5><p style="margin:0;font-size:14px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty">{{ pz.rt }}</p></div></div></sc-for></div>
    </section>
    <section style="padding-top:var(--space-8)"><div style="margin-bottom:var(--space-6)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--color-accent-700);display:block">SECCIÓN 02 //</span><div style="display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;border-bottom:2px solid var(--color-text);padding-bottom:var(--space-2);margin-top:4px"><h2 style="font-size:clamp(19px,3.2vw,30px);margin:0;flex:1;letter-spacing:-.01em">Cómo funciona</h2></div></div><sc-for list="{{ machines }}" as="m" hint-placeholder-count="2"><div style="margin-bottom:var(--space-8);border:2px solid var(--color-text)"><div style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;background:var(--color-text);color:var(--color-bg);padding:var(--space-2) var(--space-4)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--hl)">MÁQ {{ m.n }}</span><h4 style="margin:0;font-size:clamp(15px,2.4vw,20px);flex:1;color:var(--color-bg)">{{ m.name }}</h4></div><div style="padding:var(--space-4)"><p style="margin:var(--space-3) 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--color-neutral-800);line-height:1.6">{{ m.eligeRt }}</p>
          <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4)"><sc-for list="{{ m.buttons }}" as="b" hint-placeholder-count="3"><button type="button" class="btn {{ b.cls }}" style="min-height:44px" onClick="{{ b.onClick }}">{{ b.label }}</button></sc-for></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--space-6)">
            <div><h5 style="margin:0 0 var(--space-2);font-size:15px;color:var(--color-accent-700)">{{ m.activeName }}</h5><p style="margin:0;font-size:15px;line-height:1.6;text-wrap:pretty">{{ m.activeRt }}</p></div>
            <div style="border-left:2px solid var(--color-divider);padding-left:var(--space-4)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700);display:block;margin-bottom:4px">ESQUEMA MENTAL</span><p style="margin:0;font-size:13px;line-height:1.6;color:var(--color-neutral-800);text-wrap:pretty">{{ m.esquemaRt }}</p></div>
          </div></div></div></sc-for></section>
    <section style="padding-top:var(--space-8)"><div style="margin-bottom:var(--space-6)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--color-accent-700);display:block">SECCIÓN 03 //</span><div style="display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;border-bottom:2px solid var(--color-text);padding-bottom:var(--space-2);margin-top:4px"><h2 style="font-size:clamp(19px,3.2vw,30px);margin:0;flex:1;letter-spacing:-.01em">Cómo te das cuenta</h2><span style="font-family:var(--font-heading);font-weight:800;font-size:12px;color:var(--color-neutral-700);white-space:nowrap;font-variant-numeric:tabular-nums">{{ progress }}</span></div></div><div style="display:grid;gap:var(--space-6)"><sc-for list="{{ quiz }}" as="q" hint-placeholder-count="8">
          <div style="display:grid;grid-template-columns:48px 1fr;gap:var(--space-4);align-items:start">
            <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:15px;border:2px solid var(--color-accent);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;height:40px;font-variant-numeric:tabular-nums">{{ q.n }}</span>
            <div>
              <p style="margin:0 0 var(--space-3);font-size:16px;line-height:1.45;font-family:var(--font-heading);font-weight:600;text-wrap:pretty">{{ q.text }}</p>
              <div style="display:grid;gap:var(--space-2)"><sc-for list="{{ q.options }}" as="o" hint-placeholder-count="3">
                <button type="button" style="{{ o.style }}" onClick="{{ o.onClick }}"><span style="font-family:var(--font-heading);font-weight:800;font-size:13px;flex:0 0 16px">{{ o.letter }}</span><span style="font-size:14px;line-height:1.5;text-align:left">{{ o.text }}</span></button>
              </sc-for></div>
              <sc-if value="{{ q.answered }}" hint-placeholder-val="{{ false }}">
                <div style="margin-top:var(--space-3);padding:var(--space-3) var(--space-4);border-left:2px solid var(--color-text);background:var(--color-surface)"><span class="tag {{ q.verdictCls }}" style="margin-bottom:var(--space-2);display:inline-block">{{ q.verdict }}</span><p style="margin:0;font-size:14px;line-height:1.55;text-wrap:pretty">{{ q.whyRt }}</p></div>
              </sc-if>
            </div>
          </div>
        </sc-for></div></section>
    <section style="padding-top:var(--space-8)"><div style="margin-bottom:var(--space-6)"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--color-accent-700);display:block">SECCIÓN 04 //</span><div style="display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;border-bottom:2px solid var(--color-text);padding-bottom:var(--space-2);margin-top:4px"><h2 style="font-size:clamp(19px,3.2vw,30px);margin:0;flex:1;letter-spacing:-.01em">Lo que hay que aclarar</h2></div></div><div style="display:grid;gap:2px;background:var(--color-divider);border-top:2px solid var(--color-text);border-bottom:2px solid var(--color-text)"><sc-for list="{{ aclarar }}" as="a" hint-placeholder-count="3"><div style="background:var(--color-bg);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:var(--space-4);padding:var(--space-4) 0"><div><span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;color:var(--color-accent-700);display:block;margin-bottom:4px">PENDIENTE</span><h5 style="margin:0;font-size:16px">{{ a.name }}</h5></div><p style="margin:0;font-size:14px;line-height:1.6;color:var(--color-neutral-800);text-wrap:pretty">{{ a.rt }}</p></div></sc-for></div></section>
  </div>
  <footer style="background:var(--color-text);color:var(--color-bg);padding:var(--space-6);display:flex;flex-wrap:wrap;gap:var(--space-4);justify-content:space-between;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase"><span>M1·PRD·08</span><a href="../" style="color:var(--color-bg)">Volver al índice ↗</a><span>Equipo Fonoaudiología · CEFTS</span></footer>
</div>
</template>
<script src="../ficha.js"></script>
<script>window.FICHA_PROPS = { ficha: '../textos/dfof-1-proceso-deglutorio.txt', showRefs: true, revealWhy: true };</script>
<script src="../ficha-texto.js"></script>
<script>arrancarFicha();</script>
</body>
</html>
