<!-- EL TEMA, ANTES DE DIBUJAR NADA. Igual que en el resto de la app: si
     esto viviera en un script del final, la ficha arrancaria clara y
     pegaria un salto a oscura. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<style>
/* ===== LO QUE VINO DEL DISENO, TAL CUAL ===== */
:root{color-scheme:light dark;--bg:#FFFFFF;--paper:#FDFCF7;--tx:#1A1A1A;--mut:#3A3A3A;--stroke:#1A1A1A;--yellow:#F9E830;--onyel:#1A1A1A;--red:#B52625;--line:#0195B1;--dur:.25s}
html[data-tema="oscuro"]{--bg:#151412;--paper:#22201D;--tx:#FDFCF7;--mut:#D8D3C8;--stroke:#FDFCF7;--red:#FF9D8F;--line:#5AD8F0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--red);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--tx)}
button{font:inherit;cursor:pointer;color:var(--tx)}
:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.js-reveal [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.js-reveal [data-reveal].on{opacity:1;transform:none}
@media print{[data-reveal]{opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}[data-reveal]{opacity:1!important;transform:none!important;transition:none!important}:root{--dur:0s}}

/* ===== LO QUE AGREGA LA APP ===== */

/* La ficha no carga estilos.css. Es una pieza de lectura a pantalla
   completa con su propio sistema visual, y las 160 KB de la app le
   pelearian el body, la tipografia y los titulos. Lo unico que se
   comparte es el tema y la barra de volver. */

.ficha-barra{
  position:sticky; top:0; z-index:20;
  display:flex; flex-wrap:wrap; align-items:center;
  justify-content:space-between; gap:2px 14px;
  padding:11px 18px;
  font-family:Montserrat,sans-serif; font-weight:800;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--yellow);
  border-bottom:2px solid var(--stroke);
}
/* El diseno pinta los enlaces de rojo y subrayados. Sobre el amarillo
   de la barra eso no se lee, asi que aca mandan estos. */
.ficha-barra a{ color:var(--onyel); text-decoration:none; }
.ficha-barra a:hover{ text-decoration:underline; }

/* Los dos sellos del pie viven en estudiemos/fichas/assets/ y los
   comparten las nueve fichas: por eso el src sale de la carpeta de la
   ficha con ../assets/ en vez de tener nueve copias. */
</style>
</head>
<body>

<nav class="ficha-barra">

</nav>

<!-- La ficha, tal como salio del diseno. Vive dentro de un <template>
     para que el navegador no la muestre a medio armar: todavia tiene los

<template id="plantilla">

<span style="font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.06em;border:1px solid var(--stroke);border-radius:99px;padding:5px 11px">FICHA · FARINGE</span>
</div>
<h1 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(44px,15vw,92px);line-height:.84;margin:0;text-transform:uppercase;letter-spacing:-.03em" data-reveal data-delay="80">La<br>faringe</h1>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(14px,4vw,19px);letter-spacing:.02em;text-transform:uppercase;margin:16px 0 0;max-width:30ch" data-reveal data-delay="160">Tres porciones · músculos constrictores y elevadores</p>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.55;color:var(--mut);margin:14px 0 0;max-width:46ch;text-wrap:pretty" data-reveal data-delay="240">Tres pliegues: la división entera, los músculos con sus dos grupos, y la autoevaluación para ver si te quedó.</p>
<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:26px" data-reveal data-delay="320">
<a href="#f1" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:14px 18px;text-decoration:none">Empezar por el 01</a>
<a href="#f3" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:14px 18px;text-decoration:none">Ir a la autoevaluación</a>
</div>
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.1em;margin:34px 0 0;color:var(--mut)" data-reveal data-delay="400">↓ 01 QUÉ ES · 02 CÓMO FUNCIONA · 03 CÓMO TE DAS CUENTA</p>
</section>

<section id="f1" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 01</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Qué es</h2>
<p style="font-size:clamp(16px,4.4vw,20px);line-height:1.55;margin:0 0 12px;max-width:44ch;text-wrap:pretty" data-reveal data-delay="120">La faringe es un solo conducto, pero se estudia en tres porciones. El nombre de cada una te dice a qué altura está.</p>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 0 26px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="180">Y tiene músculos, en dos grupos: los que la cierran y los que la levantan.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<sc-for list="{{ intro }}" as="i" hint-placeholder-count="3">
<div style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:15px" data-reveal data-delay="{{ i.d }}">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mut);margin:0 0 6px">{{ i.n }}</p>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;border-bottom:2px solid var(--line);display:inline-block;padding-bottom:3px">{{ i.t }}</p>
<p style="font-size:14px;line-height:1.5;margin:0">{{ i.b }}</p>
</div>
</sc-for>
</div>
</section>

<section id="f2" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 02</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Cómo<br>funciona</h2>
<p style="font-size:clamp(15px,4vw,18px);line-height:1.6;margin:0 0 28px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="120">Dos piezas para mover: las tres porciones sobre el mismo conducto y los dos grupos de músculos.</p>

<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-bottom:18px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 4px">2.1</p>
<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:23px;line-height:1;margin:0 0 8px;text-transform:uppercase">Las tres porciones</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 14px">Tocá cada porción: no son tres tubos, son tres tramos del mismo. El prefijo del nombre es la pista de la altura.</p>
<div role="group" aria-label="Elegí una porción" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px">
<sc-for list="{{ zoneChips }}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--stroke);border-radius:99px;padding:10px 12px;box-shadow:2px 2px 0 var(--stroke);background:{{ c.bg }};color:{{ c.fg }};transition:background var(--dur)">{{ c.label }}</button>
</sc-for>
</div>
<svg viewBox="0 0 240 230" role="img" aria-label="{{ zoneAlt }}" style="width:100%;max-width:320px;display:block;margin:0 auto 6px;height:auto">
<g stroke="var(--stroke)" stroke-width="1.8" stroke-linejoin="round">
<path d="M56,20h96v56h-96z" style="{{ zNaso }}"></path>

</g>

<text x="68" y="52">NASOFARINGE</text>
<text x="68" y="114">OROFARINGE</text>
<text x="68" y="176">LARINGOFARINGE</text>
</g>
<g font-family="'Roboto Mono',monospace" font-size="8.5" letter-spacing="0.5" fill="var(--mut)">
<text x="14" y="46" text-anchor="end">NARIZ</text>
<text x="14" y="108" text-anchor="end">BOCA</text>
<text x="78" y="226">HACIA LA LARINGE</text>
<text x="160" y="16">ARRIBA</text>
<text x="160" y="216">ABAJO</text>
</g>
</svg>
<div style="border:1px solid var(--stroke);border-left:6px solid var(--yellow);border-radius:10px;padding:12px;margin-top:10px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px">{{ zoneName }}</p>
<p style="font-size:14.5px;line-height:1.6;margin:0 0 8px">{{ zoneText }}</p>
<p style="font-size:13px;line-height:1.5;color:var(--mut);margin:0">La ficha nombra las tres porciones sin describirlas. El esquema muestra el orden en que la ficha las lista, de arriba hacia abajo: si en tu comisión lo dan con más detalle, ese detalle manda.</p>
</div>
</article>

<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 4px">2.2</p>
<h3 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:23px;line-height:1;margin:0 0 8px;text-transform:uppercase">Los músculos</h3>
<p style="font-size:14.5px;line-height:1.55;margin:0 0 14px">Dos grupos, y cada grupo se nombra distinto. Cambiá de grupo y mirá el patrón de los nombres: ahí está el truco para no confundirlos.</p>

<sc-for list="{{ muscChips }}" as="c" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}" style="font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--stroke);border-radius:99px;padding:10px 12px;box-shadow:2px 2px 0 var(--stroke);background:{{ c.bg }};color:{{ c.fg }};transition:background var(--dur)">{{ c.label }}</button>
</sc-for>
</div>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px">{{ muscTitle }}</p>
<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">

</div>
</sc-for>
</div>
<div style="border:1px solid var(--stroke);border-left:6px solid var(--yellow);border-radius:10px;padding:12px">
<p style="font-size:14px;line-height:1.55;margin:0">{{ muscNote }}</p>
</div>
</article>
</section>

<section id="f3" style="min-height:100svh;padding:60px 18px;max-width:820px;margin:0 auto;border-bottom:2px solid var(--stroke)">
<p style="font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:.12em;margin:0 0 8px" data-reveal>PLIEGUE 03</p>
<h2 style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(34px,10vw,60px);line-height:.9;margin:0 0 18px;text-transform:uppercase" data-reveal data-delay="60">Cómo te<br>das cuenta</h2>
<p style="font-size:clamp(16px,4.4vw,20px);line-height:1.55;margin:0 0 8px;max-width:44ch;text-wrap:pretty" data-reveal data-delay="120">Seis preguntas, porque esta ficha es corta. Elegís y aparece el porqué, aciertes o no.</p>
<p style="font-size:15px;line-height:1.6;color:var(--mut);margin:0 0 26px;max-width:46ch;text-wrap:pretty" data-reveal data-delay="180">El acierto es sólo el camino: lo que hay que estudiar es el porqué.</p>
<sc-for list="{{ quiz }}" as="q" hint-placeholder-count="6">
<article style="background:var(--paper);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:16px;margin-bottom:14px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);margin:0 0 6px">{{ q.num }}</p>

<span style="font-family:'Roboto Mono',monospace;font-size:12px;padding-top:1px">{{ o.mark }}</span>

</button>

<div style="margin-top:12px;border:1px solid var(--stroke);border-left:6px solid var(--yellow);border-radius:10px;padding:12px">
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px">Por qué</p>
<p style="font-size:14.5px;line-height:1.55;margin:0;text-wrap:pretty">{{ q.why }}</p>
</div>
</sc-if>
</article>
</sc-for>
<div style="background:var(--yellow);color:var(--onyel);border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:18px;margin-top:18px" data-reveal>
<p style="font-family:'Roboto Mono',monospace;font-size:12px;letter-spacing:.06em;margin:0 0 6px">{{ score }}</p>
<p style="font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;line-height:1.4;margin:0 0 8px">Si algún porqué no te cerró, anotalo y llevalo a la cátedra.</p>
<p style="font-size:14px;line-height:1.55;margin:0">Preguntar en clase o en la comisión es parte de estudiar, no una señal de que vas atrasada.</p>
</div>
<button type="button" onClick="{{ resetQuiz }}" style="width:100%;margin-top:12px;text-align:left;font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;background:transparent;border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke);padding:13px 15px">Borrar respuestas y volver a empezar</button>
</section>

<footer style="padding:48px 18px 60px;max-width:820px;margin:0 auto">
<p style="font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(26px,8vw,44px);line-height:.92;margin:0 0 14px;text-transform:uppercase" data-reveal>Preparemos<br>anato juntes</p>
<p style="font-size:15px;line-height:1.55;margin:0 0 10px;max-width:44ch" data-reveal data-delay="80">¿Ya te sumaste al grupo de WhatsApp? Sumate y preparemos la materia juntes: pedí el link al Equipo de Fonoaudiología.</p>
<p style="font-size:13px;line-height:1.55;color:var(--mut);margin:0;max-width:52ch" data-reveal data-delay="140">Material de estudio armado con las placas del Equipo de Fonoaudiología · Agrupación Simón Bolívar. Los esquemas son diagramas, no atlas: para el detalle anatómico usá la bibliografía y preguntá en la cátedra.</p>
<div class="ficha-sellos" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin:28px 0 0;border-top:2px solid var(--stroke);padding-top:26px" data-reveal data-delay="180">

<div style="display:flex;align-items:center;justify-content:center;padding:14px 50px;background:#FDFCF7;border:1px solid var(--stroke);border-radius:10px;box-shadow:2px 2px 0 var(--stroke)">
<img loading="lazy" src="../assets/sello-sb-conduccion.svg" alt="Simón Bolívar · Conducción del CEFTS" width="514" height="213" style="width:clamp(180px,52vw,258px);height:auto;display:block">
</div>

<script src="../ficha.js"></script>
<script>
class Component extends DCLogic {
  state = { zone: 'naso', musc: 'constrictores', ans: {} };

  componentDidMount() { this.wire(); }
  componentDidUpdate() { this.wire(); }
  componentWillUnmount() { clearTimeout(this._fail); if (this._io) this._io.disconnect(); }

  wire() {
    const nodes = Array.from(document.querySelectorAll('[data-reveal]'));
    const show = () => nodes.forEach(n => n.classList.add('on'));
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { show(); return; }
    document.documentElement.classList.add('js-reveal');
    nodes.forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.top < (window.innerHeight || 800) && r.bottom > 0) n.classList.add('on');
    });
    clearTimeout(this._fail);
    this._fail = setTimeout(show, 900);
    if (!this._io) {
      this._io = new IntersectionObserver((es) => {
        es.forEach(e => {
          if (e.isIntersecting) {
            e.target.style.transitionDelay = (e.target.getAttribute('data-delay') || 0) + 'ms';
            e.target.classList.add('on');
            this._io.unobserve(e.target);
          }
        });
      }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });
    }
    nodes.forEach(n => { if (!n.classList.contains('on') && !n._obs) { n._obs = 1; this._io.observe(n); } });
  }

  chip(k, cur) {
    const on = k === cur;
    return { on, bg: on ? 'var(--yellow)' : 'transparent', fg: on ? 'var(--onyel)' : 'var(--tx)' };
  }

  renderVals() {
    const s = this.state, S = (o) => this.setState(o);
    const V = {};

    V.intro = [
      { d: 0, n: 'DIVISIÓN', t: 'Tres porciones', b: 'La faringe está dividida en nasofaringe, orofaringe y laringofaringe.' },
      { d: 80, n: 'MÚSCULOS 01', t: 'Constrictores', b: 'Superior, medio e inferior. Se nombran por la altura.' },
      { d: 160, n: 'MÚSCULOS 02', t: 'Elevadores', b: 'Estilofaríngeo, palatofaríngeo y salpingofaríngeo.' }
    ];

    const zones = {
      naso: { n: 'Nasofaringe', t: 'Es la porción que la ficha lista primero: la más alta de las tres.', k: 'zNaso' },
      oro: { n: 'Orofaringe', t: 'Es la porción del medio, entre la nasofaringe y la laringofaringe.', k: 'zOro' },
      laringo: { n: 'Laringofaringe', t: 'Es la porción que la ficha lista última: la más baja, la que sigue hacia la laringe.', k: 'zLar' }
    };
    V.zoneChips = [
      { k: 'naso', label: 'Nasofaringe' },
      { k: 'oro', label: 'Orofaringe' },
      { k: 'laringo', label: 'Laringofaringe' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.zone), go: () => S({ zone: c.k }) }));
    ['zNaso', 'zOro', 'zLar'].forEach(k => { V[k] = 'fill:var(--paper);transition:fill var(--dur)'; });
    V[zones[s.zone].k] = 'fill:var(--yellow);transition:fill var(--dur)';
    V.zoneName = zones[s.zone].n;
    V.zoneText = zones[s.zone].t;
    V.zoneAlt = 'Esquema de la faringe como un conducto en tres tramos; resaltado: ' + zones[s.zone].n + '.';

    V.muscChips = [
      { k: 'constrictores', label: 'Constrictores' },
      { k: 'elevadores', label: 'Elevadores' }
    ].map(c => ({ ...c, ...this.chip(c.k, s.musc), go: () => S({ musc: c.k }) }));
    if (s.musc === 'constrictores') {
      V.muscTitle = 'Constrictores';
      V.muscList = [{ n: '01', t: 'Superior' }, { n: '02', t: 'Medio' }, { n: '03', t: 'Inferior' }];
      V.muscNote = 'Son tres y se nombran por la altura: superior, medio e inferior. Si el nombre es una posición, es un constrictor.';
    } else {
      V.muscTitle = 'Elevadores';
      V.muscList = [{ n: '01', t: 'Estilofaríngeo' }, { n: '02', t: 'Palatofaríngeo' }, { n: '03', t: 'Salpingofaríngeo' }];
      V.muscNote = 'Son tres y todos terminan en «-faríngeo», con un prefijo distinto adelante: estilo-, palato-, salpingo-. Si el nombre es compuesto y termina en -faríngeo, es un elevador.';
    }

    const QS = [
      { id: 'f1', text: '¿En qué porciones está dividida la faringe?', o: ['Superior, media e inferior', 'Nasofaringe, orofaringe y laringofaringe', 'Estilofaríngea, palatofaríngea y salpingofaríngea'], c: 1, why: 'La faringe está dividida en nasofaringe, orofaringe y laringofaringe.' },
      { id: 'f2', text: 'Los músculos constrictores de la faringe son…', o: ['Superior, medio e inferior', 'Estilofaríngeo, palatofaríngeo y salpingofaríngeo', 'Suprahioideos e infrahioideos'], c: 0, why: 'Constrictores: superior, medio e inferior. Se nombran por la altura.' },
      { id: 'f3', text: 'Los músculos elevadores son…', o: ['Superior, medio e inferior', 'Estilofaríngeo, palatofaríngeo y salpingofaríngeo', 'Nasofaríngeo, orofaríngeo y laringofaríngeo'], c: 1, why: 'Elevadores: estilofaríngeo, palatofaríngeo y salpingofaríngeo. Todos terminan en «-faríngeo».' },
      { id: 'f4', text: 'El salpingofaríngeo es un músculo…', o: ['Constrictor', 'Elevador', 'Suprahioideo'], c: 1, why: 'El salpingofaríngeo está en el grupo de los elevadores, junto al estilofaríngeo y el palatofaríngeo.' },
      { id: 'f5', text: '¿Cuántos grupos de músculos nombra la ficha para la faringe?', o: ['Dos: constrictores y elevadores', 'Tres: superior, medio e inferior', 'Uno solo'], c: 0, why: 'La ficha nombra dos grupos: constrictores (superior, medio e inferior) y elevadores (estilofaríngeo, palatofaríngeo y salpingofaríngeo).' },
      { id: 'f6', text: 'La porción que la ficha lista última, la que sigue hacia la laringe, es…', o: ['La nasofaringe', 'La orofaringe', 'La laringofaringe'], c: 2, why: 'La ficha lista nasofaringe, orofaringe y laringofaringe. La laringofaringe es la última: la que continúa hacia la laringe.' }
    ];
    let ok = 0, done = 0;
    V.quiz = QS.map((q, i) => {
      const picked = s.ans[q.id];
      const answered = picked !== undefined;
      if (answered) { done++; if (picked === q.c) ok++; }
      return {
        num: 'PREGUNTA ' + String(i + 1).padStart(2, '0') + ' / 06',
        text: q.text, done: answered, why: q.why,
        opts: q.o.map((label, j) => {
          const isC = j === q.c, chosen = picked === j;
          let bg = 'var(--paper)', fg = 'var(--tx)', mark = '○';
          if (answered) {
            if (isC) { bg = 'var(--yellow)'; fg = 'var(--onyel)'; mark = '✔'; }
            else if (chosen) { mark = '✕'; }
            else { mark = '·'; }
          }
          return { label, bg, fg, mark, on: chosen, go: () => { if (!answered) S({ ans: { ...this.state.ans, [q.id]: j } }); } };
        })
      };
    });
    V.score = done === 0 ? 'TODAVÍA NO RESPONDISTE NINGUNA' : 'ACERTASTE ' + ok + ' DE ' + done + ' RESPONDIDAS · 6 EN TOTAL';
    V.resetQuiz = () => S({ ans: {} });

    return V;
  }
}
arrancarFicha();
</script>
