<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();

<body>

<div id="cabecera"></div>
<main class="envoltura" id="contenido" tabindex="-1">
  <div class="esq-tarjeta" aria-hidden="true"><div class="esqueleto esq-cubo"></div><div class="esq-texto"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea media"></div><div class="esqueleto esq-linea corta"></div></div></div>
  <div class="esq-tarjeta" aria-hidden="true"><div class="esqueleto esq-cubo"></div><div class="esq-texto"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea media"></div><div class="esqueleto esq-linea corta"></div></div></div>
</main>
<div id="pie"></div>

<script>window.RAIZ = '../';</script>
<!-- EL CLIENTE CHICO, y no la librería grande.
     Esta pantalla solo lee una tabla pública, así que no necesita nada
     de lo que la librería grande sabe hacer: sesión, subida de
     archivos, cambios en vivo. Son 212 KB menos por visita, que es lo
     que más pesa de toda la pantalla.
     Lo único que se perdió con el cambio es el tiempo real; abajo está
     con qué se reemplazó. -->
<script src="../lib/datos.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<script src="../fondo-red.js"></script>
<script>
(async function pantallaAgenda(){

  /* «Menos movimiento», con plan B: esta pantalla llega siempre fresca
     de la red pero app.js sale primero de lo guardado, así que la
     primera vez después de subir una versión pueden venir desfasados.
     Llamar derecho a una función que el app.js viejo no tiene mata el
     guion entero. Ver la nota larga en index.html. */
  const sinMovimiento = () => {
    try {
      if (typeof menosMovimiento === 'function') return menosMovimiento();
      return !!(window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch(e){ return false; }
  };

  document.getElementById('cabecera').innerHTML = htmlCabecera(
    '<a class="boton-cabecera" href="../mi/">Perfil</a>'
  );
  document.getElementById('pie').innerHTML = htmlPie();
  pintarNav('agenda');

  const contenido = document.getElementById('contenido');
  const id = parametro('id');

  /* El ícono de los vacíos es el mismo 'agenda' de la fila de
     secciones. Si iconos.js no lo trajera, queda el emoji de antes,
     que .vacio-icono dibuja igual adentro del círculo. */
  const ICONO_CALENDARIO = icono('agenda') || '🗓️';

  const vacio = (titulo, texto, salida = '') => `
    <div class="vacio" role="status">
      <span class="vacio-icono" aria-hidden="true">${ICONO_CALENDARIO}</span>
      <strong class="vacio-titulo">${titulo}</strong>
      <p>${texto}</p>
      ${salida}
    </div>`;

  /* ============================================================
     Detalle de una publicación
     ============================================================ */
  if (id){
    let p;
    try {
      const { data, error } = await db.from('publicaciones')
        .select('*').eq('id', id).eq('publicado', true).maybeSingle();
      if (error) throw error;
      p = data;
    } catch (e) { mostrarError(contenido, e, 'cargar la publicación'); return; }

    if (!p){
      contenido.innerHTML = vacio('Esta publicación ya no está',
        'Puede haber vencido o haber sido actualizada.',
        '<a class="boton" href="./">Ver la agenda</a>');
      return;
    }

    const cuando = rangoLindo(p.fecha_desde, p.fecha_hasta);

    contenido.innerHTML = `
      <a href="./" style="display:inline-block;margin-top:18px;font-family:var(--fuente-sub);
         font-size:var(--letra-nota);text-transform:uppercase;letter-spacing:.06em;
         color:var(--texto-suave);text-decoration:none">← Volver a la agenda</a>

      <div style="margin-top:14px">
        <span class="etiqueta ${esc(p.linea)}">${esc(NOMBRE_LINEA[p.linea] || p.linea)}</span>
      </div>
      <h1 class="titulo-pantalla" style="margin-top:4px">${esc(p.titulo)}</h1>

      ${(cuando || p.hora || p.lugar) ? `<div class="ficha"><dl>
          ${cuando  ? `<dt>Cuándo</dt><dd>${esc(cuando)}</dd>` : ''}
          ${p.hora  ? `<dt>Hora</dt><dd>${esc(p.hora)}</dd>`   : ''}
          ${p.lugar ? `<dt>Dónde</dt><dd>${esc(p.lugar)}</dd>` : ''}
        </dl></div>` : ''}

      ${p.imagen_url ? `<figure class="flyer-publicacion">
          <img src="${esc(p.imagen_url)}" alt="Flyer: ${esc(p.titulo)}" loading="lazy">
        </figure>` : ''}

      ${p.cuerpo ? `<div style="font-size:16.5px;line-height:1.5">${escMulti(p.cuerpo)}</div>` : ''}

      ${p.link_url ? `<a class="boton ancho oscuro" style="margin-top:20px"
          href="${esc(urlSegura(p.link_url))}" target="_blank" rel="noopener">Abrir el enlace ↗</a>` : ''}

      ${htmlAgendarlo(p)}`;

    /* El .ics se arma acá, con la publicación que ya está en memoria.
       El botón de Google no necesita nada: es un enlace común. */
    const botonICS = contenido.querySelector('[data-agendar]');
    if (botonICS) botonICS.addEventListener('click', () => bajarICS([p], p.titulo));

    document.title = p.titulo + ' · La Bolívar con vos';
    return;
  }

  /* ============================================================
     Listado
     ============================================================ */
  contenido.innerHTML = `
    <h1 class="titulo-pantalla">FECHAS Y<br>NOVEDADES</h1>
    <p class="bajada">Fechas, comunicados y actividades. Se actualiza sola.</p>
    <div class="calendario-centro" id="calendario">${esqueletoCalendario()}</div>
    <div id="proximo"></div>
    <div id="bajar-todo"></div>
    <div id="enfoque"></div>
    <div id="filtros"></div>
    <div id="zonas">${esqueletoTarjetas(3)}</div>`;

  const cajaCal     = document.getElementById('calendario');
  const cajaProximo = document.getElementById('proximo');
  const cajaBajar   = document.getElementById('bajar-todo');
  const cajaFiltros = document.getElementById('filtros');
  const cajaEnfoque = document.getElementById('enfoque');
  const zonas       = document.getElementById('zonas');

  let publicaciones = [];

  /* La línea editorial elegida en los chips. Filtra la LISTA, no el
     calendario: la grilla sigue mostrando todo el mes, así se ve que
     hay otras cosas esos días aunque abajo no aparezcan. */
  let lineaElegida = 'todas';

  /* Qué meses están desplegados, y qué día señaló el estudiante en el
     calendario. Viven acá afuera porque la lista se redibuja entera
     cuando el equipo publica algo: sin esto, publicar una fecha te
     cerraría el mes que estabas mirando. */
  const abiertos   = new Set();
  let   diaElegido = null;
  let   primeraVez = true;

  /* `avisar` es false cuando esto corre al volver a la pantalla: ahí un
     error no se muestra, porque taparía con un cartel una agenda que
     ya estaba a la vista y era correcta. */
  async function traer(avisar = true){
    const { data, error } = await db.from('publicaciones')
      .select('*').eq('publicado', true).order('creado_at', { ascending:false });
    if (error){ if (avisar) mostrarError(zonas, error, 'cargar la agenda'); return false; }
    publicaciones = data;
    return true;
  }

  function tarjeta(p){
    const f = partesFecha(p.fecha_desde);
    const datos = [rangoLindo(p.fecha_desde, p.fecha_hasta), p.hora, p.lugar]
      .filter(Boolean).map(esc).join(' · ');

    /* «Señalada» es la que cae en el día que se tocó arriba. Es un
       anillo de tinta, no un color nuevo: en las placas de la
       agrupación lo que se resalta se encierra, no se pinta. */
    const senalada = diaElegido && caeEnElDia(p, diaElegido) ? ' destacada' : '';

    /* HOY es lo único de la tarjeta que puede gritar: insignia roja y
       el cubo de fecha en amarillo. El resto de los cubos van en gris
       cálido, porque si todas las fechas son amarillas ninguna lo es. */
    const esHoy = !!p.fecha_desde && caeEnElDia(p, hoyISO());

    /* El título va primero y es lo más grande; la etiqueta de la línea
       baja a una fila propia con la insignia. */
    const cuerpo = `
      <h3>${esc(p.titulo)}</h3>
      ${datos ? `<p>${datos}</p>`
              : (p.cuerpo ? `<p>${esc(p.cuerpo.slice(0,140))}${p.cuerpo.length > 140 ? '…' : ''}</p>` : '')}
      <div class="tarjeta-pies">
        ${esHoy ? '<span class="insignia-hoy">Hoy</span>' : ''}
        <span class="etiqueta ${esc(p.linea)}">${esc(NOMBRE_LINEA[p.linea] || p.linea)}</span>
      </div>`;

    if (f) return `<a class="tarjeta ${esc(p.linea)}${senalada}${esHoy ? ' es-hoy' : ''}" href="?id=${p.id}" data-fecha="${esc(p.fecha_desde.slice(0,10))}">
        <div class="tarjeta-fecha">
          <div class="cubo-fecha"><span class="dia">${f.dia}</span><span class="mes">${f.mesCorto}</span></div>
          <div>${cuerpo}</div>
        </div></a>`;

    return `<a class="tarjeta ${esc(p.linea)}${senalada}" href="?id=${p.id}">${cuerpo}</a>`;
  }

  /* '2026-09-04' -> '2026-09'. Agrupar por mes y no por categoría es la
     decisión de esta pantalla: así el calendario de arriba y la lista
     de abajo hablan de lo mismo y son un solo instrumento. Si los
     grupos fueran las líneas editoriales, las dos mitades no tendrían
     ninguna relación entre sí, y la línea ya la dice la etiqueta de
     cada tarjeta. */
  function claveMes(iso){ return String(iso).slice(0, 7); }

  function nombreMes(clave){
    const [a, m] = clave.split('-');
    return (MESES_LARGO[+m - 1] + ' ' + a).toUpperCase();
  }

  function grupo(clave, titulo, dentro, cuantos){
    return `
      <details class="grupo" data-grupo="${esc(clave)}" ${abiertos.has(clave) ? 'open' : ''}>
        <summary>
          <span class="nombre-grupo">${esc(titulo)}</span>
          <span class="cuenta-grupo">${cuantos}</span>
          <span class="flecha" aria-hidden="true">▼</span>
        </summary>
        <div class="cuerpo-grupo"><div class="lista">${dentro}</div></div>
      </details>`;
  }

  /* Igual que en Info útil: el estado abierto se lee del DOM antes de
     redibujar, y no del evento «toggle», que el navegador también
     dispara al insertar un grupo que ya viene abierto. */
  function recordarAbiertos(){
    zonas.querySelectorAll('details.grupo').forEach(d => {
      if (d.open) abiertos.add(d.dataset.grupo);
      else        abiertos.delete(d.dataset.grupo);
    });
  }

  /* `dibujar` solo pinta: nunca lee el estado abierto del DOM. Eso lo
     hace quien la llama, ANTES de tocar `abiertos`. Si lo hiciera acá
     adentro, abrir un mes y redibujar en el mismo paso lo cerraría:
     se pisaría el mes recién agregado con lo que todavía dice la
     pantalla vieja. */
  function dibujar(){
    if (!publicaciones.length){
      zonas.innerHTML = vacio('Todavía no hay fechas cargadas',
        'Volvé en unos días: las próximas mesas y actividades van a aparecer acá.');
      return;
    }

    /* El modo parciales va PRIMERO y el chip después: el chip elige
       dentro de lo que el modo dejó visible. */
    const visibles = conEnfoque()
      .filter(p => lineaElegida === 'todas' || p.linea === lineaElegida);

    if (!visibles.length && lineaElegida === 'todas'){
      zonas.innerHTML = vacio('La época de parciales esconde todo',
        'No hay fechas de las categorías que dejaste visibles. Las demás siguen ahí.',
        '<button type="button" class="boton" data-apagar-enfoque>Mostrar todas</button>');
      return;
    }

    if (!visibles.length){
      zonas.innerHTML = vacio(
        `No hay fechas de ${esc(NOMBRE_LINEA[lineaElegida] || lineaElegida)}`,
        'Probá con otra categoría o mirá todas juntas.',
        '<button type="button" class="boton" data-filtro="todas">Ver todas</button>');
      return;
    }

    const mesDeHoy = claveMes(hoyISO());

    /* Un mes = un grupo. Las que no tienen día van aparte: un
       comunicado no es una fecha y meterlo en un mes sería inventarle
       una que no tiene. */
    const porMes = {};
    const sinFecha = [];
    visibles.forEach(p => {
      if (!p.fecha_desde){ sinFecha.push(p); return; }
      const k = claveMes(p.fecha_desde);
      (porMes[k] = porMes[k] || []).push(p);
    });

    const claves = Object.keys(porMes).sort();
    const porVenir = claves.filter(k => k >= mesDeHoy);
    const pasados  = claves.filter(k => k <  mesDeHoy).reverse();

    /* Al entrar se abre el mes en curso; si este mes ya no queda nada,
       el próximo que tenga algo. Llegar a «Fechas» y no ver ninguna
       fecha sería el peor resultado posible de una pantalla plegable. */
    if (primeraVez){
      const arranque = porMes[mesDeHoy] ? mesDeHoy : porVenir[0];
      if (arranque) abiertos.add(arranque);
      primeraVez = false;
    }

    const deMes = k => porMes[k]
      .sort((a, b) => a.fecha_desde.localeCompare(b.fecha_desde))
      .map(tarjeta).join('');

    let html = porVenir.map(k => grupo(k, nombreMes(k), deMes(k), porMes[k].length)).join('');

    if (sinFecha.length)
      html += grupo('sin-fecha', 'SIN FECHA', sinFecha.map(tarjeta).join(''), sinFecha.length);

    if (pasados.length)
      html += `<div class="titulo-seccion" style="margin-top:22px">YA PASARON</div>` +
              pasados.map(k => grupo(k, nombreMes(k), deMes(k), porMes[k].length)).join('');

    zonas.innerHTML = html;
  }

  /* ---------- El calendario manda sobre la lista ----------

     Cambiar de mes con las flechas ABRE ese mes abajo, pero no mueve
     la pantalla: si al tocar «›» la vista saltara a la lista, el
     calendario se iría de la pantalla y no se podría tocar «›» otra
     vez.

     Tocar un día sí lleva abajo: ahí el estudiante pidió algo
     concreto y ya terminó con la grilla.                          */
  function abrirMes(clave){
    if (!clave) return;
    abiertos.add(clave);
    const d = zonas.querySelector(`details.grupo[data-grupo="${clave}"]`);
    if (d) d.open = true;
  }

  function mostrarDia(iso){
    recordarAbiertos();          /* primero se guarda lo que había abierto */
    diaElegido = iso;
    if (iso) abiertos.add(claveMes(iso));
    dibujar();
    if (!iso) return;

    const primera = zonas.querySelector('.tarjeta.destacada');
    if (!primera) return;

    const quieto = sinMovimiento();
    primera.scrollIntoView({ behavior: quieto ? 'auto' : 'smooth', block: 'center' });

    /* Y si el desplazamiento suave no llegó, se salta y listo.
       Toda esta función depende de que la pantalla efectivamente baje:
       si no baja, tocar un día resalta tarjetas que quedaron abajo del
       borde y parece que la app no hizo nada. Prefiero un salto seco a
       eso.

       EL MEDIO SEGUNDO ERA POCO. El desplazamiento suave del navegador
       no dura lo mismo siempre: cuanto más lejos está el destino, más
       tarda, y en Chrome pasa holgado los 500 ms si hay que bajar
       varias pantallas. O sea que el respaldo entraba EN EL MEDIO del
       movimiento y la página pegaba un segundo salto, seco, arriba del
       primero. Se veía peor que no tener nada.

       Ahora se espera a que el desplazamiento realmente pare. Donde
       existe, con el evento «scrollend», que es exactamente eso. Donde
       no —Safari todavía no lo tiene—, mirando la posición: dos cuadros
       seguidos sin moverse significa que frenó. Y recién ahí, si el
       destino igual quedó fuera de la pantalla, se salta. */
    if (quieto) return;

    const revisar = () => {
      const y = primera.getBoundingClientRect().top;
      if (y < 0 || y > window.innerHeight)
        primera.scrollIntoView({ behavior: 'auto', block: 'center' });
    };

    if ('onscrollend' in window){
      let red = setTimeout(revisar, 1500);   /* por si nunca se movió */
      addEventListener('scrollend', () => { clearTimeout(red); revisar(); },
        { once:true });
      return;
    }

    let anterior = -1, quietos = 0, cuadros = 0;
    (function esperarQueFrene(){
      const y = window.scrollY;
      /* Tope duro de 1,5 s por si algo lo deja moviéndose para siempre */
      if (++cuadros > 90) return revisar();
      quietos = (y === anterior) ? quietos + 1 : 0;
      anterior = y;
      if (quietos >= 2) return revisar();
      requestAnimationFrame(esperarQueFrene);
    })();
  }

  /* ---------- Bajarse todo el cronograma de una ----------

     Va abajo del calendario y no al final de la lista: al final no lo
     encuentra nadie, porque los meses vienen plegados y la pantalla
     termina cuatro dedos más abajo del calendario.

     Se bajan SOLO las que todavía vienen. Meterle a alguien en el
     teléfono las cuarenta y seis fechas del año, incluidas las de
     marzo, es ensuciarle el calendario, no ayudarlo. Y va en botón de
     contorno, no amarillo: el amarillo de esta pantalla ya es el día
     que se toca en la grilla. */
  function pintarBajarTodo(){
    const vienen = publicaciones.filter(todaviaViene);
    if (!vienen.length){ cajaBajar.innerHTML = ''; return; }

    cajaBajar.innerHTML = `
      <button type="button" class="boton borde ancho" id="btn-bajar-todo">
        Bajar las ${vienen.length} fechas que vienen
      </button>
      <p class="letra-chica" style="margin:8px 0 22px;text-align:center">
        Un archivo que abre tu calendario y las anota todas, cada una con
        aviso dos días antes.
      </p>`;

    document.getElementById('btn-bajar-todo').addEventListener('click',
      () => bajarICS(vienen, 'Fechas de la FTS UNLP'));
  }

  /* ---------- Esqueletos ----------

     El del calendario ocupa el mismo alto que la grilla de verdad,
     así la pantalla no pega el salto cuando llega el dato. */
  function esqueletoTarjetas(cuantas){
    return Array.from({ length: cuantas }, () => `
      <div class="esq-tarjeta" aria-hidden="true">
        <div class="esqueleto esq-cubo"></div>
        <div class="esq-texto">
          <div class="esqueleto esq-linea titulo"></div>
          <div class="esqueleto esq-linea media"></div>
          <div class="esqueleto esq-linea corta"></div>
        </div>
      </div>`).join('');
  }

  function esqueletoCalendario(){
    return `
      <div class="calendario" aria-hidden="true">
        <div class="esqueleto esq-linea" style="height:16px;width:48%;margin:0 auto 16px;border-radius:99px"></div>
        <div class="cal-grilla">
          ${Array.from({ length: 28 }, () =>
            '<div class="esqueleto" style="aspect-ratio:1/1;border-radius:99px"></div>').join('')}
        </div>
      </div>`;
  }

  /* ---------- «Lo próximo» ----------

     UNA sola cosa: la próxima fecha que todavía no terminó. Negro con
     la trama de puntos, como la cabecera, para que se lea como «esto
     te lo dice la app» y no como una tarjeta más. Si no hay ninguna,
     no se dibuja: un banner que dice «nada» ocupa el lugar de algo. */
  const FLECHA_DERECHA =
    '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
    'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M9 5l7 7-7 7"/></svg>';

  /* Cuántos días faltan, dicho como lo diría una persona. */
  function enCuanto(iso){
    const hoy = hoyISO();
    if (iso <= hoy) return 'Hoy';
    const dias = Math.round(
      (new Date(iso + 'T00:00') - new Date(hoy + 'T00:00')) / 86400000);
    if (dias === 1) return 'Mañana';
    if (dias <= 30) return `En ${dias} días`;
    return rangoLindo(iso, null);
  }

  function pintarProximo(){
    const hoy = hoyISO();
    const p = conEnfoque()
      .filter(x => x.fecha_desde &&
        String(x.fecha_hasta || x.fecha_desde).slice(0,10) >= hoy)
      .sort((a,b) => a.fecha_desde.localeCompare(b.fecha_desde))[0];
    if (!p){ cajaProximo.innerHTML = ''; return; }

    const meta = [p.hora, p.lugar].filter(Boolean).map(esc).join(' · ');

    cajaProximo.innerHTML = `
      <a class="proximo" href="?id=${p.id}">
        <span class="proximo-texto">
          <span class="proximo-ceja">
            <b>Lo próximo</b>
            <span class="proximo-cuando">${esc(enCuanto(p.fecha_desde.slice(0,10)))}</span>
          </span>
          <span class="proximo-titulo">${esc(p.titulo)}</span>
          ${meta ? `<span class="proximo-meta">${meta}</span>` : ''}
        </span>
        <span class="proximo-ir" aria-hidden="true">${FLECHA_DERECHA}</span>
      </a>`;
  }

  /* ---------- Filtros por línea ----------

     Solo nombra las líneas que de verdad tienen publicaciones, igual
     que la referencia del calendario: un filtro que siempre devuelve
     cero no es un filtro, es una duda. Con una sola línea no hay qué
     filtrar y la botonera no se dibuja. */
  function pintarFiltros(){
    const presentes = Object.keys(NOMBRE_LINEA)
      .filter(l => conEnfoque().some(p => p.linea === l));

    /* Si al refrescar desapareció la línea elegida, se vuelve a todas:
       si no, la lista quedaría filtrada por un chip que ya no existe. */
    if (lineaElegida !== 'todas' && !presentes.includes(lineaElegida))
      lineaElegida = 'todas';

    if (presentes.length < 2){ cajaFiltros.innerHTML = ''; return; }

    const chip = (id, nombre, punto) => `
      <button type="button" class="chip" data-filtro="${esc(id)}"
              aria-pressed="${id === lineaElegida}">
        ${punto ? `<i class="punto ${esc(id)}" aria-hidden="true"></i>` : ''}${esc(nombre)}
      </button>`;

    cajaFiltros.innerHTML = `<div class="filtros" role="group" aria-label="Filtrar por categoría">
        ${chip('todas', 'Todas', false)}
        ${presentes.map(l => chip(l, NOMBRE_LINEA[l], true)).join('')}
      </div>`;
  }

  /* Delegado en #contenido: sirve también para el «Ver todas» del
     vacío de filtro, y sobrevive a cada redibujado de la lista. */
  contenido.addEventListener('click', ev => {
    const b = ev.target.closest('[data-filtro]');
    if (!b) return;
    recordarAbiertos();
    lineaElegida = b.dataset.filtro;
    dibujar();
    pintarFiltros();
  });

  /* ============================================================
     RONDA 2 · SEMANA, ÉPOCA DE PARCIALES Y FALTAS (18/9/2026)

     Lo de la persona —su cursada, sus faltas, su preferencia del
     modo parciales— vive en tablas privadas y necesita la sesión.
     El cliente chico no la renueva, así que la librería grande se
     baja SOLO si en este teléfono hay una sesión guardada. Quien
     entra sin cuenta sigue bajando lo mismo que antes.

     Los ayudantes van acá y no en app.js: esta pantalla llega de la
     red y app.js puede venir del caché viejo.
     ============================================================ */
  const BLOQUES = [
    { k:'manana', n:'Mañana' },
    { k:'tarde',  n:'Tarde'  },
    { k:'noche',  n:'Noche'  }
  ];
  const DOW = ['lun','mar','mié','jue','vie','sáb','dom'];

  const isoDe = d =>
    d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
    '-' + String(d.getDate()).padStart(2,'0');

  function lunesDe(iso){
    const [a,m,d] = iso.split('-').map(Number);
    const f = new Date(a, m-1, d);
    f.setDate(f.getDate() - ((f.getDay() + 6) % 7));
    return isoDe(f);
  }

  /* «18:00», «18 hs», «18h»: la hora la escribe el equipo a mano.
     Sin hora, a la tarde, que es el bloque que se mira primero. */
  function bloqueDe(hora){
    const h = /(\d{1,2})\s*(?::|h)/i.exec(hora || '');
    if (!h) return 'tarde';
    const n = +h[1];
    return n < 13 ? 'manana' : n < 18 ? 'tarde' : 'noche';
  }

  /* Tope al 80% de presentismo. */
  const topeFaltas = c => Math.floor((c.total_clases || 0) * 0.2);

  let vista = parametro('vista') === 'semana' ? 'semana' : 'mes';
  let lunes = lunesDe(hoyISO());

  /* ---------- La cuenta ---------- */
  const CLAVE_SESION = 'sb-' +
    new URL(window.BOLIVAR_CONFIG.url).hostname.split('.')[0] + '-auth-token';
  let hayCuentaGuardada = false;
  try { hayCuentaGuardada = !!localStorage.getItem(CLAVE_SESION); } catch(e){}

  let cuenta   = null;         /* { c: cliente grande, user } */
  let cargandoCuenta = hayCuentaGuardada;
  let cursada  = [];
  let faltas   = {};           /* materia -> cuántas */

  function cargarLibreria(){
    if (window.supabase && window.supabase.createClient) return Promise.resolve();
    return new Promise((listo, error) => {
      const s = document.createElement('script');
      s.src = '../lib/supabase.js';
      s.onload = listo; s.onerror = error;
      document.head.appendChild(s);
    });
  }

  async function conectarCuenta(){
    if (!hayCuentaGuardada) return;
    try {
      await cargarLibreria();
      const c = window.supabase.createClient(
        window.BOLIVAR_CONFIG.url, window.BOLIVAR_CONFIG.anonKey);
      const { data:{ user } } = await c.auth.getUser();
      /* Sesión vencida o cerrada en otro lado: es lo mismo que no
         tener cuenta, y se le ofrece entrar. */
      if (!user){ hayCuentaGuardada = false; cargandoCuenta = false; pintarVista(); return; }
      cuenta = { c, user };
      await Promise.all([traerPreferencias(), traerCursada()]);
    } catch(e){
      /* Sin la librería no se pierde nada de lo público: la agenda
         sigue entera, y la semana dice que no pudo cargar. */
      cuenta = null;
    }
    cargandoCuenta = false;
    pintarTodo();
  }

  async function traerCursada(){
    if (!cuenta) return;
    const [cur, fal] = await Promise.all([
      cuenta.c.from('cursada').select('id,materia,dia,bloque,hora,aula,total_clases'),
      cuenta.c.from('falta').select('materia')
    ]);
    if (cur.error || fal.error) return;
    cursada = cur.data || [];
    /* El número sale de contar filas, nunca de un contador guardado. */
    faltas = {};
    (fal.data || []).forEach(f => { faltas[f.materia] = (faltas[f.materia] || 0) + 1; });
  }

  /* ---------- Modo época de parciales ----------
     En el teléfono siempre (así anda sin cuenta), y en la cuenta
     cuando hay: no se lo volvés a preguntar en noviembre. */
  const CLAVE_ENFOQUE = 'bolivar-enfoque';
  let enfoque = false;
  let enfoqueCats = ['info', 'saberes'];
  try {
    const g = JSON.parse(localStorage.getItem(CLAVE_ENFOQUE) || 'null');
    if (g){ enfoque = !!g.enfoque; if (Array.isArray(g.cats) && g.cats.length) enfoqueCats = g.cats; }
  } catch(e){}

  function conEnfoque(){
    return enfoque ? publicaciones.filter(p => enfoqueCats.includes(p.linea)) : publicaciones;
  }

  async function traerPreferencias(){
    const { data, error } = await cuenta.c.from('preferencias')
      .select('enfoque,enfoque_cats').maybeSingle();
    if (error) return;
    if (data){
      enfoque = !!data.enfoque;
      if (Array.isArray(data.enfoque_cats) && data.enfoque_cats.length) enfoqueCats = data.enfoque_cats;
      guardarEnfoqueLocal();
    } else if (enfoque){
      guardarPreferencias();     /* lo del teléfono sube a la cuenta */
    }
  }

  function guardarEnfoqueLocal(){
    try { localStorage.setItem(CLAVE_ENFOQUE, JSON.stringify({ enfoque, cats: enfoqueCats })); } catch(e){}
  }

  function guardarPreferencias(){
    guardarEnfoqueLocal();
    if (!cuenta) return;
    cuenta.c.from('preferencias').upsert({
      usuario_id: cuenta.user.id, enfoque, enfoque_cats: enfoqueCats,
      actualizado_at: new Date().toISOString()
    }).then(() => {});
  }

  function pintarEnfoque(){
    const escondidas = publicaciones.length - conEnfoque().length;
    const chip = l => `
      <button type="button" class="chip" data-enfoque-cat="${esc(l)}"
              aria-pressed="${enfoqueCats.includes(l)}">
        <i class="punto ${esc(l)}" aria-hidden="true"></i>${esc(NOMBRE_LINEA[l])}
      </button>`;

    cajaEnfoque.innerHTML = `
      <div class="enfoque ${enfoque ? 'encendido' : ''}">
        <div class="enfoque-fila">
          <span class="enfoque-icono" aria-hidden="true">${icono('enfoque') || '◎'}</span>
          <label for="sw-enfoque">
            <b>Época de parciales</b>
            <span>${enfoque
              ? `${escondidas} ${escondidas === 1 ? 'fecha escondida' : 'fechas escondidas'} mientras dure`
              : 'Deja en pantalla solo lo académico'}</span>
          </label>
          <button type="button" class="switch" id="sw-enfoque" role="switch"
                  aria-checked="${enfoque}" aria-label="Modo época de parciales"></button>
        </div>
        <div class="enfoque-cuerpo">
          <div>
            <div class="enfoque-cats">
              <div class="enfoque-rotulo">Dejar visible</div>
              <div class="filtros" style="margin:0;padding:0;flex-wrap:wrap">
                ${Object.keys(NOMBRE_LINEA).map(chip).join('')}
              </div>
              <div class="enfoque-nota">Se apaga cuando quieras. Las fechas no se borran:
                vuelven todas al apagarlo.</div>
            </div>
          </div>
        </div>
      </div>`;
  }

  /* ---------- Pestañas Mes / Semana ---------- */
  function htmlPestanas(){
    const b = (id, n) => `<button type="button" role="tab" data-vista="${id}"
        aria-selected="${id === vista}">${n}</button>`;
    return `<div class="vistas" role="tablist" aria-label="Cómo ver el calendario">${
      b('mes','Mes')}${b('semana','Semana')}</div>`;
  }

  function montarCal(){
    montarCalendario(cajaCal, conEnfoque(),
      iso => mostrarDia(iso),
      (anio, mes) => abrirMes(`${anio}-${String(mes).padStart(2,'0')}`));
    const cal = cajaCal.querySelector('.calendario');
    if (cal) cal.insertAdjacentHTML('afterbegin', htmlPestanas());
  }

  /* ---------- Semana a la vista ----------
     Días en filas y bloques en columnas: en un teléfono, tres
     columnas dejan leer el nombre de una materia y siete no. La
     celda libre es la más callada, así el hueco se ve como hueco.

     De la agenda entran solo las fechas de UN día: un período de tres
     semanas (una inscripción, un cuatrimestre de seminarios) llenaría
     todas las tardes y taparía justo los huecos que se vienen a
     buscar. Esos siguen en la vista Mes. */
  function htmlSemana(){
    const [a,m,d] = lunes.split('-').map(Number);
    const dias = Array.from({ length:7 }, (_, i) => {
      const f = new Date(a, m-1, d + i);
      return { iso:isoDe(f), num:f.getDate(), mes:f.getMonth(), dow:DOW[i] };
    });
    const deUnDia = conEnfoque().filter(p => p.fecha_desde &&
      (!p.fecha_hasta || p.fecha_hasta.slice(0,10) === p.fecha_desde.slice(0,10)));

    let libres = 0;
    const filas = dias.map((dia, i) => {
      const celdas = BLOQUES.map(b => {
        const clase = cursada.find(c => c.dia === i+1 && c.bloque === b.k);
        if (clase){
          const restan = Math.max(topeFaltas(clase) - (faltas[clase.materia] || 0), 0);
          return `<button type="button" class="semana-celda cursada"
            data-materia="${esc(clase.materia)}" data-cursada-id="${clase.id}"
            aria-label="${esc(clase.materia)}, ${esc(clase.hora || '')}${clase.aula ? ', ' + esc(clase.aula) : ''}. Te ${restan === 1 ? 'queda 1 falta' : 'quedan ' + restan + ' faltas'}">
            <b>${esc(clase.materia)}</b>
            <i>${clase.aula ? esc(clase.aula) + ' · ' : ''}${restan} falta${restan === 1 ? '' : 's'}</i>
          </button>`;
        }
        const ev = deUnDia.find(p => caeEnElDia(p, dia.iso) && bloqueDe(p.hora) === b.k);
        if (ev) return `<a class="semana-celda evento ${esc(ev.linea)}" href="?id=${ev.id}">
            <b>${esc(ev.titulo)}</b>
            <i>${esc(ev.hora || NOMBRE_LINEA[ev.linea] || '')}</i>
          </a>`;
        libres++;
        return `<span class="semana-celda libre" role="img"
          aria-label="${dia.dow} a la ${b.n.toLowerCase()}, libre"></span>`;
      }).join('');

      return `<div class="semana-fila ${dia.iso === hoyISO() ? 'hoy' : ''}">
          <div class="semana-dia">
            <span class="dow">${dia.dow}</span><span class="num">${dia.num}</span>
          </div>${celdas}
        </div>`;
    }).join('');

    const rango = dias[0].mes === dias[6].mes
      ? `${dias[0].num} al ${dias[6].num} de ${MESES[dias[6].mes]}`
      : `${dias[0].num} de ${MESES[dias[0].mes]} al ${dias[6].num} de ${MESES[dias[6].mes]}`;

    return `
      <div class="cal-cabecera">
        <button type="button" class="cal-flecha" data-semana="-1" aria-label="Semana anterior">‹</button>
        <div style="flex:1;text-align:center">
          <div class="cal-mes">${esc(rango.toUpperCase())}</div>
          <div class="cal-nombre-dia">${libres} bloques libres</div>
        </div>
        <button type="button" class="cal-flecha" data-semana="1" aria-label="Semana siguiente">›</button>
      </div>
      <div class="semana-cab" aria-hidden="true">
        <span></span>${BLOQUES.map(b => `<span>${b.n}</span>`).join('')}
      </div>
      <div class="semana-grilla">${filas}</div>
      <div class="cal-referencia">
        <span><i class="cal-punto" style="background:var(--superficie-2);border:1px solid var(--linea)"></i>Libre</span>
        <span><i class="cal-punto" style="background:var(--et-saberes)"></i>Cursada</span>
        <span><i class="cal-punto" style="background:var(--et-info)"></i>De la agenda</span>
      </div>
      ${cursada.length ? '' : `<p class="letra-chica" style="margin:12px 2px 0;text-align:center">
        Todavía no cargaste tu cursada. <a href="../mi/#cursada">Cargala en Mi perfil</a>
        y aparece acá, con tus faltas.</p>`}`;
  }

  function pintarSemana(){
    let cuerpo;
    if (!hayCuentaGuardada){
      cuerpo = `<div style="text-align:center;padding:26px 8px 18px">
          <strong class="vacio-titulo" style="display:block;margin-bottom:6px">Tu semana necesita tu cuenta</strong>
          <p class="letra-chica" style="margin:0 auto 14px;max-width:30ch">Cargás lo que cursás
            una vez y acá ves tus huecos, tus clases y cuántas faltas te quedan.</p>
          <a class="boton" href="../mi/">Entrar a mi cuenta</a>
        </div>`;
    } else if (cargandoCuenta){
      cuerpo = `<p class="letra-chica" style="text-align:center;padding:30px 0" role="status">Cargando tu semana…</p>`;
    } else if (!cuenta){
      cuerpo = `<div style="text-align:center;padding:26px 8px 18px">
          <strong class="vacio-titulo" style="display:block;margin-bottom:6px">No pudimos abrir tu cuenta</strong>
          <p class="letra-chica" style="margin:0 auto 14px;max-width:30ch">Puede ser la conexión,
            o que la sesión se haya cerrado.</p>
          <a class="boton" href="../mi/">Ir a mi perfil</a>
        </div>`;
    } else {
      cuerpo = htmlSemana();
    }
    cajaCal.innerHTML = `<div class="calendario">${htmlPestanas()}${cuerpo}</div>`;
  }

  function pintarVista(){
    if (vista === 'semana') pintarSemana(); else montarCal();
  }

  function pintarTodo(){
    pintarFiltros();             /* primero: puede corregir lineaElegida */
    dibujar();
    pintarVista();
    pintarProximo();
    pintarBajarTodo();
    pintarEnfoque();
  }

  /* ---------- Los toques de la ronda 2, delegados ---------- */
  contenido.addEventListener('click', ev => {
    const pest = ev.target.closest('[data-vista]');
    if (pest){
      if (pest.dataset.vista === vista) return;
      vista = pest.dataset.vista;
      history.replaceState(null, '', vista === 'semana' ? '?vista=semana' : location.pathname);
      pintarVista();
      const elegida = cajaCal.querySelector(`[data-vista="${vista}"]`);
      if (elegida) elegida.focus();
      return;
    }

    const paso = ev.target.closest('[data-semana]');
    if (paso){
      const [a,m,d] = lunes.split('-').map(Number);
      lunes = isoDe(new Date(a, m-1, d + 7 * Number(paso.dataset.semana)));
      pintarSemana();
      return;
    }

    if (ev.target.closest('#sw-enfoque') || ev.target.closest('[data-apagar-enfoque]')){
      enfoque = ev.target.closest('[data-apagar-enfoque]') ? false : !enfoque;
      lineaElegida = 'todas';
      guardarPreferencias();
      recordarAbiertos();
      pintarTodo();
      const sw = document.getElementById('sw-enfoque');
      if (sw && !ev.target.closest('[data-apagar-enfoque]')) sw.focus();
      return;
    }

    const cat = ev.target.closest('[data-enfoque-cat]');
    if (cat){
      const l = cat.dataset.enfoqueCat;
      const i = enfoqueCats.indexOf(l);
      if (i < 0) enfoqueCats = enfoqueCats.concat(l);
      else if (enfoqueCats.length > 1) enfoqueCats = enfoqueCats.filter(x => x !== l);  /* nunca cero */
      else return;
      guardarPreferencias();
      recordarAbiertos();
      pintarTodo();
      const igual = cajaEnfoque.querySelector(`[data-enfoque-cat="${l}"]`);
      if (igual) igual.focus();
    }
  });

  /* ---------- La hoja de cursada y faltas ----------
     Hoja de abajo y no pantalla nueva: marcar una falta es un gesto
     de dos segundos y no tiene que sacarte de la semana.

     El número grande es LO QUE QUEDA. «Faltaste 2 de 16» es la
     respuesta de un sistema administrativo, y va en letra chica. */
  let materiaAbierta = null;
  let origenHoja = null;

  function htmlHoja(c){
    const usadas = faltas[c.materia] || 0;
    const tope   = topeFaltas(c);
    const restan = tope - usadas;
    const clase  = restan <= 0 ? 'libre' : (restan <= 1 ? 'filo' : 'bien');
    const estado = restan <= 0 ? 'Quedás libre' : (restan <= 1 ? 'Al filo' : 'Vas bien');
    const casillas = Array.from({ length: tope }, (_, i) =>
      `<i class="${i < usadas ? 'usada' : ''}" aria-hidden="true"></i>`).join('');
    const dias = cursada.filter(x => x.materia === c.materia)
      .sort((x, y) => x.dia - y.dia)
      .map(x => `${DOW[x.dia - 1]} ${x.hora || ''}`.trim()).join(' y ');

    return `
      <div class="cursada-agarre" aria-hidden="true"></div>
      <div class="cursada-cab">
        <div>
          <div class="cursada-ceja">${esc(dias)}</div>
          <h3 id="hoja-materia">${esc(c.materia)}</h3>
          <div class="cursada-meta">${c.aula ? esc(c.aula) + ' · ' : ''}${c.total_clases} clases en el cuatrimestre</div>
        </div>
        <button type="button" class="cursada-cerrar" data-cerrar-hoja aria-label="Cerrar">✕</button>
      </div>

      <div class="faltas ${clase}">
        <div class="faltas-cab">
          <span class="rotulo">Presentismo · pide 80%</span>
          <span class="estado">${estado}</span>
        </div>
        <div class="faltas-numero" aria-live="polite">
          <b>${Math.max(restan, 0)}</b>
          <span>${restan === 1 ? 'falta te queda' : 'faltas te quedan'}</span>
        </div>
        <div class="faltas-casillas">${casillas}</div>
        <div class="faltas-detalle">Faltaste ${usadas} de ${c.total_clases}.
          Con el 80% podés faltar ${tope} ${tope === 1 ? 'vez' : 'veces'}.</div>
      </div>

      <div class="cursada-acciones">
        <button type="button" class="boton" data-falta="mas"
                ${usadas >= tope ? 'disabled' : ''}>Falté hoy</button>
        <button type="button" class="boton borde" data-falta="menos"
                ${usadas ? '' : 'disabled'}>Deshacer</button>
      </div>
      <div class="cursada-nota" id="hoja-nota">Se guarda en tu cuenta, así lo ves también desde
        la computadora.</div>`;
  }

  function abrirHoja(materia, desde){
    const c = cursada.find(x => x.materia === materia);
    if (!c || document.querySelector('.cursada-hoja')) return;
    materiaAbierta = materia;
    origenHoja = desde;
    document.body.insertAdjacentHTML('beforeend', `
      <div class="cursada-fondo" data-cerrar-hoja></div>
      <div class="cursada-hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-materia"
           tabindex="-1">${htmlHoja(c)}</div>`);
    document.querySelector('.cursada-hoja').focus();
  }

  function cerrarHoja(){
    const hoja  = document.querySelector('.cursada-hoja');
    const fondo = document.querySelector('.cursada-fondo');
    if (!hoja) return;
    const quitar = () => { hoja.remove(); if (fondo) fondo.remove(); };
    if (sinMovimiento()) quitar();
    else {
      hoja.classList.add('cerrando');
      if (fondo) fondo.classList.add('cerrando');
      hoja.addEventListener('transitionend', quitar, { once:true });
      setTimeout(quitar, 500);   /* por si la transición no corre */
    }
    materiaAbierta = null;
    if (vista === 'semana') pintarSemana();     /* los números nuevos */
    if (origenHoja){
      const vuelta = cajaCal.querySelector(`[data-cursada-id="${origenHoja}"]`);
      if (vuelta) vuelta.focus();
    }
  }

  async function marcarFalta(mas, boton){
    const c = cursada.find(x => x.materia === materiaAbierta);
    if (!c || !cuenta) return;
    const nota = document.getElementById('hoja-nota');
    boton.disabled = true;
    let error;
    if (mas){
      ({ error } = await cuenta.c.from('falta')
        .insert({ usuario_id: cuenta.user.id, materia: c.materia, fecha: hoyISO() }));
    } else {
      /* Deshacer = borrar la última que se marcó, no una cualquiera. */
      const { data, error: e1 } = await cuenta.c.from('falta').select('id')
        .eq('materia', c.materia).order('creado_at', { ascending:false }).limit(1);
      error = e1;
      if (!e1 && data && data[0])
        ({ error } = await cuenta.c.from('falta').delete().eq('id', data[0].id));
    }
    if (error){
      boton.disabled = false;
      if (nota) nota.textContent = 'No se pudo guardar. Fijate la conexión y probá de nuevo.';
      return;
    }
    /* Se vuelve a contar desde la base: si la misma cuenta marcó
       algo desde la computadora, acá tiene que verse. */
    await traerCursada();
    const hoja = document.querySelector('.cursada-hoja');
    const cNueva = cursada.find(x => x.materia === materiaAbierta);
    if (hoja && cNueva){
      hoja.innerHTML = htmlHoja(cNueva);
      const igual = hoja.querySelector(`[data-falta="${mas ? 'mas' : 'menos'}"]`);
      (igual && !igual.disabled ? igual : hoja).focus();
    }
  }

  document.addEventListener('click', ev => {
    const abrir = ev.target.closest('[data-materia]');
    if (abrir){ abrirHoja(abrir.dataset.materia, abrir.dataset.cursadaId); return; }
    if (ev.target.closest('[data-cerrar-hoja]')){ cerrarHoja(); return; }
    const b = ev.target.closest('[data-falta]');
    if (b) marcarFalta(b.dataset.falta === 'mas', b);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && document.querySelector('.cursada-hoja')) cerrarHoja();
  });

  if (await traer()) pintarTodo();
  else cajaCal.innerHTML = '';
  conectarCuenta();

  /* ---------- SE REFRESCA AL VOLVER ----------

     Acá había tiempo real: un canal abierto contra la base que traía
     lo que el equipo publicaba sin que nadie recargara. Se cambió el
     6/9/2026 por decisión de Máximo, y lo que se compró con eso son
     212 KB menos por visita —el canal es lo único que obligaba a bajar
     la librería grande de Supabase en esta pantalla—.

     Lo que se pierde es chico: quien tenga «Fechas» abierta EN ESE
     MOMENTO ve la publicación nueva al volver a la pantalla, y no al
     instante. Quien entre después la ve igual.

     Al volver es literal: cuando la pestaña se vuelve visible, y
     cuando el teléfono devuelve la página desde su memoria (`pageshow`
     con `persisted`, que es lo que pasa al tocar «atrás» y es el caso
     más común de todos). No hay temporizador dando vueltas.        */
  let ultimoRefresco = Date.now();
  let refrescando = false;

  async function refrescarAlVolver(){
    if (refrescando || document.visibilityState !== 'visible') return;
    /* Cambiar de app y volver enseguida no es «volver a la pantalla»:
       sin esto, alternar entre dos apps dispara un pedido por toque. */
    if (Date.now() - ultimoRefresco < 15000) return;
    refrescando = true;
    try {
      recordarAbiertos();
      /* Sin avisar: si al volver no hay red, lo que corresponde es
         dejar a la vista lo que ya estaba, no reemplazar la agenda
         por un cartel de error. */
      if (!await traer(false)) return;
      ultimoRefresco = Date.now();
      pintarTodo();
    } finally { refrescando = false; }
  }

  document.addEventListener('visibilitychange', refrescarAlVolver);
  window.addEventListener('pageshow', e => { if (e.persisted) refrescarAlVolver(); });

})();
</script>
</body>
</html>
