<!-- ============================================================
     CARGAR  ·  un paro, un grupo de estudio o una actividad, en tres pasos

     POR QUÉ EXISTE, Y POR QUÉ NO ES EL PANEL

     Los paros y los grupos de estudio son lo que más se mueve, y
     cargarlos en el panel pide TRECE campos: tipo, línea editorial,
     «¿alimenta la alarma de la portada?», período, imagen, enlace,
     avisar… Para alguien sin manejo tecnológico eso es una pared, y
     el resultado es que la carga queda en manos de una sola persona
     y las cosas se publican tarde.

     Acá se pregunta lo único que no se puede adivinar: qué es, cuándo
     y dónde. Los tres campos difíciles los completa el botón que la
     persona apretó:

       Un paro              -> categoría paro      · línea gremial
       Un grupo de estudio  -> categoría grupo     · línea saberes
       Una actividad        -> categoría actividad · línea frente

     Las tres salen publicadas y avisan solas al celular (30/9/2026).
     Hasta ese día el paro esperaba visto bueno del equipo.

     Y el TÍTULO se arma solo, así nadie tiene que redactar.

     LO QUE ESTA PANTALLA NO DECIDE. Qué puede escribir cada rol, y que
     cada quien edite y suspenda solo lo suyo, no depende de este
     archivo: lo garantiza la base (`sql/tabla-publicaciones.sql`,
     secciones 6 y 9). Acá se decide cómo se ve y qué se le explica a
     la persona; la garantía está del otro lado.

     NO ENTRA ACÁ, a propósito: imágenes, enlaces y borrar. Eso sigue
     siendo del panel. Editar y suspender lo propio sí (la lista de
     «Lo que cargaste», abajo del paso 1): el aula y la hora son lo que
     más cambia, y corregirlo no puede depender de otra persona.

     Y DESDE EL 30/9/2026, EL BUZÓN. La pestaña «Buzón» es la bandeja de
     `decilo/`: contesta la misma gente que carga paros, y el rol
     `comunicacion` no entra al panel. Ver «EL BUZÓN», abajo de todo.
     ============================================================ -->

<main class="envoltura" id="contenido" tabindex="-1">

</main>

<script>
(async function cargar(){
  'use strict';

  document.getElementById('cabecera').innerHTML = htmlCabecera();
  const contenido = document.getElementById('contenido');

  /* ============================================================
     PUERTA

     Entra el equipo y también `comunicacion`, que es el rol liviano:
     puede cargar esto y no entra al panel. La lista está en
     `puedeCargar()` (app.js), no acá.
     ============================================================ */
  const { usuario, perfil } = await sesionActual();

  if (!usuario){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">CARGAR</h1>
      <p class="bajada">Entrá con tu cuenta para cargar un paro, un grupo de estudio o una actividad.</p>
      ${(window.vinoCompartido && vinoCompartido()) ? `
        <div class="aviso ok">Llegaste desde «Compartir». Si sos del equipo, entrá y
          sigo con lo que mandaste. Si no, podés
          <a href="../decilo/?compartido=1">mandárselo a la agrupación por Decilo</a>.</div>` : ''}
      <div class="ficha">
        <form id="login">
          <div class="campo"><label for="correo">Correo</label>
            <input id="correo" type="email" autocomplete="email" required></div>
          <div class="campo"><label for="clave">Contraseña</label>
            <input id="clave" type="password" autocomplete="current-password" required></div>
          <button class="boton ancho" type="submit" id="btn">Entrar</button>
        </form>
        <div id="msj"></div>
      </div>`;
    document.getElementById('login').addEventListener('submit', async ev => {
      ev.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Un segundo…';
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('correo').value.trim(),
        password: document.getElementById('clave').value
      });
      if (error){
        btn.disabled = false; btn.textContent = 'Entrar';
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">${esc(
             error.message === 'Invalid login credentials'
               ? 'El correo o la contraseña no coinciden.' : error.message)}</div>`;
        return;
      }
      location.reload();
    });
    return;
  }

  /* «Compartir con La Bolívar» le aparece a cualquiera que tenga la app
     instalada, no solo al equipo: Android no deja elegir a quién. Quien
     no puede cargar no tiene que chocar con «no podés», sino encontrar
     qué hacer con lo que quiso mandar: Decilo, con el texto ya puesto. */
  if (!puedeCargar(perfil) && (window.vinoCompartido && vinoCompartido())){
    const c = await leerCompartido();
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">¿QUERÉS<br>AVISARNOS?</h1>
      <p class="bajada">
        Compartir con La Bolívar sirve para que el equipo cargue paros y
        actividades en la agenda, y tu cuenta no tiene ese permiso. Si querés
        que la agrupación vea lo que mandaste, mandalo por Decilo${
          c && c.texto ? ': el texto ya va a estar puesto' : ''}.${
          c && c.placa ? ' La imagen no se puede mandar por ahí: contalo en palabras.' : ''}
      </p>
      <a class="boton ancho" href="../decilo/?compartido=1">Mandarlo por Decilo</a>
      <a class="boton ancho borde" href="../" style="margin-top:10px">Volver a la app</a>`;
    return;
  }

  if (!puedeCargar(perfil)){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">TODAVÍA<br>NO PODÉS</h1>
      <p class="bajada">
        Tu cuenta (${esc(usuario.email)}) existe, pero no tiene permiso para
        cargar en la agenda. Pedile a alguien del equipo que te lo dé: es un
        renglón y tarda un minuto.
      </p>
      <a class="boton ancho" href="../">Volver a la app</a>
      <button class="boton ancho borde" id="salir" style="margin-top:10px">Cerrar sesión</button>`;
    document.getElementById('salir').onclick = async () => {
      await db.auth.signOut(); location.reload();
    };
    return;
  }

  /* ============================================================
     LO QUE SE ESTÁ CARGANDO

     Un solo objeto con lo elegido hasta ahora. Los pasos lo llenan y
     al final se traduce a una fila de `publicaciones`. Tenerlo en un
     lugar es lo que permite volver atrás sin perder nada.
     ============================================================ */
  /* `editando` es el id de lo que se está corrigiendo, o null si es
     nuevo. `antes` guarda cómo estaba, para decir si el cambio va a
     avisar (día, hora o lugar) o no (una coma en el detalle). */
  /* `pegado` es el mensaje de WhatsApp del que salió todo, si salió de
     uno, y `relativa` la palabra («mañana») de la que salió la fecha.
     `repite` es el título de lo que se está copiando. Los tres sirven
     solo para decirle a la persona qué hay que revisar. */
  const esto = { que:null, fecha:null, hora:null, lugar:'', detalle:'', asunto:'',
                 editando:null, antes:null, pegado:null, relativa:null, repite:null, placa:false };

  /* Todo lo que no es lo cargado: lo que se limpia al empezar otra cosa. */
  const SIN_ORIGEN = { pegado:null, relativa:null, repite:null, placa:false };

  /* Las tres clases de cosa que se cargan acá, con TODO lo que cada una
     implica junto. Agregar otra (un taller) es agregar un renglón a
     esta tabla y nada más.

     Desde el 30/9/2026 las tres se publican directo, paros incluidos, y
     las tres avisan solas al celular de quien tenga prendido ese canal
     (`supabase/functions/avisos`). Por eso la vista previa lo dice con
     todas las letras. */
  const CLASES = {
    paro: {
      nombre: 'Un paro',
      emoji: '✊',
      pista: 'Una medida de fuerza, una jornada de lucha, un abrazo a la facultad.',
      linea: 'gremial',
      categoria: 'paro',
      /* Cada clase pregunta UNA cosa suya, y de ahí sale el título. Que
         las dos tengan la misma forma es lo que evita que el título
         repita el texto de abajo: el asunto va arriba, el detalle
         abajo, y no dicen lo mismo. */
      campo: {
        titulo: '¿Por qué es el paro?',
        ejemplo: 'Contra el recorte de presupuesto',
        falta: 'Falta decir por qué es el paro: es lo que se lee en la agenda.'
      },
      titulo: e => 'Paro: ' + e.asunto,
      /* Al revés que `titulo`: de la fila guardada al asunto, para
         poder editarla sin que el prefijo se duplique. */
      asunto: p => String(p.titulo || '').replace(/^Paro:\s*/i, '')
    },
    grupo: {
      nombre: 'Un grupo de estudio',
      emoji: '📚',
      pista: 'Juntarse a estudiar una materia, preparar un final, repasar un parcial.',
      linea: 'saberes',
      categoria: 'grupo',
      campo: {
        titulo: '¿De qué materia?',
        ejemplo: 'Trabajo Social I',
        falta: 'Falta la materia: es lo que hace que el grupo se encuentre.',
        /* Sugiere los nombres del plan: escrita igual que en la cursada
           de cada quien, la materia es la que hace sonar el aviso. */
        sugerencias: true
      },
      titulo: e => 'Grupo de estudio de ' + e.asunto,
      asunto: p => p.materia ||
        String(p.titulo || '').replace(/^Grupo de estudio de\s*/i, '')
    },
    actividad: {
      nombre: 'Una actividad',
      emoji: '📣',
      pista: 'Una charla, una asamblea, una jornada, un taller.',
      linea: 'frente',
      categoria: 'actividad',
      campo: {
        titulo: '¿Qué es?',
        ejemplo: 'Asamblea por el boleto estudiantil',
        falta: 'Falta decir qué es: es el título que se lee en la agenda.'
      },
      titulo: e => e.asunto,
      asunto: p => String(p.titulo || '')
    }
  };

  const QUE_DE_CATEGORIA = { paro:'paro', grupo:'grupo', actividad:'actividad' };

  /* Todas las materias de los tres planes, sin repetir. Si algún plan no
     cargó, se sugiere con lo que haya: es una ayuda, no un requisito. */
  const MATERIAS = (function(){
    const nombres = new Set();
    ['PLAN_TS', 'PLAN_FONO', 'PLAN_TGCR'].forEach(k => {
      const plan = window[k];
      ((plan && plan.materias) || []).forEach(m => { if (m && m.nombre) nombres.add(m.nombre); });
    });
    return [...nombres].sort((a, b) => a.localeCompare(b, 'es'));
  })();

  /* Los lugares de siempre, para no escribirlos a mano. El último es
     libre porque los aulas cambian de número todo el tiempo. */
  const LUGARES = ['La facultad', 'El hall', 'El aula de siempre', 'Otro lugar'];

  /* Horarios de cursada, que es cuando se junta la gente. Escribir
     «18:00» en un teclado de celular es justo lo que queremos evitar. */
  const HORAS = ['10:00', '12:00', '14:00', '16:00', '18:00', '20:00'];

  /* ------------------------------------------------------------
     FECHAS

     `hoy`, `mañana` y los próximos días por su nombre. Se arma en el
     momento y no con una lista fija, así «el lunes» siempre es el
     lunes que viene y no el de la semana pasada.
     ------------------------------------------------------------ */
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
                 'agosto','septiembre','octubre','noviembre','diciembre'];

  function aISO(d){
    /* A mano y no con `toISOString()`, que pasa a UTC y en Argentina
       adelanta un día toda la tarde: un grupo del martes a las 20:00
       quedaría cargado el miércoles. */
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${dd}`;
  }

  function enPalabras(iso){
    const [a, m, d] = iso.split('-').map(Number);
    const f = new Date(a, m - 1, d);
    return `${DIAS[f.getDay()]} ${d} de ${MESES[m - 1]}`;
  }

  function atajosDeFecha(){
    const hoy = new Date();
    const lista = [];
    for (let i = 0; i < 8; i++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i);
      lista.push({
        iso: aISO(d),
        nombre: i === 0 ? 'Hoy' : i === 1 ? 'Mañana'
                : DIAS[d.getDay()][0].toUpperCase() + DIAS[d.getDay()].slice(1) + ' ' + d.getDate()
      });
    }
    return lista;
  }

  /* ------------------------------------------------------------
     LOS PASOS

     Cada uno dibuja y engancha lo suyo. `paso1` no recibe nada porque
     es el principio; los demás pueden volver al anterior, y volver no
     borra lo elegido (está en `esto`).
     ------------------------------------------------------------ */

  function encabezado(n, texto){
    return `
      <p class="bajada" style="margin-bottom:6px">${esto.editando ? 'Corrigiendo · '
        : esto.repite ? 'Repitiendo · ' : esto.placa ? 'Desde la placa · '
        : esto.pegado ? 'Desde el mensaje · ' : ''}Paso ${n} de 3</p>
      <h1 class="titulo-pantalla">${texto}</h1>
      ${cajaDeOrigen()}`;
  }

  /* LO QUE HAY QUE REVISAR

     Cuando los pasos vienen llenos —de un mensaje pegado o de una
     copia— lo peligroso es pasar «Seguir» sin mirar. Por eso arriba de
     cada paso se dice qué faltó y qué se adivinó, y el mensaje queda a
     mano para copiar un renglón. Lo que falta se calcula con lo que hay
     AHORA: al completarlo, deja de aparecer. */
  const QUE_FALTA = { paro:'por qué es el paro', grupo:'la materia', actividad:'qué es' };

  function cajaDeOrigen(){
    if (esto.editando || (!esto.pegado && !esto.repite)) return '';
    if (esto.repite) return `
      <div class="aviso ok">Copiaste «${esc(esto.repite)}». Elegí el día nuevo y
        revisá que la hora y el lugar sigan siendo los mismos.</div>`;
    const falta = [
      !esto.fecha  && 'el día',
      !esto.hora   && 'la hora',
      !esto.asunto && QUE_FALTA[esto.que],
      !esto.lugar  && 'el lugar'
    ].filter(Boolean);
    const lista = falta.length > 1
      ? falta.slice(0, -1).join(', ') + ' y ' + falta[falta.length - 1] : falta[0];
    return `
      <div class="aviso ok">
        Completé lo que pude leer ${esto.placa ? 'de la placa' : 'del mensaje'}. <strong>Revisalo:</strong> lo
        adiviné, no lo sé.${falta.length ? ` No encontré ${esc(lista)}.` : ''}${
        esto.relativa && esto.fecha ? ` «${esc(esto.relativa)}» lo tomé como el
        ${esc(enPalabras(esto.fecha))}: si ${esto.placa ? 'la placa' : 'el mensaje'} es de otro día, cambiá la fecha.` : ''}
        <details style="margin-top:8px">
          <summary style="cursor:pointer;font-weight:700">${esto.placa
            ? 'Ver el texto de la placa' : 'Ver el mensaje que pegaste'}</summary>
          <p style="white-space:pre-wrap;margin:6px 0 0">${esc(esto.pegado)}</p>
        </details>
      </div>`;
  }

  function paso1(){
    contenido.innerHTML = `
      ${htmlPestanas('cargar')}
      ${encabezado(1, '¿QUÉ<br>ES?')}
      <div class="ficha">
        <h3>¿Te llegó por WhatsApp?</h3>
        <p class="bajada" style="margin-top:4px">Pegá el mensaje y completo los pasos
          con lo que diga. Vos revisás todo antes de publicar.</p>
        <div class="campo">
          <label for="pegado">El mensaje</label>
          <textarea id="pegado" style="min-height:96px"
                    placeholder="✊ PARO este jueves en defensa de la universidad pública…">${esc(esto.pegado || '')}</textarea>
        </div>
        <div id="msj-pegado" role="status" aria-live="polite"></div>
        <button type="button" class="boton ancho" id="leer">Leer el mensaje</button>
        <p class="bajada" style="margin:14px 0 8px">¿Es una placa? Subí la imagen y la leo.</p>
        <button type="button" class="boton ancho borde" id="subir-placa">Subir la foto de la placa</button>
        <input id="placa" type="file" accept="image/*" hidden>
      </div>
      <div class="titulo-seccion" style="margin-top:22px">O ELEGÍ QUÉ ES</div>
      <div class="grupo">
        ${Object.entries(CLASES).map(([clave, c]) => `
          <button class="tarjeta ${esc(c.linea)}" data-que="${clave}"
                  style="width:100%;text-align:left;font:inherit;cursor:pointer">
            <h3>${c.emoji} ${esc(c.nombre)}</h3>
            <p>${esc(c.pista)}</p>
          </button>`).join('')}
      </div>
      <p class="bajada" style="margin-top:18px">
        Si lo que querés cargar no es ninguna de estas, avisale a alguien del
        equipo: se carga desde el panel.
      </p>
      <div id="lo-mio"></div>
      <div id="para-repetir"></div>`;

    const pegado = document.getElementById('pegado');
    document.getElementById('leer').onclick = () => {
      if (!pegado.value.trim()){
        document.getElementById('msj-pegado').innerHTML =
          '<div class="aviso error">Primero pegá el mensaje en el cuadro.</div>';
        pegado.focus();
        return;
      }
      desdeElMensaje(pegado.value.trim(), null);
    };

    const placa = document.getElementById('placa');
    document.getElementById('subir-placa').onclick = () => placa.click();
    placa.onchange = () => {
      const archivo = placa.files && placa.files[0];
      /* Se vacía para que elegir la misma foto otra vez vuelva a leerla. */
      placa.value = '';
      if (archivo) desdeLaPlaca(archivo);
    };

    /* Con un mensaje pegado, tocar una clase es decir «es esto»: se
       vuelve a leer sabiéndolo, que es lo que permite sacar el asunto
       cuando el lector no se dio cuenta solo (o se equivocó de clase). */
    contenido.querySelectorAll('[data-que]').forEach(b => {
      b.onclick = () => {
        if (pegado.value.trim()){ desdeElMensaje(pegado.value.trim(), b.dataset.que); return; }
        Object.assign(esto, { que: b.dataset.que, editando: null, antes: null }, SIN_ORIGEN);
        paso2();
      };
    });
    engancharPestanas();
    contarSinContestar();
    pintarLoMio();
    pintarParaRepetir();
  }

  /* Del mensaje a los pasos. Nunca salta la vista previa: sin día va al
     paso 2, y con día va al 3, que es donde están los textos —el asunto
     y el lugar— que más chances tienen de haber salido mal. */
  function desdeElMensaje(texto, que){
    const l = window.leerAviso
      ? window.leerAviso(texto, { materias: MATERIAS, que })
      : { que, fecha:null, hora:null, lugar:'', asunto:'', relativa:null };
    Object.assign(esto, {
      que: l.que, fecha: l.fecha, hora: l.hora, lugar: l.lugar, asunto: l.asunto,
      detalle: '', editando: null, antes: null
    }, SIN_ORIGEN, { pegado: texto, relativa: l.relativa });
    seguirConLoLeido('No me di cuenta de qué es.');
  }

  function seguirConLoLeido(sinClase){
    if (!esto.que){
      document.getElementById('msj-pegado').innerHTML =
        `<div class="aviso error">${sinClase} Tocá abajo si es un paro, ` +
        'un grupo de estudio o una actividad, y sigo con lo que leí.</div>';
      return;
    }
    if (esto.fecha) paso3(); else paso2();
  }

  /* ------------------------------------------------------------
     LA PLACA (7/10/2026)

     Una imagen no se lee con reglas: la lee Gemini, en la función
     `leer-placa` (ver el porqué allá). Esto achica la foto, se la
     manda y pone lo que vuelve en los mismos pasos que un mensaje
     pegado. La transcripción queda en el cuadro de texto: si Gemini no
     supo qué es, tocar una clase la vuelve a leer con las reglas.

     Si falla —sin cupo, sin señal, Google cambió algo— se dice qué
     hacer en vez de esto, que es lo mismo que se hacía antes.
     ------------------------------------------------------------ */
  const PROBLEMA_PLACA = {
    cupo: 'Por hoy se terminaron las lecturas gratis de placas.',
    imagen: 'No pude abrir esa imagen. Probá con una captura de pantalla de la placa.',
    'sin-permiso': 'Tu cuenta no tiene permiso para leer placas.'
  };

  async function desdeLaPlaca(archivo){
    const msj = document.getElementById('msj-pegado');
    const boton = document.getElementById('subir-placa');
    boton.disabled = true;
    boton.textContent = 'Leyendo la placa…';
    msj.innerHTML = '<div class="aviso ok">Leyendo la placa. Tarda unos segundos.</div>';

    let r = null, problema = 'gemini';
    try {
      const { base64, tipo } = await achicar(archivo);
      const { data, error } = await db.functions.invoke('leer-placa', { body: { imagen: base64, tipo } });
      if (!error) r = data;
      else {
        /* El error de la función viene adentro de la respuesta. */
        try { problema = (await error.context.json()).error || problema; } catch(e){}
      }
    } catch(e){ problema = 'imagen'; }

    if (!document.getElementById('subir-placa')) return;
    boton.disabled = false;
    boton.textContent = 'Subir la foto de la placa';

    if (!r){
      msj.innerHTML = `<div class="aviso error">${PROBLEMA_PLACA[problema] ||
        'No pude leer la placa ahora.'} Si el posteo tiene el texto, copialo y pegalo
        arriba; si no, elegí abajo qué es y cargalo a mano.</div>`;
      return;
    }

    /* La materia se busca además en la transcripción con la lista del
       plan: escrita igual que en el plan es la que hace sonar el aviso,
       y Gemini no conoce el plan. */
    let asunto = r.asunto || '';
    if (r.que === 'grupo' && window.leerAviso){
      asunto = window.leerAviso(r.texto || '', { materias: MATERIAS, que: 'grupo' }).asunto || asunto;
    }
    /* Sin transcripción no se pisa lo que ya estaba: puede ser el
       mensaje que vino compartido junto con la placa. */
    const cuadro = document.getElementById('pegado');
    if (r.texto) cuadro.value = r.texto;
    Object.assign(esto, {
      que: r.que, fecha: r.fecha, hora: r.hora, lugar: r.lugar || '', asunto,
      detalle: '', editando: null, antes: null
    }, SIN_ORIGEN, { pegado: r.texto || '', relativa: r.relativa, placa: true });
    seguirConLoLeido('Leí la placa pero no me di cuenta de qué es.');
  }

  /* A 1600 px de lado y en JPEG: una foto del teléfono pasa de 4 MB a
     unos 300 KB, que sube rápido con poca señal y se lee igual. El
     fondo blanco es para las PNG transparentes, que en JPEG saldrían
     negras. */
  async function achicar(archivo){
    const url = URL.createObjectURL(archivo);
    try {
      const img = await new Promise((ok, mal) => {
        const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = url;
      });
      const escala = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const lienzo = document.createElement('canvas');
      lienzo.width = Math.round(img.naturalWidth * escala);
      lienzo.height = Math.round(img.naturalHeight * escala);
      const ctx = lienzo.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, lienzo.width, lienzo.height);
      ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
      return { base64: lienzo.toDataURL('image/jpeg', 0.85).split(',')[1], tipo: 'image/jpeg' };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  /* ------------------------------------------------------------
     LO QUE CARGUÉ

     Lo que más cambia de un paro o un grupo es el aula y la hora, y
     hasta hoy corregirlo exigía el panel. Acá cada quien ve lo suyo que
     todavía no pasó y lo edita o lo suspende. La base garantiza que sea
     lo SUYO (`creado_por`, sección 9 de `sql/tabla-publicaciones.sql`).

     Suspender no borra: queda tachado en la agenda y a quien ya le
     había llegado el aviso le llega «se suspendió». Borrar haría que
     desaparezca sin que nadie se entere, que es lo peor para un paro.
     ------------------------------------------------------------ */
  let mio = [];

  async function pintarLoMio(){
    const caja = document.getElementById('lo-mio');
    if (!caja) return;
    const ayer = aISO(new Date(Date.now() - 86400000));
    const { data, error } = await db.from('publicaciones')
      .select('id,titulo,categoria,materia,fecha_desde,fecha_hasta,hora,lugar,cuerpo,publicado,suspendido')
      .eq('creado_por', usuario.id)
      .in('categoria', Object.keys(QUE_DE_CATEGORIA))
      .gte('fecha_desde', ayer)
      .order('fecha_desde', { ascending: true })
      .limit(30);
    /* Sin la columna `categoria` (falta correr el SQL) no se dibuja
       nada: la carga sigue andando igual y esto es un agregado. */
    if (error || !document.getElementById('lo-mio')) return;
    mio = data || [];
    if (!mio.length){ caja.innerHTML = ''; return; }

    /* Cuántos dijeron «Voy», y en los grupos los números que dejaron
       para que los sumen al de WhatsApp (tanda 3, 30/9/2026). Los
       números los ve solo quien cargó el grupo: lo decide la base
       (`sql/tabla-anotados.sql`), no esta pantalla. Si algo falla, la
       lista sale igual, sin esto. */
    const van = {}, numeros = {};
    try {
      const grupos = mio.filter(p => p.categoria === 'grupo').map(p => p.id);
      const [rc, rn] = await Promise.all([
        db.from('anotados_totales').select('*').in('publicacion_id', mio.map(p => p.id)),
        grupos.length
          ? db.from('anotados_contacto').select('publicacion_id,telefono').in('publicacion_id', grupos)
          : Promise.resolve({ data: [] })
      ]);
      (rc.data || []).forEach(f => { van[f.publicacion_id] = Number(f.cuantos) || 0; });
      (rn.data || []).forEach(f => {
        (numeros[f.publicacion_id] = numeros[f.publicacion_id] || []).push(f.telefono);
      });
    } catch(e){}
    const cuantosVanA = p => {
      const n = van[p.id] || 0;
      if (!n) return p.categoria === 'grupo' ? 'Todavía no se anotó nadie' : 'Todavía nadie dijo que va';
      return p.categoria === 'grupo'
        ? `${n} ${n === 1 ? 'persona anotada' : 'personas anotadas'}`
        : `${n} ${n === 1 ? 'persona dijo' : 'personas dijeron'} que va`;
    };

    caja.innerHTML = `
      <div class="titulo-seccion" style="margin-top:26px">LO QUE CARGASTE</div>
      <div class="grupo">
        ${mio.map(p => {
          const c = CLASES[QUE_DE_CATEGORIA[p.categoria]];
          const estado = p.suspendido ? 'Suspendido'
                       : !p.publicado ? 'Sin publicar' : '';
          return `
          <div class="tarjeta ${esc(c.linea)}${p.suspendido ? ' suspendida' : ''}">
            <h3>${c.emoji} ${esc(p.titulo)}</h3>
            <p>${esc(enPalabras(String(p.fecha_desde).slice(0, 10)))}${
              p.hora ? ' · ' + esc(p.hora) : ''}${p.lugar ? ' · ' + esc(p.lugar) : ''}</p>
            ${estado ? `<div class="tarjeta-pies"><span class="etiqueta">${estado}</span></div>` : ''}
            ${p.publicado && !p.suspendido ? `<p class="voy-cuenta" style="margin:8px 0 0">${esc(cuantosVanA(p))}</p>` : ''}
            ${(numeros[p.id] || []).length ? `
              <details style="margin-top:8px">
                <summary class="letra-chica" style="cursor:pointer;font-weight:700">${numeros[p.id].length} ${
                  numeros[p.id].length === 1 ? 'número' : 'números'} para sumar al grupo de WhatsApp</summary>
                <ul style="margin:6px 0 0;padding-left:18px">${numeros[p.id].map(t => `<li>${esc(t)}</li>`).join('')}</ul>
                <p class="letra-chica" style="margin:6px 0 0">Usalos solo para sumar gente a este grupo.
                  Se borran solos dos días después del encuentro.</p>
              </details>` : ''}
            <div class="chips" style="margin-top:10px">
              ${p.suspendido ? '' : `<button type="button" class="chip" data-editar="${p.id}">Editar</button>`}
              ${!p.publicado ? `<button type="button" class="chip" data-publicar="${p.id}">Publicar ya</button>` : ''}
              <button type="button" class="chip" data-suspender="${p.id}">${
                p.suspendido ? 'Volver a activar' : 'Suspender'}</button>
              <button type="button" class="chip" data-repetir="${p.id}">Repetir otro día</button>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div id="msj-mio"></div>`;

    caja.querySelectorAll('[data-editar]').forEach(b => {
      b.onclick = () => editar(mio.find(p => String(p.id) === b.dataset.editar));
    });
    caja.querySelectorAll('[data-suspender]').forEach(b => {
      b.onclick = () => suspender(mio.find(p => String(p.id) === b.dataset.suspender), b);
    });
    caja.querySelectorAll('[data-publicar]').forEach(b => {
      b.onclick = () => cambiarFila(Number(b.dataset.publicar), { publicado: true }, b);
    });
    caja.querySelectorAll('[data-repetir]').forEach(b => {
      b.onclick = () => repetir(mio.find(p => String(p.id) === b.dataset.repetir));
    });
  }

  function editar(p){
    if (!p) return;
    const que = QUE_DE_CATEGORIA[p.categoria];
    Object.assign(esto, {
      que,
      fecha:   String(p.fecha_desde).slice(0, 10),
      hora:    p.hora || null,
      lugar:   p.lugar || '',
      detalle: p.cuerpo || '',
      asunto:  CLASES[que].asunto(p),
      editando: p.id,
      antes:   { fecha: String(p.fecha_desde).slice(0, 10), hora: p.hora || null, lugar: p.lugar || '' }
    }, SIN_ORIGEN);
    paso2();
  }

  /* REPETIR (7/10/2026)

     La asamblea de cada martes, el grupo de siempre: cargarlos de nuevo
     cada semana era repetir los tres pasos para cambiar solo el día. Se
     copia todo menos la fecha, que queda vacía a propósito: una copia
     con la fecha vieja se publicaría en el pasado sin que nadie lo note. */
  function repetir(p){
    if (!p) return;
    const que = QUE_DE_CATEGORIA[p.categoria];
    Object.assign(esto, {
      que, fecha: null,
      hora:    p.hora || null,
      lugar:   p.lugar || '',
      detalle: p.cuerpo || '',
      asunto:  CLASES[que].asunto(p),
      editando: null, antes: null
    }, SIN_ORIGEN, { repite: p.titulo });
    paso2();
  }

  /* Lo que ya pasó no está en «Lo que cargaste» (esa lista es para
     corregir lo que viene), así que lo repetible de antes va aparte:
     lo último de cada título, para que la asamblea semanal no salga
     cinco veces. */
  async function pintarParaRepetir(){
    const caja = document.getElementById('para-repetir');
    if (!caja) return;
    const ayer = aISO(new Date(Date.now() - 86400000));
    const { data, error } = await db.from('publicaciones')
      .select('id,titulo,categoria,materia,fecha_desde,hora,lugar,cuerpo')
      .eq('creado_por', usuario.id)
      .in('categoria', Object.keys(QUE_DE_CATEGORIA))
      .lt('fecha_desde', ayer)
      .order('fecha_desde', { ascending: false })
      .limit(30);
    if (error || !data || !document.getElementById('para-repetir')) return;
    const vistos = new Set();
    const pasadas = data.filter(p => !vistos.has(p.titulo) && vistos.add(p.titulo)).slice(0, 6);
    if (!pasadas.length){ caja.innerHTML = ''; return; }
    caja.innerHTML = `
      <div class="titulo-seccion" style="margin-top:26px">REPETIR ALGO QUE YA PASÓ</div>
      <p class="bajada">Se copia todo y elegís el día nuevo.</p>
      <div class="chips">
        ${pasadas.map(p => `
          <button type="button" class="chip" data-repetir="${p.id}"
                  aria-label="Repetir ${esc(p.titulo)}">${
            CLASES[QUE_DE_CATEGORIA[p.categoria]].emoji} ${esc(p.titulo)}</button>`).join('')}
      </div>`;
    caja.querySelectorAll('[data-repetir]').forEach(b => {
      b.onclick = () => repetir(pasadas.find(p => String(p.id) === b.dataset.repetir));
    });
  }

  async function suspender(p, boton){
    if (!p) return;
    const suspendiendo = !p.suspendido;
    if (suspendiendo && !confirm(
        '¿Suspender «' + p.titulo + '»?\n\nQueda tachado en la agenda y a quien ya ' +
        'le había llegado el aviso le avisamos que se suspendió.')) return;
    cambiarFila(p.id, { suspendido: suspendiendo }, boton);
  }

  async function cambiarFila(id, cambios, boton){
    if (boton) boton.disabled = true;
    const { error } = await db.from('publicaciones').update(cambios).eq('id', id);
    if (error){
      if (boton) boton.disabled = false;
      const msj = document.getElementById('msj-mio');
      if (msj) msj.innerHTML = `<div class="aviso error">No se pudo guardar: ${esc(error.message)}</div>`;
      return;
    }
    pintarLoMio();
  }

  function paso2(){
    const c = CLASES[esto.que];
    contenido.innerHTML = `
      ${encabezado(2, '¿CUÁNDO<br>ES?')}
      <p class="bajada">${c.emoji} ${esc(c.nombre)}</p>

      <div class="ficha">
        <h3>El día</h3>
        <div class="chips elegir-uno" id="dias"></div>
        <div class="campo" style="margin-top:12px">
          <label for="otra-fecha">…o elegí otro día</label>
          <input id="otra-fecha" type="date" value="${esc(esto.fecha || '')}">
        </div>
      </div>

      <div class="ficha">
        <h3>La hora</h3>
        <div class="chips elegir-uno" id="horas"></div>
        <div class="campo" style="margin-top:12px">
          <label for="otra-hora">…o escribila</label>
          <input id="otra-hora" type="time" value="${esc(esto.hora || '')}">
        </div>
      </div>

      <div id="msj"></div>
      <button class="boton ancho" id="seguir">Seguir</button>
      <button class="boton ancho borde" id="atras" style="margin-top:10px">← Volver</button>`;

    const dias = document.getElementById('dias');
    dias.innerHTML = atajosDeFecha().map(a =>
      `<button type="button" class="chip" aria-pressed="${esto.fecha === a.iso}"
               data-iso="${a.iso}">${esc(a.nombre)}</button>`).join('');
    dias.querySelectorAll('[data-iso]').forEach(b => {
      b.onclick = () => { esto.fecha = b.dataset.iso; paso2(); };
    });
    document.getElementById('otra-fecha').onchange = ev => {
      esto.fecha = ev.target.value || null; paso2();
    };

    const horas = document.getElementById('horas');
    horas.innerHTML = HORAS.map(h =>
      `<button type="button" class="chip" aria-pressed="${esto.hora === h}"
               data-hora="${h}">${esc(h)}</button>`).join('');
    horas.querySelectorAll('[data-hora]').forEach(b => {
      b.onclick = () => { esto.hora = b.dataset.hora; paso2(); };
    });
    document.getElementById('otra-hora').onchange = ev => {
      esto.hora = ev.target.value || null; paso2();
    };

    document.getElementById('atras').onclick = paso1;
    document.getElementById('seguir').onclick = () => {
      /* La fecha es lo único obligatorio de este paso: sin fecha no
         entra al calendario, que es todo el punto. La hora puede
         faltar (un paro dura el día entero). */
      if (!esto.fecha){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Falta el día. Sin día no aparece en el calendario.</div>';
        return;
      }
      paso3();
    };
  }

  function paso3(){
    const c = CLASES[esto.que];
    contenido.innerHTML = `
      ${encabezado(3, '¿DÓNDE<br>Y QUÉ?')}
      <p class="bajada">${c.emoji} ${esc(c.nombre)} · ${esc(enPalabras(esto.fecha))}${
        esto.hora ? ' · ' + esc(esto.hora) : ''}</p>

      <div class="ficha">
        <h3>${esc(c.campo.titulo)}</h3>
        <div class="campo">
          <input id="asunto" value="${esc(esto.asunto)}"
                 placeholder="${esc(c.campo.ejemplo)}" maxlength="80"
                 ${c.campo.sugerencias && MATERIAS.length ? 'list="materias-plan" autocomplete="off"' : ''}>
          ${c.campo.sugerencias && MATERIAS.length ? `<datalist id="materias-plan">${
            MATERIAS.map(m => `<option value="${esc(m)}">`).join('')}</datalist>` : ''}
        </div>
      </div>

      <div class="ficha">
        <h3>El lugar</h3>
        <div class="chips elegir-uno" id="lugares"></div>
        <div class="campo" style="margin-top:12px">
          <label for="otro-lugar">…o escribilo</label>
          <input id="otro-lugar" value="${esc(esto.lugar)}"
                 placeholder="Aula 3" maxlength="80">
        </div>
      </div>

      <div class="ficha">
        <h3>¿Querés agregar algo?</h3>
        <div class="campo">
          <textarea id="detalle" maxlength="400"
                    placeholder="Opcional. Un renglón alcanza."
                    style="min-height:90px">${esc(esto.detalle)}</textarea>
        </div>
      </div>

      <div id="msj"></div>
      <button class="boton ancho" id="seguir">Ver cómo va a quedar</button>
      <button class="boton ancho borde" id="atras" style="margin-top:10px">← Volver</button>`;

    const lugares = document.getElementById('lugares');
    lugares.innerHTML = LUGARES.map(l =>
      `<button type="button" class="chip" aria-pressed="${esto.lugar === l}"
               data-lugar="${esc(l)}">${esc(l)}</button>`).join('');
    lugares.querySelectorAll('[data-lugar]').forEach(b => {
      b.onclick = () => {
        /* PRIMERO se guarda lo que ya está escrito. Tocar un chip
           redibuja el paso entero, y sin esto la materia que la persona
           acababa de escribir se borraba sola: el error más enojoso que
           puede tener una pantalla que existe para ser fácil. */
        juntar();
        /* «Otro lugar» no es un lugar: es pedir el campo de abajo. */
        esto.lugar = b.dataset.lugar === 'Otro lugar' ? '' : b.dataset.lugar;
        paso3();
        if (b.dataset.lugar === 'Otro lugar') document.getElementById('otro-lugar').focus();
      };
    });

    function juntar(){
      esto.lugar   = document.getElementById('otro-lugar').value.trim();
      esto.detalle = document.getElementById('detalle').value.trim();
      esto.asunto  = document.getElementById('asunto').value.trim();
    }

    document.getElementById('atras').onclick = () => { juntar(); paso2(); };
    document.getElementById('seguir').onclick = () => {
      juntar();
      if (!esto.asunto){
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">${esc(c.campo.falta)}</div>`;
        return;
      }
      if (!esto.lugar){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Falta el lugar. Si todavía no lo sabés, poné «la facultad» y después se corrige.</div>';
        return;
      }
      vistaPrevia();
    };
  }

  /* ------------------------------------------------------------
     LA VISTA PREVIA

     Es la parte que más importa de toda la pantalla. Quien no maneja
     tecnología no confía en un formulario a ciegas: ver la tarjeta
     como va a salir es lo que le dice «esto es lo que estás haciendo».

     Y es donde se le avisa, con todas las letras, que esto se publica
     YA y que le suena el teléfono a quien tenga prendidos los avisos.
     Desde que los paros no esperan visto bueno (30/9/2026), esta es la
     última mirada antes de que lo lea toda la facultad.
     ------------------------------------------------------------ */
  const ROTULO = { paro:'Paro', grupo:'Grupo de estudio', actividad:'Actividad' };
  const CANAL  = { paro:'paros', grupo:'grupos de estudio', actividad:'actividades' };

  function vistaPrevia(){
    const c = CLASES[esto.que];
    const titulo = c.titulo(esto);
    const editando = !!esto.editando;

    /* Solo el día, la hora y el lugar avisan un cambio (lo decide el
       disparador de la base). Una coma en el detalle no despierta a
       nadie, y así se le dice a quien edita. */
    const avisaCambio = editando && esto.antes && (
      esto.antes.fecha !== esto.fecha ||
      (esto.antes.hora || null) !== (esto.hora || null) ||
      esto.antes.lugar !== esto.lugar);

    const textoBoton = editando ? 'Guardar los cambios' : 'Publicar';

    contenido.innerHTML = `
      <p class="bajada" style="margin-bottom:6px">Antes de guardar</p>
      <h1 class="titulo-pantalla">ASÍ VA<br>A QUEDAR</h1>

      <div class="tarjeta ${esc(c.linea)} cat-${esc(c.categoria)}">
        <h3>${esc(titulo)}</h3>
        <p>
          ${esc(enPalabras(esto.fecha))}${esto.hora ? ' · ' + esc(esto.hora) : ''}<br>
          ${esc(esto.lugar)}
          ${esto.detalle ? '<br><br>' + esc(esto.detalle) : ''}
        </p>
        <div class="tarjeta-pies">
          <span class="etiqueta cat-${esc(c.categoria)}">${esc(ROTULO[c.categoria])}</span>
        </div>
      </div>

      <div class="aviso ok" style="margin-top:16px">
        ${!editando
          ? '<strong>Esto se va a ver ya</strong> en la agenda y en el calendario de ' +
            'la app, y les llega un aviso al celular a quienes tengan prendidos los ' +
            'avisos de ' + CANAL[c.categoria] + '. Revisá bien el día y el lugar.'
          : avisaCambio
            ? '<strong>Cambia el día, la hora o el lugar.</strong> A quienes ya les ' +
              'había llegado el aviso les llega otro con el cambio.'
            : 'Se corrige en la agenda. Como no cambia el día, la hora ni el lugar, ' +
              'no le suena el teléfono a nadie.'}
      </div>

      <div id="msj"></div>
      <button class="boton ancho" id="guardar">${textoBoton}</button>
      <button class="boton ancho borde" id="atras" style="margin-top:10px">← Cambiar algo</button>`;

    document.getElementById('atras').onclick = paso3;
    document.getElementById('guardar').onclick = async function(){
      this.disabled = true;
      this.textContent = 'Guardando…';

      /* Lo que se escribe en los dos casos. Al editar no se toca
         `publicado` ni `creado_por`: se corrige lo que se ve, no de
         quién es ni si está a la vista. */
      const comun = {
        titulo:      titulo,
        cuerpo:      esto.detalle || null,
        fecha_desde: esto.fecha,
        hora:        esto.hora || null,
        lugar:       esto.lugar,
        materia:     c.categoria === 'grupo' ? esto.asunto : null
      };

      const { error } = editando
        ? await db.from('publicaciones').update(comun).eq('id', esto.editando)
        : await db.from('publicaciones').insert(Object.assign({
            tipo:        'evento',
            linea:       c.linea,
            categoria:   c.categoria,
            publicado:   true,
            /* Los dos que la base también exige, y que acá no se
               preguntan nunca: un evento no usa la marca manual de
               avisar (avisa solo, por su canal) y no toca la alarma de
               mesas. Ver `sql/tabla-publicaciones.sql`. */
            alarma:      'ninguna',
            avisar:      false,
            creado_por:  usuario.id
          }, comun));

      if (error){
        this.disabled = false;
        this.textContent = textoBoton;
        /* El error crudo de PostgREST no le dice nada a nadie. El caso
           más probable es que la cuenta no tenga el permiso todavía, o
           que falte correr el archivo de la tabla. */
        const suena = /row-level security|permission denied|42501/i.test(error.message || '');
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">${suena
            ? 'Tu cuenta no tiene permiso para cargar esto todavía. Pedile a ' +
              'alguien del equipo que te lo dé (y que haya corrido ' +
              '<code>sql/tabla-publicaciones.sql</code>).'
            : 'No se pudo guardar: ' + esc(error.message)}</div>`;
        return;
      }

      listo(editando);
    };
  }

  /* ------------------------------------------------------------
     EN QUÉ QUEDÓ

     Un paro mandado y sin noticias es un compañero preguntando por
     WhatsApp, y ahí perdimos lo que ganamos. Así que se dice qué pasó
     y qué sigue.
     ------------------------------------------------------------ */
  function listo(fueEdicion){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">YA<br>ESTÁ</h1>
      <p class="bajada">
        ${fueEdicion
          ? 'Quedó corregido en la agenda y en el calendario de la app.'
          : 'Ya se ve en la agenda y en el calendario de la app. El aviso al ' +
            'celular sale en la próxima vuelta del reloj (cada hora en punto, ' +
            'de 9 a 21).'}
      </p>
      <div class="grupo">
        <a class="boton ancho" href="../agenda/">Verlo en la agenda</a>
        <button class="boton ancho borde" id="otra">Cargar otra cosa</button>
        <a class="boton ancho borde" href="../">Volver a la app</a>
      </div>`;
    document.getElementById('otra').onclick = () => {
      /* Se limpia todo menos la fecha: casi siempre se cargan varias
         cosas del mismo día, y volver a elegirlo cansa. */
      const fecha = esto.fecha;
      Object.assign(esto, { que:null, fecha, hora:null, lugar:'', detalle:'', asunto:'',
                            editando:null, antes:null }, SIN_ORIGEN);
      paso1();
    };
  }

  /* ============================================================
     EL BUZÓN  ·  la bandeja de «Decilo» (sesión 3, 30/9/2026)

     Lo que la gente deja en `decilo/` llega acá, y se contesta desde el
     celular. Va en esta pantalla y no en el panel porque la usa el rol
     `comunicacion`, que no entra al panel (decisión del 30/9).
     `modera_buzon()` de `sql/tabla-buzon.sql` deja moderar a los mismos
     dos roles que `puedeCargar()`: si uno cambia, cambia el otro.

     Tres cosas que garantiza la base y que acá solo se explican: un
     pedido no vuelve a «sin contestar», uno descartado no se publica, y
     la fecha de cada cambio la pone el disparador, no la app. El texto
     de quien escribió no se edita: si trae algo que no puede salir, se
     descarta.
     ============================================================ */

  /* Lo que está sin contestar, para el número de la pestaña. Es lo
     único que tiene que ver de un vistazo quien entra a cargar un paro. */
  let sinContestar = 0;

  function htmlPestanas(cual){
    return `
      <div class="pestanas" role="tablist" aria-label="Qué querés hacer">
        <button type="button" class="pestana" role="tab" id="tab-cargar"
                aria-selected="${cual === 'cargar'}" data-ver="cargar">Cargar</button>
        <button type="button" class="pestana" role="tab" id="tab-buzon"
                aria-selected="${cual === 'buzon'}" data-ver="buzon">${esc(rotuloBuzon())}</button>
      </div>`;
  }

  const rotuloBuzon = () => 'Buzón' + (sinContestar ? ' · ' + sinContestar : '');

  function engancharPestanas(){
    const tabs = [...contenido.querySelectorAll('.pestanas [data-ver]')];
    tabs.forEach((b, i) => {
      /* Una sola parada de tabulador para las dos; las flechas cambian
         de una a otra, que es lo que espera un lector de pantalla de
         algo que se anuncia como pestañas. */
      b.tabIndex = b.getAttribute('aria-selected') === 'true' ? 0 : -1;
      b.onclick = () => ir(b.dataset.ver);
      b.onkeydown = ev => {
        if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
        ev.preventDefault();
        ir(tabs[(i + 1) % tabs.length].dataset.ver);
      };
    });
  }

  /* `?ver=buzon` en la dirección: así el panel lleva directo a la
     bandeja, y recargar no te devuelve a «Cargar». */
  function ir(cual){
    const u = new URL(location.href);
    if (cual === 'buzon') u.searchParams.set('ver', 'buzon');
    else u.searchParams.delete('ver');
    history.replaceState(null, '', u);
    if (cual === 'buzon') bandeja(); else paso1();
    const t = document.getElementById('tab-' + cual);
    if (t) t.focus();
  }

  async function contarSinContestar(){
    try {
      const { count, error } = await db.from('buzon_pedidos')
        .select('id', { count:'exact', head:true }).eq('estado', 'recibido');
      if (error) return;
      sinContestar = count || 0;
      const t = document.getElementById('tab-buzon');
      if (t) t.textContent = rotuloBuzon();
    } catch(e){}
  }

  const ESTADOS = {
    recibido:   { filtro:'Sin contestar', texto:'Sin contestar', fecha:'creado_at' },
    en_gestion: { filtro:'En gestión',    texto:'En gestión',    fecha:'en_gestion_at' },
    resuelto:   { filtro:'Resueltos',     texto:'Resuelto',      fecha:'resuelto_at' },
    descartado: { filtro:'Descartados',   texto:'Descartado',    fecha:'descartado_at' }
  };

  /* Qué quiere decir cada estado, dicho para quien lo elige. */
  const QUE_SIGNIFICA = {
    en_gestion: 'Lo estamos moviendo. Si está publicado, en el tablero se ve «En gestión» con la fecha de hoy.',
    resuelto:   'Ya tiene solución. Suma a los resueltos del tablero.',
    descartado: 'Spam, repetido o algo que no puede salir. No se publica, pero se cuenta ' +
                'aparte en los totales: no se esconde.'
  };

  /* LAS RESPUESTAS YA ESCRITAS
     BORRADOR del 30/9/2026. Las escribió Claude con `marca/VOZ.md`
     porque las del equipo de comunicación todavía no llegaron: hay que
     reemplazarlas por las suyas. Tocar una la copia en el campo, y
     siempre se puede cambiar antes de guardar.
     Las que tienen [corchetes] piden completar algo, y la bandeja no
     deja guardar mientras quede uno: se publicaría tal cual. */
  const RESPUESTAS = [
    { nombre:'Lo estamos viendo', estado:'en_gestion',
      texto:'Gracias por escribirnos. Ya lo estamos viendo con quien corresponde, y acá ' +
            'vamos a contar en qué queda.' },
    { nombre:'Lo llevamos a la cátedra', estado:'en_gestion',
      texto:'Lo llevamos a la cátedra y estamos esperando que nos contesten. Apenas sepamos ' +
            'algo, lo publicamos acá.' },
    { nombre:'Es de la facultad', estado:'en_gestion',
      texto:'Esto no depende de una cátedra sino de la gestión de la facultad. Lo vamos a ' +
            'plantear, y acá te contamos qué nos responden.' },
    { nombre:'Resuelto', estado:'resuelto',
      texto:'Ya está resuelto: [qué cambió]. Gracias por avisar: sin tu pedido no nos ' +
            'enterábamos.' },
    { nombre:'Hay un trámite', estado:'resuelto',
      texto:'Esto tiene un trámite propio, y en la app está explicado paso a paso: ' +
            'labolivarconvos.ar/tramites. Si te trabás en algún paso, escribinos de nuevo.' },
    { nombre:'Grupo de estudio', estado:'resuelto',
      texto:'Para [materia] hay grupos de estudio: los encontrás en Fechas, con el día y el ' +
            'lugar. Si ninguno te queda cómodo, contanos y vemos de armar otro.' },
    { nombre:'No es nuestro', estado:'resuelto',
      texto:'Esto no lo puede resolver el centro de estudiantes, pero sabemos quién sí: ' +
            '[a quién hay que ir y cómo].' },
    { nombre:'Repetido', estado:'descartado',
      texto:'Nos llegó el mismo pedido de otra persona y lo seguimos ahí, en el tablero.' }
  ];

  let pedidos = [], nombreCategoria = {}, filtro = 'recibido', abierto = null;

  function bandeja(){
    contenido.innerHTML = `
      ${htmlPestanas('buzon')}
      <h1 class="titulo-pantalla">BUZÓN</h1>
      <p class="bajada">Lo que llega a <a href="../decilo/">Decilo</a>. La meta es contestar
        todo en menos de 48 horas: el tablero público muestra cuánto tardamos.</p>
      <div class="chips elegir-uno" id="filtros" role="group" aria-label="Qué pedidos ver"></div>
      <div id="msj-buzon" role="status" aria-live="polite"></div>
      <div id="pedidos" aria-busy="true">
        <div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea media"></div>
      </div>`;
    engancharPestanas();
    traerPedidos();
  }

  async function traerPedidos(){
    const [cat, ped] = await Promise.all([
      db.from('buzon_categorias').select('clave,nombre'),
      db.from('buzon_pedidos')
        .select('id,texto,categoria,carrera,estado,publicado,respuesta,creado_at,' +
                'en_gestion_at,resuelto_at,descartado_at,pidio_aviso')
        .order('creado_at', { ascending:false })
        .limit(300)
    ]);
    const caja = document.getElementById('pedidos');
    if (!caja) return;   /* se fue a «Cargar» mientras esto llegaba */
    caja.removeAttribute('aria-busy');

    if (ped.error){
      const falta = /does not exist|schema cache|42P01/i.test(ped.error.message || '');
      caja.innerHTML = `<div class="aviso error">${falta
        ? 'Falta correr <code>sql/tabla-buzon.sql</code> en Supabase.'
        : 'No pudimos traer los pedidos. Probá de nuevo en un rato.'}</div>`;
      return;
    }

    nombreCategoria = {};
    (cat.data || []).forEach(c => { nombreCategoria[c.clave] = c.nombre; });
    pedidos = ped.data || [];
    sinContestar = pedidos.filter(p => p.estado === 'recibido').length;
    const t = document.getElementById('tab-buzon');
    if (t) t.textContent = rotuloBuzon();
    pintarBandeja();
  }

  /* «hace 5 horas», «hace 3 días». En horas hasta las 48, porque la
     meta se cuenta en horas y «hace 1 día» esconde si van 25 o 47. */
  function hace(iso){
    const h = Math.floor((Date.now() - Date.parse(iso)) / 3600000);
    if (h < 1) return 'hace un rato';
    if (h < 48) return `hace ${h} ${h === 1 ? 'hora' : 'horas'}`;
    return `hace ${Math.floor(h / 24)} días`;
  }

  function pintarBandeja(){
    const filtros = document.getElementById('filtros');
    const caja = document.getElementById('pedidos');
    if (!filtros || !caja) return;

    const cuantos = e => pedidos.filter(p => p.estado === e).length;
    filtros.innerHTML = Object.entries(ESTADOS).map(([e, x]) =>
      `<button type="button" class="chip" aria-pressed="${filtro === e}"
               data-filtro="${e}">${esc(x.filtro)} · ${cuantos(e)}</button>`).join('');
    filtros.querySelectorAll('[data-filtro]').forEach(b => {
      b.onclick = () => {
        if (!sePuedeCerrar()) return;
        filtro = b.dataset.filtro; abierto = null; pintarBandeja();
      };
    });

    /* Lo sin contestar va del más viejo al más nuevo: el que lleva más
       horas esperando es el primero que se pasa de las 48. Lo demás, lo
       último que se movió arriba. */
    const f = ESTADOS[filtro].fecha;
    const lista = pedidos.filter(p => p.estado === filtro).sort((a, b) =>
      filtro === 'recibido'
        ? Date.parse(a.creado_at) - Date.parse(b.creado_at)
        : Date.parse(b[f] || b.creado_at) - Date.parse(a[f] || a.creado_at));

    if (!lista.length){
      caja.innerHTML = `<div class="vacio">${filtro === 'recibido'
        ? 'No hay nada sin contestar. Cuando alguien escriba en Decilo, aparece acá.'
        : 'Por ahora no hay ninguno.'}</div>`;
      return;
    }

    caja.innerHTML = `<div class="grupo">${lista.map(htmlPedido).join('')}</div>`;
    caja.querySelectorAll('[data-contestar]').forEach(b => {
      b.onclick = () => {
        if (!sePuedeCerrar()) return;
        abierto = Number(b.dataset.contestar);
        pintarBandeja();
        /* El foco va a lo primero que hay que decidir, no arriba de todo. */
        const primero = document.querySelector(`#pedido-${abierto} [data-estado]`);
        if (primero) primero.focus();
      };
    });
    if (abierto) engancharEditor(lista.find(p => p.id === abierto));
  }

  /* Con un pedido abierto, los filtros y los «Contestar» de los demás
     siguen a la vista, y tocarlos redibuja la lista: lo escrito y sin
     guardar se perdía sin aviso. En el celular, con la lista larga, es
     fácil tocar el de abajo. */
  function sePuedeCerrar(){
    if (!abierto) return true;
    const t = document.getElementById('respuesta-' + abierto);
    const p = pedidos.find(x => x.id === abierto);
    if (!t || !p || t.value.trim() === (p.respuesta || '').trim()) return true;
    return confirm('La respuesta que estás escribiendo no está guardada. ¿Dejarla igual?');
  }

  function htmlPedido(p){
    const e = ESTADOS[p.estado] || ESTADOS.recibido;
    const carrera = CARRERAS_APP.filter(c => c.id === p.carrera)[0];
    const horas = Math.floor((Date.now() - Date.parse(p.creado_at)) / 3600000);
    /* Pasadas las 36 horas se dice en voz alta: faltan doce para la
       meta, y es el último momento en que todavía se llega. */
    const apurado = p.estado === 'recibido' && horas >= 36;

    return `
      <article class="modulo" id="pedido-${p.id}">
        <div class="modulo-cabeza">
          <span class="espacio-estado${p.estado === 'resuelto' ? ' abierto' : ''}">${esc(e.texto)}</span>
          <span class="modulo-numero">${esc(hace(p.creado_at))}</span>
        </div>
        <p>${escMulti(p.texto)}</p>
        <p class="letra-chica">
          ${esc(nombreCategoria[p.categoria] || p.categoria)}${carrera ? ' · ' + esc(carrera.corto) : ''}
          · ${p.publicado ? '<strong>publicado en el tablero</strong>' : 'sin publicar'}${
          /* El aviso al autor es la sesión 4, que todavía no está: que
             nadie crea que ya le llegó. */
          p.pidio_aviso ? ' · pidió aviso al celular (todavía no sale solo)' : ''}
        </p>
        ${apurado ? `<p class="letra-chica"><strong>Lleva ${horas} horas sin respuesta.</strong>
          La meta son 48.</p>` : ''}
        ${p.respuesta && abierto !== p.id
          ? `<div class="aviso ok"><strong>Respuesta:</strong> ${escMulti(p.respuesta)}</div>` : ''}
        ${abierto === p.id ? htmlEditor(p) : `
          <div class="chips" style="margin-top:10px">
            <button type="button" class="chip" data-contestar="${p.id}">${
              p.estado === 'recibido' ? 'Contestar' : 'Cambiar'}</button>
          </div>`}
      </article>`;
  }

  function htmlEditor(p){
    const n = p.id;
    return `
      <div style="margin-top:14px">
        <h3>¿En qué quedó?</h3>
        <div class="chips elegir-uno" role="group" aria-label="En qué quedó el pedido">
          ${['en_gestion', 'resuelto', 'descartado'].map(e => `
            <button type="button" class="chip" data-estado="${e}" aria-pressed="${p.estado === e}">${
              e === 'descartado' ? 'Descartar' : esc(ESTADOS[e].texto)}</button>`).join('')}
        </div>
        <p class="letra-chica" id="significa-${n}"></p>

        <h3 style="margin-top:16px">La respuesta</h3>
        <p class="letra-chica" style="margin-top:0">Tocá una ya escrita para empezar, y cambiala a gusto.</p>
        <div class="chips" style="margin-top:8px">
          ${RESPUESTAS.map((r, i) => `
            <button type="button" class="chip" data-ya="${i}">${esc(r.nombre)}</button>`).join('')}
        </div>
        <div class="campo" style="margin-top:10px">
          <label for="respuesta-${n}">Sale con el pedido, como respuesta del CEFTS</label>
          <textarea id="respuesta-${n}" maxlength="1000"
                    style="min-height:110px">${esc(p.respuesta || '')}</textarea>
        </div>

        <div class="campo">
          <label for="publicar-${n}" style="text-transform:none;letter-spacing:0">
            <input type="checkbox" id="publicar-${n}" style="width:auto;margin-right:8px"${
              p.publicado ? ' checked' : ''}>
            Publicarlo en el tablero de Decilo
          </label>
          <p class="letra-chica">Sale el texto tal cual lo escribieron. Si nombra a alguien o
            trae algo que no puede salir, descartalo: el texto no se edita.</p>
        </div>

        <div id="msj-${n}"></div>
        <button type="button" class="boton ancho" data-guardar>Guardar</button>
        <button type="button" class="boton ancho borde" data-cancelar
                style="margin-top:10px">Cancelar</button>
      </div>`;
  }

  function engancharEditor(p){
    if (!p) return;
    const caja     = document.getElementById('pedido-' + p.id);
    const texto    = document.getElementById('respuesta-' + p.id);
    const publicar = document.getElementById('publicar-' + p.id);
    const significa= document.getElementById('significa-' + p.id);
    const guardar  = caja.querySelector('[data-guardar]');
    /* «Sin contestar» no se ofrece: la base no deja volver ahí. */
    let estado = p.estado === 'recibido' ? null : p.estado;
    /* Lo que tenía «publicar» antes de pasar por Descartar. Sin esto,
       tocar Descartar sin querer y después otro estado dejaba el tilde
       apagado, y un pedido publicado salía del tablero con un
       «Guardado.» y nada más. */
    let publicarAntes = publicar.checked;

    function acomodar(){
      caja.querySelectorAll('[data-estado]').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.estado === estado)));
      significa.textContent = estado ? QUE_SIGNIFICA[estado] : '';
      /* Descartado y publicado no van juntos: lo frena la base, y acá
         se ve antes de apretar. */
      if (estado === 'descartado'){
        if (!publicar.disabled) publicarAntes = publicar.checked;
        publicar.checked = false;
      } else if (publicar.disabled){
        publicar.checked = publicarAntes;
      }
      publicar.disabled = estado === 'descartado';
      guardar.textContent = publicar.checked ? 'Guardar y publicar' : 'Guardar';
    }

    caja.querySelectorAll('[data-estado]').forEach(b => {
      b.onclick = () => { estado = b.dataset.estado; acomodar(); };
    });
    caja.querySelectorAll('[data-ya]').forEach(b => {
      b.onclick = () => {
        const r = RESPUESTAS[Number(b.dataset.ya)];
        /* Pisar sin preguntar algo escrito a mano es perderlo. */
        const hay = texto.value.trim();
        if (hay && hay !== r.texto &&
            !confirm('¿Reemplazar lo que está escrito por «' + r.nombre + '»?')) return;
        texto.value = r.texto;
        /* La respuesta sugiere un estado, pero no le gana al que ya se
           eligió a mano. */
        if (!estado) estado = r.estado;
        acomodar();
        /* Si trae corchetes, queda marcado lo que hay que completar. */
        texto.focus();
        const i = r.texto.indexOf('[');
        if (i >= 0) texto.setSelectionRange(i, r.texto.indexOf(']', i) + 1);
      };
    });
    publicar.onchange = acomodar;
    caja.querySelector('[data-cancelar]').onclick = () => { abierto = null; pintarBandeja(); };
    guardar.onclick = () => guardarPedido(p, estado, texto.value.trim(), publicar.checked, guardar);
    acomodar();
  }

  async function guardarPedido(p, estado, respuesta, publicado, boton){
    const msj = document.getElementById('msj-' + p.id);
    const falla = t => { msj.innerHTML = `<div class="aviso error">${t}</div>`; };

    if (!estado) return falla('Elegí en qué quedó: en gestión, resuelto o descartar.');
    if (/\[[^\]]*\]/.test(respuesta))
      return falla('Quedó algo entre corchetes para completar. Así como está, se publicaría tal cual.');

    const cambios = { estado, respuesta: respuesta || null,
                      publicado: estado === 'descartado' ? false : publicado };
    const rotulo = boton.textContent;
    boton.disabled = true; boton.textContent = 'Guardando…';

    /* Con `select` para saber si cambió una fila: sin permiso, la base
       no da error, dice «listo» y no toca nada. */
    const { data, error } = await db.from('buzon_pedidos')
      .update(cambios).eq('id', p.id).select('id');

    if (error || !(data || []).length){
      boton.disabled = false; boton.textContent = rotulo;
      const permiso = !error || /row-level security|permission denied|42501/i.test(error.message || '');
      return falla(permiso
        ? 'Tu cuenta no tiene permiso para moderar el buzón. Pedile a alguien del equipo que te lo dé.'
        : 'No se pudo guardar: ' + esc(error.message));
    }

    abierto = null;
    await traerPedidos();
    const aviso = document.getElementById('msj-buzon');
    if (aviso) aviso.innerHTML = `<div class="aviso ok">${cambios.publicado
      ? 'Guardado. Ya se ve en el tablero de <a href="../decilo/">Decilo</a>.'
      : 'Guardado.'}</div>`;
  }

  /* ------------------------------------------------------------
     LO QUE LLEGÓ POR «COMPARTIR» (7/10/2026)

     Hace lo mismo que si se hubiera pegado el mensaje o subido la
     placa a mano. Se borra apenas se lee: volver a esta pantalla más
     tarde no tiene que traer de nuevo lo de hoy.
     ------------------------------------------------------------ */
  async function recibirCompartido(){
    const c = await leerCompartido();
    limpiarDireccionCompartido();
    if (!c) return;
    await olvidarCompartido();
    const pegado = document.getElementById('pegado');
    if (!pegado) return;
    if (c.texto) pegado.value = c.texto;
    if (c.placa){ desdeLaPlaca(c.placa); return; }

    /* Instagram y casi todas las redes comparten solo el link, y de un
       link solo no se lee nada (ver la nota de Instagram en la
       BITACORA). Se dice qué hacer en vez de mostrar «no me di cuenta». */
    if (/https?:\/\//.test(c.texto) && !c.texto.replace(/https?:\/\/\S+/g, '').trim()){
      pegado.value = '';
      document.getElementById('msj-pegado').innerHTML =
        '<div class="aviso error">Me llegó solo el link del posteo, y de un link no puedo ' +
        'leer nada. Abrí el posteo, sacale una captura a la placa y compartí la captura. ' +
        'O copiá el texto del posteo y pegalo acá.</div>';
      return;
    }
    desdeElMensaje(c.texto, null);
  }

  if (new URLSearchParams(location.search).get('ver') === 'buzon') bandeja();
  else {
    paso1();
    if ((window.vinoCompartido && vinoCompartido())) recibirCompartido();
  }
})();
</script>
</body>
</html>
