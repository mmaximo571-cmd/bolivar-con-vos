<script>window.RAIZ = './';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function inicio(){

  /* ============================================================
     LAS TRES ETAPAS DE LA APERTURA

     1. La animación: se ve una vez por visita. Si volvés desde
        Trámites, no la ves de nuevo (por eso sessionStorage).
     2. La bienvenida: solo la primerísima vez, nunca más
        (por eso localStorage).
     3. La app.

     Mientras tanto los datos ya se están pidiendo, así que cuando
     la animación termina la pantalla suele estar lista.
     ============================================================ */
  const LLAVE_BIENVENIDA = 'bolivar-bienvenida-vista';
  const LLAVE_APERTURA   = 'bolivar-apertura-vista';

  const capaApertura   = document.getElementById('apertura');
  const capaBienvenida = document.getElementById('bienvenida');
  const capaApp        = document.getElementById('app');

  function guardado(almacen, llave){
    try { return almacen.getItem(llave); } catch(e){ return null; }
  }
  function guardar(almacen, llave){
    try { almacen.setItem(llave, '1'); } catch(e){ /* modo incógnito */ }
  }

  function mostrarApp(){
    capaBienvenida.hidden = true;
    capaApp.hidden = false;
    /* Recién acá aparece la barra de abajo, así que recién acá le
       devolvemos al body el hueco que esa barra necesita. */
    document.body.classList.remove('antes-de-entrar');
    if (!document.querySelector('.nav-abajo')) pintarNav('inicio');
  }

  function mostrarBienvenida(){
    capaBienvenida.hidden = false;
    document.getElementById('btn-entrar').addEventListener('click', () => {
      guardar(localStorage, LLAVE_BIENVENIDA);
      mostrarApp();
    });
    /* El que ya tiene cuenta también vio la bienvenida: no se la
       mostramos otra vez cuando vuelva. */
    document.getElementById('btn-cuenta').addEventListener('click', () => {
      guardar(localStorage, LLAVE_BIENVENIDA);
    });
  }

  function seguirDespuesDeLaApertura(){
    if (guardado(localStorage, LLAVE_BIENVENIDA)) mostrarApp();
    else mostrarBienvenida();
  }

  /* ============================================================
     LA APERTURA: el logo animado de la Agrupación

     Viene del proyecto de Claude Design «Animación logo Simón Bolívar».
     Allá la animación dura 8,8 segundos y va en loop, porque está
     pensada como pieza de video. Acá es la puerta de entrada a la app,
     así que se reproduce UNA vez y comprimida.

     La coreografía es exactamente la del diseño. Para que quede fiel,
     el reloj interno sigue contando en los 8,8 segundos originales y lo
     único que cambia es a qué velocidad avanza. Así que si querés que
     dure más o menos, tocá SOLO esta línea:
     ============================================================ */
  const DURACION_APERTURA = 2.6;   // segundos que dura en la app

  const TOTAL_ORIGINAL = 8.8;
  /* Cada escena empieza donde termina la anterior (3 + 2,2 + 2,6 + 1) */
  const CUE = { tinta:0, palabras:3, respiro:5.2, salida:7.8 };

  /* Las curvas de movimiento del diseño original */
  const suaveFinal  = t => 1 - Math.pow(1 - t, 3);          // easeOutCubic
  const suaveAmbos  = t => -(Math.cos(Math.PI * t) - 1) / 2; // easeInOutSine
  const suaveCuad   = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

  const topar = (v, a, b) => Math.min(b, Math.max(a, v));

  /* Interpola de "desde" a "hasta" entre dos momentos del guión */
  function tramo(desde, hasta, arranca, termina, curva){
    return t => {
      if (t <= arranca) return desde;
      if (t >= termina) return hasta;
      return desde + (hasta - desde) * curva((t - arranca) / (termina - arranca));
    };
  }

  /* Las máscaras: una franja que barre y va destapando la capa */
  const mascaraMapa = p =>
    `linear-gradient(to bottom, #000 0%, #000 ${p*100 - 3}%,` +
    ` rgba(0,0,0,0) ${p*100 + 3}%, rgba(0,0,0,0) 100%)`;
  const mascaraPalabra = p =>
    `linear-gradient(to right, #000 0%, #000 ${p*100 - 6}%,` +
    ` rgba(0,0,0,0) ${p*100 + 6}%, rgba(0,0,0,0) 100%)`;

  function pintarCuadro(T, escena, capas){
    const dibujo = tramo(0, 1, CUE.tinta + 0.3, CUE.tinta + 2.5, suaveAmbos)(T);
    ponerMascara(capas.mapa, mascaraMapa(dibujo));

    /* SIMÓN entra primero, BOLÍVAR un poco después */
    const p1 = tramo(0, 1, CUE.palabras - 0.2,  CUE.palabras + 1.0,  suaveFinal)(T);
    const p2 = tramo(0, 1, CUE.palabras + 0.35, CUE.palabras + 1.55, suaveFinal)(T);
    [[capas.simon, p1], [capas.bolivar, p2]].forEach(([capa, p]) => {
      ponerMascara(capa, mascaraPalabra(p));
      capa.style.transform = `translateX(${-(1 - p) * 26}px)`;
    });

    /* El logo se asienta y después respira */
    const asiento  = tramo(1.035, 1, CUE.tinta, CUE.palabras + 1.2, suaveFinal)(T);
    const respiro  = 1 + 0.005 * Math.sin((T - CUE.respiro) * 1.15);
    const salida   = tramo(0, 1, CUE.salida + 0.1, CUE.salida + 0.85, suaveCuad)(T);

    escena.style.transform = `scale(${escala() * asiento * respiro * (1 + 0.05 * salida)})`;
    escena.style.opacity   = 1 - salida;

    /* El destello de luz que cruza la marca */
    const destelloX = tramo(-60, 160, CUE.respiro + 0.2, CUE.respiro + 1.9, suaveCuad)(T);
    capas.destello.style.left = destelloX + '%';
    capas.destello.style.opacity =
      topar(Math.sin(Math.PI * topar((T - CUE.respiro - 0.2) / 1.7, 0, 1)), 0, 1) * 0.55;
  }

  function ponerMascara(el, valor){
    el.style.webkitMaskImage = valor;
    el.style.maskImage = valor;
  }

  /* La tinta del dibujo ocupa 805x664 dentro del lienzo de 1080x1350.
     Si el navegador todavía no sabe cuánto mide la ventana devuelve 0, y
     entonces el logo quedaría en tamaño cero: por eso el piso. */
  function escala(){
    const an = innerWidth  || document.documentElement.clientWidth  || 360;
    const al = innerHeight || document.documentElement.clientHeight || 640;
    return Math.max(0.05, Math.min((an * 0.78) / 805, (al * 0.66) / 664));
  }

  (function apertura(){
    /* Si ya la vio en esta visita, no la repetimos */
    if (guardado(sessionStorage, LLAVE_APERTURA)){
      capaApertura.remove();
      seguirDespuesDeLaApertura();
      return;
    }
    guardar(sessionStorage, LLAVE_APERTURA);

    const escena = document.getElementById('marca-escena');
    const capas = {
      mapa:     document.getElementById('capa-mapa'),
      simon:    document.getElementById('capa-simon'),
      bolivar:  document.getElementById('capa-bolivar'),
      destello: document.getElementById('destello')
    };

    let terminada = false;
    function cerrar(){
      if (terminada) return;
      terminada = true;
      capaApertura.classList.add('yendose');
      setTimeout(() => capaApertura.remove(), 380);
      seguirDespuesDeLaApertura();
    }

    /* Se puede saltear tocando la pantalla: nadie tiene que esperar */
    capaApertura.addEventListener('click', cerrar);

    /* Red de seguridad. El navegador congela requestAnimationFrame cuando
       la pestaña no está a la vista, así que si alguien abre la app en una
       pestaña de fondo la animación se pausa a mitad de camino. Sin esto,
       al volver se encontraría la apertura colgada y la app inalcanzable. */
    setTimeout(cerrar, DURACION_APERTURA * 1000 + 2600);

    const sinMovimiento = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (sinMovimiento){
      /* Sin animación: mostramos el logo ya armado y seguimos */
      pintarCuadro(CUE.respiro + 0.9, escena, capas);
      setTimeout(cerrar, 700);
      return;
    }

    /* Las tres capas tienen que estar cargadas antes de empezar, si no
       la animación arranca con la pantalla vacía. Pero nadie espera para
       siempre: si tardan, se entra igual a la app. */
    const imagenes = [capas.mapa, capas.simon, capas.bolivar]
      .map(c => c.querySelector('img'));

    const listas = Promise.all(imagenes.map(img => img.complete
      ? Promise.resolve()
      : new Promise(res => { img.onload = res; img.onerror = res; })));

    const seCansoDeEsperar = new Promise(res => setTimeout(res, 1800));

    /* Antes de que carguen no se ve nada más que el amarillo */
    escena.style.opacity = 0;

    Promise.race([listas, seCansoDeEsperar]).then(() => {
      if (terminada) return;
      if (!imagenes.every(i => i.complete && i.naturalWidth)){ cerrar(); return; }

      escena.style.opacity = 1;
      const arranque = performance.now();

      (function cuadro(ahora){
        if (terminada) return;
        const transcurrido = (ahora - arranque) / 1000;
        const T = (transcurrido / DURACION_APERTURA) * TOTAL_ORIGINAL;
        pintarCuadro(Math.min(T, TOTAL_ORIGINAL), escena, capas);
        if (transcurrido >= DURACION_APERTURA) cerrar();
        else requestAnimationFrame(cuadro);
      })(arranque);
    });
  })();

  document.getElementById('cabecera').innerHTML = htmlCabecera(
    '<a class="boton-cabecera" href="mi/">Mi cuenta</a>'
  );
  document.getElementById('pie').innerHTML = htmlPie();

  /* ---------- Traemos todo de una sola vez ---------- */
  let categorias = [], tramites = [], preguntas = [], publicaciones = [];

  try {
    const [rCat, rTra, rFaq, rPub] = await Promise.all([
      db.from('categorias').select('*').order('orden'),
      db.from('tramites').select('id,titulo,resumen,categoria_id,palabras_clave')
        .eq('publicado', true).order('orden'),
      db.from('faq').select('id,pregunta,respuesta,categoria_id')
        .eq('publicado', true).order('orden'),
      db.from('publicaciones').select('*').eq('publicado', true)
        .order('creado_at', { ascending:false })
    ]);
    for (const r of [rCat, rTra, rFaq, rPub]) if (r.error) throw r.error;
    categorias = rCat.data; tramites = rTra.data;
    preguntas = rFaq.data;  publicaciones = rPub.data;
  } catch (e) {
    mostrarError(document.getElementById('zona-normal'), e, 'cargar la información');
    return;
  }

  /* ---------- Tarjeta grande: cómo venís con la carrera ----------
     El organizador deja acá un resumen chiquito cuando lo usás, así
     esta pantalla no necesita cargar los tres planes de estudio. */
  (function pintarTarjetaCarrera(){
    const caja = document.getElementById('tarjeta-carrera');
    let resumen = null;
    try { resumen = JSON.parse(localStorage.getItem('bolivar-carrera-resumen')); } catch(e){}

    if (!resumen || !resumen.total){
      caja.innerHTML = `
        <span class="rotulo">Organizador de cursadas</span>
        <span class="nombre">Armá tu año que viene</span>
        <p style="margin:0;font-size:14.5px;line-height:1.35;max-width:30ch">
          Marcá las materias que ya hiciste y mirá cuáles podés cursar
          y cuáles podés promocionar.</p>`;
      return;
    }

    const pct = Math.round(resumen.aprobadas / resumen.total * 100);
    caja.innerHTML = `
      <span class="rotulo">Mi carrera</span>
      <span class="nombre">${esc(resumen.carrera)}</span>
      <div class="barra"><div class="barra-llena" style="width:${pct}%"></div></div>
      <div class="cifra">
        <span><strong>${resumen.aprobadas}</strong> de ${resumen.total} materias</span>
        <span>${pct}%</span>
      </div>`;
  })();

  /* ---------- Recuadros ---------- */
  (function pintarRecuadros(){
    const hoy = hoyISO();
    const proxima = publicaciones
      .filter(p => p.fecha_desde && (p.fecha_hasta || p.fecha_desde) >= hoy)
      .sort((a,b) => a.fecha_desde.localeCompare(b.fecha_desde))[0];

    const cuantosTramites = tramites.length;
    const f = proxima ? partesFecha(proxima.fecha_desde) : null;

    document.getElementById('recuadros').innerHTML = `
      <a class="recuadro" href="agenda/">
        <span class="rotulo">Próxima fecha</span>
        ${f ? `<span class="grande">${f.dia} ${esc(f.mesCorto)}</span>
               <span class="pie-recuadro">${esc(proxima.titulo)}</span>`
            : `<span class="detalle" style="margin-top:6px">
                 No hay fechas cargadas por ahora.</span>`}
      </a>
      <a class="recuadro" href="tramites/">
        <span class="rotulo">Trámites</span>
        <span class="grande">${cuantosTramites}</span>
        <span class="pie-recuadro">${cuantosTramites === 1
          ? 'ficha explicada paso a paso' : 'fichas explicadas paso a paso'}</span>
      </a>`;
  })();

  /* ---------- Categorías, agrupadas en las dos puertas ---------- */
  (function pintarCategorias(){
    const caja = document.getElementById('categorias');
    if (!categorias.length){
      caja.innerHTML = '<div class="vacio">Todavía no hay categorías cargadas.</div>';
      return;
    }

    /* Solo mostramos las categorías que tengan algo publicado adentro:
       una categoría vacía es una puerta que no lleva a ningún lado. */
    const conContenido = categorias.filter(c =>
      tramites.some(t => t.categoria_id === c.id) ||
      preguntas.some(p => p.categoria_id === c.id));

    if (!conContenido.length){
      caja.innerHTML = `<div class="vacio">
          Todavía no hay contenido publicado.<br>Volvé en unos días.</div>`;
      return;
    }

    caja.innerHTML = Object.keys(NOMBRE_SECCION).map(seccion => {
      const suyas = conContenido.filter(c => (c.seccion || 'carrera') === seccion);
      if (!suyas.length) return '';

      return `<div class="titulo-seccion">${esc(NOMBRE_SECCION[seccion].toUpperCase())}
          <a href="tramites/?seccion=${seccion}">Ver todo</a></div>
        <div class="rejilla-categorias">` +
        suyas.map(c => {
          const cuantos = tramites.filter(t => t.categoria_id === c.id).length +
                          preguntas.filter(p => p.categoria_id === c.id).length;
          return `<a class="tarjeta-categoria" href="tramites/?categoria=${c.id}">
              <span class="emoji">${esc(c.emoji)}</span>
              <span class="nombre">${esc(c.nombre)}</span>
              <span class="cuenta">${cuantos} ${cuantos === 1 ? 'ficha' : 'fichas'}</span>
            </a>`;
        }).join('') + `</div>`;
    }).join('');
  })();

  /* ---------- Lo que se viene ---------- */
  (function pintarProximas(){
    const caja = document.getElementById('proximas');
    const hoy = hoyISO();
    const proximas = publicaciones
      .filter(p => p.fecha_desde && (p.fecha_hasta || p.fecha_desde) >= hoy)
      .sort((a,b) => a.fecha_desde.localeCompare(b.fecha_desde))
      .slice(0, 4);

    if (!proximas.length){
      caja.innerHTML = '<div class="vacio">No hay fechas cargadas por ahora.</div>';
      return;
    }
    caja.innerHTML = proximas.map(p => {
      const f = partesFecha(p.fecha_desde);
      return `<a class="tarjeta ${esc(p.linea)}" href="agenda/?id=${p.id}">
          <div class="tarjeta-fecha">
            <div class="cubo-fecha">
              <span class="dia">${f.dia}</span><span class="mes">${f.mesCorto}</span>
            </div>
            <div>
              <span class="etiqueta ${esc(p.linea)}">${esc(NOMBRE_LINEA[p.linea] || p.linea)}</span>
              <h3>${esc(p.titulo)}</h3>
              <p>${esc(rangoLindo(p.fecha_desde, p.fecha_hasta))}${p.hora ? ' · ' + esc(p.hora) : ''}${p.lugar ? ' · ' + esc(p.lugar) : ''}</p>
            </div>
          </div>
        </a>`;
    }).join('');
  })();

  /* ---------- Novedades ---------- */
  (function pintarNovedades(){
    const caja = document.getElementById('novedades');
    const novedades = publicaciones.filter(p => p.tipo === 'novedad').slice(0, 3);
    if (!novedades.length){
      caja.innerHTML = '<div class="vacio">Todavía no hay novedades publicadas.</div>';
      return;
    }
    caja.innerHTML = novedades.map(p => `
        <a class="tarjeta ${esc(p.linea)}" href="agenda/?id=${p.id}">
          <span class="etiqueta ${esc(p.linea)}">${esc(NOMBRE_LINEA[p.linea] || p.linea)}</span>
          <h3>${esc(p.titulo)}</h3>
          ${p.cuerpo ? `<p>${esc(p.cuerpo.slice(0,140))}${p.cuerpo.length > 140 ? '…' : ''}</p>` : ''}
        </a>`).join('');
  })();

  /* ---------- Buscador ---------- */
  const entrada    = document.getElementById('busqueda');
  const zonaRes    = document.getElementById('zona-resultados');
  const zonaNormal = document.getElementById('zona-normal');
  const listaRes   = document.getElementById('resultados');
  const tituloRes  = document.getElementById('titulo-resultados');

  entrada.addEventListener('input', function(){
    const q = normalizar(entrada.value.trim());

    if (q.length < 2){
      zonaRes.hidden = true;
      zonaNormal.hidden = false;
      return;
    }
    zonaRes.hidden = false;
    zonaNormal.hidden = true;

    const tHit = tramites.filter(t =>
      normalizar(t.titulo + ' ' + (t.resumen || '') + ' ' + (t.palabras_clave || '')).includes(q));
    const fHit = preguntas.filter(p =>
      normalizar(p.pregunta + ' ' + p.respuesta).includes(q));

    const total = tHit.length + fHit.length;
    tituloRes.textContent = total
      ? `${total} ${total === 1 ? 'RESULTADO' : 'RESULTADOS'}`
      : 'SIN RESULTADOS';

    if (!total){
      listaRes.innerHTML = `<div class="vacio">
          No encontramos nada con «${esc(entrada.value.trim())}».<br>
          Probá con otra palabra, o escribinos por Instagram y lo resolvemos a mano.
        </div>`;
      return;
    }

    listaRes.innerHTML =
      tHit.map(t => `
        <a class="tarjeta" href="tramites/?id=${t.id}">
          <h3>${esc(t.titulo)}</h3>
          ${t.resumen ? `<p>${esc(t.resumen)}</p>` : ''}
          <div class="meta"><span>Trámite</span></div>
        </a>`).join('') +
      fHit.map(p => `
        <a class="tarjeta" href="tramites/?faq=${p.id}">
          <h3>${esc(p.pregunta)}</h3>
          <p>${esc(p.respuesta.slice(0,140))}${p.respuesta.length > 140 ? '…' : ''}</p>
          <div class="meta"><span>Pregunta frecuente</span></div>
        </a>`).join('');
  });

})();
</script>
</body>
</html>
