<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil · La Bolívar con vos</title>
<meta name="theme-color" content="#F9E830">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Iconos de la app: pestana, Google, y pantalla de inicio del celular -->
<link rel="icon" type="image/png" sizes="32x32" href="../imagenes/icono-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../imagenes/icono-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="../imagenes/icono-192.png">
<link rel="apple-touch-icon" href="../imagenes/icono-apple.png">
<link rel="manifest" href="../manifest.json">

<!-- Como se ve cuando alguien comparte el link por WhatsApp o Instagram -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Bolivar con vos">
<meta property="og:title" content="Perfil · La Bolívar con vos">
<meta property="og:description" content="">
<meta property="og:image" content="https://bolivar-con-vos.vercel.app/imagenes/compartir.png">
<meta name="twitter:card" content="summary_large_image">

<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
</head>
<body>

<div id="cabecera"></div>
<main class="envoltura" id="contenido" tabindex="-1">
  <div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea media"></div></div><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea corta"></div></div>
</main>
<div id="pie"></div>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno.
     Versión 2.112.4, congelada. Antes se bajaba de cdn.jsdelivr.net en
     cada visita: si esa descarga fallaba, la app quedaba en «Cargando…». -->
<script src="../lib/supabase.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<script>
(async function pantallaMiCuenta(){

  document.getElementById('cabecera').innerHTML = htmlCabecera();
  document.getElementById('pie').innerHTML = htmlPie();
  pintarNav('mi');

  const contenido = document.getElementById('contenido');

  /* Cuando volvés desde el correo de recuperación, Supabase deja el
     enlace con type=recovery y abre una sesión temporal. Hay que
     mirarlo ANTES de decidir qué pantalla mostrar: si no, se ve
     «Hola, Máximo» y la persona nunca llega a cambiar la contraseña. */
  function vieneDeRecuperar(){
    const h = location.hash || '';
    const b = location.search || '';
    return /type=recovery/.test(h) || /type=recovery/.test(b);
  }
  let recuperando = vieneDeRecuperar();

  async function refrescar(){
    const { usuario, perfil } = await sesionActual();
    if (recuperando && usuario) return pedirClaveNueva(usuario);
    if (usuario) pintarAdentro(usuario, perfil);
    else         pintarAfuera();
  }

  /* ============================================================
     ELEGIR UNA CONTRASEÑA NUEVA
     ============================================================ */
  function pedirClaveNueva(usuario){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">CONTRASEÑA NUEVA</h1>
      <p class="bajada">Entraste con el enlace que te mandamos a
        <strong>${esc(usuario.email)}</strong>. Elegí una contraseña nueva
        y ya quedás adentro.</p>

      <div class="ficha">
        <div class="campo">
          <label for="clave-nueva">Contraseña nueva</label>
          <input id="clave-nueva" type="password" autocomplete="new-password"
                 minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="boton ancho" id="guardar-clave">Guardar la contraseña</button>
        <div id="mensaje"></div>
      </div>`;

    const campo   = document.getElementById('clave-nueva');
    const mensaje = document.getElementById('mensaje');
    campo.focus();

    document.getElementById('guardar-clave').onclick = async function(){
      const clave = campo.value;
      if (!clave || clave.length < 6){
        mensaje.innerHTML = `<div class="aviso error">
            La contraseña tiene que tener al menos 6 caracteres.</div>`;
        campo.focus();
        return;
      }
      this.disabled = true; this.textContent = 'Guardando…';
      const { error } = await db.auth.updateUser({ password: clave });
      if (error){
        this.disabled = false; this.textContent = 'Guardar la contraseña';
        mensaje.innerHTML = `<div class="aviso error">No se pudo guardar: ${esc(error.message)}</div>`;
        return;
      }
      /* Se limpia el enlace de la dirección: si queda, al recargar
         vuelve a pedir contraseña nueva. */
      recuperando = false;
      history.replaceState(null, '', location.pathname);
      refrescar();
    };
  }

  /* ============================================================
     SIN CUENTA · entrar o registrarse
     ============================================================ */
  function pintarAfuera(){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">MI PERFIL</h1>
      <p class="bajada">
        La app funciona entera sin cuenta. Registrate solo si querés
        <strong>guardar trámites</strong> para encontrarlos rápido después.
      </p>

      <div class="chips" style="margin-bottom:4px">
        <button class="chip" id="tab-entrar" aria-pressed="true">Ya tengo cuenta</button>
        <button class="chip" id="tab-crear"  aria-pressed="false">Crear una cuenta</button>
      </div>

      <div class="ficha">
        <form id="formulario">
          <div class="campo" id="campo-nombre" hidden>
            <label for="nombre">Tu nombre</label>
            <input id="nombre" type="text" autocomplete="name" placeholder="Cómo te llamamos">
          </div>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" autocomplete="email" required placeholder="vos@ejemplo.com">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input id="clave" type="password" autocomplete="current-password" required
                   minlength="6" placeholder="Mínimo 6 caracteres">
          </div>
          <button class="boton ancho" type="submit" id="enviar">Entrar</button>
        </form>
        <button class="boton texto ancho" id="olvide">Me olvidé la contraseña</button>
        <div id="mensaje"></div>
      </div>

      <p style="color:var(--texto-suave);font-size:13px;margin-top:16px">
        Guardamos solo tu correo y los trámites que marques. Nada más.
      </p>`;

    let modo = 'entrar';
    const tabEntrar = document.getElementById('tab-entrar');
    const tabCrear  = document.getElementById('tab-crear');
    const campoNom  = document.getElementById('campo-nombre');
    const boton     = document.getElementById('enviar');
    const mensaje   = document.getElementById('mensaje');

    function cambiarModo(nuevo){
      modo = nuevo;
      tabEntrar.setAttribute('aria-pressed', modo === 'entrar');
      tabCrear .setAttribute('aria-pressed', modo === 'crear');
      campoNom.hidden = (modo !== 'crear');
      boton.textContent = (modo === 'crear') ? 'Crear mi cuenta' : 'Entrar';
      document.getElementById('clave').autocomplete =
        (modo === 'crear') ? 'new-password' : 'current-password';
      mensaje.innerHTML = '';
    }
    tabEntrar.onclick = () => cambiarModo('entrar');
    tabCrear .onclick = () => cambiarModo('crear');

    /* ---------- Me olvidé la contraseña ----------
       Manda un correo con un enlace. Al volver por ese enlace, Supabase
       deja una sesión de recuperación y la app pide la contraseña nueva
       (más abajo, en pedirClaveNueva). */
    document.getElementById('olvide').onclick = async function(){
      const correo = document.getElementById('correo').value.trim();
      if (!correo){
        mensaje.innerHTML = `<div class="aviso error">
            Escribí tu correo arriba y volvé a tocar acá: ahí te mandamos el enlace.
          </div>`;
        document.getElementById('correo').focus();
        return;
      }
      this.disabled = true; this.textContent = 'Mandando…';
      const { error } = await db.auth.resetPasswordForEmail(correo, {
        redirectTo: location.origin + RAIZ + 'mi/'
      });
      this.disabled = false; this.textContent = 'Me olvidé la contraseña';

      if (error){
        mensaje.innerHTML = `<div class="aviso error">${esc(
          /rate limit|only request this after/i.test(error.message)
            ? 'Se mandaron muchos correos seguidos. Esperá unos minutos.'
            : 'No se pudo mandar el correo: ' + error.message)}</div>`;
        return;
      }
      /* Se contesta lo mismo exista o no la cuenta: si dijéramos "ese
         correo no está registrado", cualquiera podría averiguar quién
         tiene cuenta probando direcciones. */
      mensaje.innerHTML = `<div class="aviso ok">
          Si ese correo tiene una cuenta, le mandamos un enlace a
          <strong>${esc(correo)}</strong>. Abrilo desde este mismo teléfono
          y vas a poder elegir una contraseña nueva.<br>
          <small>Fijate también en el correo no deseado.</small>
        </div>`;
    };

    document.getElementById('formulario').addEventListener('submit', async function(ev){
      ev.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const clave  = document.getElementById('clave').value;
      const nombre = document.getElementById('nombre').value.trim();

      boton.disabled = true;
      boton.textContent = 'Un segundo…';
      mensaje.innerHTML = '';

      const { data, error } = (modo === 'crear')
        ? await db.auth.signUp({ email:correo, password:clave, options:{ data:{ nombre } } })
        : await db.auth.signInWithPassword({ email:correo, password:clave });

      boton.disabled = false;
      cambiarModo(modo);

      if (error){
        const traduccion = {
          'Invalid login credentials': 'El correo o la contraseña no coinciden.',
          'Email not confirmed':       'Tenés que confirmar tu correo antes de entrar. Fijate en tu casilla.',
          'User already registered':   'Ese correo ya tiene cuenta. Probá con «Ya tengo cuenta».',
          'Signups not allowed for this instance':
            'El registro de cuentas nuevas está cerrado por ahora.'
        }[error.message]
        /* Los que vienen con un número adentro no se pueden poner en una
           lista fija, así que se reconocen por lo que dicen. Sin esto, el
           estudiante ve el error en inglés y no entiende qué hacer. */
        || (/logins are disabled|signups are disabled/i.test(error.message)
              ? 'Las cuentas están desactivadas por ahora. La app funciona igual sin cuenta.' : '')
        || (/at least \d+ characters/i.test(error.message)
              ? 'La contraseña tiene que tener al menos 6 caracteres.' : '')
        || (/rate limit|too many requests|only request this after/i.test(error.message)
              ? 'Probamos muchas veces seguidas. Esperá unos minutos y volvé a intentar.' : '')
        || (/unable to validate email|invalid format/i.test(error.message)
              ? 'Ese correo no parece estar bien escrito.' : '')
        || error.message;
        mensaje.innerHTML = `<div class="aviso error">${esc(traduccion)}</div>`;
        return;
      }

      if (modo === 'crear' && data.user && !data.session){
        mensaje.innerHTML = `<div class="aviso ok">
            Listo. Te mandamos un correo a <strong>${esc(correo)}</strong> para confirmar la cuenta.
            Abrilo y después volvé acá.</div>`;
        return;
      }
      refrescar();
    });
  }

  /* ============================================================
     CON CUENTA
     ============================================================ */
  async function pintarAdentro(usuario, perfil){
    const nombre = (perfil && perfil.nombre) || usuario.email;

    contenido.innerHTML = `
      <h1 class="titulo-pantalla">HOLA${perfil && perfil.nombre ? ', ' + esc(perfil.nombre.split(' ')[0]).toUpperCase() : ''}</h1>
      <p class="bajada">${esc(usuario.email)}</p>

      ${esDelEquipo(perfil) ? `
        <a class="boton ancho oscuro" href="../panel/" style="margin-bottom:14px">
          🛠 Panel de la agrupación</a>` : ''}

      <div class="titulo-seccion">TRÁMITES GUARDADOS</div>
      <div class="lista" id="guardados"><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea media"></div></div><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea corta"></div></div></div>

      <button class="boton ancho borde" id="salir" style="margin-top:26px">Cerrar sesión</button>`;

    document.getElementById('salir').onclick = async function(){
      this.disabled = true;
      await db.auth.signOut();
      refrescar();
    };

    const caja = document.getElementById('guardados');
    const { data, error } = await db.from('guardados')
      .select('tramite_id, tramites(id,titulo,resumen)')
      .order('creado_at', { ascending:false });

    if (error){ mostrarError(caja, error, 'cargar tus guardados'); return; }

    const conTramite = (data || []).filter(g => g.tramites);
    if (!conTramite.length){
      caja.innerHTML = `<div class="vacio">
          Todavía no guardaste ninguno.<br>
          Abrí un trámite y tocá «Guardar».<br>
          <a class="boton" href="../tramites/" style="margin-top:14px">Ver trámites</a>
        </div>`;
      return;
    }

    caja.innerHTML = conTramite.map(g => `
      <a class="tarjeta" href="../tramites/?id=${g.tramites.id}">
        <h3>${esc(g.tramites.titulo)}</h3>
        ${g.tramites.resumen ? `<p>${esc(g.tramites.resumen)}</p>` : ''}
      </a>`).join('');
  }

  refrescar();

})();
</script>
</body>
</html>
