<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>

<body>

<div id="cabecera"></div>
<main class="envoltura" id="contenido" tabindex="-1">
  <div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea media"></div></div><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea corta"></div></div>
</main>
<div id="pie"></div>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno.
     Versión 2.112.4, congelada. Antes se bajaba de cdn.jsdelivr.net en
     cada visita: si esa descarga fallaba, la app quedaba en «Cargando…». -->
<script src="../lib/supabase.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<script src="../fondo-red.js"></script>
<script>
(async function pantallaMiCuenta(){

  document.getElementById('cabecera').innerHTML = htmlCabecera();
  document.getElementById('pie').innerHTML = htmlPie();
  pintarNav('mi');

  const contenido = document.getElementById('contenido');

  /* Cuando volvés desde el correo de recuperación, Supabase deja el
     enlace con type=recovery y abre una sesión temporal. Hay que
     mirarlo ANTES de decidir qué pantalla mostrar: si no, se ve
     «Hola, Máximo» y la persona nunca llega a cambiar la contraseña. */
  function vieneDeRecuperar(){
    const h = location.hash || '';
    const b = location.search || '';
    /* «code» es la otra forma en que Supabase devuelve el enlace, y es
       la que usan también los enlaces mágicos que se mandan desde el
       tablero. La app nunca manda enlaces para otra cosa, así que si
       llega uno es porque alguien no puede entrar: mostrarle la
       pantalla de contraseña nueva es exactamente lo que necesita. */
    return /type=recovery/.test(h) || /type=recovery/.test(b) || /[?&]code=/.test(b);
  }
  let recuperando = vieneDeRecuperar();

  async function refrescar(){
    const { usuario, perfil } = await sesionActual();
    if (recuperando && usuario) return pedirClaveNueva(usuario);
    if (usuario) pintarAdentro(usuario, perfil);
    else         pintarAfuera();
  }

  /* ============================================================
     ELEGIR UNA CONTRASEÑA NUEVA
     ============================================================ */
  function pedirClaveNueva(usuario){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">CONTRASEÑA NUEVA</h1>
      <p class="bajada">Entraste con el enlace que te mandamos a
        <strong>${esc(usuario.email)}</strong>. Elegí una contraseña nueva
        y ya quedás adentro.</p>

      <div class="ficha">
        <div class="campo">
          <label for="clave-nueva">Contraseña nueva</label>
          <input id="clave-nueva" type="password" autocomplete="new-password"
                 minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="boton ancho" id="guardar-clave">Guardar la contraseña</button>
        <div id="mensaje"></div>
      </div>`;

    const campo   = document.getElementById('clave-nueva');
    const mensaje = document.getElementById('mensaje');
    campo.focus();

    document.getElementById('guardar-clave').onclick = async function(){
      const clave = campo.value;
      if (!clave || clave.length < 6){
        mensaje.innerHTML = `<div class="aviso error">
            La contraseña tiene que tener al menos 6 caracteres.</div>`;
        campo.focus();
        return;
      }
      this.disabled = true; this.textContent = 'Guardando…';
      const { error } = await db.auth.updateUser({ password: clave });
      if (error){
        this.disabled = false; this.textContent = 'Guardar la contraseña';
        mensaje.innerHTML = `<div class="aviso error">No pudimos guardar la contraseña. ${esc(
          /at least \d+ characters|weak/i.test(error.message || '')
            ? 'Tiene que tener al menos 6 caracteres.' : errorEnCastellano(error))}</div>`;
        return;
      }
      /* Se limpia el enlace de la dirección: si queda, al recargar
         vuelve a pedir contraseña nueva. */
      recuperando = false;
      history.replaceState(null, '', location.pathname);
      refrescar();
    };
  }

  /* ============================================================
     SIN CUENTA · entrar o registrarse
     ============================================================ */
  function pintarAfuera(){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">MI PERFIL</h1>
      <p class="bajada">
        La app funciona entera sin cuenta. Registrate solo si querés
        <strong>guardar trámites</strong> para encontrarlos rápido después.
      </p>

      <div class="chips" style="margin-bottom:4px">
        <button class="chip" id="tab-entrar" aria-pressed="true">Ya tengo cuenta</button>
        <button class="chip" id="tab-crear"  aria-pressed="false">Crear una cuenta</button>
      </div>

      <div class="ficha">
        <form id="formulario">
          <div class="campo" id="campo-nombre" hidden>
            <label for="nombre">Tu nombre</label>
            <input id="nombre" type="text" autocomplete="name" placeholder="Cómo te llamamos">
          </div>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" autocomplete="email" required placeholder="vos@ejemplo.com">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input id="clave" type="password" autocomplete="current-password" required
                   minlength="6" placeholder="Mínimo 6 caracteres">
          </div>
          <button class="boton ancho" type="submit" id="enviar">Entrar</button>
        </form>
        <button class="boton texto ancho" id="olvide">Me olvidé la contraseña</button>
        <div id="mensaje"></div>
      </div>

      <!-- QUE SE GUARDA, QUIEN LO VE Y COMO SE BORRA. Los tres renglones
           estan comprobados contra las politicas de la base el 5/9, no
           escritos de memoria: «guardados» y «preparaciones» solo se dejan
           leer por su dueño, y «perfiles» -lo unico que ve el equipo- tiene
           OJO: nada de comillas invertidas aca adentro. Este comentario vive
           DENTRO de un template literal, y una comilla invertida lo corta al
           medio: la pantalla entera deja de andar.
           nombre y rol, sin el correo. Si algun dia cambia una politica,
           cambia este texto: una nota de privacidad que no coincide con la
           base es peor que no tenerla. -->
      <div style="color:var(--texto-suave);font-size:var(--letra-nota);
                  margin-top:16px;line-height:1.5">
        <p style="margin:0 0 6px"><b>Qué guardamos:</b> tu correo, el nombre
          que pongas, los trámites que marques, las materias que estés
          preparando y, si la cargás, tu cursada con las faltas. Nada de
          notas.</p>
        <p style="margin:0 0 6px"><b>Quién lo ve:</b> vos. El equipo ve tu
          nombre en la lista de cuentas; no ve tu correo, ni qué guardaste, ni
          qué estás preparando, ni tu cursada.</p>
        <p style="margin:0 0 6px"><b>Cómo se borra:</b> desde tu cuenta, en un
          toque, y se va todo junto.</p>
        <p style="margin:0">La app anda igual sin cuenta. La cuenta sirve para
          que lo tuyo esté en cualquier teléfono.</p>
      </div>`;

    let modo = 'entrar';
    const tabEntrar = document.getElementById('tab-entrar');
    const tabCrear  = document.getElementById('tab-crear');
    const campoNom  = document.getElementById('campo-nombre');
    const boton     = document.getElementById('enviar');
    const mensaje   = document.getElementById('mensaje');

    function cambiarModo(nuevo){
      modo = nuevo;
      tabEntrar.setAttribute('aria-pressed', modo === 'entrar');
      tabCrear .setAttribute('aria-pressed', modo === 'crear');
      campoNom.hidden = (modo !== 'crear');
      boton.textContent = (modo === 'crear') ? 'Crear mi cuenta' : 'Entrar';
      document.getElementById('clave').autocomplete =
        (modo === 'crear') ? 'new-password' : 'current-password';
      mensaje.innerHTML = '';
    }
    tabEntrar.onclick = () => cambiarModo('entrar');
    tabCrear .onclick = () => cambiarModo('crear');

    /* La portada tiene un botón «Crear mi cuenta» que trae hasta acá con
       ?crear. Sin esta línea la pantalla abre en «Entrar», y quien venía
       justamente a crearse una cuenta tiene que darse cuenta solo de que
       hay una solapa al lado. */
    if (/[?&]crear\b/.test(location.search)) cambiarModo('crear');

    /* ---------- Me olvidé la contraseña ----------
       Manda un correo con un enlace. Al volver por ese enlace, Supabase
       deja una sesión de recuperación y la app pide la contraseña nueva
       (más abajo, en pedirClaveNueva). */
    document.getElementById('olvide').onclick = async function(){
      const correo = document.getElementById('correo').value.trim();
      if (!correo){
        mensaje.innerHTML = `<div class="aviso error">
            Escribí tu correo arriba y volvé a tocar acá: ahí te mandamos el enlace.
          </div>`;
        document.getElementById('correo').focus();
        return;
      }
      this.disabled = true; this.textContent = 'Mandando…';
      /* OJO: acá NO va RAIZ. En esta pantalla RAIZ vale '../', así que
         origin + RAIZ + 'mi/' daba «…vercel.app../mi/», una dirección
         inválida: Supabase la descartaba y mandaba el enlace a la
         portada, donde no existe la pantalla de contraseña nueva. La
         persona entraba y no tenía dónde cambiarla.
         El botón vive en esta misma pantalla, así que la dirección de
         vuelta es esta misma pantalla. */
      const { error } = await db.auth.resetPasswordForEmail(correo, {
        redirectTo: location.origin + location.pathname
      });
      this.disabled = false; this.textContent = 'Me olvidé la contraseña';

      if (error){
        mensaje.innerHTML = `<div class="aviso error">${esc(
          /rate limit|only request this after/i.test(error.message)
            ? 'Se mandaron muchos correos seguidos. Esperá unos minutos.'
            : 'No pudimos mandar el correo. ' + errorEnCastellano(error))}</div>`;
        return;
      }
      /* Se contesta lo mismo exista o no la cuenta: si dijéramos "ese
         correo no está registrado", cualquiera podría averiguar quién
         tiene cuenta probando direcciones. */
      mensaje.innerHTML = `<div class="aviso ok">
          Si ese correo tiene una cuenta, le mandamos un enlace a
          <strong>${esc(correo)}</strong>. Abrilo desde este mismo teléfono
          y vas a poder elegir una contraseña nueva.<br>
          <small>Fijate también en el correo no deseado.</small>
        </div>`;
    };

    document.getElementById('formulario').addEventListener('submit', async function(ev){
      ev.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const clave  = document.getElementById('clave').value;
      const nombre = document.getElementById('nombre').value.trim();

      boton.disabled = true;
      boton.textContent = 'Un segundo…';
      mensaje.innerHTML = '';

      const { data, error } = (modo === 'crear')
        ? await db.auth.signUp({ email:correo, password:clave, options:{ data:{ nombre } } })
        : await db.auth.signInWithPassword({ email:correo, password:clave });

      boton.disabled = false;
      cambiarModo(modo);

      if (error){
        const traduccion = {
          'Invalid login credentials': 'El correo o la contraseña no coinciden.',
          'Email not confirmed':       'Tenés que confirmar tu correo antes de entrar. Fijate en tu casilla.',
          'User already registered':   'Ese correo ya tiene cuenta. Probá con «Ya tengo cuenta».',
          'Signups not allowed for this instance':
            'El registro de cuentas nuevas está cerrado por ahora.'
        }[error.message]
        /* Los que vienen con un número adentro no se pueden poner en una
           lista fija, así que se reconocen por lo que dicen. Sin esto, el
           estudiante ve el error en inglés y no entiende qué hacer. */
        || (/logins are disabled|signups are disabled/i.test(error.message)
              ? 'Las cuentas están desactivadas por ahora. La app funciona igual sin cuenta.' : '')
        || (/at least \d+ characters/i.test(error.message)
              ? 'La contraseña tiene que tener al menos 6 caracteres.' : '')
        || (/rate limit|too many requests|only request this after/i.test(error.message)
              ? 'Hubo muchos intentos seguidos. Esperá unos minutos y volvé a intentar.' : '')
        || (/unable to validate email|invalid format/i.test(error.message)
              ? 'Ese correo no parece estar bien escrito.' : '')
        || errorEnCastellano(error);
        mensaje.innerHTML = `<div class="aviso error">${esc(traduccion)}</div>`;
        return;
      }

      if (modo === 'crear' && data.user && !data.session){
        /* EL CORREO ES EL ESLABÓN FLOJO DE TODO ESTO.

           Supabase manda estos mails con un servidor de prueba que corta
           después de unos pocos por hora. Hoy, con dos cuentas, llega
           siempre. El 21, con mucha gente entrando junta, va a haber quien
           no lo reciba.

           Sin una salida, esa persona queda con la cuenta creada, sin poder
           entrar y sin nada que tocar. Así que se dicen las dos cosas de
           una: cómo pedirlo de nuevo, y que mientras tanto la app funciona
           igual sin cuenta. Lo segundo importa más que lo primero: si el
           correo no llega, que al menos no se vaya. */
        mensaje.innerHTML = `<div class="aviso ok">
            Listo. Te mandamos un correo a <strong>${esc(correo)}</strong> para
            confirmar la cuenta. Abrilo y después volvé acá.
            <br><small>Fijate también en el correo no deseado.</small>
            <button class="boton texto ancho" id="reenviar" style="margin-top:10px">
              No me llegó, mandámelo de nuevo</button>
            <small style="display:block;margin-top:8px;line-height:1.45">
              Mientras tanto usá la app igual: sin cuenta anda todo, y lo que
              marques queda guardado en este teléfono.</small>
          </div>`;

        document.getElementById('reenviar').onclick = async function(){
          this.disabled = true;
          this.textContent = 'Mandando…';
          const { error: fallo } = await db.auth.resend({ type:'signup', email: correo });
          this.disabled = false;
          this.textContent = 'No me llegó, mandámelo de nuevo';

          if (fallo){
            /* El límite del servidor de prueba es lo que más va a saltar,
               y no es culpa de quien se registra: se lo decimos sin echarle
               la culpa y con un plazo concreto, que es lo único que
               tranquiliza. */
            const esElLimite =
              /rate limit|too many|only request this after|security purposes/i
                .test(fallo.message || '');
            mensaje.insertAdjacentHTML('beforeend', `<div class="aviso error">${
              esElLimite
                ? 'Estamos mandando muchos correos juntos. Esperá unos minutos y volvé a tocar el botón. La app la podés usar igual mientras tanto.'
                : esc('No pudimos reenviarlo. ' + errorEnCastellano(fallo))
            }</div>`);
            return;
          }
          mensaje.insertAdjacentHTML('beforeend', `<div class="aviso ok">
              Listo, lo mandamos de nuevo a <strong>${esc(correo)}</strong>.</div>`);
        };
        return;
      }
      refrescar();
    });
  }

  /* ============================================================
     CON CUENTA
     ============================================================ */
  async function pintarAdentro(usuario, perfil){
    const nombre = (perfil && perfil.nombre) || usuario.email;

    contenido.innerHTML = `
      <h1 class="titulo-pantalla">HOLA${perfil && perfil.nombre ? ', ' + esc(perfil.nombre.split(' ')[0]).toUpperCase() : ''}</h1>
      <p class="bajada">${esc(usuario.email)}</p>

      ${esDelEquipo(perfil) ? `
        <a class="boton ancho oscuro" href="../panel/" style="margin-bottom:14px">
          🛠 Panel de la agrupación</a>` : ''}

      <div class="titulo-seccion">TRÁMITES GUARDADOS</div>
      <div class="lista" id="guardados"><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea media"></div></div><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea corta"></div></div></div>

      <div class="titulo-seccion" id="cursada">MI CURSADA</div>
      <p style="margin:0 0 12px;font-size:var(--letra-nota);line-height:1.45;color:var(--texto-suave)">
        Cargá qué cursás y cuándo. Aparece en <a href="../agenda/">Fechas</a>,
        en la vista <b>Semana</b>, y ahí llevás la cuenta de tus faltas.</p>
      <div class="lista-cursada" id="mi-cursada"></div>
      <div class="ficha">
        <form id="form-cursada">
          <div class="campo">
            <label for="c-materia">Materia</label>
            <input id="c-materia" type="text" required maxlength="80"
                   autocomplete="off" placeholder="Trabajo Social III">
          </div>
          <div class="campos-par">
            <div class="campo">
              <label for="c-dia">Día</label>
              <select id="c-dia" required>
                <option value="1">Lunes</option><option value="2">Martes</option>
                <option value="3">Miércoles</option><option value="4">Jueves</option>
                <option value="5">Viernes</option><option value="6">Sábado</option>
              </select>
            </div>
            <div class="campo">
              <label for="c-hora">Empieza</label>
              <input id="c-hora" type="time" required value="14:00">
            </div>
          </div>
          <div class="campos-par">
            <div class="campo">
              <label for="c-aula">Aula</label>
              <input id="c-aula" type="text" maxlength="40" placeholder="Aula 12">
            </div>
            <div class="campo">
              <label for="c-clases">Clases en el cuatri</label>
              <input id="c-clases" type="number" inputmode="numeric" min="1" max="200" value="16" required>
            </div>
          </div>
          <button class="boton ancho" type="submit" id="c-guardar">Agregar a mi cursada</button>
        </form>
        <div id="msj-cursada"></div>
      </div>

      <div class="titulo-seccion">TU CONTRASEÑA</div>
      <div class="ficha">
        <p style="margin:0 0 12px;font-size:var(--letra-nota);line-height:1.4;color:var(--texto-suave)">
          Cambiala cuando quieras. No hace falta que te acuerdes de la
          anterior: ya estás con la sesión abierta.</p>
        <button class="boton borde ancho" id="abrir-cambio">Cambiar mi contraseña</button>

        <div id="cambio" hidden>
          <div class="campo" style="margin-top:12px">
            <label for="clave-nueva">Contraseña nueva</label>
            <input id="clave-nueva" type="password" autocomplete="new-password"
                   minlength="6" placeholder="Mínimo 6 caracteres">
          </div>
          <button class="boton ancho" id="guardar-clave">Guardar la contraseña</button>
          <button class="boton texto ancho" id="cancelar-cambio">Dejarla como está</button>
        </div>
        <div id="msj-clave"></div>
      </div>

      <button class="boton ancho borde" id="salir" style="margin-top:26px">Cerrar sesión</button>

      <!-- BORRAR LA CUENTA. Va ultimo y detras de dos puertas -abrir el
           bloque, y escribir la palabra- porque no se puede deshacer. No
           es desconfianza del dedo: es que el precio de tocarlo sin querer
           es el año entero de alguien. -->
      <div class="titulo-seccion" style="margin-top:30px">BORRAR MI CUENTA</div>
      <div class="ficha">
        <p style="margin:0 0 12px;font-size:var(--letra-nota);line-height:1.4;color:var(--texto-suave)">
          Se va todo junto: la cuenta, tu nombre, los trámites que guardaste,
          las materias que estabas preparando y tu cursada con sus faltas.
          <b>No se puede deshacer.</b></p>
        <button class="boton borde ancho" id="abrir-borrado">Quiero borrar mi cuenta</button>

        <div id="borrado" hidden>
          <div class="campo" style="margin-top:12px">
            <label for="confirmar-borrado">Escribí BORRAR para confirmar</label>
            <input id="confirmar-borrado" type="text" autocomplete="off"
                   autocapitalize="characters" placeholder="BORRAR">
          </div>
          <button class="boton ancho" id="borrar-ya">Borrar mi cuenta para siempre</button>
          <button class="boton texto ancho" id="cancelar-borrado">Mejor no</button>
        </div>
        <div id="msj-borrado"></div>
      </div>`;

    document.getElementById('salir').onclick = async function(){
      this.disabled = true;
      await db.auth.signOut();
      refrescar();
    };

    /* ---------- Borrar la cuenta ----------
       El borrado de verdad lo hace `borrar_mi_cuenta()` en la base, no
       esta pantalla: con la clave pública nadie puede tocar `auth.users`.
       Lo que sí es de acá son las dos puertas de antes y, sobre todo, el
       aviso honesto si algo sale mal. Decirle «listo» a alguien cuyos
       datos siguen ahí es la peor forma de fallar en esto. */
    const cajaBorrado = document.getElementById('borrado');
    const msjBorrado  = document.getElementById('msj-borrado');
    const btnAbrirBor = document.getElementById('abrir-borrado');

    btnAbrirBor.onclick = () => {
      cajaBorrado.hidden = false;
      btnAbrirBor.hidden = true;
      msjBorrado.innerHTML = '';
      document.getElementById('confirmar-borrado').focus();
    };

    document.getElementById('cancelar-borrado').onclick = () => {
      cajaBorrado.hidden = true;
      btnAbrirBor.hidden = false;
      document.getElementById('confirmar-borrado').value = '';
      msjBorrado.innerHTML = '';
      btnAbrirBor.focus();
    };

    document.getElementById('borrar-ya').onclick = async function(){
      const campo = document.getElementById('confirmar-borrado');
      if (campo.value.trim().toUpperCase() !== 'BORRAR'){
        msjBorrado.innerHTML = `<div class="aviso error">
            Escribí la palabra <b>BORRAR</b> para confirmar.</div>`;
        campo.focus();
        return;
      }

      this.disabled = true; this.textContent = 'Borrando…';
      const { error } = await db.rpc('borrar_mi_cuenta');

      if (error){
        this.disabled = false; this.textContent = 'Borrar mi cuenta para siempre';
        /* Si la función todavía no está en la base, no es culpa de quien
           quiere borrarse: falta correr el SQL. Se lo decimos sin jerga y
           le damos una salida que no depende de nosotros. */
        const faltaLaFuncion =
          /borrar_mi_cuenta|schema cache|does not exist|404|not find/i.test(error.message || '');
        msjBorrado.innerHTML = faltaLaFuncion
          ? `<div class="aviso error">
               Todavía no podemos borrar cuentas desde acá.
               <b>Escribinos y la borramos a mano en el día.</b><br>
               <small>Al equipo: falta correr <b>tabla-borrar-cuenta.sql</b> en Supabase.</small>
             </div>`
          : `<div class="aviso error">
               No pudimos borrar tu cuenta. ${esc(errorEnCastellano(error))}<br>
               <b>Tu cuenta sigue estando.</b> Si sigue fallando, escribinos.</div>`;
        return;
      }

      /* Borrada la fila, el token que tenemos en la mano ya no vale. El
         signOut puede fallar por eso mismo, y no importa: lo que se está
         limpiando es el teléfono. Por eso va en try. */
      try { await db.auth.signOut(); } catch(e){}

      document.getElementById('contenido').innerHTML = `
        <h1 class="titulo-pantalla">LISTO</h1>
        <p class="bajada">Tu cuenta y todo lo que tenía adentro se borraron.</p>
        <div class="ficha">
          <p style="margin:0 0 12px;font-size:var(--letra-nota);line-height:1.5">
            La app sigue funcionando sin cuenta: lo que marques queda guardado
            en este teléfono. Si algún día querés volver, te creás una nueva.</p>
          <a class="boton ancho" href="../">Ir al inicio</a>
        </div>`;
    };

    /* ---------- Cambiar la contraseña con la sesión abierta ----------
       El campo empieza escondido a propósito: es una acción que se hace
       una vez cada mucho, y si estuviera siempre a la vista competiría
       con lo que la persona vino a hacer, que es ver sus trámites. */
    const cajaCambio = document.getElementById('cambio');
    const msjClave   = document.getElementById('msj-clave');
    const btnAbrir   = document.getElementById('abrir-cambio');

    btnAbrir.onclick = () => {
      cajaCambio.hidden = false;
      btnAbrir.hidden = true;
      msjClave.innerHTML = '';
      document.getElementById('clave-nueva').focus();
    };

    document.getElementById('cancelar-cambio').onclick = () => {
      cajaCambio.hidden = true;
      btnAbrir.hidden = false;
      document.getElementById('clave-nueva').value = '';
      msjClave.innerHTML = '';
      btnAbrir.focus();
    };

    document.getElementById('guardar-clave').onclick = async function(){
      const campo = document.getElementById('clave-nueva');
      if (!campo.value || campo.value.length < 6){
        msjClave.innerHTML = `<div class="aviso error">
            La contraseña tiene que tener al menos 6 caracteres.</div>`;
        campo.focus();
        return;
      }
      this.disabled = true; this.textContent = 'Guardando…';
      const { error } = await db.auth.updateUser({ password: campo.value });
      this.disabled = false; this.textContent = 'Guardar la contraseña';

      if (error){
        msjClave.innerHTML = `<div class="aviso error">${esc(
          /should be different|same/i.test(error.message)
            ? 'Esa es la que ya tenías. Poné una distinta.'
            : /at least \d+ characters|weak/i.test(error.message || '')
              ? 'La contraseña tiene que tener al menos 6 caracteres.'
              : 'No pudimos cambiar la contraseña. ' + errorEnCastellano(error))}</div>`;
        return;
      }
      campo.value = '';
      cajaCambio.hidden = true;
      btnAbrir.hidden = false;
      msjClave.innerHTML = `<div class="aviso ok">
          Listo, la contraseña quedó cambiada. La vas a necesitar la próxima
          vez que entres.</div>`;
    };

    montarCursada(usuario);

    const caja = document.getElementById('guardados');
    const { data, error } = await db.from('guardados')
      .select('tramite_id, tramites(id,titulo,resumen)')
      .order('creado_at', { ascending:false });

    if (error){ mostrarError(caja, error, 'cargar tus guardados'); return; }

    const conTramite = (data || []).filter(g => g.tramites);
    if (!conTramite.length){
      caja.innerHTML = `<div class="vacio">
          Todavía no guardaste ninguno.<br>
          Abrí un trámite y tocá «Guardar».<br>
          <a class="boton" href="../tramites/" style="margin-top:14px">Ver trámites</a>
        </div>`;
      return;
    }

    caja.innerHTML = conTramite.map(g => `
      <a class="tarjeta" href="../tramites/?id=${g.tramites.id}">
        <h3>${esc(g.tramites.titulo)}</h3>
        ${g.tramites.resumen ? `<p>${esc(g.tramites.resumen)}</p>` : ''}
      </a>`).join('');
  }

  /* ============================================================
     MI CURSADA (18/9/2026)

     La carga a mano de qué cursa cada estudiante y cuándo. Iba a
     salir del reporte de SIU Guaraní que ya lee Mi año, pero ese
     reporte no trae horarios: solo aprobadas y regularidades.

     Se pide la hora y no el bloque: el bloque (mañana, tarde, noche)
     se deduce, y así la persona escribe lo que lee en su comprobante.
     Una clase por celda de la semana: si ya hay algo ese día en ese
     bloque, la base lo rechaza y se dice qué es.

     Los ayudantes van acá y no en app.js a propósito: la pantalla
     llega de la red y app.js puede venir del caché viejo.
     ============================================================ */
  const DIAS_LARGO = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
  function bloqueDe(hora){
    const h = /^(\d{1,2}):/.exec(hora || '');
    const n = h ? +h[1] : 14;
    return n < 13 ? 'manana' : n < 18 ? 'tarde' : 'noche';
  }
  const NOMBRE_BLOQUE = { manana:'mañana', tarde:'tarde', noche:'noche' };

  async function montarCursada(usuario){
    const lista = document.getElementById('mi-cursada');
    const form  = document.getElementById('form-cursada');
    const msj   = document.getElementById('msj-cursada');
    if (!lista || !form) return;
    let filas = [];

    function pintar(){
      if (!filas.length){
        lista.innerHTML = '';
        return;
      }
      lista.innerHTML = filas.map(c => `
        <div class="lista-cursada-fila">
          <div>
            <b>${esc(c.materia)}</b>
            <span>${esc(DIAS_LARGO[c.dia - 1])} ${esc(c.hora || '')}${
              c.aula ? ' · ' + esc(c.aula) : ''} · ${c.total_clases} clases</span>
          </div>
          <button type="button" class="cursada-cerrar" data-borrar-cursada="${c.id}"
                  aria-label="Sacar ${esc(c.materia)} del ${esc(DIAS_LARGO[c.dia - 1])}">✕</button>
        </div>`).join('');
    }

    async function traer(){
      const { data, error } = await db.from('cursada')
        .select('id,materia,dia,bloque,hora,aula,total_clases')
        .order('dia').order('hora');
      if (error){ mostrarError(lista, error, 'cargar tu cursada'); return; }
      filas = data || [];
      pintar();
    }

    lista.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-borrar-cursada]');
      if (!b) return;
      b.disabled = true;
      const { error } = await db.from('cursada').delete().eq('id', b.dataset.borrarCursada);
      if (error){
        b.disabled = false;
        msj.innerHTML = `<div class="aviso error">No pudimos sacarla. ${esc(errorEnCastellano(error))}</div>`;
        return;
      }
      msj.innerHTML = '';
      traer();
    });

    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const materia = document.getElementById('c-materia').value.trim().replace(/\s+/g, ' ');
      const dia     = +document.getElementById('c-dia').value;
      const hora    = document.getElementById('c-hora').value;
      const aula    = document.getElementById('c-aula').value.trim();
      const clases  = +document.getElementById('c-clases').value;
      if (!materia || !hora || !(clases >= 1)){
        msj.innerHTML = '<div class="aviso error">Faltan la materia, la hora o la cantidad de clases.</div>';
        return;
      }
      const bloque = bloqueDe(hora);

      /* Se avisa antes de mandar: el rechazo de la base diría
         «duplicate key», que no le sirve a nadie. */
      const ocupada = filas.find(c => c.dia === dia && c.bloque === bloque);
      if (ocupada){
        msj.innerHTML = `<div class="aviso error">El ${esc(DIAS_LARGO[dia - 1])} a la
          ${NOMBRE_BLOQUE[bloque]} ya tenés <b>${esc(ocupada.materia)}</b>. Sacala primero
          si cambió.</div>`;
        return;
      }

      const boton = document.getElementById('c-guardar');
      boton.disabled = true; boton.textContent = 'Guardando…';
      const { error } = await db.from('cursada').insert({
        usuario_id: usuario.id, materia, dia, bloque, hora,
        aula: aula || null, total_clases: clases
      });
      boton.disabled = false; boton.textContent = 'Agregar a mi cursada';

      if (error){
        msj.innerHTML = `<div class="aviso error">${esc(
          /duplicate|23505/i.test(error.message + error.code)
            ? 'Ya tenés otra materia ese día en ese horario.'
            : 'No pudimos guardarla. ' + errorEnCastellano(error))}</div>`;
        return;
      }
      msj.innerHTML = `<div class="aviso ok">Listo: ${esc(materia)} quedó el
        ${esc(DIAS_LARGO[dia - 1])}. <a href="../agenda/?vista=semana">Ver mi semana</a></div>`;
      document.getElementById('c-materia').value = '';
      document.getElementById('c-aula').value = '';
      document.getElementById('c-materia').focus();
      traer();
    });

    await traer();
    if (location.hash === '#cursada')
      document.getElementById('cursada').scrollIntoView({ block:'start' });
  }

  refrescar();

})();
</script>
</body>
</html>
