<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
</head>
<body>

<div id="cabecera"></div>

<main class="envoltura">
  <h1 class="titulo-pantalla">¿Quiénes somos?</h1>
  <p class="bajada" id="bajada"></p>
  <div id="contenido" tabindex="-1"></div>
</main>

<div class="zona-fondo">
  <div id="pie"></div>
</div>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno. -->
<script src="../lib/supabase.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<script>
/* ============================================================
   ACÁ SE ESCRIBE EL TEXTO DE ESTA PANTALLA

   Es el único lugar que hay que tocar. No hace falta entender el
   resto del archivo: todo lo de abajo dibuja lo que se escriba acá.

   Reglas simples:
   - Cada bloque es un título y uno o más párrafos.
   - Para sumar un bloque, copiá uno entero y cambiale el texto.
   - Para sacarlo, borralo. No pasa nada si quedan dos o si hay diez.

   OJO: lo que se escriba acá lo lee un estudiante, no el equipo. Si
   un texto todavía no está listo, es mejor sacar el bloque entero que
   dejar una nota nuestra a la vista.
   ============================================================ */
const QUIENES = {

  /* La frase que va debajo del título, arriba de todo */
  bajada: 'Somos la Agrupación Simón Bolívar. Conducimos el Centro de ' +
          'Estudiantes de la Facultad de Trabajo Social de la UNLP, y esta ' +
          'app la hacemos nosotras y nosotros.',

  bloques: [
    {
      titulo: 'Por qué hicimos esta app',
      parrafos: [
        'La información de la facultad existe, pero está desparramada: un ' +
        'poco en la página, un poco en un PDF, un poco en un grupo de ' +
        'WhatsApp que alguien te tiene que pasar. Perderse una fecha por no ' +
        'haberla visto a tiempo te puede costar un cuatrimestre.',
        'Así que juntamos todo en un solo lugar y lo escribimos como se lo ' +
        'contaríamos a una compañera. Sin registrarte y sin dar datos.'
      ]
    },
    {
      titulo: 'Esta parte todavía la estamos escribiendo',
      parrafos: [
        'Nos falta contar quiénes somos, desde cuándo existe la agrupación y ' +
        'qué hacemos desde el Centro de Estudiantes. Preferimos dejarlo en ' +
        'blanco antes que llenarlo con cualquier cosa.',
        'Mientras tanto, si querés saber más o darnos una mano, escribinos ' +
        'por Instagram: ahí contestamos.'
      ]
    }
  ],

  /* Dónde encontrarnos. Si alguna red no la usan, borren el renglón. */
  redes: [
    { nombre: 'Instagram', url: 'https://www.instagram.com/SimonBolivarfts' },
    { nombre: 'Facebook',  url: 'https://www.facebook.com/SimonBolivarfts'  },
    { nombre: 'Todos nuestros links', url: 'https://linktr.ee/SimonBolivarfts' }
  ],

  /* El llamado del final. Si no lo quieren, borren todo este bloque
     poniendo   sumate: null,   en su lugar. */
  sumate: {
    titulo: 'Sumate',
    texto: 'Si algo de acá adentro está mal, falta o se puede explicar ' +
           'mejor, decinos. Y si querés participar de la agrupación, ' +
           'escribinos y te contamos cuándo nos juntamos.',
    boton: 'Escribinos por Instagram',
    url: 'https://www.instagram.com/SimonBolivarfts'
  }
};

/* ============================================================
   DE ACÁ PARA ABAJO NO HACE FALTA TOCAR NADA
   ============================================================ */
(function quienes(){

document.getElementById('cabecera').innerHTML = htmlCabecera();
document.getElementById('pie').innerHTML = htmlPie();
pintarNav('quienes');

/* Un link solo sirve si de verdad es un link. Si en vez de una
   dirección hay una nota, se muestra como texto apagado en vez de
   como botón: no se publica un botón que no lleva a ningún lado. */
function esLink(u){ return /^https?:\/\//i.test(String(u || '')); }

document.getElementById('bajada').textContent = QUIENES.bajada;

const bloques = (QUIENES.bloques || []).map(b => `
  <section class="bloque-texto">
    <h2>${esc(b.titulo)}</h2>
    ${(b.parrafos || []).map(p => `<p>${esc(p)}</p>`).join('')}
  </section>`).join('');

const redes = (QUIENES.redes || []).length ? `
  <section class="bloque-texto">
    <h2>Dónde encontrarnos</h2>
    <div class="redes">
      ${QUIENES.redes.map(r => esLink(r.url)
        ? `<a class="boton borde" href="${esc(r.url)}"
              target="_blank" rel="noopener">${esc(r.nombre)} ↗</a>`
        : `<span class="red-pendiente">${esc(r.nombre)}: falta cargar el link</span>`
      ).join('')}
    </div>
  </section>` : '';

const sumate = QUIENES.sumate ? `
  <section class="bloque-sumate">
    <h2>${esc(QUIENES.sumate.titulo)}</h2>
    <p>${esc(QUIENES.sumate.texto)}</p>
    ${esLink(QUIENES.sumate.url)
      ? `<a class="boton oscuro ancho" href="${esc(QUIENES.sumate.url)}"
            target="_blank" rel="noopener">${esc(QUIENES.sumate.boton)} ↗</a>`
      : `<span class="red-pendiente">Falta cargar el link del botón</span>`}
  </section>` : '';

document.getElementById('contenido').innerHTML = bloques + redes + sumate;

})();
</script>
</body>
</html>
