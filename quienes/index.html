<link rel="icon" type="image/png" sizes="32x32" href="../imagenes/icono-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../imagenes/icono-96.png">

<!-- Como se ve cuando alguien comparte el link por WhatsApp o Instagram -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Bolivar con vos">
<meta property="og:title" content="Quiénes somos · La Bolívar con vos">
<meta property="og:description" content="Quiénes somos: la Agrupación Simón Bolívar, conducción del Centro de Estudiantes de la Facultad de Trabajo Social de la UNLP.">

<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
</head>
<body class="lectura sin-js">

<div id="cabecera"></div>

<main id="contenido" tabindex="-1">
  <!-- Todo se dibuja desde el JS con lo que el equipo carga en el panel.
       El esqueleto va ADENTRO de #lectura para que lo reemplace: si va
       afuera, se queda arriba y el contenido real aparece debajo. -->
  <div id="lectura">
    <div class="banda tinta">
      <div class="envoltura">
        <div class="esqueleto esq-linea titulo" style="height:38px;width:80%"></div>
        <div class="esqueleto esq-linea" style="margin-top:18px"></div>
        <div class="esqueleto esq-linea media"></div>
      </div>
    </div>
  </div>
</main>

<div id="pie"></div>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno. -->
<script src="../lib/datos.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<script src="../lectura.js"></script>
<script>
/* ============================================================
   ¿QUIÉNES SOMOS?

   El texto se edita desde el PANEL, solapa «✊ Quiénes somos». Acá no
   hay texto que tocar.

   Lo de abajo es la red de seguridad: si la base no contesta —red de
   la facultad, tabla sin crear— se muestra esto en vez de una pantalla
   en blanco. Tocalo solo para eso.
   ============================================================ */
const RESPALDO = {
  bajada: 'Somos la Agrupación Simón Bolívar. Conducimos el Centro de ' +
          'Estudiantes de la Facultad de Trabajo Social de la UNLP, y esta ' +
          'app la hacemos nosotras y nosotros.',
  bloques: [{
    titulo: 'Por qué hicimos esta app',
    parrafos: ['La información de la facultad existe, pero está desparramada. ' +
      'Perderse una fecha por no haberla visto a tiempo te puede costar un ' +
      'cuatrimestre, así que juntamos todo en un solo lugar.']
  }],
  redes: [{ nombre:'Instagram', url:'https://www.instagram.com/SimonBolivarfts' }],
  titular: 'Esta app es|la parte *chica*',
  sumate: null, imagenes: []
};

(async function quienes(){
  document.getElementById('cabecera').innerHTML = htmlCabecera();
  document.getElementById('pie').innerHTML = htmlPie();
  pintarNav('quienes');
  document.body.classList.remove('sin-js');

  /* ============================================================
     LO GUARDADO DE LA VISITA ANTERIOR

     Esta pantalla ya tenía red de seguridad: el RESPALDO de arriba.
     Pero el respaldo es un texto mínimo escrito en el archivo, y lo
     que vio la persona la visita pasada es la página de verdad. Así
     que el orden ahora es: lo guardado, y el RESPALDO recién si nunca
     se llegó a ver nada.

     Y SE AVISA. Antes esto se caía en silencio: sin red mostraba el
     texto de emergencia y nadie se enteraba de que estaba viendo otra
     cosa. Acá no hay fechas —quiénes somos no vence—, pero mostrar
     algo de la semana pasada sin decirlo es la misma familia de
     mentira que la app decidió no decir.
     ============================================================ */
  const memoria = memoriaDe('quienes');
  if (memoria){
    pintar(memoria.datos);
    avisarMostrandoGuardado(memoria.cuando);
  }

  let p = null, huboRed = false;
  try {
    const { data, error } = await conPaciencia(
      db.from('pagina_quienes').select('*').limit(1).maybeSingle());
    if (error) throw error;
    huboRed = true;
    p = data;              // puede venir vacío: la página sin cargar
  } catch(e){ /* sin red: más abajo se decide qué queda en pantalla */ }

  if (huboRed && p){
    pintar(p);
    guardarEnMemoria('quienes', p);
    sacarAvisoGuardado();
  } else if (huboRed){
    /* Contestó, y contestó que no hay página cargada. Es lo más nuevo
       que tenemos: se olvida lo guardado y queda el respaldo. */
    olvidarMemoria('quienes');
    sacarAvisoGuardado();
    pintar(RESPALDO);
  } else if (memoria){
    avisarNoSePudoActualizar(memoria.cuando);
  } else {
    pintar(RESPALDO);
  }

/* El dibujo, aparte, porque corre dos veces: una con lo guardado y
   otra con lo que trae la red. */
function pintar(p){
  const bloques  = Array.isArray(p.bloques)  ? p.bloques  : [];
  const imagenes = Array.isArray(p.imagenes) ? p.imagenes : [];
  const redes    = Array.isArray(p.redes)    ? p.redes    : [];

  /* EL GRITO. Es lo primero y lo único gigante: si alguien entra acá es
     porque se preguntó quién está atrás de la app, y la respuesta tiene
     que implicarlo, no solamente informarlo. */
  const hero = `
    <div class="banda tinta">
      <div class="envoltura">
        <p class="ceja-lectura aparece">Agrupación Simón Bolívar · Conducción del CEFTS</p>
        <h1 class="grito aparece">${titularHTML(p.titular)}</h1>
        <p class="bajada-lectura aparece">${esc(p.bajada || '')}</p>
      </div>
    </div>`;

  /* Los bloques, en zigzag. Las fotos se reparten entre ellos: si hay
     menos fotos que bloques, los últimos van solo con texto y la
     pantalla no se rompe. */
  const cuerpo = bloques.length ? `
    <div class="banda papel">
      <div class="envoltura">
        <div class="zigzag">
          ${bloques.map((b, i) => {
            const img = imagenes[i];
            return `
            <article class="aparece">
              <div>
                <h3>${esc(b.titulo || '')}</h3>
                ${(b.parrafos || []).map(t => `<p>${esc(t)}</p>`).join('')}
              </div>
              ${fotoDe(img) ? `
                <figure>
                  <img src="${esc(fotoDe(img))}" alt="${esc(img.epigrafe || '')}"
                       loading="lazy" decoding="async">
                  ${img.epigrafe ? `<figcaption>${esc(img.epigrafe)}</figcaption>` : ''}
                </figure>` : ''}
            </article>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  /* La puerta al Consejo. Va después de los bloques a propósito: primero
     quiénes somos, después dónde lo peleamos. El texto se edita desde el
     panel; lo de acá abajo es lo que se muestra si la base no contesta. */
  const pt = p.puerta || {};
  const puerta = `
    <div class="banda sol">
      <div class="envoltura">
        <h2 class="grito aparece">${titularHTML(
          pt.titular || 'Donde se decide|lo que *te pasa*')}</h2>
        <p class="bajada-lectura aparece">${esc(pt.texto ||
          'Los planes de estudio, las mesas, los horarios y el presupuesto se ' +
          'aprueban en el Consejo Directivo. Ahí también estamos.')}</p>
        <a class="puerta aparece" href="../consejo/">
          <span class="puerta-texto">
            <strong>${esc(pt.boton_titulo || 'El Consejo Directivo')}</strong>
            <span>${esc(pt.boton_bajada || 'Qué es, qué hacemos ahí y qué conseguimos')}</span>
          </span>
          <span class="puerta-flecha" aria-hidden="true">→</span>
        </a>
      </div>
    </div>`;

  const cierre = `
    <div class="banda tinta">
      <div class="envoltura">
        ${redes.length ? `
          <h2 class="grito aparece" style="font-size:clamp(28px,7.4vw,52px)">Dónde<br>encontrarnos</h2>
          <div class="redes aparece" style="margin-top:26px">
            ${redes.map(r => /^https?:\/\//i.test(String(r.url || ''))
              ? `<a class="boton borde" href="${esc(r.url)}" target="_blank"
                    rel="noopener">${esc(r.nombre)} ↗</a>`
              : `<span class="red-pendiente">${esc(r.nombre)}: falta cargar el link</span>`
            ).join('')}
          </div>` : ''}
        ${p.sumate && p.sumate.titulo ? `
          <div class="aparece" style="margin-top:${redes.length ? '38px' : '0'}">
            <h2 class="grito" style="font-size:clamp(28px,7.4vw,52px)">${esc(p.sumate.titulo)}</h2>
            <p class="bajada-lectura">${esc(p.sumate.texto || '')}</p>
            ${/^https?:\/\//i.test(String(p.sumate.url || ''))
              ? `<a class="boton ancho" href="${esc(p.sumate.url)}" target="_blank"
                    rel="noopener" style="margin-top:20px;max-width:420px">${
                    esc(p.sumate.boton || 'Escribinos')} ↗</a>`
              : ''}
          </div>` : ''}
      </div>
    </div>`;

  document.getElementById('lectura').innerHTML = hero + cuerpo + puerta + cierre;
  vigilarAparicion();
}
})();
</script>
</body>
</html>
