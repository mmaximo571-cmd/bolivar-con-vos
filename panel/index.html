<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · La Bolívar con vos</title>
<meta name="theme-color" content="#F9E830">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Iconos de la app: pestana, Google, y pantalla de inicio del celular -->
<link rel="icon" type="image/png" sizes="32x32" href="../imagenes/icono-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="../imagenes/icono-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="../imagenes/icono-192.png">
<link rel="apple-touch-icon" href="../imagenes/icono-apple.png">
<link rel="manifest" href="../manifest.json">

<!-- Como se ve cuando alguien comparte el link por WhatsApp o Instagram -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Bolivar con vos">
<meta property="og:title" content="Panel · La Bolívar con vos">
<meta property="og:description" content="">
<meta property="og:image" content="https://bolivar-con-vos.vercel.app/imagenes/compartir.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../estilos.css">
<!-- EL TEMA, ANTES DE DIBUJAR NADA. Va acá arriba y no en app.js a
     propósito: app.js carga al final del cuerpo, así que la pantalla
     arrancaría clara y pegaría un salto a oscura. Son tres renglones. -->
<script>
(function(){try{
  var g = localStorage.getItem('bolivar-tema') || 'auto';
  var oscuro = g === 'oscuro' || (g === 'auto' &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
}catch(e){ document.documentElement.dataset.tema = 'claro'; }})();
</script>
<style>
  body{padding-bottom:30px}                    /* el panel no lleva barra de abajo */
  .fila-item{display:flex;align-items:center;gap:10px}
  .fila-item .crecer{flex:1;min-width:0}
  .borrador{opacity:.55}
  .mini{
    font-family:var(--fuente-sub);font-size:var(--letra-chica);text-transform:uppercase;letter-spacing:.06em;
    padding:7px 11px;border-radius:99px;border:1px solid var(--linea);background:var(--superficie);
    white-space:nowrap
  }
  .mini.rojo{border-color:var(--rojo);color:var(--rojo)}
  .paso-editor{
    border:1px solid var(--linea);border-radius:var(--radio-chico);
    padding:10px;margin-bottom:8px;background:var(--superficie-2)
  }
  .paso-editor .encabezado{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;
    font-family:var(--fuente-sub);font-size:var(--letra-chica);text-transform:uppercase;
    letter-spacing:.07em;color:var(--texto-suave)
  }
  .paso-editor .campo{margin-bottom:8px}
  .paso-editor .campo:last-child{margin-bottom:0}
  /* --- La lista de PDFs leídos ---
     Cada renglón es un programa. La barra de la izquierda dice de un
     vistazo si hay que mirarlo: verde salió entero, amarillo salió con
     avisos, rojo no se pudo. El color no viaja solo: al lado siempre
     está el motivo escrito, porque el color no se lee en voz alta ni
     lo ve quien no distingue el verde del rojo. */
  .lectura{
    display:flex;gap:10px;align-items:flex-start;
    border:1px solid var(--linea);border-left-width:5px;
    border-radius:var(--radio-chico);padding:9px 11px;margin-bottom:7px;
    background:var(--superficie)
  }
  .lectura.bien{border-left-color:#2E7D32}
  .lectura.avisa{border-left-color:#B8860B}
  .lectura.mal{border-left-color:var(--rojo)}
  .lectura .crecer{flex:1;min-width:0}
  .lectura h4{margin:0 0 2px;font-size:var(--letra-base)}
  .lectura .archivo{
    font-family:var(--fuente-datos);font-size:var(--letra-mini);color:var(--texto-suave);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  .lectura .cuentas{font-size:var(--letra-chica);color:var(--texto-suave);margin-top:3px}
  .lectura .porque{font-size:var(--letra-chica);margin-top:3px}
  .zona-soltar{
    border:2px dashed var(--linea);border-radius:var(--radio-chico);
    padding:26px 14px;text-align:center;background:var(--superficie-2);
    margin-bottom:12px
  }
  .zona-soltar.encima{border-color:var(--rojo);background:var(--superficie)}
  /* --- Las ranuras de foto ---
     Una por bloque de texto. La miniatura se muestra con el mismo
     recorte que va a tener en la app, para que no haya sorpresas. */
  .ranura-foto{
    border:1px solid var(--linea);border-radius:var(--radio);
    padding:12px;margin-bottom:12px;background:var(--superficie)
  }
  .ranura-donde{
    margin:0 0 10px;font-size:var(--letra-chica);color:var(--texto-suave)
  }
  .ranura-vista{
    width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
    border:2px solid var(--tinta-borde);border-radius:var(--radio);
    margin-bottom:12px;background:var(--superficie-2)
  }
  .ranura-botones{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ranura-botones .boton{flex:1 1 0;min-width:0}
</style>

</head>
<body>

<div id="cabecera"></div>
<main class="envoltura" id="contenido">
  <div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea media"></div></div><div class="esq-tarjeta"><div class="esqueleto esq-linea titulo"></div><div class="esqueleto esq-linea"></div><div class="esqueleto esq-linea corta"></div></div>
</main>

<script>window.RAIZ = '../';</script>
<!-- La librería de Supabase vive ACÁ ADENTRO, no en un servidor ajeno.
     Versión 2.112.4, congelada. Antes se bajaba de cdn.jsdelivr.net en
     cada visita: si esa descarga fallaba, la app quedaba en «Cargando…». -->
<script src="../lib/supabase.js"></script>
<script src="../config.js"></script>
<script src="../iconos.js"></script>
<script src="../app.js"></script>
<!-- Para leer los programas en PDF. Los tres planes hacen falta para
     reconocer de qué materia es cada archivo, y pdf.js para sacarle el
     texto sin mandarlo a ningún servidor: el PDF se lee en la máquina
     de quien lo sube y recién después se guarda.
     Esto lo carga SOLO el panel. La app que usa el estudiante no baja
     ni un byte de pdf.js. -->
<script src="../carrera/plan.js"></script>
<script src="../carrera/plan-tgcr.js"></script>
<script src="../carrera/plan-fono.js"></script>
<script src="../lib/leer-programa.js"></script>
<script src="../lib/pdf.js"></script>
<script>
(async function panel(){

  document.getElementById('cabecera').innerHTML = htmlCabecera(
    '<a class="boton-cabecera" href="../">Ver la app</a>'
  );
  const contenido = document.getElementById('contenido');

  /* ============================================================
     PUERTA · solo el equipo entra
     ============================================================ */
  const { usuario, perfil } = await sesionActual();

  if (!usuario){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">PANEL</h1>
      <p class="bajada">Entrá con la cuenta del equipo de la agrupación.</p>
      <div class="ficha">
        <form id="login">
          <div class="campo"><label for="correo">Correo</label>
            <input id="correo" type="email" autocomplete="email" required></div>
          <div class="campo"><label for="clave">Contraseña</label>
            <input id="clave" type="password" autocomplete="current-password" required></div>
          <button class="boton ancho" type="submit" id="btn">Entrar</button>
        </form>
        <div id="msj"></div>
      </div>`;
    document.getElementById('login').addEventListener('submit', async ev => {
      ev.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Un segundo…';
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('correo').value.trim(),
        password: document.getElementById('clave').value
      });
      if (error){
        btn.disabled = false; btn.textContent = 'Entrar';
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">${esc(
             error.message === 'Invalid login credentials'
               ? 'El correo o la contraseña no coinciden.' : error.message)}</div>`;
        return;
      }
      location.reload();
    });
    return;
  }

  if (!esDelEquipo(perfil)){
    contenido.innerHTML = `
      <h1 class="titulo-pantalla">ACCESO<br>RESERVADO</h1>
      <p class="bajada">
        Tu cuenta (${esc(usuario.email)}) existe, pero no forma parte del equipo
        de la agrupación, así que no puede administrar contenido.
      </p>
      <a class="boton ancho" href="../">Volver a la app</a>
      <button class="boton ancho borde" id="salir" style="margin-top:10px">Cerrar sesión</button>`;
    document.getElementById('salir').onclick = async () => {
      await db.auth.signOut(); location.reload();
    };
    return;
  }

  /* ============================================================
     ARMADO DEL PANEL
     ============================================================ */
  contenido.innerHTML = `
    <h1 class="titulo-pantalla">PANEL</h1>
    <p class="bajada">${esc(usuario.email)} · equipo</p>
    <div class="chips" id="pestanias">
      <button class="chip" data-p="tramites" aria-pressed="true">🧭 Trámites</button>
      <button class="chip" data-p="faq"      aria-pressed="false">❓ Preguntas</button>
      <button class="chip" data-p="agenda"   aria-pressed="false">📅 Agenda</button>
      <button class="chip" data-p="materiales" aria-pressed="false">📚 Estudiemos</button>
      <button class="chip" data-p="programas"  aria-pressed="false">📖 Programas</button>
      <button class="chip" data-p="guia"      aria-pressed="false">🧠 Guía de materia</button>
      <button class="chip" data-p="catedras"  aria-pressed="false">✉️ Cátedras</button>
      <button class="chip" data-p="quienes"    aria-pressed="false">✊ Quiénes somos</button>
      <button class="chip" data-p="consejo"   aria-pressed="false">🏛 Consejo</button>
      <button class="chip" data-p="avisanos"   aria-pressed="false">💬 Avisanos</button>
      <button class="chip" data-p="categorias" aria-pressed="false">🗂 Categorías</button>
      <button class="chip" data-p="registro"   aria-pressed="false">📈 Registro</button>
    </div>
    <div id="zona" style="margin-top:14px"></div>
    <button class="boton ancho borde" id="salir" style="margin-top:34px">Cerrar sesión</button>`;

  document.getElementById('salir').onclick = async () => {
    await db.auth.signOut(); location.href = '../';
  };

  const zona = document.getElementById('zona');
  const pestanias = document.getElementById('pestanias');
  let actual = 'tramites';
  let categorias = [];

  pestanias.addEventListener('click', ev => {
    const b = ev.target.closest('.chip');
    if (!b) return;
    actual = b.dataset.p;
    [...pestanias.children].forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.p === actual ? 'true' : 'false'));
    dibujar();
  });

  /* -------- helpers -------- */
  const val  = id => document.getElementById(id).value.trim();
  const nulo = id => val(id) || null;

  function aviso(texto, clase){
    zona.insertAdjacentHTML('afterbegin', `<div class="aviso ${clase}">${esc(texto)}</div>`);
  }

  async function cargarCategorias(){
    const { data } = await db.from('categorias').select('*').order('orden');
    categorias = data || [];
  }

  function opcionesCategoria(seleccionada){
    return `<option value="">— sin categoría —</option>` +
      categorias.map(c =>
        `<option value="${c.id}"${c.id === seleccionada ? ' selected' : ''}>${esc(c.emoji)} ${esc(c.nombre)}</option>`
      ).join('');
  }

  /* ============================================================
     TRÁMITES
     ============================================================ */
  async function vistaTramites(){
    await cargarCategorias();
    const { data, error } = await db.from('tramites')
      .select('*').order('orden').order('id');
    if (error){ mostrarError(zona, error, 'cargar los trámites'); return; }

    zona.innerHTML = `
      <button class="boton ancho" id="nuevo">+ Nuevo trámite</button>
      <div class="lista" style="margin-top:14px" id="lista"></div>`;

    document.getElementById('nuevo').onclick = () => formularioTramite(null);

    const lista = document.getElementById('lista');
    if (!data.length){
      lista.innerHTML = '<div class="vacio">Todavía no hay trámites. Creá el primero.</div>';
      return;
    }
    lista.innerHTML = data.map(t => {
      const c = categorias.find(c => c.id === t.categoria_id);
      return `<div class="tarjeta ${t.publicado ? '' : 'borrador'}">
        <div class="fila-item">
          <div class="crecer">
            <h3>${esc(t.titulo)}</h3>
            <p>${c ? esc(c.emoji + ' ' + c.nombre) : 'Sin categoría'}${t.publicado ? '' : ' · BORRADOR'}</p>
          </div>
          <button class="mini" data-editar="${t.id}">Editar</button>
        </div></div>`;
    }).join('');

    lista.addEventListener('click', ev => {
      const b = ev.target.closest('[data-editar]');
      if (b) formularioTramite(data.find(t => t.id === Number(b.dataset.editar)));
    });
  }

  function formularioTramite(t){
    const esNuevo = !t;
    t = t || { pasos:[], publicado:true, orden:0 };

    zona.innerHTML = `
      <button class="mini" id="volver">← Volver a la lista</button>
      <h2 class="titulo-pantalla" style="font-size:24px">${esNuevo ? 'NUEVO TRÁMITE' : 'EDITAR TRÁMITE'}</h2>

      <div class="campo"><label for="titulo">Título *</label>
        <input id="titulo" value="${esc(t.titulo || '')}" placeholder="Inscripción a finales"></div>

      <div class="campo"><label for="resumen">Resumen corto</label>
        <textarea id="resumen" style="min-height:60px"
          placeholder="Una línea que se ve en la lista">${esc(t.resumen || '')}</textarea></div>

      <div class="campo"><label for="categoria">Categoría</label>
        <select id="categoria">${opcionesCategoria(t.categoria_id)}</select></div>

      <div class="campo"><label for="requisitos">Qué necesita el estudiante</label>
        <textarea id="requisitos" style="min-height:60px"
          placeholder="DNI, libreta, número de legajo…">${esc(t.requisitos || '')}</textarea></div>

      <div class="dos-columnas">
        <div class="campo"><label for="plazo">Cuándo</label>
          <input id="plazo" value="${esc(t.plazo || '')}" placeholder="Del 1 al 10 de cada mes"></div>
        <div class="campo"><label for="donde">Dónde</label>
          <input id="donde" value="${esc(t.donde || '')}" placeholder="Alumnado, planta baja"></div>
      </div>

      <div class="titulo-seccion" style="font-size:var(--letra-guia)">PASO A PASO</div>
      <div id="pasos"></div>
      <button class="mini" id="agregar-paso">+ Agregar paso</button>

      <div class="dos-columnas" style="margin-top:20px">
        <div class="campo"><label for="link_titulo">Texto del botón</label>
          <input id="link_titulo" value="${esc(t.link_titulo || '')}" placeholder="Ir al SIU Guaraní"></div>
        <div class="campo"><label for="link_url">Enlace</label>
          <input id="link_url" type="url" value="${esc(t.link_url || '')}" placeholder="https://…"></div>
      </div>

      <div class="campo"><label for="palabras_clave">Palabras clave para el buscador</label>
        <input id="palabras_clave" value="${esc(t.palabras_clave || '')}"
          placeholder="mesa, examen, anotarse, guarani"></div>

      <div class="dos-columnas">
        <div class="campo"><label for="orden">Orden en la lista</label>
          <input id="orden" type="number" value="${Number(t.orden) || 0}"></div>
        <div class="campo"><label for="publicado">¿Se ve en la app?</label>
          <select id="publicado">
            <option value="si"${t.publicado ? ' selected' : ''}>Sí, publicado</option>
            <option value="no"${t.publicado ? '' : ' selected'}>No, borrador</option>
          </select></div>
      </div>

      <button class="boton ancho" id="guardar" style="margin-top:8px">Guardar</button>
      ${esNuevo ? '' : `<button class="boton ancho peligro" id="borrar" style="margin-top:10px">Eliminar trámite</button>`}
      <div id="msj"></div>`;

    document.getElementById('volver').onclick = vistaTramites;

    /* --- editor de pasos --- */
    const cajaPasos = document.getElementById('pasos');
    function pintarPasos(pasos){
      cajaPasos.innerHTML = pasos.length ? '' :
        '<p style="color:var(--texto-suave);font-size:var(--letra-densa)">Sin pasos todavía.</p>';
      pasos.forEach((p, i) => {
        cajaPasos.insertAdjacentHTML('beforeend', `
          <div class="paso-editor" data-i="${i}">
            <div class="encabezado"><span>Paso ${i + 1}</span>
              <span>
                ${i > 0 ? '<button class="mini" data-sube="' + i + '">↑</button>' : ''}
                <button class="mini rojo" data-quita="${i}">Quitar</button>
              </span></div>
            <div class="campo"><input class="p-titulo" value="${esc(p.titulo || '')}"
              placeholder="Qué hay que hacer"></div>
            <div class="campo"><textarea class="p-detalle" style="min-height:52px"
              placeholder="Aclaraciones (opcional)">${esc(p.detalle || '')}</textarea></div>
          </div>`);
      });
    }

    function leerPasos(){
      return [...cajaPasos.querySelectorAll('.paso-editor')].map(d => ({
        titulo:  d.querySelector('.p-titulo').value.trim(),
        detalle: d.querySelector('.p-detalle').value.trim()
      })).filter(p => p.titulo || p.detalle);
    }

    pintarPasos(Array.isArray(t.pasos) ? t.pasos : []);

    document.getElementById('agregar-paso').onclick = () =>
      pintarPasos([...leerPasos(), { titulo:'', detalle:'' }]);

    cajaPasos.addEventListener('click', ev => {
      const quita = ev.target.closest('[data-quita]');
      const sube  = ev.target.closest('[data-sube]');
      if (quita){
        const pasos = leerPasos();
        pasos.splice(Number(quita.dataset.quita), 1);
        pintarPasos(pasos);
      } else if (sube){
        const pasos = leerPasos();
        const i = Number(sube.dataset.sube);
        [pasos[i-1], pasos[i]] = [pasos[i], pasos[i-1]];
        pintarPasos(pasos);
      }
    });

    /* --- guardar --- */
    document.getElementById('guardar').onclick = async function(){
      if (!val('titulo')){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Falta el título.</div>';
        return;
      }
      this.disabled = true; this.textContent = 'Guardando…';

      const fila = {
        titulo:         val('titulo'),
        resumen:        nulo('resumen'),
        categoria_id:   val('categoria') ? Number(val('categoria')) : null,
        requisitos:     nulo('requisitos'),
        plazo:          nulo('plazo'),
        donde:          nulo('donde'),
        link_titulo:    nulo('link_titulo'),
        link_url:       nulo('link_url'),
        palabras_clave: nulo('palabras_clave'),
        orden:          Number(val('orden')) || 0,
        publicado:      val('publicado') === 'si',
        pasos:          leerPasos()
      };

      const { error } = esNuevo
        ? await db.from('tramites').insert(fila)
        : await db.from('tramites').update(fila).eq('id', t.id);

      if (error){
        this.disabled = false; this.textContent = 'Guardar';
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo guardar: ${esc(error.message)}</div>`;
        return;
      }
      await vistaTramites();
      aviso('Trámite guardado.', 'ok');
    };

    const btnBorrar = document.getElementById('borrar');
    if (btnBorrar) btnBorrar.onclick = async function(){
      if (!confirm('¿Eliminar «' + t.titulo + '»? No se puede deshacer.')) return;
      this.disabled = true;
      const { error } = await db.from('tramites').delete().eq('id', t.id);
      if (error){
        this.disabled = false;
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo eliminar: ${esc(error.message)}</div>`;
        return;
      }
      await vistaTramites();
      aviso('Trámite eliminado.', 'ok');
    };
  }

  /* ============================================================
     PREGUNTAS FRECUENTES
     ============================================================ */
  async function vistaFaq(){
    await cargarCategorias();
    const { data, error } = await db.from('faq').select('*').order('orden').order('id');
    if (error){ mostrarError(zona, error, 'cargar las preguntas'); return; }

    zona.innerHTML = `
      <button class="boton ancho" id="nuevo">+ Nueva pregunta</button>
      <div class="lista" style="margin-top:14px" id="lista"></div>`;
    document.getElementById('nuevo').onclick = () => formularioFaq(null);

    const lista = document.getElementById('lista');
    if (!data.length){
      lista.innerHTML = '<div class="vacio">Todavía no hay preguntas cargadas.</div>';
      return;
    }
    lista.innerHTML = data.map(f => `
      <div class="tarjeta ${f.publicado ? '' : 'borrador'}">
        <div class="fila-item">
          <div class="crecer"><h3>${esc(f.pregunta)}</h3>
            <p>${esc(f.respuesta.slice(0,90))}${f.respuesta.length > 90 ? '…' : ''}</p></div>
          <button class="mini" data-editar="${f.id}">Editar</button>
        </div></div>`).join('');

    lista.addEventListener('click', ev => {
      const b = ev.target.closest('[data-editar]');
      if (b) formularioFaq(data.find(f => f.id === Number(b.dataset.editar)));
    });
  }

  function formularioFaq(f){
    const esNuevo = !f;
    f = f || { publicado:true, orden:0 };

    zona.innerHTML = `
      <button class="mini" id="volver">← Volver a la lista</button>
      <h2 class="titulo-pantalla" style="font-size:24px">${esNuevo ? 'NUEVA PREGUNTA' : 'EDITAR PREGUNTA'}</h2>

      <div class="campo"><label for="pregunta">Pregunta *</label>
        <input id="pregunta" value="${esc(f.pregunta || '')}"
          placeholder="¿Cuántas veces puedo rendir un final?"></div>

      <div class="campo"><label for="respuesta">Respuesta *</label>

     AGENDA Y NOVEDADES

  async function vistaAgenda(){
    const { data, error } = await db.from('publicaciones')
      .select('*').order('creado_at', { ascending:false });
    if (error){ mostrarError(zona, error, 'cargar la agenda'); return; }

    zona.innerHTML = `
      <button class="boton ancho" id="nuevo">+ Nueva publicación</button>
      <div class="lista" style="margin-top:14px" id="lista"></div>`;
    document.getElementById('nuevo').onclick = () => formularioPublicacion(null);

    const lista = document.getElementById('lista');
    if (!data.length){
      lista.innerHTML = '<div class="vacio">Todavía no publicaste nada.</div>';
      return;
    }
    lista.innerHTML = data.map(p => `
      <div class="tarjeta ${esc(p.linea)} ${p.publicado ? '' : 'borrador'}">
        <div class="fila-item">
          <div class="crecer">
            <span class="etiqueta ${esc(p.linea)}">${esc(NOMBRE_LINEA[p.linea] || p.linea)}</span>
            <h3>${esc(p.titulo)}</h3>
            <p>${esc(rangoLindo(p.fecha_desde, p.fecha_hasta) || 'Sin fecha')}${p.publicado ? '' : ' · BORRADOR'}${
              p.alarma === 'inscripcion' ? ' · ALARMA: inscripción de ' + esc(p.periodo || '')
            : p.alarma === 'mesa'        ? ' · mesa de ' + esc(p.periodo || '')
            : ''}</p>
          </div>
          <button class="mini" data-editar="${p.id}">Editar</button>
        </div></div>`).join('');

    lista.addEventListener('click', ev => {
      const b = ev.target.closest('[data-editar]');
      if (b) formularioPublicacion(data.find(p => p.id === Number(b.dataset.editar)));
    });
  }

  function formularioPublicacion(p){
    const esNuevo = !p;
    p = p || { tipo:'novedad', linea:'info', publicado:true };

    const opcion = (v, txt, actual) =>
      `<option value="${v}"${v === actual ? ' selected' : ''}>${esc(txt)}</option>`;

    zona.innerHTML = `
      <button class="mini" id="volver">← Volver a la lista</button>
      <h2 class="titulo-pantalla" style="font-size:24px">${esNuevo ? 'NUEVA PUBLICACIÓN' : 'EDITAR PUBLICACIÓN'}</h2>

      <div class="campo"><label for="titulo">Título *</label>
        <input id="titulo" value="${esc(p.titulo || '')}" placeholder="Mesa de finales de septiembre"></div>

      <div class="dos-columnas">
        <div class="campo"><label for="tipo">Tipo</label>
          <select id="tipo">
            ${opcion('novedad','Novedad', p.tipo)}
            ${opcion('evento','Actividad o evento', p.tipo)}
            ${opcion('fecha','Fecha clave', p.tipo)}
          </select></div>
        <div class="campo"><label for="linea">Línea editorial</label>
          <select id="linea">
            ${opcion('info','Info importante (rojo)', p.linea)}
            ${opcion('gremial','Gremial (turquesa)', p.linea)}
            ${opcion('saberes','Saberes colectivos (celeste)', p.linea)}
            ${opcion('frente','Frente político (negro)', p.linea)}
          </select></div>
      </div>

      <!-- LA ALARMA DE LA PORTADA
           Esto es lo que hace que el inicio avise «faltan 4 días para
           anotarte». Hasta el 3/9/2026 se adivinaba del título, así que
           un título escrito distinto la apagaba sin avisarle a nadie.
           Ahora se elige acá. -->
      <div class="dos-columnas">
        <div class="campo"><label for="alarma">¿Alimenta la alarma de la portada?</label>
          <select id="alarma">
            <option value=""${p.alarma ? '' : ' selected'}>— Elegí —</option>
            ${opcion('inscripcion','Sí: es la INSCRIPCIÓN a una mesa', p.alarma)}
            ${opcion('mesa','Sí: es la MESA de examen', p.alarma)}
            ${opcion('ninguna','No tiene que ver con las mesas', p.alarma)}
          </select></div>
        <div class="campo"><label for="periodo">¿De qué mesa?</label>
          <input id="periodo" value="${esc(p.periodo || '')}" placeholder="septiembre"></div>
      </div>

      <div class="campo"><label for="cuerpo">Texto</label>
        <textarea id="cuerpo" style="min-height:120px">${esc(p.cuerpo || '')}</textarea></div>

      <div class="dos-columnas">
        <div class="campo"><label for="fecha_desde">Fecha (desde)</label>
          <input id="fecha_desde" type="date" value="${esc((p.fecha_desde || '').slice(0,10))}"></div>
        <div class="campo"><label for="fecha_hasta">Fecha (hasta)</label>
          <input id="fecha_hasta" type="date" value="${esc((p.fecha_hasta || '').slice(0,10))}"></div>
      </div>

      <div class="dos-columnas">
        <div class="campo"><label for="hora">Hora</label>
          <input id="hora" value="${esc(p.hora || '')}" placeholder="18:00"></div>
        <div class="campo"><label for="lugar">Lugar</label>
          <input id="lugar" value="${esc(p.lugar || '')}" placeholder="Aula 3"></div>
      </div>

      <div class="campo"><label for="imagen_url">Dirección de una imagen (opcional)</label>
        <input id="imagen_url" type="url" value="${esc(p.imagen_url || '')}" placeholder="https://…"></div>

      <div class="campo"><label for="link_url">Enlace (opcional)</label>
        <input id="link_url" type="url" value="${esc(p.link_url || '')}" placeholder="https://…"></div>

      <div class="campo"><label for="publicado">¿Se ve en la app?</label>
        <select id="publicado">
          <option value="si"${p.publicado ? ' selected' : ''}>Sí, publicada</option>
          <option value="no"${p.publicado ? '' : ' selected'}>No, borrador</option>
        </select></div>

      <button class="boton ancho" id="guardar">Guardar</button>
      ${esNuevo ? '' : `<button class="boton ancho peligro" id="borrar" style="margin-top:10px">Eliminar</button>`}
      <div id="msj"></div>`;

    document.getElementById('volver').onclick = vistaAgenda;

    document.getElementById('guardar').onclick = async function(){
      if (!val('titulo')){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Falta el título.</div>';
        return;
      }
      const desde = nulo('fecha_desde'), hasta = nulo('fecha_hasta');
      if (desde && hasta && hasta < desde){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">La fecha «hasta» es anterior a la de «desde».</div>';
        return;
      }
      /* La alarma es lo más útil que hace la app, y lo que no se marca
         no avisa. Si el título habla de una mesa y nadie dijo qué es,
         se pregunta UNA vez: eligiendo «No tiene que ver con las
         mesas» queda decidido y no vuelve a molestar. */
      const alarma  = val('alarma');
      const periodo = nulo('periodo');
      if (!alarma && /^(inscripci[óo]n a la mesa|mesa de examen)/i.test(val('titulo'))){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">El título habla de una mesa, así que hace falta ' +
          'decir qué es en «¿Alimenta la alarma de la portada?». Si de verdad no tiene ' +
          'nada que ver, elegí esa opción y no se pregunta más.</div>';
        return;
      }
      if ((alarma === 'inscripcion' || alarma === 'mesa') && !periodo){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Falta «¿De qué mesa?». Va el mes solo: septiembre.</div>';
        return;
      }

      this.disabled = true; this.textContent = 'Guardando…';

      const fila = {
        titulo:      val('titulo'),
        tipo:        val('tipo'),
        linea:       val('linea'),
        alarma:      alarma || null,
        periodo:     (alarma === 'inscripcion' || alarma === 'mesa') ? periodo : null,
        cuerpo:      nulo('cuerpo'),
        fecha_desde: desde,
        fecha_hasta: hasta,
        hora:        nulo('hora'),
        lugar:       nulo('lugar'),
        imagen_url:  nulo('imagen_url'),
        link_url:    nulo('link_url'),
        publicado:   val('publicado') === 'si'
      };

      const { error } = esNuevo
        ? await db.from('publicaciones').insert(fila)
        : await db.from('publicaciones').update(fila).eq('id', p.id);

      if (error){
        this.disabled = false; this.textContent = 'Guardar';
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo guardar: ${esc(error.message)}</div>`;
        return;
      }
      await vistaAgenda();
      aviso('Publicación guardada.', 'ok');
    };

    const btnBorrar = document.getElementById('borrar');
    if (btnBorrar) btnBorrar.onclick = async function(){
      if (!confirm('¿Eliminar «' + p.titulo + '»?')) return;
      this.disabled = true;
      const { error } = await db.from('publicaciones').delete().eq('id', p.id);
      if (error){
        this.disabled = false;
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo eliminar: ${esc(error.message)}</div>`;
        return;
      }
      await vistaAgenda();
      aviso('Publicación eliminada.', 'ok');
    };
  }

  async function vistaCategorias(){
    await cargarCategorias();

    zona.innerHTML = `
      <p style="color:var(--texto-suave);font-size:var(--letra-densa);margin-top:0">
        Las categorías son los cuadraditos de la pantalla de inicio.</p>
      <div class="ficha">
        <div class="dos-columnas">
          <div class="campo"><label for="n-emoji">Emoji</label>
            <input id="n-emoji" value="📌" maxlength="4"></div>
          <div class="campo"><label for="n-orden">Orden</label>
            <input id="n-orden" type="number" value="${categorias.length + 1}"></div>
        </div>
        <div class="campo"><label for="n-nombre">Nombre de la categoría</label>
          <input id="n-nombre" placeholder="Becas y ayudas"></div>
        <div class="campo"><label for="n-seccion">¿En qué puerta va?</label>
          <select id="n-seccion">
            <option value="carrera">🎓 Mi carrera</option>
            <option value="derechos">⚖️ Mis derechos</option>
          </select></div>
        <button class="boton ancho" id="agregar">+ Agregar categoría</button>
      </div>
      <div class="lista" id="lista"></div>
      <div id="msj"></div>`;

    document.getElementById('agregar').onclick = async function(){
      const nombre = document.getElementById('n-nombre').value.trim();
      if (!nombre){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Escribí un nombre.</div>';
        return;
      }
      this.disabled = true;
      const { error } = await db.from('categorias').insert({
        nombre,
        emoji:   document.getElementById('n-emoji').value.trim() || '📌',
        orden:   Number(document.getElementById('n-orden').value) || 0,
        seccion: document.getElementById('n-seccion').value
      });
      if (error){
        this.disabled = false;
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo agregar: ${esc(error.message)}</div>`;
        return;
      }
      vistaCategorias();
    };

    const lista = document.getElementById('lista');
    lista.innerHTML = Object.keys(NOMBRE_SECCION).map(s => {
      const suyas = categorias.filter(c => (c.seccion || 'carrera') === s);
      if (!suyas.length) return '';
      return `<div class="titulo-seccion" style="font-size:var(--letra-guia)">${esc(NOMBRE_SECCION[s].toUpperCase())}</div>` +
        suyas.map(c => `
          <div class="tarjeta">
            <div class="fila-item">
              <div class="crecer"><h3>${esc(c.emoji)} ${esc(c.nombre)}</h3>
                <p>Orden ${c.orden}</p></div>
              <button class="mini" data-mover="${c.id}">Mover</button>
              <button class="mini rojo" data-borrar="${c.id}">Eliminar</button>
            </div></div>`).join('');
    }).join('');

    lista.addEventListener('click', async ev => {
      /* Mover una categoría de una puerta a la otra */
      const m = ev.target.closest('[data-mover]');
      if (m){
        const c = categorias.find(x => x.id === Number(m.dataset.mover));
        const destino = (c.seccion || 'carrera') === 'carrera' ? 'derechos' : 'carrera';
        m.disabled = true;
        const { error } = await db.from('categorias').update({ seccion: destino }).eq('id', c.id);
        if (error){
          document.getElementById('msj').innerHTML =
            `<div class="aviso error">No se pudo mover: ${esc(error.message)}</div>`;
          m.disabled = false;
          return;
        }
        vistaCategorias();
        return;
      }

      const b = ev.target.closest('[data-borrar]');
      if (!b) return;
      const c = categorias.find(x => x.id === Number(b.dataset.borrar));
      if (!confirm('¿Eliminar «' + c.nombre + '»? Los trámites que la usaban quedan sin categoría.')) return;
      b.disabled = true;
      const { error } = await db.from('categorias').delete().eq('id', c.id);
      if (error){
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo eliminar: ${esc(error.message)}</div>`;
        b.disabled = false;
        return;
      }
      vistaCategorias();
    });
  }

      /* Si todavía no corrieron el SQL, lo decimos sin jerga */
      zona.innerHTML = /materiales/.test(error.message || '')

  /* ============================================================
     PROGRAMAS · lo que el equipo carga una vez y usan todos

     Se carga PEGANDO el programa tal como viene de la cátedra, no
     llenando un campo por texto: un programa tiene treinta textos y
     nadie va a tipear treinta formularios.
     ============================================================ */
  const CARRERAS_PANEL = { ts:'Trabajo Social', tgcr:'Gestión del Riesgo', fono:'Fonoaudiología' };

  /* De texto pegado a unidades: un bloque por unidad, el primer renglón
     es el título y los de abajo son los textos, uno por línea. */
  function leerPrograma(texto){
    return texto.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
      const lineas = b.split('\n').map(l => l.trim()).filter(Boolean);
      return {
        titulo: lineas.shift(),
        textos: lineas.map(l => {
          const p = l.split(/\s*[·;]\s*/);
          if (p.length >= 3) return { autor:p[0], anio:p[1], titulo:p.slice(2).join(' · ') };
          if (p.length === 2) return { autor:p[0], anio:'', titulo:p[1] };
          return { autor:'', anio:'', titulo:p[0] };
        })
      };
    });
  }

  function escribirPrograma(unidades){
    return (unidades || []).map(u =>
      (u.titulo || '') + '\n' + (u.textos || []).map(t =>
        [t.autor, t.anio, t.titulo].filter(Boolean).join(' · ')).join('\n')
    ).join('\n\n');
  }

  function contarTextosPanel(unidades){
    return (unidades || []).reduce((s, u) => s + (u.textos || []).length, 0);
  }

  async function vistaProgramas(){
    const { data, error } = await db.from('programas')
      .select('*').order('carrera').order('materia');

    if (error){
      zona.innerHTML = /programas/.test(error.message || '')
        ? `<div class="aviso error">
             <strong>Falta activar esta sección.</strong><br>
             Hay que correr <b>tabla-organizador.sql</b> en el SQL Editor de
             Supabase. Es una sola vez.
           </div>`
        : `<div class="aviso error">No se pudo cargar: ${esc(error.message)}</div>`;
      return;
    }

    zona.innerHTML =
      `<button class="boton ancho" id="desde-pdf">📄 Cargar programas desde PDF</button>
       <button class="boton ancho borde" id="nuevo" style="margin-top:8px">+ Cargar uno a mano</button>
       <p class="letra-chica" style="margin-bottom:6px;margin-top:8px">
         Cada estudiante se lleva una copia al empezar a preparar el final, y
         puede editarla. Corregir el programa acá no le reescribe el plan a
         quien ya lo empezó.</p>` +

      /* Los programas cargados desde PDF entran como borrador, y en
         borrador no los ve nadie: la pantalla de la materia solo pide
         los publicados. Cargar 45 de una y después tener que abrirlos
         de a uno para publicarlos no era una revisión cuidadosa, era
         un castigo. Este botón aparece solo si hay borradores. */
      (data.some(p => !p.publicado)
        ? `<div class="aviso" style="margin-bottom:10px">
             Hay <b>${data.filter(p => !p.publicado).length}</b> en borrador.
             Mientras estén así no los ve ningún estudiante.
             <button class="boton ancho" id="publicar-todos" style="margin-top:8px">
               Publicar los ${data.filter(p => !p.publicado).length}</button>
           </div>`
        : '') +
      (data.length ? data.map(p => `
        <button class="tarjeta" data-id="${p.id}">
          <h3>${esc(p.materia)}</h3>
          <p>${esc(CARRERAS_PANEL[p.carrera] || p.carrera)}${p.catedra ? ' · ' + esc(p.catedra) : ''}</p>
          <div class="meta">
            <span>${(p.unidades || []).length} unidades</span>
            <span>${contarTextosPanel(p.unidades)} textos</span>
            ${p.anio ? `<span>${p.anio}</span>` : ''}
            <span>${p.publicado ? 'Publicado' : 'Borrador'}</span>
          </div>
        </button>`).join('')
        : `<div class="vacio">Todavía no hay ningún programa cargado.</div>`);

    document.getElementById('nuevo').onclick = () => formularioPrograma(null);
    document.getElementById('desde-pdf').onclick = () => vistaProgramasPDF(data);

    const publicarTodos = document.getElementById('publicar-todos');
    if (publicarTodos) publicarTodos.onclick = async function(){
      const borradores = data.filter(p => !p.publicado);
      if (!confirm('¿Publicar ' + borradores.length + ' programas?\n\n' +
                   'A partir de ahí los estudiantes los ven al preparar un final. ' +
                   'Se puede volver atrás uno por uno.')) return;
      this.disabled = true; this.textContent = 'Publicando…';
      const { error } = await db.from('programas')
        .update({ publicado: true })
        .in('id', borradores.map(p => p.id));
      if (error){
        this.disabled = false; this.textContent = 'Publicar los ' + borradores.length;
        alert('No se pudieron publicar: ' + error.message);
        return;
      }
      vistaProgramas();
    };
    zona.querySelectorAll('.tarjeta[data-id]').forEach(b => {
      b.onclick = () => formularioPrograma(data.find(x => x.id === Number(b.dataset.id)));
    });
  }

  function formularioPrograma(p){
    /* Se mira el id, no el objeto: la carga desde PDF abre este mismo
       formulario con lo que leyó ya puesto, y eso sigue siendo un
       programa nuevo. Con `!p` a secas intentaría actualizar la fila
       de id `undefined` y no guardaría nada, sin decir por qué. */
    const esNuevo = !(p && p.id);
    p = p || { carrera:'ts', publicado:true, unidades:[] };

    zona.innerHTML = `
      <button class="mini" id="volver">← Volver a la lista</button>
      <h2 class="titulo-pantalla" style="font-size:24px">${esNuevo ? 'CARGAR UN PROGRAMA' : 'EDITAR EL PROGRAMA'}</h2>

      <div class="dos-columnas">
        <div class="campo"><label for="carrera">Carrera</label>
          <select id="carrera">${Object.keys(CARRERAS_PANEL).map(k =>
            `<option value="${k}"${p.carrera === k ? ' selected' : ''}>${CARRERAS_PANEL[k]}</option>`).join('')}
          </select></div>
        <div class="campo"><label for="materia_cod">Código de la materia *</label>
          <input id="materia_cod" value="${esc(p.materia_cod || '')}" placeholder="211 A"></div>
      </div>
      <p class="letra-chica" style="margin-top:-6px">
        El código tiene que ser <b>igual al del plan de estudios</b>: es lo que
        conecta el programa con la materia. Está en «Plan completo».</p>

      <div class="campo"><label for="materia">Nombre de la materia *</label>
        <input id="materia" value="${esc(p.materia || '')}" placeholder="Trabajo Social I"></div>

      <div class="dos-columnas">
        <div class="campo"><label for="catedra">Cátedra</label>
          <input id="catedra" value="${esc(p.catedra || '')}" placeholder="Opcional"></div>
        <div class="campo"><label for="anio">Año del programa</label>
          <input id="anio" type="number" value="${p.anio || ''}" placeholder="2026"></div>
      </div>

      <div class="campo">
        <label for="unidades">El programa</label>
        <p class="letra-chica" style="margin:0 0 6px">
          Pegalo tal como viene. Una unidad por bloque, separando los bloques
          con un renglón en blanco. El primer renglón de cada bloque es el
          título de la unidad y los de abajo son los textos, uno por línea.
          Para separar autor, año y título usá <b>·</b> o punto y coma.</p>
        <textarea id="unidades" style="min-height:300px;font-family:var(--fuente-datos);font-size:var(--letra-densa)"
          placeholder="Unidad 1: El campo profesional&#10;Carballeda · 2002 · La intervención en lo social&#10;Rozas Pagaza · 1998 · Una perspectiva teórica metodológica&#10;&#10;Unidad 2: La cuestión social&#10;Castel · 1997 · Las metamorfosis de la cuestión social">${esc(escribirPrograma(p.unidades))}</textarea>
      </div>
      <div id="vista-previa"></div>

      <div class="campo"><label for="publicado">¿Lo ven los estudiantes?</label>
        <select id="publicado">
          <option value="si"${p.publicado ? ' selected' : ''}>Sí, publicado</option>
          <option value="no"${p.publicado ? '' : ' selected'}>No, borrador</option>
        </select></div>

      <button class="boton ancho" id="guardar">Guardar</button>
      ${esNuevo ? '' : `<button class="boton ancho peligro" id="borrar" style="margin-top:10px">Eliminar</button>`}
      <div id="msj"></div>`;

    /* Se ve al toque cómo va a quedar leído: si el formato está mal, se
       nota acá y no después, cuando ya lo copió un estudiante. */
    const campo = document.getElementById('unidades');
    const previa = document.getElementById('vista-previa');
    function verPrevia(){
      const u = leerPrograma(campo.value);
      previa.innerHTML = u.length
        ? `<div class="aviso ok">Van a quedar <b>${u.length}</b>
             unidad${u.length === 1 ? '' : 'es'} y
             <b>${contarTextosPanel(u)}</b> textos.</div>`
        : '';
    }
    campo.addEventListener('input', verPrevia);
    verPrevia();

    document.getElementById('volver').onclick = vistaProgramas;

    document.getElementById('guardar').onclick = async function(){
      if (!val('materia_cod') || !val('materia')){
        document.getElementById('msj').innerHTML =
          '<div class="aviso error">Falta el código o el nombre de la materia.</div>';
        return;
      }
      this.disabled = true; this.textContent = 'Guardando…';
      const fila = {
        carrera:     val('carrera'),
        materia_cod: val('materia_cod'),
        materia:     val('materia'),
        catedra:     nulo('catedra'),
        anio:        val('anio') ? Number(val('anio')) : null,
        unidades:    leerPrograma(campo.value),
        publicado:   val('publicado') === 'si'
      };
      const { error } = esNuevo
        ? await db.from('programas').insert(fila)
        : await db.from('programas').update(fila).eq('id', p.id);
      if (error){
        this.disabled = false; this.textContent = 'Guardar';
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">${/duplicate|unique/i.test(error.message)
            ? 'Ya hay un programa cargado para esa materia, cátedra y año.'
            : 'No se pudo guardar: ' + esc(error.message)}</div>`;
        return;
      }
      vistaProgramas();
    };

    const borrar = document.getElementById('borrar');
    if (borrar) borrar.onclick = async function(){
      if (!confirm('¿Eliminar este programa?\n\nA quien ya lo esté usando no se le borra: se llevó una copia.')) return;
      const { error } = await db.from('programas').delete().eq('id', p.id);
      if (error){
        document.getElementById('msj').innerHTML =
          `<div class="aviso error">No se pudo eliminar: ${esc(error.message)}</div>`;
        return;
      }
      vistaProgramas();
    };
  }

  /* ============================================================
     CARGAR PROGRAMAS DESDE PDF

     Cincuenta y tres materias. Pegar cada programa a mano en el
     formulario de arriba es una tarde entera por carrera, y encima
     hay que rehacerlo cada año cuando las cátedras publican los
     nuevos. Acá se arrastran los PDFs y salen leídos.

     TRES COSAS QUE NO SON OBVIAS:

     1. El PDF NO SE MANDA A NINGÚN LADO PARA LEERLO. pdf.js le saca
        el texto en la máquina de quien lo sube. Al servidor va el
        resultado, y el archivo solo si se pide guardarlo.

     2. NADA SE GUARDA SOLO. Se lee todo, se muestra qué entendió de
        cada uno, y recién con «Guardar» se escribe. Un parser que
        guarda sin mostrar es un parser que se equivoca en silencio, y
        el error aparece meses después, cuando alguien estudia con un
        programa mal cargado.

     3. LO QUE NO PUDO LEER NO SE PIERDE. Se abre en el formulario de
        siempre con el texto del PDF ya extraído, así igual no hay que
        copiar y pegar desde el visor de PDF.
     ============================================================ */

  /* Le saca el texto a un PDF, hoja por hoja. El `-layout` que hace
     pdftotext no existe acá, así que se reconstruyen los renglones
     por la coordenada Y de cada pedazo: si dos pedazos están a la
     misma altura, van en el mismo renglón. Sin esto sale todo el
     programa en una sola línea y no se reconoce ni una unidad. */
  async function textoDelPdf(archivo){
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../lib/pdf.worker.js';
    const datos = await archivo.arrayBuffer();
    const doc   = await pdfjsLib.getDocument({ data: datos }).promise;
    let texto = '';

    for (let n = 1; n <= doc.numPages; n++){
      const hoja = await doc.getPage(n);
      const cont = await hoja.getTextContent();
      let renglones = [], actual = null;

      cont.items.forEach(it => {
        if (!it.str) return;
        const y = Math.round(it.transform[5]);
        /* Dos puntos de tolerancia: los acentos y las viñetas vienen
           un pelo más arriba que el resto del renglón. */
        if (actual && Math.abs(actual.y - y) <= 2){
          actual.partes.push(it.str);
        } else {
          if (actual) renglones.push(actual);
          actual = { y: y, partes: [it.str] };
        }
      });
      if (actual) renglones.push(actual);

      texto += renglones.map(r => r.partes.join('')).join('\n') + '\n';
    }
    return texto;
  }

  /* Nombre dentro del depósito. Lleva la materia adelante para que se
     entienda de qué es al mirar el depósito, y la hora al final para
     que subir dos veces la misma materia no pise el archivo anterior. */
  function nombreDePdf(lectura){
    const base = (lectura.materia || lectura.archivo)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
    return (lectura.carrera || 'sin-carrera') + '-' + base + '-' + Date.now() + '.pdf';
  }

  async function subirPdf(archivo, nombre){
    const { error } = await db.storage.from('programas')
      .upload(nombre, archivo, { contentType: 'application/pdf' });
    if (error){
      if (/Bucket not found/i.test(error.message || ''))
        throw new Error('Falta correr tabla-programas-pdf.sql en Supabase.');
      if (/row-level security|Unauthorized/i.test(error.message || ''))
        throw new Error('Tu cuenta no tiene permiso para subir archivos. Tiene que estar como «equipo».');
      throw error;
    }
    return db.storage.from('programas').getPublicUrl(nombre).data.publicUrl;
  }

  function vistaProgramasPDF(yaCargados){
    const CARRERAS = CARRERAS_PANEL;
    let lecturas = [];

    zona.innerHTML = `
      <button class="mini" id="volver">← Volver a los programas</button>
      <h2 class="titulo-pantalla" style="font-size:24px">CARGAR DESDE PDF</h2>

      <div class="zona-soltar" id="soltar">
        <p style="margin:0 0 10px"><b>Arrastrá acá los PDFs de los programas.</b><br>
          <span class="letra-chica">Todos juntos si querés. Se leen en tu teléfono o
          computadora: no se mandan a ningún lado hasta que toques Guardar.</span></p>
        <input type="file" id="archivos" accept="application/pdf" multiple hidden>
        <button class="boton borde" id="elegir">Elegir archivos</button>
      </div>

      <div class="dos-columnas">
        <div class="campo"><label for="anio-tanda">Año de estos programas</label>
          <input id="anio-tanda" type="number" value="${new Date().getFullYear()}"></div>
        <div class="campo"><label for="publicar-tanda">¿Los ven los estudiantes?</label>
          <select id="publicar-tanda">
            <option value="no">No todavía, borradores</option>
            <option value="si">Sí, publicados</option>
          </select></div>
      </div>
      <p class="letra-chica" style="margin-top:-6px">
        El año se usa solo para los programas donde el PDF no lo dice.
        Arrancan como borrador a propósito: así se pueden revisar contra
        el PDF antes de que alguien estudie con ellos.</p>

      <div id="lista"></div>
      <div id="msj"></div>`;

    document.getElementById('volver').onclick = vistaProgramas;
    const entrada = document.getElementById('archivos');
    const soltar  = document.getElementById('soltar');
    const lista   = document.getElementById('lista');

    document.getElementById('elegir').onclick = () => entrada.click();
    entrada.onchange = () => procesar([...entrada.files]);

    ['dragenter', 'dragover'].forEach(e => soltar.addEventListener(e, ev => {
      ev.preventDefault(); soltar.classList.add('encima');
    }));
    ['dragleave', 'drop'].forEach(e => soltar.addEventListener(e, ev => {
      ev.preventDefault(); soltar.classList.remove('encima');
    }));
    soltar.addEventListener('drop', ev => {
      procesar([...ev.dataTransfer.files].filter(f => /\.pdf$/i.test(f.name)));
    });

    /* ---------- Leer ---------- */
    async function procesar(archivos){
      if (!archivos.length) return;
      lista.innerHTML = `<div class="aviso">Leyendo ${archivos.length} archivo${archivos.length === 1 ? '' : 's'}…</div>`;

      for (const archivo of archivos){
        let lectura;
        try {
          const texto = await textoDelPdf(archivo);
          lectura = LeerPrograma.desdeTexto(texto);
          lectura.archivo = archivo.name;
          lectura.file    = archivo;
          lectura.calidad = LeerPrograma.calidad(lectura.unidades);
          lectura.guardar = !!(lectura.materia && lectura.unidades.length);
        } catch(e){
          lectura = { archivo: archivo.name, file: archivo, materia: '', carrera: null,
                      materia_cod: '', anio: null, unidades: [], calidad: 0,
                      guardar: false, crudo: '',
                      avisos: ['No se pudo abrir el PDF: ' + (e.message || e)] };
        }
        /* Si esa materia ya está cargada, se avisa antes y no después
           de que la base rechace el duplicado. */
        const repetido = (yaCargados || []).find(p =>
          p.carrera === lectura.carrera && p.materia_cod === lectura.materia_cod);
        if (repetido){
          lectura.avisos = lectura.avisos.concat(['Esta materia ya está cargada. Si lo guardás, se reemplaza.']);
          lectura.reemplaza = repetido.id;
        }
        lecturas.push(lectura);
        pintarLista();
      }
    }

    /* ---------- Mostrar ---------- */
    function pintarLista(){
      if (!lecturas.length){ lista.innerHTML = ''; return; }

      const listos = lecturas.filter(l => l.guardar).length;

      lista.innerHTML = lecturas.map((l, i) => {
        const clase = !l.unidades.length ? 'mal' : (l.avisos.length ? 'avisa' : 'bien');
        const textos = LeerPrograma.contarTextos(l.unidades);
        return `
        <div class="lectura ${clase}">
          <input type="checkbox" data-i="${i}" class="marcar" ${l.guardar ? 'checked' : ''}
                 ${l.materia && l.unidades.length ? '' : 'disabled'} style="margin-top:4px"
                 aria-label="Guardar ${esc(l.materia || l.archivo)}">
          <div class="crecer">
            <h4>${esc(l.materia || 'No se reconoció la materia')}</h4>
            <div class="archivo">${esc(l.archivo)}</div>
            <div class="cuentas">
              ${l.carrera ? esc(CARRERAS[l.carrera]) + ' · ' : ''}
              ${l.materia_cod ? 'cód. ' + esc(l.materia_cod) + ' · ' : ''}
              ${l.unidades.length} unidades · ${textos} textos
              ${textos ? ' · ' + l.calidad + '% con autor y año' : ''}
            </div>
            ${l.avisos.length
              ? `<div class="porque">⚠ ${l.avisos.map(a => esc(a)).join('<br>⚠ ')}</div>` : ''}
            ${l.materia ? '' :
              `<div class="porque">Sin materia reconocida no se puede guardar solo:
                 abrilo y elegí la materia a mano.</div>`}
          </div>
          <button class="mini" data-abrir="${i}">Abrir</button>
        </div>`;
      }).join('') + `
        <div class="campo" style="margin-top:12px">
          <label><input type="checkbox" id="guardar-pdf" checked>
            Guardar también el PDF original, para que se pueda ver el oficial</label>
        </div>
        <button class="boton ancho" id="guardar-todo" ${listos ? '' : 'disabled'}>
          Guardar ${listos} programa${listos === 1 ? '' : 's'}</button>`;

      lista.querySelectorAll('.marcar').forEach(c => {
        c.onchange = () => { lecturas[+c.dataset.i].guardar = c.checked; pintarLista(); };
      });
      /* «Abrir» lleva al formulario de siempre, con lo leído ya puesto.
         Para los que fallaron es la salida: el texto del PDF va en el
         campo grande y se acomoda a mano, sin copiar del visor. */
      lista.querySelectorAll('[data-abrir]').forEach(b => {
        b.onclick = () => {
          const l = lecturas[+b.dataset.abrir];
          formularioPrograma({
            carrera: l.carrera || 'ts', materia_cod: l.materia_cod, materia: l.materia,
            catedra: null, anio: l.anio || Number(val('anio-tanda')) || null,
            unidades: l.unidades.length ? l.unidades
                    : [{ titulo: 'Pegar acá el programa', textos: [] }],
            publicado: false
          });
        };
      });
      document.getElementById('guardar-todo').onclick = guardarTodo;
    }

    /* ---------- Guardar ---------- */
    async function guardarTodo(){
      const boton = document.getElementById('guardar-todo');
      const conPdf = document.getElementById('guardar-pdf').checked;
      const anioTanda  = Number(document.getElementById('anio-tanda').value) || null;
      const publicados = document.getElementById('publicar-tanda').value === 'si';
      const elegidos = lecturas.filter(l => l.guardar);

      boton.disabled = true;
      let hechos = 0, fallados = [];

      for (const l of elegidos){
        boton.textContent = `Guardando ${hechos + 1} de ${elegidos.length}…`;
        try {
          let pdfUrl = null, pdfNombre = null;
          if (conPdf){
            pdfNombre = nombreDePdf(l);
            pdfUrl    = await subirPdf(l.file, pdfNombre);
          }
          const fila = {
            carrera: l.carrera, materia_cod: l.materia_cod, materia: l.materia,
            anio: l.anio || anioTanda, unidades: l.unidades,
            publicado: publicados, pdf_url: pdfUrl, pdf_nombre: pdfNombre,
            revisado: false,
            origen: l.archivo + (l.avisos.length ? ' · ' + l.avisos.join(' ') : '')
          };
          const { error } = l.reemplaza
            ? await db.from('programas').update(fila).eq('id', l.reemplaza)
            : await db.from('programas').insert(fila);
          if (error) throw error;
          hechos++;
        } catch(e){
          fallados.push(l.archivo + ': ' + (e.message || e));
        }
      }

      document.getElementById('msj').innerHTML =
        `<div class="aviso ${fallados.length ? 'error' : 'ok'}">
           Se guardaron <b>${hechos}</b> de ${elegidos.length}.
           ${publicados ? '' : 'Quedaron como borrador: se publican desde la lista.'}
           ${fallados.length ? '<br>No entraron:<br>' + fallados.map(esc).join('<br>') : ''}
         </div>`;
      boton.textContent = 'Guardar';
      boton.disabled = false;
      if (hechos) setTimeout(vistaProgramas, 2500);
    }
  }

  /* ============================================================
     ¿QUIÉNES SOMOS?  ·  una sola página, no una lista

     Era la única pantalla que había que editar tocando el archivo. No
     tenía sentido: ese texto lo escribe la agrupación.

     No hay lista ni botón de «nuevo»: es UNA página. El formulario se
     abre directamente y guarda arriba de lo que había.
     ============================================================ */

  /* Los bloques se escriben como el programa de una materia: un bloque
     por sección, el primer renglón es el título y los de abajo son los
     párrafos. Es la misma convención en toda la app. */
  function leerBloques(texto){
    return texto.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
      const lineas = b.split('\n').map(l => l.trim()).filter(Boolean);
      return { titulo: lineas.shift() || '', parrafos: lineas };
    });
  }
  function escribirBloques(bloques){
    return (bloques || []).map(b =>
      (b.titulo || '') + '\n' + (b.parrafos || []).join('\n')).join('\n\n');
  }

  function leerRedes(texto){
    return texto.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const p = l.split(/\s*[·;|]\s*/);
      return { nombre: p[0] || '', url: (p[1] || '').trim() };
    }).filter(r => r.nombre);
  }
  function escribirRedes(redes){
    return (redes || []).map(r => r.nombre + ' · ' + (r.url || '')).join('\n');
  }


  /* ============================================================
     LAS FOTOS DE LA AGRUPACIÓN

     Una foto por bloque de texto: la foto va al lado de lo que ese
     bloque cuenta. Se suben al depósito «fotos» de Supabase desde el
     panel, o sea desde el celular, sin que pase por quien programa.

     Se achican ANTES de salir. Una foto de teléfono pesa 3 o 4 MB y en
     la red de la facultad eso no sube ni baja; achicada a 1600px de
     lado queda en 200 o 300 KB y en pantalla se ve igual.
     ============================================================ */

  const MAX_LADO = 1600;

  function achicarFoto(archivo){
    return new Promise(function(listo, fallo){
      const lector = new FileReader();
      lector.onerror = function(){ fallo(new Error('No se pudo leer ese archivo.')); };
      lector.onload = function(){
        const img = new Image();
        img.onerror = function(){ fallo(new Error('Ese archivo no es una imagen.')); };
        img.onload = function(){
          const escala = Math.min(1, MAX_LADO / Math.max(img.width, img.height));
          const lienzo = document.createElement('canvas');
          lienzo.width  = Math.round(img.width  * escala);
          lienzo.height = Math.round(img.height * escala);
          lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
          lienzo.toBlob(function(b){
            b ? listo(b) : fallo(new Error('No se pudo preparar la foto.'));
          }, 'image/jpeg', 0.82);
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(archivo);
    });
  }

  async function subirFoto(archivo, prefijo){
    const chica  = await achicarFoto(archivo);
    const nombre = prefijo + '-' + Date.now() + '.jpg';
    const { error } = await db.storage.from('fotos')
      .upload(nombre, chica, { contentType:'image/jpeg' });
    if (error){
      if (/Bucket not found/i.test(error.message || ''))
        throw new Error('Falta activar el depósito de fotos: hay que correr tabla-fotos.sql en Supabase.');
      if (/row-level security|Unauthorized/i.test(error.message || ''))
        throw new Error('Tu cuenta no tiene permiso para subir fotos. Tiene que estar como «equipo».');
      throw error;
    }
    return { url: db.storage.from('fotos').getPublicUrl(nombre).data.publicUrl,
             nombre: nombre };
  }

  /* Borra el archivo del depósito además de sacarlo de la pantalla. Si
     una compañera pide que saquen su foto, tiene que desaparecer de
     verdad, no solo dejar de mostrarse. */
  async function borrarFoto(nombre){
    if (!nombre) return;
    try { await db.storage.from('fotos').remove([nombre]); } catch(e){ /* ya no estaba */ }
  }

  /* Dibuja una ranura de foto por cada bloque de texto y devuelve el
     mismo arreglo que le pasaron, ya modificado. Lo usan las dos
     pantallas: «¿Quiénes somos?» y el Consejo Directivo. */
  function montarFotos(donde, bloques, imagenes, prefijo){
    const caja = document.getElementById(donde);
    if (!caja) return;

    function dibujar(){
      if (!bloques.length){
        caja.innerHTML = `<p class="letra-chica">Escribí primero los bloques de
          texto de acá arriba y guardá: cada bloque va a poder llevar su foto.</p>`;
        return;
      }
      caja.innerHTML = bloques.map(function(b, i){
        const f = imagenes[i] || {};
        return `
        <div class="ranura-foto">
          <p class="ranura-donde">Al lado de: <b>${esc(b.titulo || 'bloque sin título')}</b></p>
          ${f.url ? `
            <img class="ranura-vista" src="${esc(f.url)}" alt="">
            <div class="campo">
              <label for="epi-${i}">Qué se ve en la foto</label>
              <input id="epi-${i}" data-epi="${i}" value="${esc(f.epigrafe || '')}"
                     placeholder="Asamblea de carrera, mayo de 2026">
            </div>
            <div class="ranura-botones">
              <button class="boton borde" data-cambiar="${i}">Cambiar la foto</button>
              <button class="boton texto" data-sacar="${i}">Sacar la foto</button>
            </div>`
          : `
            <button class="boton borde ancho" data-cambiar="${i}">Elegir una foto</button>`}
          <input type="file" accept="image/jpeg,image/png,image/webp"
                 data-archivo="${i}" hidden>
          <div data-msj="${i}"></div>
        </div>`;
      }).join('');

      caja.querySelectorAll('[data-cambiar]').forEach(function(b){
        b.onclick = function(){
          caja.querySelector('[data-archivo="' + this.dataset.cambiar + '"]').click();
        };
      });

      caja.querySelectorAll('[data-epi]').forEach(function(c){
        c.oninput = function(){
          const i = +this.dataset.epi;
          imagenes[i] = Object.assign({}, imagenes[i], { epigrafe: this.value });
        };
      });

      caja.querySelectorAll('[data-sacar]').forEach(function(b){
        b.onclick = async function(){
          const i = +this.dataset.sacar;
          await borrarFoto((imagenes[i] || {}).nombre);
          imagenes[i] = null;
          dibujar();
        };
      });

      caja.querySelectorAll('[data-archivo]').forEach(function(c){
        c.onchange = async function(){
          const i = +this.dataset.archivo;
          const archivo = this.files && this.files[0];
          if (!archivo) return;
          const msj = caja.querySelector('[data-msj="' + i + '"]');
          msj.innerHTML = `<div class="aviso">Subiendo la foto…</div>`;
          try {
            const viejo = (imagenes[i] || {}).nombre;
            const nueva = await subirFoto(archivo, prefijo + '-' + (i + 1));
            imagenes[i] = { url: nueva.url, nombre: nueva.nombre,
                            epigrafe: (imagenes[i] || {}).epigrafe || '' };
            await borrarFoto(viejo);
            dibujar();
          } catch(e){
            msj.innerHTML = `<div class="aviso error">${esc(e.message || 'No se pudo subir.')}</div>`;
          }
        };
      });
    }

    dibujar();
  }

  /* ============================================================
     EL CONSEJO DIRECTIVO  ·  su propia página, con línea de tiempo

     Igual que «¿Quiénes somos?»: una sola fila, se guarda entera. Lo
     que cambia es que acá hay LOGROS, y van con año porque en la

  /* Un logro por bloque: primer renglón «2025 · Título», el resto es el
     detalle. Misma convención que los programas y los bloques. */
  function leerLogros(texto){
    return texto.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
      const lineas = b.split('\n').map(l => l.trim()).filter(Boolean);
      const cabeza = (lineas.shift() || '').split(/\s*[·;]\s*/);
      return {
        anio:    cabeza.length > 1 ? cabeza[0] : '',
        titulo:  cabeza.length > 1 ? cabeza.slice(1).join(' · ') : cabeza[0],
        detalle: lineas.join(' ')
      };
    });
  }
  function escribirLogros(logros){
    return (logros || []).map(l =>
      [l.anio, l.titulo].filter(Boolean).join(' · ') +
      (l.detalle ? '\n' + l.detalle : '')).join('\n\n');
  }

  /* ============================================================
     LA GUÍA DE UNA MATERIA

     El programa lo transcribí yo del PDF de la cátedra, así que esto
     existe para que ustedes lo corrijan sin pedírmelo. Sobre todo el
     cronograma: el .docx original vino con las filas de la tabla
     desordenadas y las fechas hay que verificarlas contra la cátedra.

     Un módulo por bloque, y adentro de cada módulo las listas van una
     por línea. Las líneas que empiezan con «>» son bibliografía
     obligatoria y las que empiezan con «+» son complementaria.
     ============================================================ */
  function leerModulos(texto){
    return texto.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map((b, i) => {
      const lineas = b.split('\n').map(l => l.trim()).filter(Boolean);
      const cabeza = (lineas.shift() || '').split(/\s*[·;]\s*/);
      const mod = {
        numero: Number(cabeza[0]) || (i + 1),
        titulo: cabeza[1] || '',
        fechas: cabeza[2] || '',
        contenidos: [], obligatoria: [], complementaria: [], modelo: null
      };
      lineas.forEach(l => {
        if (l.charAt(0) === '>')      mod.obligatoria.push(l.slice(1).trim());
        else if (l.charAt(0) === '+') mod.complementaria.push(l.slice(1).trim());
        else                          mod.contenidos.push(l);
      });
      return mod;
    });
  }

  function escribirModulos(modulos){
    return (modulos || []).map(m =>
      [m.numero, m.titulo, m.fechas].filter(x => x !== '' && x != null).join(' · ') + '\n' +
      (m.contenidos    || []).join('\n') +
      ((m.obligatoria    || []).length ? '\n' + m.obligatoria.map(x => '> ' + x).join('\n') : '') +
      ((m.complementaria || []).length ? '\n' + m.complementaria.map(x => '+ ' + x).join('\n') : '')
    ).join('\n\n');
  }

  function leerParejas(texto, a, b){
    return texto.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const p = l.split(/\s*[·;]\s*/);
      const o = {}; o[a] = p[0] || ''; o[b] = p.slice(1).join(' · ');
      return o;
    });
  }
  function escribirParejas(filas, a, b){
    return (filas || []).map(f => [f[a], f[b]].filter(Boolean).join(' · ')).join('\n');
  }

  async function vistaGuia(){

    if (error){

           </div>`
        : `<div class="aviso error">No se pudo cargar: ${esc(error.message)}</div>`;

    const g = data || { bajada:'', modulos:[], fechas_clave:[], practicos:[] };

    zona.innerHTML = `

        del documento de la cátedra, que vino con la tabla de fechas
        desordenada. <b>Verificar las fechas con la cátedra antes de
        confiar en ellas.</b>

      <p class="letra-chica">Esto es lo que se lee en
        <b>Anatomofisiología Fonoaudiológica</b>, a la que se llega desde
        Estudiemos.</p>

      <div class="campo"><label for="bajada">La frase de arriba</label>

      <div class="campo">
        <label for="modulos">El programa</label>
        <p class="letra-chica" style="margin:0 0 6px">

          <code>número · título · fechas</code>.<br>
          Después, un tema por línea. Las que empiezan con <b>&gt;</b> son

        <textarea id="modulos" style="min-height:340px;font-family:var(--fuente-datos);font-size:var(--letra-nota)">${esc(escribirModulos(g.modulos))}</textarea>

        <textarea id="fechas" style="min-height:110px;font-family:var(--fuente-datos);font-size:var(--letra-nota)">${esc(escribirParejas(g.fechas_clave,'fecha','que'))}</textarea>
      </div>

      <div class="campo">
        <label for="practicos">Los prácticos obligatorios</label>

      <button class="boton ancho" id="guardar-guia">Guardar la guía</button>
      <a class="boton borde ancho" href="../anatomo/" target="_blank" rel="noopener"

      <p class="letra-chica" style="margin-top:12px">
        Los <b>modelos 3D</b> de los módulos 3 y 5 no se tocan desde acá: están
        atados a su licencia y a su atribución. Si hace falta cambiarlos,
        avisá.</p>
      <div id="msj"></div>`;

    const campo = document.getElementById('modulos');
    const cuenta = document.getElementById('cuenta-modulos');
    function verCuenta(){
      const m = leerModulos(campo.value);
      const sinTitulo = m.filter(x => !x.titulo).length;
      cuenta.innerHTML = !m.length ? '' :
        `<div class="aviso ${sinTitulo ? 'error' : 'ok'}">
           Van a quedar <b>${m.length}</b> módulo${m.length === 1 ? '' : 's'},
           con <b>${m.reduce((s, x) => s + x.contenidos.length, 0)}</b> temas y
           <b>${m.reduce((s, x) => s + x.obligatoria.length + x.complementaria.length, 0)}</b>
           textos de bibliografía.
           ${sinTitulo ? `<b>${sinTitulo}</b> sin título: el primer renglón va
             <b>número · título · fechas</b>.` : ''}

    campo.addEventListener('input', verCuenta);

    document.getElementById('guardar-guia').onclick = async function(){

      /* Los modelos 3D se conservan: no se editan desde acá, así que se

      const viejos = {};
      (g.modulos || []).forEach(m => { if (m.modelo) viejos[m.numero] = m.modelo; });

        ? `<div class="aviso error">No se pudo guardar: ${esc(error.message)}</div>`
        : `<div class="aviso ok">Listo. Ya se ve así en la app.</div>`;
    };
  }
  /* ============================================================
     AVISANOS  ·  a quién pasa el chat, y qué no supo contestar

     Dos cosas en una pantalla porque se leen juntas: las consultas
     sin responder dicen qué falta cargar en «Info útil», y los
     contactos son a quién le llegan mientras tanto.
     ============================================================ */

  const TIPOS_CONTACTO = { instagram:'Instagram', whatsapp:'WhatsApp', mail:'Correo' };
  const CARRERAS_CONTACTO = { todas:'Todas las carreras', ts:'Trabajo Social',
                              tgcr:'Gestión del Riesgo', fono:'Fonoaudiología' };

  async function vistaAvisanos(){
    const [rC, rQ] = await Promise.all([
      db.from('contactos').select('*').order('carrera').order('orden'),
      db.from('consultas').select('*').eq('resuelta', false).order('creado_at', { ascending:false }).limit(50)
    ]);

    if (rC.error){
      zona.innerHTML = /contactos/.test(rC.error.message || '')
        ? `<div class="aviso error">
             <strong>Falta activar esta sección.</strong><br>
             Hay que correr <b>tabla-avisanos.sql</b> en el SQL Editor de
             Supabase. Es una sola vez.
           </div>`
        : `<div class="aviso error">No se pudo cargar: ${esc(rC.error.message)}</div>`;
      return;
    }

    const contactos = rC.data || [];
    const consultas = rQ.error ? [] : (rQ.data || []);

    /* Cuántos hay por carrera. El chat ofrece tres al azar, así que
       con menos de tres siempre le caen a la misma persona: eso hay
       que poder verlo de un vistazo. */
    const porCarrera = Object.keys(CARRERAS_CONTACTO).map(k => {
      const cuantos = contactos.filter(c => c.activo && (c.carrera === k || c.carrera === 'todas')).length;
      return k === 'todas' ? null : `${CARRERAS_CONTACTO[k]}: <b>${cuantos}</b>`;
    }).filter(Boolean).join(' · ');

    zona.innerHTML = `
      <h2 class="titulo-pantalla" style="font-size:22px;margin-top:0">LO QUE NO SUPO CONTESTAR</h2>
      <p class="letra-chica">Cada renglón es alguien que buscó algo y no lo
        encontró. Es la lista de lo que falta cargar en Info útil, escrita por
        los estudiantes.</p>
      ${consultas.length ? consultas.map(q => `
        <div class="fila-item" style="border:1px solid var(--linea);border-radius:var(--radio-chico);padding:10px;margin-bottom:6px">
          <div class="crecer">
            <div>${esc(q.texto)}</div>
            <div class="letra-chica">${esc(fechaLinda(q.creado_at))}${
              q.carrera ? ' · ' + esc(CARRERAS_CONTACTO[q.carrera] || q.carrera) : ''}</div>
          </div>
          <button class="mini" data-listo="${q.id}">Listo</button>
        </div>`).join('')
      : `<div class="vacio">Por ahora el chat contestó todo lo que le preguntaron.</div>`}

      <h2 class="titulo-pantalla" style="font-size:22px;margin-top:26px">A QUIÉN PASA EL CHAT</h2>
      <p class="letra-chica">Cuando el chat no sabe, ofrece <b>tres al azar</b> de
        la carrera que corresponda. Al azar para que las consultas no le caigan
        siempre a la misma compañera.<br>${porCarrera}</p>
      <button class="boton ancho" id="nuevo-contacto">+ Sumar un contacto</button>
      <div style="margin-top:10px">
        ${contactos.length ? contactos.map(c => `
          <button class="tarjeta ${c.activo ? '' : 'borrador'}" data-contacto="${c.id}">
            <h3>${esc(c.nombre)}</h3>
            <p>${esc(CARRERAS_CONTACTO[c.carrera] || c.carrera)}${c.detalle ? ' · ' + esc(c.detalle) : ''}</p>
            <div class="meta">
              <span>${esc(TIPOS_CONTACTO[c.tipo] || c.tipo)}</span>
              <span>${esc(c.destino)}</span>
              <span>${c.activo ? 'Activo' : 'Apagado'}</span>
            </div>
          </button>`).join('')
        : `<div class="vacio">Todavía no hay contactos. Mientras tanto el chat
             ofrece el Instagram de la agrupación.</div>`}
      </div>`;

    zona.querySelectorAll('[data-listo]').forEach(b => {
      b.onclick = async function(){
        this.disabled = true;
        await db.from('consultas').update({ resuelta:true }).eq('id', Number(b.dataset.listo));
        vistaAvisanos();
      };
    });
    document.getElementById('nuevo-contacto').onclick = () => formularioContacto(null);
    zona.querySelectorAll('[data-contacto]').forEach(b => {
      b.onclick = () => formularioContacto(contactos.find(c => c.id === Number(b.dataset.contacto)));
    });

  function formularioContacto(c){
    const esNuevo = !(c && c.id);
    c = c || { carrera:'todas', tipo:'instagram', activo:true, orden:0 };

    zona.innerHTML = `
      <button class="mini" id="volver">← Volver</button>
      <h2 class="titulo-pantalla" style="font-size:24px">${esNuevo ? 'SUMAR UN CONTACTO' : 'EDITAR EL CONTACTO'}</h2>

      <div class="campo"><label for="nombre">Nombre *</label>
        <input id="nombre" value="${esc(c.nombre || '')}" placeholder="Cami"></div>

      <div class="dos-columnas">
        <div class="campo"><label for="carrera">¿A quién atiende?</label>
          <select id="carrera">${Object.keys(CARRERAS_CONTACTO).map(k =>
            `<option value="${k}"${c.carrera === k ? ' selected' : ''}>${CARRERAS_CONTACTO[k]}</option>`).join('')}
          </select></div>
        <div class="campo"><label for="tipo">¿Por dónde se le escribe?</label>
          <select id="tipo">${Object.keys(TIPOS_CONTACTO).map(k =>
            `<option value="${k}"${c.tipo === k ? ' selected' : ''}>${TIPOS_CONTACTO[k]}</option>`).join('')}
          </select></div>
      </div>

      <div class="campo"><label for="destino">Usuario, número o correo *</label>
        <input id="destino" value="${esc(c.destino || '')}" placeholder="camibolivar"></div>
      <p class="letra-chica" style="margin-top:-6px">
        Instagram: el usuario <b>sin arroba</b>. WhatsApp: el número con código
        de país y sin espacios ni guiones (5492211234567). Correo: la dirección.</p>

      <div class="campo"><label for="detalle">Detalle</label>
        <input id="detalle" value="${esc(c.detalle || '')}" placeholder="4.º año · consejera estudiantil"></div>
      <p class="letra-chica" style="margin-top:-6px">
        Sirve para que quien escribe sepa con quién habla. Opcional.</p>

      <div class="campo"><label for="activo">¿Lo ofrece el chat?</label>
        <select id="activo">
          <option value="si"${c.activo ? ' selected' : ''}>Sí</option>
          <option value="no"${c.activo ? '' : ' selected'}>No, apagado por ahora</option>

      <button class="boton ancho" id="guardar">Guardar</button>

    document.getElementById('volver').onclick = vistaAvisanos;

    document.getElementById('guardar').onclick = async function(){
